<title id="page-title">pomiai · rename</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --paper:#F6F3EC;
  --surface:#FFFFFF;
  --line:#E4DFD1;
  --ink:#211E19;
  --muted:#7C7768;
  --accent:#E2571E;
  --accent-soft:#FDE9DE;
  --ok:#2E6B4F;
  --ok-bg:#E7F1EB;
  --warn:#B5451C;
  --warn-bg:#FBEAE2;
  --tape:#FFF6E6;
  --tape-line:#EFD8AA;
  --mono:'JetBrains Mono', ui-monospace, monospace;
  --sans:'Inter', system-ui, sans-serif;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1000px 400px at 100% -10%, #FBEEDC 0%, transparent 60%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  padding:0 0 70px;
  min-height:100vh;
}
.wrap{max-width:920px;margin:0 auto;padding:0 20px;}

/* ===== brand bar ===== */
.brandbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 16px;
  border-bottom:1px solid var(--line);
  margin-bottom:26px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand svg{display:block;}
.brand .word{font-family:var(--mono);font-weight:700;font-size:16px;letter-spacing:-0.02em;}
.brand .word b{color:var(--accent);}
.brand .module{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  border-left:1px solid var(--line);padding-left:10px;margin-left:2px;
  letter-spacing:.04em;
}
.status-pill{
  font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:100px;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
.status-pill.on{border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
.status-pill.on .dot{background:var(--ok);}

.intro{margin-bottom:20px;}
.intro h1{font-family:var(--mono);font-size:20px;margin:0 0 6px;letter-spacing:-0.01em;}
.intro p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;}

.fallback-note{
  font-size:12.5px;color:var(--warn);background:var(--warn-bg);
  border:1px solid #EBCBB8;border-radius:10px;padding:10px 13px;margin-bottom:16px;display:none;
}
.fallback-note.show{display:block;}

/* ===== source / dropzone ===== */
.source{
  background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  transition:border-color .15s ease, background .15s ease;
}
.source.dragover{border-color:var(--accent);background:var(--accent-soft);}
.btn{
  font-family:var(--sans);font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:9px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn.secondary{background:transparent;color:var(--ink);}
.btn.accent{background:var(--accent);border-color:var(--accent);}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line);font-weight:500;}
.btn.small{padding:7px 11px;font-size:12px;}
.source-info{font-size:13px;color:var(--muted);flex:1;min-width:200px;}
.source-info b{color:var(--ink);}
input[type=file]{display:none;}

/* ===== rules ===== */
.section-label{
  font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;
  margin:26px 0 10px;text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px;margin-bottom:8px;}
.rule{display:flex;gap:14px;align-items:flex-start;padding:14px 12px;border-bottom:1px dashed var(--line);}
.rule:last-child{border-bottom:none;}
.rule.disabled .rule-controls{opacity:.4;pointer-events:none;}
.tag{
  font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--ink);
  border-radius:5px;padding:3px 7px;margin-top:2px;flex-shrink:0;letter-spacing:.02em;
}
.rule-body{flex:1;min-width:0;}
.rule-title{font-size:13.5px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.rule-title .hint{font-weight:400;color:var(--muted);font-size:11.5px;font-family:var(--mono);}
.rule-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.rule-controls label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
input[type=text],input[type=number],select{
  font-family:var(--mono);font-size:13px;padding:7px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0;
}
input[type=text]{width:160px;}
input[type=number]{width:60px;}
input[type=checkbox]{accent-color:var(--accent);}
.chip-select{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.chip-select button{font-family:var(--mono);font-size:12px;padding:6px 10px;border:none;background:var(--paper);color:var(--muted);cursor:pointer;}
.chip-select button.active{background:var(--ink);color:#fff;}
.chip-select button+button{border-left:1px solid var(--line);}

.preset-row{display:flex;gap:8px;justify-content:flex-end;margin:10px 2px 0;}
input[type=file]#presetInput{display:none;}

/* ===== preview ===== */
.preview-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;}
.preview-head h2{font-family:var(--mono);font-size:14px;margin:0;}
.count{font-size:12px;color:var(--muted);font-family:var(--mono);}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;max-height:420px;overflow-y:auto;}
.row{
  display:grid;grid-template-columns:1fr 20px 1fr 56px;gap:10px;align-items:center;
  padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;
}
.row:last-child{border-bottom:none;}
.row.dup{background:var(--warn-bg);}
.row .old{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .arrow{color:var(--line);text-align:center;}
.row .new{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.new-tape{display:inline-block;background:var(--tape);border:1px solid var(--tape-line);border-radius:4px;padding:2px 7px;font-weight:600;}
.row .flag{font-size:10.5px;color:var(--warn);text-align:right;}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px;}

.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center;}
.result-msg{font-size:12.5px;color:var(--ok);font-family:var(--mono);}
.result-msg.err{color:var(--warn);}

.footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
</style>
</head>

(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  const LANG = (urlLang && I18N[urlLang]) ? urlLang
             : (I18N[browserLang]         ? browserLang : 'ko');
  window._LANG = LANG;
  window._T    = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
})();
function t(key, vars){
  let s = window._T[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.replace('{'+k+'}', vars[k]); });
  return s;
}
function applyI18n(){
  const dict = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if (typeof dict[k] !== 'string') return;
    const val = dict[k];
    if (val.includes('{n}') && el.querySelector('input')) {
      const inp = el.querySelector('input');
      const [before, after] = val.split('{n}');
      el.textContent = '';
      el.appendChild(document.createTextNode(before));
      el.appendChild(inp);
      el.appendChild(document.createTextNode(after));
    } else {
      el.textContent = val;
    }
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k = el.dataset.i18nHtml;
    if (typeof dict[k] === 'string') el.innerHTML = dict[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const k = el.dataset.i18nPlaceholder;
    if (typeof dict[k] === 'string') el.placeholder = dict[k];
  });
  const pt = document.getElementById('page-title');
  if (pt) pt.textContent = dict.page_title;
  document.title = dict.page_title;
}
applyI18n();

const supportsFS = 'showDirectoryPicker' in window;
if(!supportsFS){
  document.getElementById('fallbackNote').classList.add('show');
  document.getElementById('pickFolderBtn').disabled = true;
}

let mode = null; // 'folder' | 'files'
let dirHandle = null;
let entries = []; // {name, handle?, file?, mtime}
let lastApplyHistory = null; // [{oldName newName}] for undo
let state = { spaceMode:'none', caseMode:'none', numPos:'prefix', dateSource:'none', datePos:'prefix' };

function bindChips(id, key, after){
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      el.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      state[key] = b.dataset.v;
      if(after) after(b.dataset.v);
      render();
    });
  });
}
bindChips('spaceMode','spaceMode');
bindChips('caseMode','caseMode');
bindChips('numPos','numPos');
bindChips('datePos','datePos');
bindChips('dateSource','dateSource');

['findText','replaceText','useRegex','trimStart','trimEnd','prefixText','suffixText',
 'numEnabled','numStart','numPad','dateFormat','extText']
  .forEach(id => document.getElementById(id).addEventListener('input', render));

document.getElementById('extProtect').addEventListener('change', (e)=>{
  document.getElementById('extText').disabled = e.target.checked;
  render();
});

function splitExt(name){
  const idx = name.lastIndexOf('.');
  if(idx <= 0) return [name, ''];
  return [name.slice(0, idx), name.slice(idx+1)];
}
function sanitize(name){ return name.replace(/[\\/:*?"<>|]/g, '_'); }
function pad(n, width){ return String(n).padStart(width, '0'); }
function formatDate(d, fmt){
  const y = d.getFullYear(), m = pad(d.getMonth()+1,2), day = pad(d.getDate(),2);
  return fmt === 'YYYY-MM-DD' ? `${y}-${m}-${day}` : `${y}${m}${day}`;
}

function computeNewName(entry, index){
  let [base, ext] = splitExt(entry.name);

  // 01 find/replace
  const find = document.getElementById('findText').value;
  const replace = document.getElementById('replaceText').value;
  const useRegex = document.getElementById('useRegex').checked;
  if(find){
    try{
      base = useRegex ? base.replace(new RegExp(find,'g'), replace) : base.split(find).join(replace);
    }catch(e){}
  }

  // 02 trim
  const trimStart = parseInt(document.getElementById('trimStart').value || '0', 10);
  const trimEnd = parseInt(document.getElementById('trimEnd').value || '0', 10);
  if(trimStart > 0) base = base.slice(trimStart);
  if(trimEnd > 0) base = base.slice(0, Math.max(0, base.length - trimEnd));

  // 03 space
  if(state.spaceMode==='underscore') base = base.replace(/\s+/g,'_');
  else if(state.spaceMode==='dash') base = base.replace(/\s+/g,'-');
  else if(state.spaceMode==='remove') base = base.replace(/\s+/g,'');

  // 04 case
  if(state.caseMode==='lower') base = base.toLowerCase();
  else if(state.caseMode==='upper') base = base.toUpperCase();
  else if(state.caseMode==='title') base = base.replace(/\b\w/g, c=>c.toUpperCase());

  // 05 prefix/suffix
  const prefix = document.getElementById('prefixText').value;
  const suffix = document.getElementById('suffixText').value;
  base = prefix + base + suffix;

  // 06 numbering
  if(document.getElementById('numEnabled').checked){
    const start = parseInt(document.getElementById('numStart').value || '0', 10);
    const padW = parseInt(document.getElementById('numPad').value || '1', 10);
    const num = pad(start + index, padW);
    base = state.numPos === 'prefix' ? `${num}_${base}` : `${base}_${num}`;
  }

  // 07 date
  if(state.dateSource !== 'none'){
    const fmt = document.getElementById('dateFormat').value;
    const d = state.dateSource === 'mtime' && entry.mtime ? new Date(entry.mtime) : new Date();
    const ds = formatDate(d, fmt);
    base = state.datePos === 'prefix' ? `${ds}_${base}` : `${base}_${ds}`;
  }

  // 08 extension
  const extProtect = document.getElementById('extProtect').checked;
  const extOverride = extProtect ? '' : document.getElementById('extText').value.trim().replace(/^\./,'');
  const finalExt = extOverride || ext;

  base = sanitize(base);
  return finalExt ? `${base}.${finalExt}` : base;
}

function render(){
  const list = document.getElementById('list');
  document.getElementById('countInfo').textContent = t('msg_countfiles',{n:entries.length});

  if(entries.length === 0){
    list.innerHTML = '<div class="empty" data-i18n="preview_empty"></div>';
    document.getElementById('applyBtn').disabled = true;
    document.getElementById('zipBtn').disabled = true;
    return;
  }

  const newNames = entries.map((e,i)=>computeNewName(e,i));
  const counts = {};
  newNames.forEach(n => counts[n] = (counts[n]||0)+1);

  list.innerHTML = entries.map((e,i)=>{
    const nn = newNames[i];
    const isDup = counts[nn] > 1;
    return `<div class="row ${isDup?'dup':''}">
      <span class="old" title="${e.name}">${e.name}</span>
      <span class="arrow">→</span>
      <span class="new"><span class="new-tape">${nn}</span></span>
      <span class="flag">${isDup?t('msg_dup'):''}</span>
    </div>`;
  }).join('');

  const hasDup = Object.values(counts).some(c=>c>1);
  document.getElementById('applyBtn').disabled = !(mode==='folder') || hasDup;
  document.getElementById('zipBtn').disabled = entries.length===0 || hasDup;
  const rm = document.getElementById('resultMsg');
  if(hasDup){ rm.textContent = t('msg_dup_warning'); rm.className='result-msg err'; }
  else if(rm.textContent === t('msg_dup_warning')){ rm.textContent=''; rm.className='result-msg'; }
}

async function loadFolderEntries(){
  entries = [];
  for await (const [name, handle] of dirHandle.entries()){
    if(handle.kind === 'file'){
      let mtime = null;
      try{ const f = await handle.getFile(); mtime = f.lastModified; }catch(e){}
      entries.push({name, handle, mtime});
    }
  }
}

document.getElementById('pickFolderBtn').addEventListener('click', async ()=>{
  try{
    dirHandle = await window.showDirectoryPicker();
    const perm = await dirHandle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){
      document.getElementById('sourceInfo').textContent = t('msg_writeperm');
      return;
    }
    mode = 'folder';
    await loadFolderEntries();
    document.getElementById('sourceInfo').innerHTML = t('msg_folder_selected',{n:dirHandle.name,c:entries.length});
    const pill = document.getElementById('statusPill');
    pill.innerHTML = '<span class="dot"></span>' + t('status_folder_on');
    pill.classList.add('on');
    lastApplyHistory = null;
    document.getElementById('undoBtn').disabled = true;
    render();
  }catch(e){}
});

function setFilesMode(fileList){
  const files = Array.from(fileList);
  if(files.length === 0) return;
  mode = 'files';
  entries = files.map(f => ({name:f.name, file:f, mtime:f.lastModified}));
  document.getElementById('sourceInfo').innerHTML = t('msg_files_selected',{c:entries.length});
  const pill = document.getElementById('statusPill');
  pill.innerHTML = '<span class="dot"></span>' + t('status_files');
  pill.classList.remove('on');
  render();
}

document.getElementById('pickFilesBtn').addEventListener('click', ()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', e=>setFilesMode(e.target.files));

const dz = document.getElementById('dropzone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.add('dragover');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev, e=>{e.preventDefault();dz.classList.remove('dragover');}));
dz.addEventListener('drop', e=>{
  if(e.dataTransfer.files && e.dataTransfer.files.length) setFilesMode(e.dataTransfer.files);
});

document.getElementById('applyBtn').addEventListener('click', async ()=>{
  const rm = document.getElementById('resultMsg');
  rm.className = 'result-msg'; rm.textContent = t('msg_applying');
  let done=0, failed=0;
  const newNames = entries.map((e,i)=>computeNewName(e,i));
  const history = [];

  for(let i=0;i<entries.length;i++){
    const e = entries[i]; const newName = newNames[i];
    if(newName === e.name){ done++; continue; }
    try{
      const file = await e.handle.getFile();
      const buf = await file.arrayBuffer();
      const newHandle = await dirHandle.getFileHandle(newName, {create:true});
      const writable = await newHandle.createWritable();
      await writable.write(buf); await writable.close();
      await dirHandle.removeEntry(e.name);
      history.push({oldName:e.name, newName});
      done++;
    }catch(err){ failed++; }
  }

  await loadFolderEntries();
  render();
  lastApplyHistory = history.length ? history : null;
  document.getElementById('undoBtn').disabled = !lastApplyHistory;
  rm.className = failed ? 'result-msg err' : 'result-msg';
  rm.textContent = failed ? t('msg_apply_partial',{done:done,failed:failed}) : t('msg_apply_done',{n:done});
});

document.getElementById('undoBtn').addEventListener('click', async ()=>{
  if(!lastApplyHistory) return;
  const rm = document.getElementById('resultMsg');
  rm.className='result-msg'; rm.textContent=t('msg_undoing');
  let done=0, failed=0;
  for(const {oldName, newName} of lastApplyHistory.slice().reverse()){
    try{
      const handle = await dirHandle.getFileHandle(newName);
      const file = await handle.getFile();
      const buf = await file.arrayBuffer();
      const restored = await dirHandle.getFileHandle(oldName, {create:true});
      const writable = await restored.createWritable();
      await writable.write(buf); await writable.close();
      await dirHandle.removeEntry(newName);
      done++;
    }catch(err){ failed++; }
  }
  await loadFolderEntries();
  render();
  lastApplyHistory = null;
  document.getElementById('undoBtn').disabled = true;
  rm.className = failed ? 'result-msg err' : 'result-msg';
  rm.textContent = failed ? t('msg_undo_partial',{done:done,failed:failed}) : t('msg_undo_done',{n:done});
});

document.getElementById('zipBtn').addEventListener('click', async ()=>{
  const rm = document.getElementById('resultMsg');
  rm.className='result-msg'; rm.textContent=t('msg_zipping');
  const zip = new JSZip();
  const newNames = entries.map((e,i)=>computeNewName(e,i));
  for(let i=0;i<entries.length;i++){
    const e = entries[i];
    const blob = e.file ? e.file : await e.handle.getFile();
    zip.file(newNames[i], blob);
  }
  const content = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(content);
  const a = document.createElement('a'); a.href = url; a.download = 'pomiai_renamed.zip'; a.click();
  URL.revokeObjectURL(url);
  rm.className='result-msg';
  rm.textContent = t('msg_zip_done',{n:entries.length});
});

// ---- presets ----
function gatherPreset(){
  return {
    findText: val('findText'), replaceText: val('replaceText'), useRegex: chk('useRegex'),
    trimStart: val('trimStart'), trimEnd: val('trimEnd'),
    spaceMode: state.spaceMode, caseMode: state.caseMode,
    prefixText: val('prefixText'), suffixText: val('suffixText'),
    numEnabled: chk('numEnabled'), numStart: val('numStart'), numPad: val('numPad'), numPos: state.numPos,
    dateSource: state.dateSource, dateFormat: val('dateFormat'), datePos: state.datePos,
    extProtect: chk('extProtect'), extText: val('extText')
  };
}
function val(id){ return document.getElementById(id).value; }
function chk(id){ return document.getElementById(id).checked; }
function setChip(groupId, key, v){
  const el = document.getElementById(groupId);
  el.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.v === v));
  state[key] = v;
}

document.getElementById('savePresetBtn').addEventListener('click', ()=>{
  const preset = gatherPreset();
  const blob = new Blob([JSON.stringify(preset,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='pomiai-rename-preset.json'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('loadPresetBtn').addEventListener('click', ()=>document.getElementById('presetInput').click());
document.getElementById('presetInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  try{
    const p = JSON.parse(await file.text());
    document.getElementById('findText').value = p.findText || '';
    document.getElementById('replaceText').value = p.replaceText || '';
    document.getElementById('useRegex').checked = !!p.useRegex;
    document.getElementById('trimStart').value = p.trimStart || 0;
    document.getElementById('trimEnd').value = p.trimEnd || 0;
    document.getElementById('prefixText').value = p.prefixText || '';
    document.getElementById('suffixText').value = p.suffixText || '';
    document.getElementById('numEnabled').checked = !!p.numEnabled;
    document.getElementById('numStart').value = p.numStart || 1;
    document.getElementById('numPad').value = p.numPad || 2;
    document.getElementById('dateFormat').value = p.dateFormat || 'YYYYMMDD';
    document.getElementById('extProtect').checked = p.extProtect !== false;
    document.getElementById('extText').value = p.extText || '';
    document.getElementById('extText').disabled = document.getElementById('extProtect').checked;
    setChip('spaceMode','spaceMode', p.spaceMode || 'none');
    setChip('caseMode','caseMode', p.caseMode || 'none');
    setChip('numPos','numPos', p.numPos || 'prefix');
    setChip('dateSource','dateSource', p.dateSource || 'none');
    setChip('datePos','datePos', p.datePos || 'prefix');
    render();
  }catch(err){
    const rm = document.getElementById('resultMsg');
    rm.className='result-msg err'; rm.textContent=t('msg_preset_error');
  }
});

render();
