name: stockreport-collect

# pomiai 데일리 주식 리포트 데이터 수집
# 시각은 UTC 기준 (KST = UTC+9). GitHub 예약 실행은 몇 분씩 늦게 시작될 수 있다.
on:
  schedule:
    - cron: "*/15 0-6 * * 1-5"   # 평일 09:00~15:59 KST, 15분 간격 (장중)
    - cron: "10 7,9,11 * * 1-5"  # 평일 16:10, 18:10, 20:10 KST (마감 수급 확정분)
    - cron: "30 22 * * 0-4"      # 평일 07:30 KST (미국장 마감 반영)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stockreport-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet requests beautifulsoup4
      - name: Collect
        run: python scripts/stockreport_collect.py
      - name: Commit data
        run: |
          git config user.name "pomiai-stockreport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stockreport
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: stockreport $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
