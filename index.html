<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tool Player</title>
    <style>
        body { background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        /* 캔버스가 처음엔 보이지 않게 설정 후 JS 로드 시 보여줌 */
        canvas { background: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); border-radius: 8px; display: none; }
        #info { margin-top: 20px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <canvas id="myCanvas" width="480" height="320"></canvas>
    <div id="info">접속 중인 도구 ID: <span id="tool-id">확인 중...</span></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const toolId = urlParams.get('id');
        const infoDisplay = document.getElementById('tool-id');
        const canvas = document.getElementById('myCanvas');

        let jsFile = "";

        switch(toolId) {
            case "1":
                jsFile = "game001.html";
                break;
            case "2":
                jsFile = "game002.html";
                break;
            case "3":
                jsFile = "game003.html";
                break;
            default:
                jsFile = ""; 
        }

        if (jsFile) {
            infoDisplay.innerText = `${toolId} (${jsFile})`;
            canvas.style.display = 'block'; // 도구가 있을 때만 캔버스 표시

            const script = document.createElement('script');
            // 캐시 방지를 위해 뒤에 랜덤한 숫자를 붙여 호출 (선택 사항)
            script.src = jsFile + "?v=" + new Date().getTime();
            script.async = true; // 비동기 로드 설정

            script.onload = function() {
                console.log(`${jsFile} 로드 완료 및 실행`);
            };

            script.onerror = function() {
                infoDisplay.innerText = "파일을 찾을 수 없습니다: " + jsFile;
                canvas.style.display = 'none';
            };

            document.body.appendChild(script);
        } else {
            infoDisplay.innerText = "올바른 도구 ID가 아닙니다. (예: ?id=1)";
            canvas.style.display = 'none';
        }
    </script>
</body>
</html>
