<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tool Redirector</title>
    <style>
        body { background-color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #info { margin-top: 20px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div id="info">도구를 불러오는 중입니다... <span id="tool-id">확인 중</span></div>

    <script>
        window.onload = function() {
            // 1. URL 파라미터에서 ID 추출
            const urlParams = new URLSearchParams(window.location.search);
            const toolId = urlParams.get('id');
            const infoDisplay = document.getElementById('tool-id');

            let targetHtml = "";

            // 2. ID에 따라 연결할 HTML 파일 설정
            switch(toolId) {
                case "g1":
                    targetHtml = "game001.html"; // Classic Breakout Game Online – Play Retro Arcade Brick Breaker
                    break;
                case "g2":
                    targetHtml = "game002.html"; // Classic Tetris Game Online – Play the 1984 Retro Block Puzzle
                    break;
                case "g3":
                    targetHtml = "game003.html"; // Classic Bubble Bobble Online – Play Retro Arcade Bubble Shooter
                    break;
                case "g4":
                    targetHtml = "game004.html"; // Galaxian Online: Play the 1979 Classic Arcade Shooter Free
                    break;
                case "g5":
                    targetHtml = "game005.html"; // Pac-Man JavaScript Clone: Play and Learn the Code Behind It
                    break;
                case "g6":
                    targetHtml = "game006.html"; // Space Invaders HTML5: A Nostalgic Trip to the 80s
                    break;
                case "g7":
                    targetHtml = "game007.html"; // Play Super Mario Bros Style Platformer (Canvas API Showcase)
                    break;
                case "g8":
                    targetHtml = "game008.html"; // Asteroids Arcade: Physics and Collision Detection in JS
                    break;
                case "g9":
                    targetHtml = "game009.html"; // Snake Game Classic: See How AI Can Beat It
                    break;
                case "g10":
                    targetHtml = "game010.html"; // Pong Multi-player: WebSocket Powered Retro Fun
                    break;
                case "g11":
                    targetHtml = "game011.html"; // Donkey Kong JS: Retro Platforming Challenge
                    break;
                case "l1":
                    targetHtml = "logic001.html"; // Classic Minesweeper Online – Enjoy this retro logic puzzle from 1989
                    break;
                case "l2":
                    targetHtml = "logic002.html"; // Classic 2048 Online – Challenge Your Brain with the Ultimate Tile-Merging Game
                    break;
                case "l3":
                    targetHtml = "logic003.html"; // Classic Nonogram Online – Solving Retro Logic Puzzles Since 1987
                    break;
                case "l4":
                    targetHtml = "logic004.html"; // Sudoku Master: Daily Interactive Puzzles for Your Brain
                    break;
                case "l5":
                    targetHtml = "logic005.html"; // The Tower of Hanoi: Play and Understand Recursive Algorithms
                    break;
                case "l6":
                    targetHtml = "logic006.html"; // Visual Memory Test: How Good is Your Spatial Recall?
                    break;
                case "l7":
                    targetHtml = "logic007.html"; // Escape Room Web Puzzle: Crack the Cryptography Codes
                    break;
                case "l8":
                    targetHtml = "logic008.html"; // Rubik's Cube 3D Simulator: Play and Learn Algorithms
                    break;
                case "l9":
                    targetHtml = "logic009.html"; // Chess Endgame Puzzles: Checkmate in 3 Moves
                    break;
                case "l10":
                    targetHtml = "logic010.html"; // 
                    break;

                case "m1":
                    targetHtml = "Math001.html";
                    break;
                case "m2":
                    targetHtml = "Math002.html";
                    break;
                case "m3":
                    targetHtml = "Math003.html";
                    break;
                case "m4":
                    targetHtml = "Math004.html";
                    break;
                case "m5":
                    targetHtml = "Math005.html";
                    break;
                case "m6":
                    targetHtml = "Math006.html";
                    break;
                case "m7":
                    targetHtml = "Math007.html";
                    break;
                case "m8":
                    targetHtml = "Math008.html";
                    break;
                case "m9":
                    targetHtml = "Math009.html";
                    break;
                case "m10":
                    targetHtml = "Math010.html";
                    break;

                case "u1":
                    targetHtml = "Util001.html";
                    break;
                case "u2":
                    targetHtml = "Util002.html";
                    break;
                case "u3":
                    targetHtml = "Util003.html";
                    break;
                case "u4":
                    targetHtml = "Util004.html";
                    break;
                case "u5":
                    targetHtml = "Util005.html";
                    break;
                case "u6":
                    targetHtml = "Util006.html";
                    break;
                case "u7":
                    targetHtml = "Util007.html";
                    break;
                case "u8":
                    targetHtml = "Util008.html";
                    break;
                case "u9":
                    targetHtml = "Util009.html";
                    break;
                case "u10":
                    targetHtml = "Util010.html";
                    break;
                default:
                    targetHtml = ""; 
            }

            // 3. 페이지 이동 처리
            if (targetHtml) {
                infoDisplay.innerText = `${toolId}번 도구로 이동합니다.`;
                
                // window.open(url, "_self") 또는 location.href 사용
                // replace를 사용하면 브라우저 '뒤로가기'를 눌렀을 때 다시 리다이렉트되는 루프를 방지합니다.
                setTimeout(() => {
                    window.location.replace(targetHtml);
                }, 500); // 0.5초 대기 후 이동 (사용자 확인용)
            } else {
                infoDisplay.innerText = "올바른 도구 ID가 아닙니다. (?id=1 등)";
                document.querySelector('.loader').style.display = 'none';
            }
        };
    </script>
</body>
</html>
