<!-- Pomi Asteroids – Free Retro Space Rock Shooter Arcade Game | pomiai -->
<div id="asteroids-game-container" style="max-width: 500px; margin: 40px auto; background: #000; border-radius: 12px; padding: 20px; font-family: 'Courier New', Courier, monospace; box-shadow: 0 0 30px rgba(255,255,255,0.2), inset 0 0 20px rgba(255,255,255,0.05); border: 2px solid #555; touch-action: none; user-select: none;">
    <div style="text-align:center;margin-bottom:8px"><a href="https://checkpomi.com" target="_blank" style="background:#ff007f;color:#fff;font-size:10px;font-weight:bold;padding:3px 12px;border-radius:20px;letter-spacing:2px;font-family:monospace;text-decoration:none;">POMIAI</a></div>

    
    <!-- Game HUD -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; color: #fff;">
        <div>
            <h3 style="color: #fff; margin: 0; font-size: 1.2rem; font-weight: bold; letter-spacing: 2px;">POMI ASTEROIDS</h3>
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">WAVE: <span id="ast-level">1</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 0.9rem; color: #fff; margin-bottom: 5px;">SCORE: <span id="ast-score">0</span></div>
            <div style="font-size: 0.9rem; color: #fff;">LIVES: <span id="ast-lives">🚀🚀🚀</span></div>
        </div>
    </div>

    <!-- Game Controls (Start, Pause, Reset) -->
    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;">
        <button id="btn-ast-start" class="ast-ctrl-btn" style="background: #fff; color: #000;">▶ START</button>
        <button id="btn-ast-pause" class="ast-ctrl-btn" style="background: #888; color: #fff;">⏸ PAUSE</button>
        <button id="btn-ast-reset" class="ast-ctrl-btn" style="background: #e74c3c; color: #fff; border-color: #e74c3c;">⏹ RESET</button>
    </div>

    <!-- Canvas Container with CRT Effect -->
    <div style="position: relative; width: 100%; aspect-ratio: 1; background: #000; border-radius: 8px; border: 2px solid #333; overflow: hidden; margin-bottom: 15px;">
        <!-- Scanlines -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.5) 50%); background-size: 100% 4px; pointer-events: none; z-index: 10;"></div>
        
        <canvas id="ast-canvas" width="400" height="400" style="display: block; width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Mobile Action Controls -->
    <div style="display: flex; justify-content: space-between; gap: 10px;">
        <div style="display: flex; gap: 5px;">
            <button class="ast-dir-btn" id="btn-ast-left" style="width: 50px;">↺</button>
            <button class="ast-dir-btn" id="btn-ast-right" style="width: 50px;">↻</button>
        </div>
        <div style="display: flex; gap: 5px; flex: 1;">
            <button class="ast-dir-btn" id="btn-ast-thrust" style="flex: 1; font-size: 1rem;">🔥 THRUST</button>
            <button class="ast-dir-btn" id="btn-ast-shoot" style="flex: 1; background: #fff; color: #000; border-color: #ccc; font-size: 1rem; font-weight: bold;">🎯 FIRE</button>
        </div>
    </div>

    <style>
        #asteroids-game-container .ast-ctrl-btn { border: 2px solid #fff; padding: 8px 15px; border-radius: 0; font-weight: bold; cursor: pointer; transition: 0.1s; font-family: inherit; font-size: 0.85rem; }
        #asteroids-game-container .ast-ctrl-btn:active { transform: scale(0.95); }
        
        #asteroids-game-container .ast-dir-btn { background: #111; color: #fff; border: 2px solid #555; height: 50px; border-radius: 4px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
        #asteroids-game-container .ast-dir-btn:active { background: #333; border-color: #fff; }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('ast-canvas');
            const ctx = canvas.getContext('2d');
            
            const scoreEl = document.getElementById('ast-score');
            const levelEl = document.getElementById('ast-level');
            const livesEl = document.getElementById('ast-lives');

            let reqId = null;
            let isPlaying = false;
            
            let level = 1;
            let score = 0;
            let lives = 3;
            
            let ship;
            let asteroids = [];
            let bullets = [];
            let particles = [];

            const FPS = 60;
            const FRICTION = 0.98; // Space inertia
            const AST_ROIDS_NUM = 3; // Starting asteroids
            const AST_SIZE = 80;
            
            let keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, Space: false };
            let lastShot = 0;

            // --- Vector Physics Classes ---
            class Ship {
                constructor() {
                    this.x = canvas.width / 2;
                    this.y = canvas.height / 2;
                    this.r = 12; // radius
                    this.a = -Math.PI / 2; // angle (pointing up)
                    this.rot = 0;
                    this.thrusting = false;
                    this.dx = 0;
                    this.dy = 0;
                    this.isDead = false;
                    this.invulnerable = 120; // 2 seconds at 60fps
                }
                draw() {
                    if (this.isDead) return;
                    
                    // Blink if invulnerable
                    if (this.invulnerable > 0 && Math.floor(this.invulnerable / 10) % 2 === 0) return;

                    ctx.strokeStyle = "white";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    
                    // Draw Triangle Ship
                    ctx.moveTo(
                        this.x + 4/3 * this.r * Math.cos(this.a),
                        this.y + 4/3 * this.r * Math.sin(this.a)
                    );
                    ctx.lineTo(
                        this.x - this.r * (2/3 * Math.cos(this.a) + Math.sin(this.a)),
                        this.y - this.r * (2/3 * Math.sin(this.a) - Math.cos(this.a))
                    );
                    ctx.lineTo(
                        this.x - this.r * (2/3 * Math.cos(this.a) - Math.sin(this.a)),
                        this.y - this.r * (2/3 * Math.sin(this.a) + Math.cos(this.a))
                    );
                    ctx.closePath();
                    ctx.stroke();

                    // Draw Thrust Flame
                    if (this.thrusting) {
                        ctx.strokeStyle = "#e74c3c";
                        ctx.beginPath();
                        ctx.moveTo(
                            this.x - this.r * (2/3 * Math.cos(this.a) + 0.5 * Math.sin(this.a)),
                            this.y - this.r * (2/3 * Math.sin(this.a) - 0.5 * Math.cos(this.a))
                        );
                        ctx.lineTo(
                            this.x - this.r * 5/3 * Math.cos(this.a),
                            this.y - this.r * 5/3 * Math.sin(this.a)
                        );
                        ctx.lineTo(
                            this.x - this.r * (2/3 * Math.cos(this.a) - 0.5 * Math.sin(this.a)),
                            this.y - this.r * (2/3 * Math.sin(this.a) + 0.5 * Math.cos(this.a))
                        );
                        ctx.stroke();
                    }
                }
                update() {
                    if(this.invulnerable > 0) this.invulnerable--;

                    // Rotation
                    this.a += this.rot;

                    // Thrust (Vector Math)
                    if (this.thrusting) {
                        this.dx += 0.1 * Math.cos(this.a);
                        this.dy += 0.1 * Math.sin(this.a);
                    } else {
                        // Friction
                        this.dx *= FRICTION;
                        this.dy *= FRICTION;
                    }

                    // Move
                    this.x += this.dx;
                    this.y += this.dy;

                    // Screen Wrap
                    if (this.x < 0 - this.r) this.x = canvas.width + this.r;
                    else if (this.x > canvas.width + this.r) this.x = 0 - this.r;
                    if (this.y < 0 - this.r) this.y = canvas.height + this.r;
                    else if (this.y > canvas.height + this.r) this.y = 0 - this.r;
                }
            }

            class Asteroid {
                constructor(x, y, r, lvl) {
                    this.x = x;
                    this.y = y;
                    this.r = r;
                    this.lvl = lvl; // 3 = large, 2 = med, 1 = small
                    this.a = Math.random() * Math.PI * 2; // direction
                    
                    // Velocity increases as they get smaller and level goes up
                    let spd = (1 + level * 0.2) / this.lvl; 
                    this.dx = spd * Math.cos(this.a);
                    this.dy = spd * Math.sin(this.a);
                    
                    this.vert = Math.floor(Math.random() * 5 + 7); // jaggedness
                    this.offs = [];
                    for(let i=0; i<this.vert; i++) {
                        this.offs.push(Math.random() * 0.4 + 0.8);
                    }
                }
                draw() {
                    ctx.strokeStyle = "white";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    for(let j=0; j<this.vert; j++) {
                        let angle = j * Math.PI * 2 / this.vert;
                        let r = this.r * this.offs[j];
                        let px = this.x + r * Math.cos(angle);
                        let py = this.y + r * Math.sin(angle);
                        if(j===0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
                update() {
                    this.x += this.dx;
                    this.y += this.dy;
                    
                    // Screen Wrap
                    if (this.x < 0 - this.r) this.x = canvas.width + this.r;
                    else if (this.x > canvas.width + this.r) this.x = 0 - this.r;
                    if (this.y < 0 - this.r) this.y = canvas.height + this.r;
                    else if (this.y > canvas.height + this.r) this.y = 0 - this.r;
                }
            }

            class Bullet {
                constructor(x, y, a) {
                    this.x = x;
                    this.y = y;
                    this.dx = 6 * Math.cos(a);
                    this.dy = 6 * Math.sin(a);
                    this.life = 60; // 1 second
                }
                draw() {
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                update() {
                    this.x += this.dx;
                    this.y += this.dy;
                    this.life--;
                    
                    // Screen Wrap for bullets too
                    if (this.x < 0) this.x = canvas.width;
                    else if (this.x > canvas.width) this.x = 0;
                    if (this.y < 0) this.y = canvas.height;
                    else if (this.y > canvas.height) this.y = 0;
                }
            }

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.dx = (Math.random() - 0.5) * 4;
                    this.dy = (Math.random() - 0.5) * 4;
                    this.life = Math.random() * 30 + 10;
                }
                draw() {
                    ctx.fillStyle = "white";
                    ctx.globalAlpha = this.life / 40;
                    ctx.fillRect(this.x, this.y, 2, 2);
                    ctx.globalAlpha = 1.0;
                }
                update() {
                    this.x += this.dx;
                    this.y += this.dy;
                    this.life--;
                }
            }

            // --- Game Logic ---
            function createAsteroids() {
                asteroids = [];
                let num = AST_ROIDS_NUM + level - 1;
                for (let i = 0; i < num; i++) {
                    let x, y;
                    do {
                        x = Math.random() * canvas.width;
                        y = Math.random() * canvas.height;
                    } while (distBetweenPoints(ship.x, ship.y, x, y) < AST_SIZE * 2 + ship.r); // safe spawn
                    
                    asteroids.push(new Asteroid(x, y, AST_SIZE / 2, 3));
                }
            }

            function distBetweenPoints(x1, y1, x2, y2) {
                return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            }

            function explodeAsteroid(index) {
                let a = asteroids[index];
                
                // Add Score
                score += (4 - a.lvl) * 100;
                updateUI();

                // Particles
                for(let i=0; i<10; i++) particles.push(new Particle(a.x, a.y));

                // Split
                if (a.lvl > 1) {
                    asteroids.push(new Asteroid(a.x, a.y, a.r / 2, a.lvl - 1));
                    asteroids.push(new Asteroid(a.x, a.y, a.r / 2, a.lvl - 1));
                }
                asteroids.splice(index, 1);
                
                // Level Clear Check
                if (asteroids.length === 0) {
                    level++;
                    updateUI();
                    setTimeout(createAsteroids, 1000); // 1 sec delay before next wave
                }
            }

            function killShip() {
                ship.isDead = true;
                for(let i=0; i<30; i++) particles.push(new Particle(ship.x, ship.y));
                lives--;
                updateUI();
                
                if (lives > 0) {
                    setTimeout(() => {
                        ship = new Ship(); // Respawn
                    }, 1000);
                } else {
                    isPlaying = false;
                    setTimeout(() => alert(`💥 게임 오버!\n최종 점수: ${score}\n다시 도전하세요.`), 500);
                }
            }

            function initGame() {
                level = 1;
                score = 0;
                lives = 3;
                ship = new Ship();
                bullets = [];
                particles = [];
                createAsteroids();
                updateUI();
            }

            function updateUI() {
                scoreEl.innerText = score;
                levelEl.innerText = level;
                livesEl.innerText = lives > 0 ? '🚀'.repeat(lives) : '💀';
            }

            function shoot() {
                if(ship.isDead) return;
                let now = Date.now();
                if (now - lastShot > 150) { // Fire rate limit
                    bullets.push(new Bullet(
                        ship.x + 4/3 * ship.r * Math.cos(ship.a),
                        ship.y + 4/3 * ship.r * Math.sin(ship.a),
                        ship.a
                    ));
                    lastShot = now;
                }
            }

            // --- Main Loop ---
            function gameLoop() {
                if (!isPlaying) return;
                
                // Background
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Update & Draw Ship
                if (!ship.isDead) {
                    ship.update();
                    ship.draw();
                }

                // Update & Draw Asteroids & Collision Check
                for (let i = asteroids.length - 1; i >= 0; i--) {
                    let a = asteroids[i];
                    a.update();
                    a.draw();
                    
                    // Ship vs Asteroid Collision
                    if (!ship.isDead && ship.invulnerable === 0) {
                        if (distBetweenPoints(ship.x, ship.y, a.x, a.y) < ship.r + a.r) {
                            explodeAsteroid(i);
                            killShip();
                            continue;
                        }
                    }
                }

                // Update & Draw Bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.update();
                    b.draw();
                    if (b.life <= 0) {
                        bullets.splice(i, 1);
                        continue;
                    }
                    
                    // Bullet vs Asteroid Collision
                    for (let j = asteroids.length - 1; j >= 0; j--) {
                        let a = asteroids[j];
                        if (distBetweenPoints(b.x, b.y, a.x, a.y) < a.r) {
                            bullets.splice(i, 1);
                            explodeAsteroid(j);
                            break; // one bullet, one hit
                        }
                    }
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.update();
                    p.draw();
                    if (p.life <= 0) particles.splice(i, 1);
                }

                reqId = requestAnimationFrame(gameLoop);
            }

            // --- Input Handling ---
            const handleKey = (e, isDown) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) e.preventDefault();
                if (ship.isDead) return;
                
                if (e.code === 'ArrowLeft') ship.rot = isDown ? -0.1 : 0;
                if (e.code === 'ArrowRight') ship.rot = isDown ? 0.1 : 0;
                if (e.code === 'ArrowUp') ship.thrusting = isDown;
                if (e.code === 'Space' && isDown) shoot();
            };

            window.addEventListener('keydown', (e) => handleKey(e, true), { passive: false });
            window.addEventListener('keyup', (e) => handleKey(e, false));

            // Controls Buttons
            document.getElementById('btn-ast-start').addEventListener('click', () => {
                if (!isPlaying) {
                    if (lives <= 0) initGame();
                    isPlaying = true;
                    gameLoop();
                }
            });
            document.getElementById('btn-ast-pause').addEventListener('click', () => isPlaying = false);
            document.getElementById('btn-ast-reset').addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(reqId);
                initGame();
                
                // Draw initial frame
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ship.draw();
                asteroids.forEach(a => a.draw());
            });

            // Mobile Controls
            const btnLeft = document.getElementById('btn-ast-left');
            const btnRight = document.getElementById('btn-ast-right');
            const btnThrust = document.getElementById('btn-ast-thrust');
            const btnShoot = document.getElementById('btn-ast-shoot');

            const addTouch = (elem, actDown, actUp) => {
                elem.addEventListener('touchstart', (e) => { e.preventDefault(); actDown(); }, {passive: false});
                elem.addEventListener('touchend', (e) => { e.preventDefault(); actUp(); }, {passive: false});
                elem.addEventListener('mousedown', (e) => { e.preventDefault(); actDown(); });
                elem.addEventListener('mouseup', (e) => { e.preventDefault(); actUp(); });
                elem.addEventListener('mouseleave', (e) => { actUp(); });
            };

            addTouch(btnLeft, () => {if(!ship.isDead) ship.rot = -0.1}, () => {if(!ship.isDead) ship.rot = 0});
            addTouch(btnRight, () => {if(!ship.isDead) ship.rot = 0.1}, () => {if(!ship.isDead) ship.rot = 0});
            addTouch(btnThrust, () => {if(!ship.isDead) ship.thrusting = true}, () => {if(!ship.isDead) ship.thrusting = false});
            
            // Shoot needs continuous firing on mobile hold
            let shootInterval;
            addTouch(btnShoot, 
                () => { shoot(); shootInterval = setInterval(shoot, 200); }, 
                () => { clearInterval(shootInterval); }
            );

            // Initialize on load
            initGame();
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ship.draw();
            asteroids.forEach(a => a.draw());
            
        })();
    </script>
</div>
<!-- End of Playable Asteroids HTML5 Arcade Game -->
