<title id="page-title">pomiai 퐁</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#08080e;--s1:#0e0e18;--s2:#131320;--s3:#191928;--s4:#202032;
  --bd:#1c1c2e;--bd2:#262640;--bd3:#303050;
  --ac:#6c5ce8;--ac2:#9b8ff5;--ac3:rgba(108,92,232,.15);--ac4:rgba(108,92,232,.08);
  --go:#d4924a;--go2:#f0b060;--go3:rgba(212,146,74,.12);
  --te:#28c4a0;--te2:#4eddb8;--te3:rgba(40,196,160,.12);
  --re:#e05555;--re3:rgba(224,85,85,.12);
  --tx:#eeeaf8;--tx2:#8e8aac;--tx3:#52506a;--tx4:#2c2a3c;
  --sh:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overscroll-behavior:none}

#shell{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 0 18px}

#header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--s1);border-bottom:1px solid var(--bd);z-index:20}
#logo{font-size:14px;font-weight:700;color:var(--ac2);letter-spacing:.5px}
#logo span{color:var(--tx3);font-weight:400}
#header .tagline{font-size:10px;color:var(--tx3);margin-top:1px}
.icon-btn{background:var(--s3);border:1px solid var(--bd2);color:var(--tx2);width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:active{background:var(--ac3);color:var(--ac2)}

#stats-row{display:flex;gap:8px;padding:12px 16px 6px}
.chip{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:9px 6px;text-align:center}
.chip-label{font-size:9px;color:var(--tx3);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px}
.chip-value{font-size:17px;font-weight:700;color:var(--tx);font-family:'DM Mono',monospace}

#board-area{position:relative;display:flex;justify-content:center;padding:10px 16px 4px;flex:1}
#canvas-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd2);width:100%;max-width:300px}
#pause-overlay{position:absolute;inset:0;background:rgba(8,8,14,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:14px;z-index:5}
#pause-overlay.show{display:flex}
#pause-overlay .po-title{font-size:16px;font-weight:700;color:var(--ac2)}

#action-row{display:flex;gap:8px;padding:12px 16px 4px}
.btn{background:linear-gradient(135deg,var(--ac),#4a38c0);border:none;color:#fff;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(108,92,232,.28);flex:1}
.btn:active{filter:brightness(.92);transform:scale(.98)}
.btn.outline{background:transparent;border:1px solid var(--bd2);color:var(--tx2);box-shadow:none}
.btn.go{background:linear-gradient(135deg,var(--te),#1a8c72);box-shadow:0 4px 16px rgba(40,196,160,.22)}
.btn.re{background:linear-gradient(135deg,var(--re),#a83232);box-shadow:0 4px 16px rgba(224,85,85,.22)}
.btn:disabled{opacity:.4;pointer-events:none}

#control-pad{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:14px;flex-wrap:wrap}
#dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;flex-shrink:0}
#dpad button{background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.1s}
#dpad button:active,#dpad button.active{background:var(--ac3);border-color:var(--ac);color:var(--ac2);transform:scale(.94)}
#action-buttons{display:flex;gap:8px;flex-wrap:wrap}
#action-buttons button{width:64px;height:56px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.1s}
#action-buttons button:active{background:var(--te3);border-color:var(--te);color:var(--te2);transform:scale(.94)}
#action-buttons button.fire:active{background:var(--re3);border-color:var(--re);color:#ff9a9a}
#action-buttons button span{font-size:8px;font-weight:600;color:var(--tx3);letter-spacing:.4px}
#action-buttons button:active span{color:inherit}

#touch-hint{text-align:center;font-size:11px;color:var(--tx3);padding:8px 16px 2px}
#pc-hint{text-align:center;font-size:11px;color:var(--tx3);padding:6px 16px 2px}
@media (hover:none) and (pointer:coarse){ #pc-hint{display:none} }
@media (hover:hover) and (pointer:fine){ #touch-hint{display:none} }

.brand-footer{margin:16px 16px 0;padding:14px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand-name{font-weight:700;font-size:13px;letter-spacing:-.01em;color:var(--tx)}
.brand-by{font-weight:600;font-size:11px;color:var(--tx3);margin-right:4px}
.brand-links{display:flex;gap:8px;flex-wrap:wrap}
.brand-links a{font-size:11px;font-weight:700;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--bd2);white-space:nowrap}
.brand-links a:active{opacity:.7}

#gameover-modal{position:fixed;inset:0;background:rgba(4,4,8,.82);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#gameover-modal.show{display:flex}
.go-card{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:28px 24px;text-align:center;max-width:300px;width:100%;box-shadow:var(--sh)}
.go-title{font-size:20px;font-weight:700;color:var(--re);margin-bottom:8px}
.go-score-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:14px}
.go-score-val{font-size:30px;font-weight:700;color:var(--ac2);font-family:'DM Mono',monospace;margin-bottom:18px}

#landscape-lock{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#landscape-lock .rot-ic{font-size:44px;animation:rotpulse 1.6s ease-in-out infinite}
@keyframes rotpulse{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
#landscape-lock .rot-txt{font-size:14px;color:var(--tx2);font-weight:600}
@media (orientation:landscape) and (hover:none) and (pointer:coarse){
  #landscape-lock{display:flex}
}

#canvas-wrap{max-width:320px}
#pongCanvas{display:block;width:100%;height:auto;aspect-ratio:3/2}
.scanline{position:absolute;inset:0;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.3) 50%);background-size:100% 4px;pointer-events:none;z-index:2}
.paddle-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;gap:10px}
.paddle-col{display:flex;flex-direction:column;gap:8px}
.paddle-col .lbl{font-size:10px;text-align:center;font-weight:700;color:var(--tx3)}
.paddle-btn{width:60px;height:52px;background:var(--s2);border:1px solid var(--bd2);border-radius:12px;color:var(--tx);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.paddle-btn.p1:active{background:var(--te3);border-color:var(--te);color:var(--te2)}
.paddle-btn.p2:active{background:var(--ac3);border-color:var(--ac);color:var(--ac2)}
.speed-center{flex:1;text-align:center;font-size:11px;color:var(--tx3);font-family:'DM Mono',monospace}

</style>
</head>
<body>
<div id="landscape-lock">
  <div class="rot-ic">📱</div>
  <div class="rot-txt" data-i18n="orientation_msg">화면을 세로로 돌려주세요</div>
</div>
<div id="shell">
  <div id="header">
    <div>
      <div id="logo">pomiai <span>· PONG</span></div>
      <div class="tagline" id="modeDisplay" data-i18n="mode_1p">1P (vs AI)</div>
    </div>
    <button class="icon-btn" id="toggleBtn" title="1P/2P">👥</button>
  </div>

  <div id="stats-row">
    <div class="chip"><div class="chip-label" data-i18n="p1">P1</div><div class="chip-value" id="scoreP1" style="color:var(--te2)">0</div></div>
    <div class="chip"><div class="chip-label" id="p2Label" data-i18n="ai">AI</div><div class="chip-value" id="scoreP2" style="color:var(--ac2)">0</div></div>
  </div>

  <div id="board-area">
    <div id="canvas-wrap">
      <canvas id="pongCanvas" width="600" height="400"></canvas>
      <div class="scanline"></div>
      <div id="pause-overlay"><div class="po-title" data-i18n="btn_resume">계속</div></div>
    </div>
  </div>

  <div id="touch-hint" data-i18n="touch_hint">좌우 버튼으로 패들을 움직이세요</div>
  <div id="pc-hint" data-i18n="pc_hint">PC: P1 W/S · P2 방향키(2인용)</div>

  <div id="action-row">
    <button class="btn" id="startBtn" data-i18n="btn_start">시작</button>
    <button class="btn outline" id="pauseBtn" data-i18n="btn_pause">일시정지</button>
    <button class="btn re" id="endBtn" data-i18n="btn_end">종료</button>
  </div>

  <div class="paddle-row">
    <div class="paddle-col">
      <div class="lbl">P1 (W/S)</div>
      <button class="paddle-btn p1" id="p1up">▲</button>
      <button class="paddle-btn p1" id="p1down">▼</button>
    </div>
    <div class="speed-center" id="speedDisplay">SPEED 100%</div>
    <div class="paddle-col">
      <div class="lbl" id="p2ColLabel">AI</div>
      <button class="paddle-btn p2" id="p2up">▲</button>
      <button class="paddle-btn p2" id="p2down">▼</button>
    </div>
  </div>

  <div class="brand-footer">
    <div class="brand-name"><span class="brand-by" data-i18n="footer_by">Product by</span> pomiai</div>
    <div class="brand-links">
      <a href="https://checkpomi.com" target="_blank" rel="noopener">🌐 checkpomi.com</a>
      <a href="https://www.youtube.com/@pomiai_official" target="_blank" rel="noopener">▶ YouTube</a>
    </div>
  </div>
</div>

<div id="gameover-modal">
  <div class="go-card">
    <div class="go-title" id="winnerTitle" data-i18n="gameover_title">게임 종료</div>
    <div class="go-score-label" data-i18n="final_score">최종 스코어</div>
    <div class="go-score-val" id="finalScore">0 - 0</div>
    <button class="btn full" style="width:100%" id="retryBtn" data-i18n="btn_retry">다시하기</button>
  </div>
</div>

<script>
const I18N = {
  ko:{ page_title:'pomiai 퐁', mode_1p:'1P (vs AI)', mode_2p:'2P (로컬대전)', p1:'P1', ai:'AI', p2:'P2',
    touch_hint:'좌우 버튼으로 패들을 움직이세요', pc_hint:'PC: P1 W/S · P2 방향키(2인용)',
    btn_start:'시작', btn_pause:'일시정지', btn_resume:'계속', btn_end:'종료', btn_retry:'다시하기',
    orientation_msg:'화면을 세로로 돌려주세요',
    gameover_title:'게임 종료', final_score:'최종 스코어', footer_by:'Product by',
    win_p1:'PLAYER 1 승리!', win_p2:'PLAYER 2 승리!', win_ai:'AI 승리!' },
  en:{ page_title:'pomiai Pong', mode_1p:'1P (vs AI)', mode_2p:'2P (Local)', p1:'P1', ai:'AI', p2:'P2',
    touch_hint:'Use the buttons to move paddles', pc_hint:'PC: P1 W/S · P2 arrows (2P mode)',
    btn_start:'Start', btn_pause:'Pause', btn_resume:'Resume', btn_end:'End', btn_retry:'Retry',
    orientation_msg:'Please rotate to portrait',
    gameover_title:'Match Over', final_score:'Final Score', footer_by:'Product by',
    win_p1:'PLAYER 1 WINS!', win_p2:'PLAYER 2 WINS!', win_ai:'AI WINS!' },
  ja:{ page_title:'pomiai ポン', mode_1p:'1P（CPU戦）', mode_2p:'2P（対戦）', p1:'P1', ai:'CPU', p2:'P2',
    touch_hint:'ボタンでパドルを操作', pc_hint:'PC：P1はW/S・P2は矢印キー',
    btn_start:'スタート', btn_pause:'一時停止', btn_resume:'再開', btn_end:'終了', btn_retry:'もう一度',
    orientation_msg:'画面を縦向きにしてください',
    gameover_title:'ゲーム終了', final_score:'最終スコア', footer_by:'Product by',
    win_p1:'PLAYER 1の勝利！', win_p2:'PLAYER 2の勝利！', win_ai:'CPUの勝利！' }
};

(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  const LANG = (urlLang && I18N[urlLang]) ? urlLang
             : (I18N[browserLang]         ? browserLang : 'ko');
  window._LANG = LANG;
  window._T    = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
})();
function applyI18n() {
  const t = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (typeof t[k] === 'string') el.textContent = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.title = t.page_title;
}
applyI18n();
function bindHold(el, fn, repeatMs){
  repeatMs = repeatMs || 130;
  let iv=null;
  const start=(e)=>{ e.preventDefault(); fn(); el.classList.add('active'); iv=setInterval(fn,repeatMs); };
  const end=()=>{ clearInterval(iv); iv=null; el.classList.remove('active'); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointercancel', end);
}

const canvas = document.getElementById('pongCanvas');
const ctx = canvas.getContext('2d');
const scoreP1El = document.getElementById('scoreP1'), scoreP2El = document.getElementById('scoreP2');
const modeDisplay = document.getElementById('modeDisplay');
const p2Label = document.getElementById('p2Label'), p2ColLabel = document.getElementById('p2ColLabel');
const speedDisplay = document.getElementById('speedDisplay');

let reqId=null, isPlaying=false, isTwoPlayer=false;
let keys={w:false,s:false,ArrowUp:false,ArrowDown:false};
const paddleProps={width:10,height:80,speed:6};
let p1={x:20,y:160,score:0}, p2={x:570,y:160,score:0};
let initialBallSpeed=5;
let ball={x:300,y:200,r:8,speed:initialBallSpeed,dx:initialBallSpeed,dy:initialBallSpeed};

function resetBall(){
  ball.x=canvas.width/2; ball.y=canvas.height/2; ball.speed=initialBallSpeed;
  ball.dx=(Math.random()>0.5?1:-1)*ball.speed;
  ball.dy=(Math.random()*2-1)*ball.speed;
  if(ball.dy===0) ball.dy=1;
  updateSpeed();
}
function initGame(full){
  if(full){ p1.score=0; p2.score=0; scoreP1El.textContent=0; scoreP2El.textContent=0; }
  p1.y=canvas.height/2-paddleProps.height/2; p2.y=canvas.height/2-paddleProps.height/2;
  resetBall();
}
function updateSpeed(){
  let ratio=Math.round((ball.speed/initialBallSpeed)*100);
  speedDisplay.textContent=`SPEED ${ratio}%`;
  speedDisplay.style.color = ratio>150?'var(--re)':(ratio>100?'var(--go2)':'var(--tx3)');
}
function update(){
  if(keys.w && p1.y>0) p1.y-=paddleProps.speed;
  if(keys.s && p1.y<canvas.height-paddleProps.height) p1.y+=paddleProps.speed;
  if(isTwoPlayer){
    if(keys.ArrowUp && p2.y>0) p2.y-=paddleProps.speed;
    if(keys.ArrowDown && p2.y<canvas.height-paddleProps.height) p2.y+=paddleProps.speed;
  } else {
    let aiCenter=p2.y+paddleProps.height/2, delay=0.85;
    if(aiCenter<ball.y-10) p2.y+=paddleProps.speed*delay;
    else if(aiCenter>ball.y+10) p2.y-=paddleProps.speed*delay;
    if(p2.y<0) p2.y=0;
    if(p2.y>canvas.height-paddleProps.height) p2.y=canvas.height-paddleProps.height;
  }
  ball.x+=ball.dx; ball.y+=ball.dy;
  if(ball.y-ball.r<0){ ball.y=ball.r; ball.dy*=-1; }
  if(ball.y+ball.r>canvas.height){ ball.y=canvas.height-ball.r; ball.dy*=-1; }
  let hit=null;
  if(ball.dx<0 && ball.x-ball.r<p1.x+paddleProps.width && ball.x+ball.r>p1.x && ball.y>p1.y && ball.y<p1.y+paddleProps.height) hit=p1;
  else if(ball.dx>0 && ball.x+ball.r>p2.x && ball.x-ball.r<p2.x+paddleProps.width && ball.y>p2.y && ball.y<p2.y+paddleProps.height) hit=p2;
  if(hit){
    let cp=(ball.y-(hit.y+paddleProps.height/2))/(paddleProps.height/2);
    let angle=(Math.PI/4)*cp, dir=(hit===p1)?1:-1;
    ball.speed*=1.05; updateSpeed();
    ball.dx=dir*ball.speed*Math.cos(angle); ball.dy=ball.speed*Math.sin(angle);
    if(hit===p1) ball.x=p1.x+paddleProps.width+ball.r; else ball.x=p2.x-ball.r;
  }
  if(ball.x-ball.r<0){ p2.score++; scoreP2El.textContent=p2.score; checkWin(p2.score, isTwoPlayer?'win_p2':'win_ai'); }
  else if(ball.x+ball.r>canvas.width){ p1.score++; scoreP1El.textContent=p1.score; checkWin(p1.score,'win_p1'); }
}
function checkWin(score,key){
  if(score>=5){
    isPlaying=false; cancelAnimationFrame(reqId);
    document.getElementById('winnerTitle').textContent = window._T[key];
    document.getElementById('finalScore').textContent = `${p1.score} - ${p2.score}`;
    document.getElementById('gameover-modal').classList.add('show');
  } else resetBall();
}
function draw(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(155,143,245,.4)';
  for(let i=0;i<=canvas.height;i+=20) ctx.fillRect(canvas.width/2-2,i,4,10);
  ctx.fillStyle='#4eddb8'; ctx.fillRect(p1.x,p1.y,paddleProps.width,paddleProps.height);
  ctx.fillStyle=isTwoPlayer?'#9b8ff5':'#eeeaf8'; ctx.fillRect(p2.x,p2.y,paddleProps.width,paddleProps.height);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill();
}
function gameLoop(){ if(!isPlaying) return; update(); draw(); reqId=requestAnimationFrame(gameLoop); }

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('gameover-modal').classList.remove('show');
  if(!isPlaying){ isPlaying=true; gameLoop(); }
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{ isPlaying=false; cancelAnimationFrame(reqId); });
document.getElementById('endBtn').addEventListener('click', ()=>{ isPlaying=false; cancelAnimationFrame(reqId); initGame(true); draw(); });
document.getElementById('retryBtn').addEventListener('click', ()=>{
  document.getElementById('gameover-modal').classList.remove('show');
  initGame(true); isPlaying=true; gameLoop();
});
document.getElementById('toggleBtn').addEventListener('click', ()=>{
  isTwoPlayer=!isTwoPlayer;
  modeDisplay.textContent = window._T[isTwoPlayer?'mode_2p':'mode_1p'];
  const p2txt = isTwoPlayer ? window._T.p2 : window._T.ai;
  p2Label.textContent = p2txt; p2ColLabel.textContent = isTwoPlayer ? `${p2txt} (▲/▼)` : p2txt;
  isPlaying=false; cancelAnimationFrame(reqId); initGame(true); draw();
});

window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','w','s','W','S',' '].includes(e.key)) e.preventDefault();
  if(e.key==='w'||e.key==='W') keys.w=true;
  if(e.key==='s'||e.key==='S') keys.s=true;
  if(e.key==='ArrowUp') keys.ArrowUp=true;
  if(e.key==='ArrowDown') keys.ArrowDown=true;
}, {passive:false});
window.addEventListener('keyup', e=>{
  if(e.key==='w'||e.key==='W') keys.w=false;
  if(e.key==='s'||e.key==='S') keys.s=false;
  if(e.key==='ArrowUp') keys.ArrowUp=false;
  if(e.key==='ArrowDown') keys.ArrowDown=false;
});
function addTouch(id,key){
  const btn=document.getElementById(id);
  const down=e=>{e.preventDefault(); keys[key]=true;}, up=e=>{e.preventDefault(); keys[key]=false;};
  btn.addEventListener('pointerdown',down); btn.addEventListener('pointerup',up); btn.addEventListener('pointerleave',up); btn.addEventListener('pointercancel',up);
}
addTouch('p1up','w'); addTouch('p1down','s'); addTouch('p2up','ArrowUp'); addTouch('p2down','ArrowDown');

initGame(true); draw();

</script>
</body>
</html>
