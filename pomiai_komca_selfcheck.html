<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f0eae2;
    --surface: #fbf8f3;
    --surface-raised: #ffffff;
    --ink: #241d1a;
    --ink-soft: #5c5148;
    --line: #d9cfc2;
    --line-strong: #c2b6a5;
    --accent: #c1442d;
    --accent-ink: #ffffff;
    --accent-soft: #f2ddd6;
    --good: #2f7d5b;
    --good-soft: #e1efe7;
    --warn: #a8721a;
    --warn-soft: #f5e9d3;
    --bad: #8b2e3b;
    --bad-soft: #f1dcdf;
    --focus: #8a5a2a;
    --brand-blue: #2e6da8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b1714;
      --surface: #242019;
      --surface-raised: #2b261e;
      --ink: #ede7dd;
      --ink-soft: #b6ab9c;
      --line: #3a322c;
      --line-strong: #4b4139;
      --accent: #e6684f;
      --accent-ink: #1b1714;
      --accent-soft: #402823;
      --good: #4fbe8c;
      --good-soft: #1f3329;
      --warn: #e3a542;
      --warn-soft: #3a2f18;
      --bad: #d9636f;
      --bad-soft: #3a2124;
      --focus: #e3b774;
      --brand-blue: #6fa8dc;
    }
  }

  :root[data-theme="dark"] {
    --paper: #1b1714;
    --surface: #242019;
    --surface-raised: #2b261e;
    --ink: #ede7dd;
    --ink-soft: #b6ab9c;
    --line: #3a322c;
    --line-strong: #4b4139;
    --accent: #e6684f;
    --accent-ink: #1b1714;
    --accent-soft: #402823;
    --good: #4fbe8c;
    --good-soft: #1f3329;
    --warn: #e3a542;
    --warn-soft: #3a2f18;
    --bad: #d9636f;
    --bad-soft: #3a2124;
    --focus: #e3b774;
    --brand-blue: #6fa8dc;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', 'Inter', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans TC', 'Noto Sans Arabic', sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 96px;
  }

  h1, h2, h3 {
    font-family: 'Gowun Batang', 'Noto Serif KR', serif;
    font-weight: 700;
    text-wrap: balance;
    margin: 0;
  }

  [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3,
  [lang="ar"] h1, [lang="ar"] h2, [lang="ar"] h3 {
    font-family: 'Noto Sans Arabic', sans-serif;
  }

  a { color: var(--accent); }

  /* ---------- Brand bar ---------- */
  .brand-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    max-width: 760px;
    margin: 0 auto 32px;
    padding: 0 4px;
  }
  .brand-mark {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  .brand-mark:hover { color: var(--brand-blue); }
  .brand-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--brand-blue);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-icon svg { width: 13px; height: 13px; }

  .lang-select-wrap {
    position: relative;
  }
  #lang-select {
    font: inherit;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 7px 30px 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    color: var(--ink);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
  }
  .lang-select-wrap::after {
    content: "▾";
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--ink-soft);
    pointer-events: none;
  }
  [dir="rtl"] .lang-select-wrap::after { right: auto; left: 12px; }
  [dir="rtl"] #lang-select { padding: 7px 12px 7px 30px; }
  #lang-select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* ---------- Masthead ---------- */
  .masthead {
    text-align: center;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 44px;
  }

  .stamp {
    width: 108px;
    height: 108px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-7deg);
    position: relative;
    color: var(--accent);
  }
  .stamp::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 1px dashed var(--accent);
    border-radius: 50%;
    opacity: 0.6;
  }
  .stamp-text {
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    line-height: 1.3;
    white-space: pre-line;
  }
  [lang="ar"] .stamp-text, [lang="ja"] .stamp-text, [lang="zh"] .stamp-text, [lang="tw"] .stamp-text {
    font-family: 'Noto Sans Arabic', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans TC', sans-serif;
    font-size: 13px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-size: clamp(24px, 4.4vw, 32px);
    margin-bottom: 14px;
  }

  .lede {
    max-width: 46ch;
    margin: 0 auto 22px;
    color: var(--ink-soft);
    font-size: 15.5px;
  }

  .notice {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 14px 16px;
    font-size: 13.5px;
    color: var(--ink-soft);
    max-width: 56ch;
    margin: 0 auto;
  }
  [dir="rtl"] .notice { text-align: right; border-left: none; border-right: 3px solid var(--accent); }
  .notice strong {
    color: var(--ink);
    font-weight: 700;
    margin-right: 4px;
  }
  [dir="rtl"] .notice strong { margin-right: 0; margin-left: 4px; }

  /* ---------- Form blocks ---------- */
  .block {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 24px 28px;
    margin-bottom: 22px;
  }

  .block h2 {
    font-size: 19px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .block-hint {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 0 0 18px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 140px 1fr;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .field-row label {
    font-size: 14px;
    color: var(--ink-soft);
  }
  .field-row input[type="text"] {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--surface-raised);
    color: var(--ink);
    width: 100%;
  }
  .field-row input[type="text"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  /* ---------- Component rows (radio chips) ---------- */
  .component-row {
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .component-row:first-child { border-top: none; padding-top: 0; }

  .component-row .comp-label {
    font-weight: 500;
    font-size: 15px;
    margin-bottom: 10px;
    display: block;
  }

  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip-group input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
  }

  .chip-group label {
    font-size: 13.5px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .chip-group input[type="radio"]:checked + label {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
  }

  .chip-group input[type="radio"]:focus-visible + label {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  /* ---------- Checklists ---------- */
  .check-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 4px;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .check-item:first-child { border-top: none; }

  .check-item input[type="checkbox"] {
    margin-top: 3px;
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .check-item input[type="checkbox"]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .check-item .txt { font-size: 14.5px; }
  .check-item.negative .txt { color: var(--ink-soft); font-style: italic; }

  /* ---------- Submit ---------- */
  .diagnose-btn {
    display: block;
    width: 100%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    padding: 15px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .diagnose-btn:hover { opacity: 0.92; }
  .diagnose-btn:active { transform: scale(0.99); }
  .diagnose-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .validation-msg {
    color: var(--bad);
    font-size: 13.5px;
    text-align: center;
    margin-top: 12px;
  }

  /* ---------- Result ---------- */
  .result {
    margin-top: 40px;
    padding-top: 8px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .result { animation: rise 0.4s ease both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 22px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .verdict.good { background: var(--good-soft); }
  .verdict.warn { background: var(--warn-soft); }
  .verdict.bad  { background: var(--bad-soft); }

  .verdict-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .verdict.good .verdict-badge { background: var(--good); color: #fff; }
  .verdict.warn .verdict-badge { background: var(--warn); color: #24190a; }
  .verdict.bad  .verdict-badge { background: var(--bad); color: #fff; }

  .verdict-body h3 { font-size: 18px; margin-bottom: 4px; }
  .verdict-body p { margin: 0; font-size: 14px; color: var(--ink-soft); }

  .reasons {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .reasons h4, .evidence-status h4 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    margin: 0 0 12px;
    font-weight: 500;
  }
  .reasons ul { margin: 0; padding-left: 20px; }
  [dir="rtl"] .reasons ul { padding-left: 0; padding-right: 20px; }
  .reasons li { margin-bottom: 8px; font-size: 14.5px; }
  .reasons li:last-child { margin-bottom: 0; }

  .evidence-status {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .ev-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0;
    font-size: 14px;
  }
  .ev-icon {
    width: 18px; height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
  }
  .ev-row.have .ev-icon { background: var(--good-soft); color: var(--good); }
  .ev-row.missing .ev-icon { background: var(--bad-soft); color: var(--bad); }
  .ev-row.missing .txt { color: var(--ink-soft); }

  .summary-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .summary-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .summary-head h3 { font-size: 15px; }
  .summary-head button {
    font: inherit;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: var(--surface-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .summary-head button:hover { border-color: var(--accent); color: var(--accent); }
  .summary-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .summary-head button.copied { background: var(--good); color: #fff; border-color: var(--good); }

  #summary-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.75;
    padding: 18px 20px;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
    color: var(--ink);
    text-align: left;
    direction: ltr;
  }

  .fine-print {
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align: center;
    margin: 0 0 24px;
  }

  .reset-btn {
    display: block;
    margin: 0 auto;
    font: inherit;
    font-size: 13.5px;
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .reset-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .page-footer {
    text-align: center;
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .footer-tagline {
    font-family: 'Gowun Batang', serif;
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 8px;
    font-style: italic;
  }
  .footer-brand {
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
    margin: 0;
  }
  .footer-brand a { color: var(--ink-soft); }
  .footer-brand a:hover { color: var(--brand-blue); }

  @media (max-width: 520px) {
    .field-row { grid-template-columns: 1fr; }
    .brand-bar { flex-wrap: wrap; }
  }
</style>

<div class="brand-bar">
  <a class="brand-mark" href="https://checkpomi.com" target="_blank" rel="noopener">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12.5L9.5 18L20 6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    checkpomi.com
  </a>
  <div class="lang-select-wrap">
    <select id="lang-select" aria-label="Language"></select>
  </div>
</div>

<main class="page">

  <header class="masthead">
    <div class="stamp" aria-hidden="true"><span class="stamp-text" id="stamp-text"></span></div>
    <p class="eyebrow" id="t-eyebrow"></p>
    <h1 id="t-title"></h1>
    <p class="lede" id="t-lede"></p>
    <div class="notice"><strong id="t-notice-label"></strong><span id="t-notice-body"></span></div>
  </header>

  <form id="diagnosis-form" novalidate>

    <section class="block">
      <h2><span class="num">A</span><span id="t-secA"></span></h2>
      <div class="field-row">
        <label for="song-title" id="t-songtitle-label"></label>
        <input type="text" id="song-title" autocomplete="off">
      </div>
      <div class="field-row">
        <label for="ai-tool" id="t-aitool-label"></label>
        <input type="text" id="ai-tool" autocomplete="off">
      </div>
    </section>

    <section class="block">
      <h2><span class="num">B</span><span id="t-secB"></span></h2>
      <p class="block-hint" id="t-secB-hint"></p>
      <div class="component-grid" id="component-grid"></div>
    </section>

    <section class="block">
      <h2><span class="num">C</span><span id="t-secC"></span></h2>
      <p class="block-hint" id="t-secC-hint"></p>
      <div class="check-list" id="contribution-list"></div>
    </section>

    <section class="block">
      <h2><span class="num">D</span><span id="t-secD"></span></h2>
      <p class="block-hint" id="t-secD-hint"></p>
      <div class="check-list" id="evidence-list"></div>
    </section>

    <button type="submit" class="diagnose-btn" id="t-diagnose-btn"></button>
    <p class="validation-msg" id="validation-msg" role="alert" hidden></p>
  </form>

  <section class="result" id="result" hidden>
    <div class="verdict" id="verdict"></div>

    <div class="reasons">
      <h4 id="t-reasons-heading"></h4>
      <ul id="reasons-list"></ul>
    </div>

    <div class="evidence-status">
      <h4 id="t-evidence-heading"></h4>
      <div id="evidence-status-list"></div>
    </div>

    <div class="summary-box">
      <div class="summary-head">
        <h3 id="t-summary-heading"></h3>
        <button type="button" id="copy-btn"></button>
      </div>
      <pre id="summary-text"></pre>
    </div>

    <p class="fine-print" id="t-fine-print"></p>

    <button type="button" id="reset-btn" class="reset-btn"></button>
  </section>

  <footer class="page-footer">
    <p class="footer-tagline">Creating Smiles, One Sound at a Time</p>
    <p class="footer-brand" id="t-footer"></p>
  </footer>
</main>

        headline: "창작 기여가 다소 약합니다",
        sub: "등록 가능성을 높이려면 더 실질적인 창작 기여가 필요합니다.",
        reasonWeak: "사람의 창작 기여 항목이 {n}개만 확인되었습니다."
      }
    },
    summary: {
      title: "[KOMCA 제출용 자가진단 요약]",
      songTitleLine: "곡 제목: ",
      aiToolLine: "사용 AI 도구: ",
      notEntered: "(미입력)",
      componentsHeading: "[구성 요소별 제작 방식]",
      contributionsHeading: "[사람의 창작 기여]",
      noneApplicable: "해당 없음",
      evidenceHeading: "[보유 증빙 자료]",
      resultLine: "진단 결과: ",
      referenceNote: "※ 본 요약은 자가진단 참고용이며 KOMCA 공식 심사 결과와 다를 수 있습니다."
    }
  },
  en: {
    eyebrow: "Reflects KOMCA's Aug 2026 revised standard",
    title: "AI Music Copyright Self-Diagnostic",
    lede: "Check in advance whether your AI-assisted song is likely to qualify for copyright registration with KOMCA. This is a reference self-check, not an official review.",
    noticeLabel: "Notice",
    noticeBody: "This tool does not replace legal advice or KOMCA's official review. Results are for reference only — final eligibility is determined by KOMCA's review process.",
    stamp: "AI Creation\nSelf-Check",
    secA: "Song Info",
    songTitleLabel: "Song title",
    songTitlePh: "e.g. Clean Conscience",
    aiToolLabel: "AI tool used",
    aiToolPh: "e.g. Suno AI",
    secB: "How each component was made",
    secBHint: "For each component, select who or what primarily created it.",
    compLabels: ["Lyrics", "Composition (melody)", "Arrangement", "Performance / Vocals"],
    compOptions: ["Human-made", "Human + AI collaboration", "AI-generated"],
    secC: "Human creative contribution",
    secCHint: "Select every item that applies.",
    contributions: [
      "I wrote or substantially revised the lyrics/melody myself",
      "I edited, rearranged, or restructured the AI output",
      "I personally designed the chord progression, structure, or arrangement",
      "I repeatedly made creative judgment calls while selecting and refining among multiple AI outputs",
      "I only entered a prompt to the AI and made no further edits afterward"
    ],
    secD: "Supporting evidence",
    secDHint: "Select the evidence you can provide. More evidence strengthens your case.",
    evidence: [
      "Draft or revision-history files of the lyrics/melody",
      "Original AI prompts and generated outputs",
      "Screen recordings or captures of the production process",
      "Communication records with co-creators",
      "DAW (production software) project files"
    ],
    diagnoseBtn: "See diagnosis",
    validationMsg: "Please select a production method for every component in section B.",
    reasonsHeading: "Basis for this result",
    evidenceHeading: "Evidence status",
    evidenceMissingSuffix: "(not available)",
    summaryHeading: "Summary for KOMCA submission",
    copyBtn: "Copy",
    copiedBtn: "Copied!",
    finePrintPre: "This is a reference diagnosis only. Check the official standard at",
    finePrintLink: "KOMCA's official site",
    finePrintPost: ".",
    resetBtn: "Start over",
    footer: "pomiai · checkpomi.com",
    verdict: {
      noAI: {
        badge: "No AI used",
        headline: "AI was not involved in this song",
        sub: "This diagnostic tool does not apply to songs that are 100% human-created.",
        reason: "Every component was marked as human-made."
      },
      red: {
        badge: "Registration unlikely",
        headline: "Copyright registration may be difficult as things stand",
        sub: "KOMCA's disclosure-first standard requires evidence of substantial, leading human creative contribution.",
        reasonNoPositive: "No item supporting human creative contribution was selected.",
        reasonAllAI: "Every component was marked as AI-generated.",
        reasonOnlyPrompt: "You indicated no further edits were made beyond entering a prompt.",
        reasonSuggestion: "Try adding substantial contribution — such as rewriting lyrics or shaping the arrangement — then run the check again."
      },
      green: {
        badge: "High likelihood",
        headline: "Copyright registration looks likely",
        sub: "Sufficient human creative contribution and supporting evidence were found.",
        reasonPositive: "{n} human-contribution item(s) were confirmed.",
        reasonEvidence: "You have {n} piece(s) of supporting evidence."
      },
      amberEvidence: {
        badge: "Needs more evidence",
        headline: "Contribution is present, but evidence is lacking",
        sub: "A lack of supporting evidence can work against you during review.",
        reasonPositive: "{n} human-contribution item(s) were confirmed.",
        reasonEvidenceLack: "You only have {n} piece(s) of evidence. 3 or more is recommended."
      },
      amberWeak: {
        badge: "Needs stronger contribution",
        headline: "Human contribution is somewhat weak",
        sub: "More substantial creative contribution would improve your chances of registration.",
        reasonWeak: "Only {n} human-contribution item(s) were confirmed."
      }
    },
    summary: {
      title: "[Self-Check Summary for KOMCA Submission]",
      songTitleLine: "Song title: ",
      aiToolLine: "AI tool used: ",
      notEntered: "(not entered)",
      componentsHeading: "[Production method by component]",
      contributionsHeading: "[Human creative contribution]",
      noneApplicable: "None selected",
      evidenceHeading: "[Available supporting evidence]",
      resultLine: "Diagnostic result: ",
      referenceNote: "* This summary is for self-check reference only and may differ from KOMCA's official review outcome."
    }
  }
};
</script>
<script>
(function () {
  var LANGS = [
    { code: "ko", native: "한국어" },
    { code: "en", native: "English" },
    { code: "ja", native: "日本語" },
    { code: "zh", native: "简体中文" },
    { code: "tw", native: "繁體中文" },
    { code: "de", native: "Deutsch" },
    { code: "fr", native: "Français" },
    { code: "nl", native: "Nederlands" },
    { code: "sv", native: "Svenska" },
    { code: "da", native: "Dansk" },
    { code: "nn", native: "Norsk" },
    { code: "ar", native: "العربية" }
  ];
  var RTL = { ar: true };

  var STRINGS = window.__KOMCA_STRINGS__ || {};

  var COMPONENT_KEYS = ["lyrics", "composition", "arrangement", "performance"];
  var COMPONENT_OPTION_KEYS = ["human", "hybrid", "ai"];
  var CONTRIB_KEYS = ["c1", "c2", "c3", "c4", "c5"];
  var EVIDENCE_KEYS = ["e1", "e2", "e3", "e4", "e5"];

  function S(lang) { return STRINGS[lang] || STRINGS.en || STRINGS.ko; }

  var currentLang = (function () {
    var saved = null;
    try { saved = localStorage.getItem("komca-lang"); } catch (e) {}
    if (saved && STRINGS[saved]) return saved;
    var nav = (navigator.language || "ko").toLowerCase();
    if (nav.indexOf("ko") === 0) return "ko";
    if (nav.indexOf("ja") === 0) return "ja";
    if (nav.indexOf("zh-tw") === 0 || nav.indexOf("zh-hant") === 0) return "tw";
    if (nav.indexOf("zh") === 0) return "zh";
    if (nav.indexOf("de") === 0) return "de";
    if (nav.indexOf("fr") === 0) return "fr";
    if (nav.indexOf("nl") === 0) return "nl";
    if (nav.indexOf("sv") === 0) return "sv";
    if (nav.indexOf("da") === 0) return "da";
    if (nav.indexOf("no") === 0 || nav.indexOf("nb") === 0 || nav.indexOf("nn") === 0) return "nn";
    if (nav.indexOf("ar") === 0) return "ar";
    return STRINGS.ko ? "ko" : "en";
  })();

  var langSelect = document.getElementById("lang-select");
  LANGS.forEach(function (l) {
    var opt = document.createElement("option");
    opt.value = l.code;
    opt.textContent = l.native;
    if (l.code === currentLang) opt.selected = true;
    langSelect.appendChild(opt);
  });
  langSelect.addEventListener("change", function () {
    setLang(langSelect.value);
  });

  var form = document.getElementById("diagnosis-form");
  var validationMsg = document.getElementById("validation-msg");
  var resultSection = document.getElementById("result");

  function el(id) { return document.getElementById(id); }

  function renderStatic(lang) {
    var s = S(lang);
    document.documentElement.setAttribute("lang", lang);
    document.documentElement.setAttribute("dir", RTL[lang] ? "rtl" : "ltr");

    el("stamp-text").textContent = s.stamp;
    el("t-eyebrow").textContent = s.eyebrow;
    el("t-title").textContent = s.title;
    el("t-lede").textContent = s.lede;
    el("t-notice-label").textContent = s.noticeLabel;
    el("t-notice-body").textContent = " " + s.noticeBody;

    el("t-secA").textContent = s.secA;
    el("t-songtitle-label").textContent = s.songTitleLabel;
    el("song-title").placeholder = s.songTitlePh;
    el("t-aitool-label").textContent = s.aiToolLabel;
    el("ai-tool").placeholder = s.aiToolPh;

    el("t-secB").textContent = s.secB;
    el("t-secB-hint").textContent = s.secBHint;
    el("t-secC").textContent = s.secC;
    el("t-secC-hint").textContent = s.secCHint;
    el("t-secD").textContent = s.secD;
    el("t-secD-hint").textContent = s.secDHint;

    el("t-diagnose-btn").textContent = s.diagnoseBtn;
    el("t-reasons-heading").textContent = s.reasonsHeading;
    el("t-evidence-heading").textContent = s.evidenceHeading;
    el("t-summary-heading").textContent = s.summaryHeading;
    el("copy-btn").textContent = s.copyBtn;
    el("reset-btn").textContent = s.resetBtn;
    el("t-footer").textContent = s.footer;

    var fp = el("t-fine-print");
    fp.textContent = "";
    fp.appendChild(document.createTextNode(s.finePrintPre + " "));
    var a = document.createElement("a");
    a.href = "https://www.komca.or.kr";
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = s.finePrintLink;
    fp.appendChild(a);
    fp.appendChild(document.createTextNode(" " + s.finePrintPost));

    buildComponentGrid(s);
    buildCheckList(el("contribution-list"), CONTRIB_KEYS, s.contributions, true);
    buildCheckList(el("evidence-list"), EVIDENCE_KEYS, s.evidence, false);
  }

  function buildComponentGrid(s) {
    var grid = el("component-grid");
    grid.innerHTML = "";
    COMPONENT_KEYS.forEach(function (key, i) {
      var row = document.createElement("div");
      row.className = "component-row";
      var label = document.createElement("span");
      label.className = "comp-label";
      label.textContent = s.compLabels[i];
      row.appendChild(label);

      var group = document.createElement("div");
      group.className = "chip-group";
      COMPONENT_OPTION_KEYS.forEach(function (optKey, j) {
        var id = key + "-" + optKey;
        var input = document.createElement("input");
        input.type = "radio";
        input.name = key;
        input.id = id;
        input.value = optKey;
        var lab = document.createElement("label");
        lab.setAttribute("for", id);
        lab.textContent = s.compOptions[j];
        group.appendChild(input);
        group.appendChild(lab);
      });
      row.appendChild(group);
      grid.appendChild(row);
    });
  }

  function buildCheckList(container, keys, labels, negLast) {
    container.innerHTML = "";
    keys.forEach(function (key, i) {
      var isNegative = negLast && i === keys.length - 1;
      var row = document.createElement("label");
      row.className = "check-item" + (isNegative ? " negative" : "");
      row.setAttribute("for", key);
      var input = document.createElement("input");
      input.type = "checkbox";
      input.id = key;
      input.value = key;
      var span = document.createElement("span");
      span.className = "txt";
      span.textContent = labels[i];
      row.appendChild(input);
      row.appendChild(span);
      container.appendChild(row);
    });
  }

  function setLang(lang) {
    currentLang = lang;
    try { localStorage.setItem("komca-lang", lang); } catch (e) {}
    renderStatic(lang);
    resultSection.hidden = true;
    validationMsg.hidden = true;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var s = S(currentLang);

    var componentValues = {};
    var missingComponent = false;
    COMPONENT_KEYS.forEach(function (key) {
      var checked = form.querySelector('input[name="' + key + '"]:checked');
      if (!checked) missingComponent = true;
      componentValues[key] = checked ? checked.value : null;
    });

    if (missingComponent) {
      validationMsg.textContent = s.validationMsg;
      validationMsg.hidden = false;
      return;
    }
    validationMsg.hidden = true;

    var contribChecked = {};
    CONTRIB_KEYS.forEach(function (key) { contribChecked[key] = el(key).checked; });
    var evidenceChecked = {};
    EVIDENCE_KEYS.forEach(function (key) { evidenceChecked[key] = el(key).checked; });

    var songTitle = el("song-title").value.trim();
    var aiTool = el("ai-tool").value.trim();

    runDiagnosis(componentValues, contribChecked, evidenceChecked, songTitle, aiTool, s);
  });

  function runDiagnosis(components, contrib, evidence, songTitle, aiTool, s) {
    var values = COMPONENT_KEYS.map(function (k) { return components[k]; });
    var aiInvolved = values.some(function (v) { return v !== "human"; });
    var allAI = values.every(function (v) { return v === "ai"; });

    var positiveKeys = ["c1", "c2", "c3", "c4"];
    var positiveScore = positiveKeys.filter(function (k) { return contrib[k]; }).length;
    var onlyNegative = contrib.c5 && positiveScore === 0;
    var evidenceScore = EVIDENCE_KEYS.filter(function (k) { return evidence[k]; }).length;

    var v = s.verdict;
    var verdictClass, badge, headline, sub, reasons = [];

    if (!aiInvolved) {
      verdictClass = "good"; badge = v.noAI.badge;
      headline = v.noAI.headline; sub = v.noAI.sub;
      reasons.push(v.noAI.reason);
    } else if (positiveScore === 0 || (allAI && onlyNegative)) {
      verdictClass = "bad"; badge = v.red.badge;
      headline = v.red.headline; sub = v.red.sub;
      reasons.push(v.red.reasonNoPositive);
      if (allAI) reasons.push(v.red.reasonAllAI);
      if (contrib.c5) reasons.push(v.red.reasonOnlyPrompt);
      reasons.push(v.red.reasonSuggestion);
    } else if (positiveScore >= 2 && evidenceScore >= 3) {
      verdictClass = "good"; badge = v.green.badge;
      headline = v.green.headline; sub = v.green.sub;
      reasons.push(v.green.reasonPositive.replace("{n}", positiveScore));
      reasons.push(v.green.reasonEvidence.replace("{n}", evidenceScore));
    } else if (positiveScore >= 1 && evidenceScore < 3) {
      verdictClass = "warn"; badge = v.amberEvidence.badge;
      headline = v.amberEvidence.headline; sub = v.amberEvidence.sub;
      reasons.push(v.amberEvidence.reasonPositive.replace("{n}", positiveScore));
      reasons.push(v.amberEvidence.reasonEvidenceLack.replace("{n}", evidenceScore));
    } else {
      verdictClass = "warn"; badge = v.amberWeak.badge;
      headline = v.amberWeak.headline; sub = v.amberWeak.sub;
      reasons.push(v.amberWeak.reasonWeak.replace("{n}", positiveScore));
    }

    var verdictEl = el("verdict");
    verdictEl.className = "verdict " + verdictClass;
    verdictEl.innerHTML =
      '<span class="verdict-badge">' + escapeHtml(badge) + '</span>' +
      '<div class="verdict-body"><h3>' + escapeHtml(headline) + '</h3><p>' + escapeHtml(sub) + '</p></div>';

    var reasonsList = el("reasons-list");
    reasonsList.innerHTML = "";
    reasons.forEach(function (r) {
      var li = document.createElement("li");
      li.textContent = r;
      reasonsList.appendChild(li);
    });

    var evStatus = el("evidence-status-list");
    evStatus.innerHTML = "";
    EVIDENCE_KEYS.forEach(function (key, i) {
      var have = evidence[key];
      var row = document.createElement("div");
      row.className = "ev-row " + (have ? "have" : "missing");
      row.innerHTML =
        '<span class="ev-icon">' + (have ? "✓" : "-") + '</span>' +
        '<span class="txt">' + escapeHtml(s.evidence[i]) + (have ? "" : " " + escapeHtml(s.evidenceMissingSuffix)) + '</span>';
      evStatus.appendChild(row);
    });

    var compOptMap = { human: s.compOptions[0], hybrid: s.compOptions[1], ai: s.compOptions[2] };
    var sm = s.summary;
    var lines = [];
    lines.push(sm.title);
    lines.push(sm.songTitleLine + (songTitle || sm.notEntered));
    lines.push(sm.aiToolLine + (aiTool || sm.notEntered));
    lines.push("");
    lines.push(sm.componentsHeading);
    COMPONENT_KEYS.forEach(function (key, i) {
      lines.push("- " + s.compLabels[i] + ": " + compOptMap[components[key]]);
    });
    lines.push("");
    lines.push(sm.contributionsHeading);
    var contribLines = CONTRIB_KEYS.filter(function (k) { return contrib[k]; })
      .map(function (k) { return "- " + s.contributions[CONTRIB_KEYS.indexOf(k)]; });
    lines.push(contribLines.length ? contribLines.join("\n") : "- " + sm.noneApplicable);
    lines.push("");
    lines.push(sm.evidenceHeading);
    var evLines = EVIDENCE_KEYS.filter(function (k) { return evidence[k]; })
      .map(function (k) { return "- " + s.evidence[EVIDENCE_KEYS.indexOf(k)]; });
    lines.push(evLines.length ? evLines.join("\n") : "- " + sm.noneApplicable);
    lines.push("");
    lines.push(sm.resultLine + badge);
    lines.push(sm.referenceNote);

    el("summary-text").textContent = lines.join("\n");

    resultSection.hidden = false;
    resultSection.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }

  function escapeHtml(str) {
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  el("copy-btn").addEventListener("click", function () {
    var text = el("summary-text").textContent;
    var btn = this;
    var original = S(currentLang).copyBtn;
    function done() {
      btn.textContent = S(currentLang).copiedBtn;
      btn.classList.add("copied");
      setTimeout(function () { btn.textContent = original; btn.classList.remove("copied"); }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallbackCopy);
    } else {
      fallbackCopy();
    }
    function fallbackCopy() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); done(); } catch (err) {}
      document.body.removeChild(ta);
    }
  });

  el("reset-btn").addEventListener("click", function () {
    form.reset();
    resultSection.hidden = true;
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  renderStatic(currentLang);
})();
</script>
