<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

:root{
  --ink:#0b0a0e;
  --card:#16141b;
  --card-2:#1d1a23;
  --elev:#252029;
  --gold:#d9a656;
  --gold-soft:#f0d9a8;
  --rose:#d9788f;
  --paper:#f4eee1;
  --paper-dim:#a49d8f;
  --line:rgba(217,166,86,0.14);
  --fd:'Noto Serif KR',serif;
  --fb:'Inter','Noto Sans KR',-apple-system,sans-serif;
  --shell-w:400px;
  --shell-h:800px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background: radial-gradient(circle at 50% -10%, #241c2c 0%, var(--ink) 55%);
  font-family:var(--fb);
  color:var(--paper);
  display:flex; align-items:center; justify-content:center;
  min-height:100dvh;
  overflow:hidden;
}

/* ================= SHELL ================= */
#shell{
  position:relative;
  width:100%; max-width:var(--shell-w);
  height:100dvh; max-height:var(--shell-h);
  background:linear-gradient(165deg, var(--card) 0%, #120f16 100%);
  border-radius:0;
  overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
  border:1px solid var(--line);
}
@media (min-width:481px){ #shell{ border-radius:28px; } }

/* ================= HEADER ================= */
#header{
  flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding: max(14px, env(safe-area-inset-top)) 18px 12px;
  z-index:20;
}
.brand{ display:flex; align-items:center; gap:8px; }
.brand .mark{ width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }
.brand .name{ font-family:var(--fd); font-size:15px; font-weight:600; color:var(--gold-soft); letter-spacing:.02em;}
.brand .sub{ font-size:9.5px; color:var(--paper-dim); letter-spacing:.14em; text-transform:uppercase; margin-left:2px;}
#header .actions{ display:flex; gap:8px; }
.icon-btn{
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--paper);
  display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.18s ease;
}
.icon-btn svg{ width:16px; height:16px; }
.icon-btn:hover{ border-color:var(--gold); color:var(--gold-soft); }
.icon-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
#back-btn{ display:none; }
#header.in-queue #back-btn{ display:flex; }
#header.in-queue #queue-btn{ display:none; }
.lang-switch{
  height:34px; max-width:64px; padding:0 6px; border-radius:14px;
  border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--paper-dim);
  font-size:10px; font-weight:700; font-family:var(--fb); cursor:pointer; outline:none;
  transition:.18s ease; appearance:auto;
}
.lang-switch:hover{ border-color:var(--gold); color:var(--gold-soft); }
.lang-switch:focus{ border-color:var(--gold); color:var(--gold-soft); }
.lang-switch option{ background:var(--card); color:var(--paper); }

/* ================= NOW PLAYING VIEW ================= */
#view-now{
  position:relative;
  flex:1; min-height:0; display:flex; flex-direction:column;
  padding:4px 20px 18px;
  transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .28s ease;
}
#view-now.hide{ transform:translateX(-14%); opacity:0; pointer-events:none; position:absolute; inset:0;}

#file-notice{ display:none; align-items:flex-start; gap:8px; background:rgba(217,166,86,.1); border:1px solid var(--line); border-radius:10px; padding:9px 10px; margin-bottom:10px; font-size:10.5px; line-height:1.5; color:var(--gold-soft); flex-shrink:0; }
#file-notice.show{ display:flex; }
#file-notice-close{ background:none; border:none; color:var(--paper-dim); cursor:pointer; font-size:15px; line-height:1; flex-shrink:0; padding:0 2px; }

#yt-notice{ display:none; align-items:flex-start; flex-wrap:wrap; gap:8px 10px; background:rgba(217,120,143,.1); border:1px solid rgba(217,120,143,.3); border-radius:10px; padding:9px 10px; margin-bottom:10px; font-size:10.5px; line-height:1.5; color:var(--rose); flex-shrink:0; }
#yt-notice.show{ display:flex; }
#yt-notice-text{ flex:1; min-width:160px; }
#yt-notice-retry{ background:rgba(217,120,143,.18); border:1px solid rgba(217,120,143,.4); color:var(--paper); border-radius:99px; padding:4px 12px; font-size:10.5px; font-weight:600; cursor:pointer; flex-shrink:0; }
#yt-notice-retry:hover{ background:rgba(217,120,143,.3); }
#yt-notice-close{ background:none; border:none; color:var(--paper-dim); cursor:pointer; font-size:15px; line-height:1; flex-shrink:0; padding:0 2px; }

#stage{ position:relative; width:100%; aspect-ratio:1/1; border-radius:20px; overflow:hidden; background:#000; flex-shrink:0; touch-action:pan-y; }
#stage-ring{ position:absolute; inset:-2px; border-radius:22px; border:1.5px solid var(--gold); opacity:0; pointer-events:none; z-index:1;}
#stage-ring.pulse{ animation:breathe 2.6s ease-in-out infinite; opacity:.55;}
@keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.55;} 50%{ transform:scale(1.035); opacity:.1;} }
#thumb-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(.72); z-index:1;}
#yt-stage{ position:absolute; inset:0; z-index:2;}
#yt-stage iframe{ position:absolute; top:50%; left:50%; width:178%; height:178%; transform:translate(-50%,-50%); border:0; pointer-events:none; }
#local-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; display:none; z-index:2;}
#list-overlay{
  position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(165deg, #241c2c 0%, #120f16 100%);
  overflow:hidden; padding:0 22px;
}
#rail-track{ display:flex; flex-direction:column; align-items:center; width:100%; gap:14px; }
.rail-row{ width:100%; text-align:center; cursor:pointer; transition:opacity .25s ease, transform .25s ease; padding:4px 0; }
.rail-row .rail-title{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; font-family:var(--fd); }
.rail-side{ opacity:.4; transform:scale(.86); color:var(--paper-dim); }
.rail-side:hover{ opacity:.7; }
.rail-side .rail-title{ font-size:13px; font-weight:500; }
.rail-current{ opacity:1; cursor:pointer; }
.rail-current .rail-title{ font-size:20px; font-weight:700; color:var(--gold-soft); line-height:1.35; }
.rail-current .rail-artist{ display:block; font-size:11px; color:var(--paper-dim); margin-top:4px; letter-spacing:.03em; }
.rail-eq{ display:flex; gap:3px; justify-content:center; align-items:flex-end; height:13px; margin-bottom:8px; }
.rail-eq span{ width:3px; background:var(--gold); border-radius:2px; animation:eq 1s ease-in-out infinite; }
.rail-eq span:nth-child(1){height:5px; animation-delay:0s;}
.rail-eq span:nth-child(2){height:12px; animation-delay:.15s;}
.rail-eq span:nth-child(3){height:8px; animation-delay:.3s;}
#viz-overlay{ position:absolute; inset:0; display:none; background:#0c0a10; overflow:hidden; z-index:4;}
#viz-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
#viz-title{ position:absolute; left:0; right:0; bottom:14px; text-align:center; font-family:var(--fd); font-size:14px; font-weight:600; color:var(--paper); text-shadow:0 2px 12px rgba(0,0,0,.7); padding:0 46px 0 16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#viz-toggle-btn{ position:absolute; top:10px; right:10px; z-index:12; background:rgba(11,10,14,.55); }
#viz-panel{ position:absolute; left:0; right:0; bottom:0; z-index:13; background:rgba(11,10,14,.85); backdrop-filter:blur(10px); padding:12px 14px 14px; display:flex; flex-direction:column; gap:10px; transform:translateY(0); transition:transform .25s ease; }
#viz-panel.hidden{ transform:translateY(100%); pointer-events:none; }
.mode-opt{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 4px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--paper-dim); font-size:11px; cursor:pointer; transition:.15s; }
.mode-opt svg{ width:14px; height:14px; }
.mode-opt:hover{ color:var(--paper); }
.mode-opt.active{ border-color:var(--gold); color:var(--gold-soft); background:rgba(217,166,86,.14); }
.mode-opt.disabled{ opacity:.35; pointer-events:none; }
.viz-row{ display:flex; gap:7px; justify-content:center; }
.viz-opt{ width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--paper-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
.viz-opt svg{ width:15px; height:15px; }
.viz-opt:hover{ color:var(--paper); }
.viz-opt.active{ border-color:var(--gold); color:var(--gold-soft); background:rgba(217,166,86,.14); }
.viz-swatch{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
.viz-swatch.active{ border-color:var(--paper); transform:scale(1.12); }
#play-overlay{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg, rgba(11,10,14,.15) 0%, rgba(11,10,14,.55) 100%); cursor:pointer; z-index:8;
}
#play-overlay .pb{ width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg, var(--gold), var(--rose)); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(217,166,86,.35); }
#play-overlay .pb svg{ width:22px; height:22px; margin-left:3px; fill:var(--ink);}
#play-overlay.hidden{ display:none; }
#swipe-hint{ position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:5px; opacity:.55; pointer-events:none; z-index:8;}
.swipe-dot{ width:4px; height:4px; border-radius:50%; background:var(--paper);}

#meta{ padding:16px 2px 6px; flex-shrink:0; }
#eyebrow{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--rose); font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
#eq-mini{ display:flex; gap:2px; align-items:flex-end; height:10px;}
#eq-mini span{ width:2px; background:var(--gold); border-radius:1px; animation:eq 1s ease-in-out infinite;}
#eq-mini span:nth-child(1){height:4px; animation-delay:0s;}
#eq-mini span:nth-child(2){height:9px; animation-delay:.15s;}
#eq-mini span:nth-child(3){height:6px; animation-delay:.3s;}
@keyframes eq{ 0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1);} }
.eq-idle span{ animation-play-state:paused; transform:scaleY(.4);}

#now-title{ font-family:var(--fd); font-size:19px; font-weight:600; line-height:1.3; color:var(--paper);
  overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
#now-artist{ font-size:12px; color:var(--paper-dim); margin-top:3px;}

#scrub-row{ display:flex; align-items:center; gap:9px; margin:14px 0 10px; flex-shrink:0;}
.tc{ font-size:10.5px; color:var(--paper-dim); min-width:30px; font-variant-numeric:tabular-nums;}
#scrub-track{ flex:1; height:14px; display:flex; align-items:center; cursor:pointer; }
#scrub-track .rail{ position:relative; width:100%; height:3px; background:rgba(255,255,255,.12); border-radius:99px;}
#scrub-fill{ position:absolute; left:0; top:0; height:100%; width:0%; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); border-radius:99px;}
#scrub-thumb{ position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--gold-soft); transform:translate(-50%,-50%); left:0%; box-shadow:0 2px 6px rgba(0,0,0,.4); opacity:0; transition:opacity .15s;}
#scrub-track:hover #scrub-thumb, #scrub-track.dragging #scrub-thumb{ opacity:1; }

#controls{ display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.tbtn{ background:none; border:none; color:var(--paper-dim); cursor:pointer; display:flex; align-items:center; justify-content:center; width:36px; height:36px; transition:.15s;}
.tbtn svg{ width:18px; height:18px; }
.tbtn:hover{ color:var(--paper); }
.tbtn.active{ color:var(--gold); }
#play-pill{ width:64px; height:44px; border-radius:22px; border:none; cursor:pointer; background:linear-gradient(135deg, var(--gold), var(--rose)); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(217,166,86,.3); transition:transform .12s ease; }
#play-pill:active{ transform:scale(.94); }
#play-pill svg{ width:20px; height:20px; fill:var(--ink); }

#sub-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; flex-shrink:0; gap:6px; }
#like-btn svg{ width:18px; height:18px; }
#like-btn.liked{ color:var(--rose); }
#like-btn.liked svg{ fill:var(--rose); }
#speed-btn{ min-width:38px; height:26px; padding:0 8px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--paper-dim); font-size:11px; font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer; transition:.15s; }
#speed-btn:hover{ color:var(--paper); }
#speed-btn.active{ color:var(--gold-soft); border-color:var(--gold); background:rgba(217,166,86,.14); }
#speed-panel{
  position:absolute; left:20px; right:20px; bottom:64px; z-index:15;
  background:rgba(11,10,14,.94); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:14px;
  padding:10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
  transform:translateY(8px); opacity:0; pointer-events:none; transition:transform .18s ease, opacity .18s ease;
  box-shadow:0 12px 30px rgba(0,0,0,.4);
}
#speed-panel.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
.speed-opt{ padding:6px 11px; border-radius:9px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--paper-dim); font-size:12px; font-weight:600; cursor:pointer; transition:.15s; }
.speed-opt:hover{ color:var(--paper); }
.speed-opt.active{ border-color:var(--gold); color:var(--gold-soft); background:rgba(217,166,86,.14); }
#vol-wrap{ display:none; align-items:center; gap:7px; flex:1; max-width:110px; margin-left:14px;}
@media (min-width:481px){ #vol-wrap{ display:flex; } }
#vol-wrap svg{ width:14px; height:14px; color:var(--paper-dim); flex-shrink:0;}
#vol-range{ -webkit-appearance:none; width:100%; height:3px; border-radius:99px; background:rgba(255,255,255,.14); outline:none; }
#vol-range::-webkit-slider-thumb{ -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:var(--gold-soft); cursor:pointer;}
#track-count{ font-size:11px; color:var(--paper-dim); font-variant-numeric:tabular-nums;}

/* ================= QUEUE VIEW ================= */
#view-queue{ flex:1; min-height:0; display:none; flex-direction:column; padding:0 18px 0; transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .28s ease; }
#view-queue.show{ display:flex; }

#add-toolbar{ display:flex; gap:8px; margin-bottom:10px; flex-shrink:0; }
.add-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:9px 4px; color:var(--paper-dim); font-size:9.5px; cursor:pointer; transition:.15s; }
.add-btn svg{ width:15px; height:15px; }
.add-btn:hover{ border-color:var(--gold); color:var(--gold-soft); }

#yt-add-panel{ margin-bottom:10px; display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
#yt-add-panel.hidden{ display:none; }
#yt-add-textarea{ width:100%; min-height:64px; resize:vertical; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:11px; padding:9px 11px; color:var(--paper); font-size:12px; outline:none; font-family:var(--fb); line-height:1.5;}
#yt-add-textarea::placeholder{ color:var(--paper-dim); }
#yt-add-textarea:focus{ border-color:var(--gold); }
#yt-add-submit{ align-self:flex-end; background:linear-gradient(135deg,var(--gold),var(--rose)); border:none; color:var(--ink); font-weight:700; font-size:12px; padding:7px 18px; border-radius:99px; cursor:pointer; }

#search-row{ flex-shrink:0; margin-bottom:10px; }
#search-input{ width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--paper); border-radius:11px; padding:10px 13px; font-size:13px; outline:none; }
#search-input::placeholder{ color:var(--paper-dim); }
#search-input:focus{ border-color:var(--gold); }
#queue-list{ position:relative; flex:1; overflow-y:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch;}
#queue-list::-webkit-scrollbar{ width:5px; }
#queue-list::-webkit-scrollbar-thumb{ background:var(--elev); border-radius:3px; }
#drop-indicator{ position:absolute; left:8px; right:8px; height:2px; background:var(--gold); border-radius:2px; box-shadow:0 0 6px var(--gold); display:none; pointer-events:none; z-index:40; }
.q-item{ display:flex; align-items:center; gap:8px; padding:9px 6px; border-radius:12px; cursor:pointer; transition:background .12s; }
.q-item:hover{ background:rgba(255,255,255,.04); }
.q-item.playing{ background:linear-gradient(90deg, rgba(217,166,86,.14), rgba(217,166,86,.02)); }
.q-item.dragging{ position:relative; z-index:50; background:var(--card-2); box-shadow:0 12px 26px rgba(0,0,0,.45); opacity:.96; transition:none; }
.q-handle{ flex-shrink:0; width:18px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--paper-dim); background:none; border:none; cursor:grab; touch-action:none; padding:0; }
.q-handle:active{ cursor:grabbing; }
.q-handle svg{ width:13px; height:13px; }
#queue-list.search-active .q-handle{ opacity:.25; pointer-events:none; }
.q-item .q-idx{ width:20px; text-align:center; font-size:11px; color:var(--paper-dim); flex-shrink:0; }
.q-item.playing .q-idx{ color:var(--gold); }
.q-item .q-eq{ width:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.q-item .q-info{ flex:1; min-width:0; }
.q-item .q-title{ font-family:var(--fd); font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--paper);}
.q-item.playing .q-title{ color:var(--gold-soft); }
.q-item .q-artist{ font-size:10.5px; color:var(--paper-dim); margin-top:1px; display:flex; align-items:center; gap:5px;}
.q-badge{ font-size:9px; padding:1px 5px; border-radius:4px; border:1px solid var(--line); color:var(--paper-dim); letter-spacing:.03em; }
.q-item .q-like{ flex-shrink:0; width:16px; height:16px; color:var(--rose); opacity:0; }
.q-item .q-like.on{ opacity:1; }
.q-del{ flex-shrink:0; width:24px; height:24px; border-radius:50%; border:none; background:none; color:var(--paper-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s; }
.q-del svg{ width:14px; height:14px; }
.q-del:hover{ color:var(--rose); background:rgba(217,120,143,.12); }
#queue-empty{ text-align:center; padding:40px 20px; color:var(--paper-dim); font-size:13px; display:none; }

/* ================= MINI BAR ================= */
#mini-bar{ display:none; align-items:center; gap:11px; flex-shrink:0; padding:10px 14px calc(12px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.03); border-top:1px solid var(--line); cursor:pointer; position:relative; }
#view-queue.show ~ #mini-bar{ display:flex; }
#mini-progress{ position:absolute; top:0; left:0; height:2px; background:linear-gradient(90deg,var(--gold),var(--gold-soft)); width:0%; }
#mini-thumb{ width:38px; height:38px; border-radius:9px; overflow:hidden; flex-shrink:0; background:#000; display:flex; align-items:center; justify-content:center; }
#mini-thumb img{ width:100%; height:100%; object-fit:cover; display:none; }
#mini-thumb svg{ width:16px; height:16px; color:var(--paper-dim); }
#mini-info{ flex:1; min-width:0; }
#mini-title{ font-size:12.5px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#mini-artist{ font-size:10px; color:var(--paper-dim); }
#mini-controls{ display:flex; gap:4px; }
#mini-controls .tbtn{ width:32px; height:32px; }
#mini-controls .tbtn svg{ width:16px; height:16px; }

/* ================= FOOTER ================= */
#footer{ flex-shrink:0; padding:9px 0 max(10px, env(safe-area-inset-bottom)); }
#view-queue.show ~ #footer{ display:none; }
#footer-links{ display:flex; align-items:center; justify-content:center; gap:14px; }
#footer-links a{ display:inline-flex; align-items:center; gap:5px; color:var(--paper-dim); text-decoration:none; font-size:10.5px; letter-spacing:.02em; transition:.15s; }
#footer-links a:hover{ color:var(--gold-soft); }
#footer-links svg{ width:12px; height:12px; flex-shrink:0; }
#footer-links .yt-icon{ color:var(--rose); }

/* small width tweak */
@media (max-width:340px){
  #now-title{ font-size:17px; }
  #play-pill{ width:58px; height:40px; }
}

/* hidden native inputs */
.hidden-input{ position:fixed; left:-9999px; width:1px; height:1px; opacity:0; }
</style>

        <option value="ja">🇯🇵 日本語</option>

  <!-- ===== NOW PLAYING ===== -->
  <div id="view-now">

      <span data-i18n="file_notice">로컬 파일(file://)로 직접 열면 브라우저 정책상 YouTube 재생이 제한될 수 있어요. 웹 서버(WordPress·GitHub Pages 등)에서 실행하면 정상 동작합니다.</span>

            <div class="rail-eq eq-idle"><span></span><span></span><span></span></div>

        <div id="viz-title"></div>

<script>
/* =========================================================
   SAFE STORAGE — localStorage가 막힌 환경(file:// opaque origin,
   시크릿 모드, 브라우저 정책 등)에서도 스크립트 전체가 죽지 않도록
   메모리 폴백을 제공하는 래퍼. 이 파일의 모든 localStorage 접근은
   반드시 이 래퍼(safeStorage)를 통해서만 이루어져야 함.
========================================================= */
const safeStorage = (function(){
  const mem = {};
  let ok = false;
  try{
    const testKey = '__pomiai_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    ok = true;
  }catch(e){ ok = false; }
  return {
    getItem(key){
      if(!ok) return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null;
      try{ return window.localStorage.getItem(key); }catch(e){ return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : null; }
    },
    setItem(key, value){
      mem[key] = String(value);
      if(!ok) return;
      try{ window.localStorage.setItem(key, value); }catch(e){ /* 무시 — 메모리 폴백은 이미 저장됨 */ }
    }
  };
})();

(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  /* 중국어 간체/번체 및 장문 코드(de_DE 등) 매핑을 위한 정규화 함수 */
  function normalizeLang(raw){
    if(!raw) return '';
    if(I18N[raw]) return raw;
    if(/^zh/i.test(raw)) return /tw|hk|mo/i.test(raw) ? 'zh_TW' : 'zh_CN';
    const two = raw.slice(0,2).toLowerCase();
    const longMap = { de:'de_DE', fr:'fr_FR', nl:'nl_NL', sv:'sv_SE', da:'da_DK', nb:'nn_NO', nn:'nn_NO', no:'nn_NO' };
    return longMap[two] || two;
  }
  const urlKey = normalizeLang(urlLang);
  const browserKey = normalizeLang(navigator.language || 'ko');
  const LANG = (urlLang && I18N[urlLang]) ? urlLang
             : (I18N[urlKey] ? urlKey
             : (I18N[browserKey] ? browserKey : 'ko'));
  window._LANG = LANG;
  window._T = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
  document.getElementById('html-root').setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
})();
function applyI18n(){
  const t = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(typeof t[k] === 'string') el.textContent = t[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const k = el.dataset.i18nPlaceholder;
    if(typeof t[k] === 'string') el.placeholder = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.title = t.page_title;
  const langSel = document.getElementById('lang-switch');
  if(langSel) langSel.value = window._LANG;
}
applyI18n();

    const saved = JSON.parse(raw);
    return saved.map(t => ({ source:'yt', videoId:t.videoId, title:t.title }));
  }catch(e){ return [...DEFAULT_PLAYLIST]; }
}

const ft = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const thumbUrl = id => 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
const eqSpan = () => '<span></span><span></span><span></span>';
const baseName = name => { const i = name.lastIndexOf('.'); return i === -1 ? name : name.slice(0,i); };
const fileExt = name => { const i = name.lastIndexOf('.'); return i === -1 ? '' : name.slice(i+1).toLowerCase(); };

function buildShuffle(){
  const idxs = PLAYLIST.map((_,i)=>i);
  for(let i = idxs.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  shuffleOrder = idxs;
  shufflePos = Math.max(0, shuffleOrder.indexOf(ci));
}
function nextIndex(){
  if(!PLAYLIST.length) return 0;
  if(mode === 'one') return ci;
  if(mode === 'shuffle'){
    if(!shuffleOrder.length) buildShuffle();
    shufflePos = (shufflePos + 1) % shuffleOrder.length;
    if(shufflePos === 0) buildShuffle();
    return shuffleOrder[shufflePos];
  }
  return (ci + 1) % PLAYLIST.length;
}
function prevIndex(){
  if(!PLAYLIST.length) return 0;
  if(mode === 'shuffle'){
    if(!shuffleOrder.length) buildShuffle();
    shufflePos = (shufflePos - 1 + shuffleOrder.length) % shuffleOrder.length;
    return shuffleOrder[shufflePos];
  }
  return (ci - 1 + PLAYLIST.length) % PLAYLIST.length;
}
// 미리보기 전용(재생목록 레일 표시용) — shufflePos 등 재생 상태를 변경하지 않음
function peekNextIndex(){
  if(!PLAYLIST.length) return -1;
  if(mode === 'one') return ci;
  if(mode === 'shuffle'){
    if(!shuffleOrder.length) return (ci + 1) % PLAYLIST.length;
    return shuffleOrder[(shufflePos + 1) % shuffleOrder.length];
  }
  return (ci + 1) % PLAYLIST.length;
}
function peekPrevIndex(){
  if(!PLAYLIST.length) return -1;
  if(mode === 'shuffle'){
    if(!shuffleOrder.length) return (ci - 1 + PLAYLIST.length) % PLAYLIST.length;
    return shuffleOrder[(shufflePos - 1 + shuffleOrder.length) % shuffleOrder.length];
  }
  return (ci - 1 + PLAYLIST.length) % PLAYLIST.length;
}

      '<button class="q-del" data-idx="' + idx + '" aria-label="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>';
    el.addEventListener('click', () => loadAt(idx));
    el.querySelector('.q-del').addEventListener('click', (e) => { e.stopPropagation(); removeTrack(idx); });
    el.querySelector('.q-handle').addEventListener('click', (e) => e.stopPropagation());
    wrap.appendChild(el);
  });
}
function reorderPlaylist(fromIdx, toIdx){
  if(fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= PLAYLIST.length) return;
  const [moved] = PLAYLIST.splice(fromIdx, 1);
  PLAYLIST.splice(toIdx, 0, moved);
  // 현재 재생 중인 트랙이 순서 변경으로 어디로 이동했는지 인덱스 보정
  if(ci === fromIdx) ci = toIdx;
  else if(fromIdx < ci && toIdx >= ci) ci -= 1;
  else if(fromIdx > ci && toIdx <= ci) ci += 1;
  shuffleOrder = []; // 순서가 바뀌었으므로 셔플 순서는 다음 사용 시 새로 계산
  savePlaylist();
}

/* =========================================================
   재생목록 드래그 앤 드롭 순서 변경 (마우스·터치 공용, Pointer Events)
   ※ pointermove/pointerup은 컨테이너가 아니라 window에 붙여서
     드래그 도중 손가락/커서가 리스트 밖으로 나가도 끊기지 않도록 함
     (setPointerCapture만 의존할 경우 일부 모바일 브라우저에서 불안정할 수 있음)
========================================================= */
let dragState = null;
function initQueueDrag(){
  const list = $('queue-list');
  list.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.q-handle');
    if(!handle) return;
    if($('search-input').value.trim()) return; // 검색 중엔 순서가 실제 배열과 안 맞으므로 비활성화
    const item = handle.closest('.q-item');
    if(!item) return;
    e.preventDefault();
    const startIndex = Number(item.dataset.idx);
    const others = [...list.querySelectorAll('.q-item')]
      .filter(el => el !== item)
      .map(el => ({ idx: Number(el.dataset.idx), rect: el.getBoundingClientRect() }))
      .sort((a,b) => a.idx - b.idx);
    dragState = { item, startIndex, others };
    item.classList.add('dragging');
    window.addEventListener('pointermove', onQueueDragMove, { passive: false });
    window.addEventListener('pointerup', onQueueDragEnd);
    window.addEventListener('pointercancel', onQueueDragEnd);
  });
}
function onQueueDragMove(e){
  if(!dragState) return;
  e.preventDefault();
  const list = $('queue-list');
  const count = dragState.others.filter(o => (o.rect.top + o.rect.height/2) < e.clientY).length;
  updateDropIndicator(dragState.others, count, list);
}
function onQueueDragEnd(e){
  if(!dragState) return;
  const count = dragState.others.filter(o => (o.rect.top + o.rect.height/2) < e.clientY).length;
  dragState.item.classList.remove('dragging');
  $('drop-indicator').style.display = 'none';
  const fromIdx = dragState.startIndex;
  window.removeEventListener('pointermove', onQueueDragMove);
  window.removeEventListener('pointerup', onQueueDragEnd);
  window.removeEventListener('pointercancel', onQueueDragEnd);
  dragState = null;
  if(count !== fromIdx){
    reorderPlaylist(fromIdx, count);
    // visible은 PLAYLIST와 별개 배열(검색 필터용)이라 재정렬 후 반드시 다시 만들어줘야
    // 화면에도 실제로 반영됨 (여기 빠져있던 게 "실제 적용 안 되는" 것처럼 보였던 원인)
    const q = $('search-input').value.trim().toLowerCase();
    visible = q ? PLAYLIST.filter(x => x.title.toLowerCase().includes(q)) : [...PLAYLIST];
    renderQueue();
    renderTrackRail();
  }
}
function updateDropIndicator(others, count, list){
  const listRect = list.getBoundingClientRect();
  const ind = $('drop-indicator');
  let y;
  if(!others.length){ y = 12; }
  else if(count <= 0){ y = others[0].rect.top - listRect.top + list.scrollTop - 3; }
  else if(count >= others.length){ const last = others[others.length-1]; y = last.rect.bottom - listRect.top + list.scrollTop + 3; }
  else{ y = others[count].rect.top - listRect.top + list.scrollTop - 3; }
  ind.style.top = y + 'px';
  ind.style.display = 'block';
}
function removeTrack(idx){
  if(idx < 0 || idx >= PLAYLIST.length) return;
  const removingCurrent = idx === ci;
  const t = PLAYLIST[idx];
  if(t.source === 'local' && t.url){ try{ URL.revokeObjectURL(t.url); }catch(e){} }
  PLAYLIST.splice(idx, 1);
  shuffleOrder = []; // 인덱스가 밀렸으므로 셔플 순서는 다음 사용 시 새로 계산
  if(idx < ci) ci -= 1;
  savePlaylist();
  const q = $('search-input').value.trim().toLowerCase();
  visible = q ? PLAYLIST.filter(x => x.title.toLowerCase().includes(q)) : [...PLAYLIST];

  if(!PLAYLIST.length){
    ci = 0; started = false; playing = false;
    try{ if(ytPlayer && ytReady) ytPlayer.stopVideo(); }catch(e){}
    localVideo.pause(); localVideo.removeAttribute('src'); localVideo.load();
    $('thumb-img').src = '';
    $('viz-title').textContent = '';
    currentSource = 'yt';
    showEngine('yt');
    updateStageMode();
    showOverlay();
    updatePlayIcons();
    updateMeta();
    renderQueue();
    return;
  }
  if(removingCurrent){
    loadAt(Math.min(idx, PLAYLIST.length - 1));
  } else {
    updateMeta();
    renderQueue();
    renderTrackRail();
  }
}

/* =========================================================
   ENGINE (YouTube ⇄ Local HTML5 video)
========================================================= */
function hideOverlay(){ $('play-overlay').classList.add('hidden'); }
function showOverlay(){ $('play-overlay').classList.remove('hidden'); }

function showEngine(kind, trackKind){
  $('yt-stage').style.display = kind === 'yt' ? 'block' : 'none';
  $('thumb-img').style.display = kind === 'yt' ? 'block' : 'none';
  localVideo.style.display = (kind === 'local' && trackKind === 'video') ? 'block' : 'none';
}

function setPlaybackRate(rate){
  playbackRate = rate;
  safeStorage.setItem('pomiai_playback_rate', String(rate));
  $('speed-label').textContent = (rate === 1 ? '1x' : rate + 'x');
  $('speed-btn').classList.toggle('active', rate !== 1);
  document.querySelectorAll('.speed-opt').forEach(b => b.classList.toggle('active', Number(b.dataset.rate) === rate));
  applyPlaybackRateToEngine();
}
function applyPlaybackRateToEngine(){
  if(currentSource === 'yt'){
    if(ytPlayer && ytReady){ try{ ytPlayer.setPlaybackRate(playbackRate); }catch(e){} }
  } else {
    try{ localVideo.playbackRate = playbackRate; }catch(e){}
  }
}

function loadAt(idx){
  if(!PLAYLIST.length) return;
  ci = ((idx % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
  const t = PLAYLIST[ci];
  currentSource = t.source || 'yt';
  updateMeta();
  renderQueue();
  started = true;
  $('viz-title').textContent = t.title;
  clearTimeout(pendingLoadTimer);
  pendingYtVideoId = null;

  if(currentSource === 'yt'){
    localVideo.pause();
    showEngine('yt');
    if(ytPlayer && ytReady){
      ytPlayer.loadVideoById(t.videoId);
      applyPlaybackRateToEngine(); // 트랙이 바뀌어도 선택했던 재생속도 유지
      // 오버레이는 실제 재생이 시작(onStateChange e.data===1)될 때 사라짐
    } else {
      // YouTube API가 아직 로드되지 않음 — 준비되는 대로 자동 재생, 오버레이는 유지(빈 화면 방지)
      pendingYtVideoId = t.videoId;
      showOverlay();
      pendingLoadTimer = setTimeout(() => {
        if(pendingYtVideoId === t.videoId && !ytReady){
          // 8초 이상 로드되지 않음 — 콘솔이 아니라 화면에 직접 안내 + 재시도 버튼 표시
          showYtNotice();
        }
      }, 8000);
    }
  } else {
    if(ytPlayer && ytReady){ try{ ytPlayer.pauseVideo(); }catch(e){} }
    showEngine('local', t.kind);
    ensureAudioGraph();
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    localVideo.src = t.url;
    localVideo.currentTime = 0;
    localVideo.playbackRate = playbackRate; // 트랙이 바뀌어도 선택했던 재생속도 유지
    localVideo.play().catch(()=>{});
    // 오버레이는 localVideo의 'play' 이벤트에서 실제 재생 시작 시 사라짐
  }
  updateStageMode();
}
function togglePlay(){
  if(!PLAYLIST.length) return;
  if(!started){ loadAt(ci); return; }
  if(currentSource === 'yt'){
    if(!ytReady) return;
    if(playing){ ytPlayer.pauseVideo(); }
    else{
      try{
        const s = ytPlayer.getPlayerState();
        (s === -1 || s === 5) ? ytPlayer.loadVideoById(PLAYLIST[ci].videoId) : ytPlayer.playVideo();
      }catch(e){ ytPlayer.loadVideoById(PLAYLIST[ci].videoId); }
    }
  } else {
    if(playing) localVideo.pause();
    else{ ensureAudioGraph(); if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); localVideo.play().catch(()=>{}); }
  }
}
function updateProgress(){
  let d = 0, c = 0;
  if(currentSource === 'yt'){
    if(!ytPlayer || !ytReady) return;
    try{ d = ytPlayer.getDuration() || 0; c = ytPlayer.getCurrentTime() || 0; }catch(e){ return; }
  } else {
    d = localVideo.duration || 0; c = localVideo.currentTime || 0;
  }
  const pct = d ? Math.min(100, c/d*100) : 0;
  $('scrub-fill').style.width = pct + '%';
  $('scrub-thumb').style.left = pct + '%';
  $('mini-progress').style.width = pct + '%';
  $('tc-cur').textContent = ft(c);
  $('tc-dur').textContent = d ? ft(d) : '–:–';
}

/* ---- YouTube IFrame API 로드 실패/지연 안내 배너 ---- */
function showYtNotice(){
  const scriptFailed = !!window.__pomiaiYtScriptFailed;
  $('yt-notice-text').textContent = scriptFailed ? window._T.yt_notice_blocked : window._T.yt_notice_timeout;
  $('yt-notice').classList.add('show');
}
function hideYtNotice(){ $('yt-notice').classList.remove('show'); }
function retryYtApiLoad(){
  hideYtNotice();
  window.__pomiaiYtScriptFailed = false;
  clearTimeout(pendingLoadTimer);
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api?retry=' + Date.now();
  s.onerror = () => { window.__pomiaiYtScriptFailed = true; };
  document.head.appendChild(s);
  if(pendingYtVideoId){
    pendingLoadTimer = setTimeout(() => {
      if(pendingYtVideoId && !ytReady) showYtNotice();
    }, 8000);
  }
}

/* ---- YouTube IFrame API ---- */
window.onYouTubeIframeAPIReady = function(){
  try{
    const playerVars = { playsinline:1, modestbranding:1, rel:0, enablejsapi:1 };
    // file:// 로 직접 연 경우 origin이 "null"이 되어 YouTube가 postMessage 통신을 거부할 수 있으므로 생략
    if(!isFileProtocol) playerVars.origin = window.location.origin;
    ytPlayer = new YT.Player('yt-stage', {
      height:'100%', width:'100%',
      playerVars: playerVars,
      events:{
        onReady:function(){
          ytReady = true;
          clearTimeout(pendingLoadTimer);
          hideYtNotice();
          if(pendingYtVideoId){
            // 사용자가 이미 재생을 눌러 대기 중이던 트랙이 있으면 바로 재생 시도
            const vid = pendingYtVideoId;
            pendingYtVideoId = null;
            if(currentSource === 'yt'){
              ytPlayer.loadVideoById(vid);
              applyPlaybackRateToEngine();
              // 이 호출은 사용자의 클릭 순간이 아니라 API 로딩이 끝난 "이후"에 비동기로 실행되므로
              // 일부 브라우저의 자동재생 정책에 막혀 소리 없이 시작 안 될 수 있음 — 확인 후 안내
              clearTimeout(pendingLoadTimer);
              pendingLoadTimer = setTimeout(() => {
                if(currentSource === 'yt' && !playing){
                  showOverlay(); // 자동재생이 막혔을 가능성 — 오버레이를 다시 보여줘 재탭으로 재생 가능하게 함
                }
              }, 1200);
            }
          } else if(PLAYLIST.length && (PLAYLIST[0].source||'yt') === 'yt' && !started){
            ytPlayer.cueVideoById(PLAYLIST[0].videoId);
          }
          progressTimer = setInterval(updateProgress, 250);
          updateMeta(); renderQueue();
        },
        onStateChange:function(e){
          if(currentSource !== 'yt') return;
          if(e.data === 1){ playing = true; hideOverlay(); }
          if(e.data === 2){ playing = false; }
          if(e.data === 0){ loadAt(nextIndex()); }
          updatePlayIcons();
        },
        onError:function(){
          // 재생 불가(비공개/삭제/지역제한 등) — 오버레이를 다시 보여줘서 다음 곡으로 넘어갈 수 있게 함
          if(currentSource === 'yt'){ playing = false; showOverlay(); updatePlayIcons(); }
        }
      }
    });
  }catch(e){ console.warn('pomiai player: YouTube Player 초기화 실패', e); }
};
if(window.YT && window.YT.Player) window.onYouTubeIframeAPIReady();

/* ---- Local HTML5 video engine events ---- */
localVideo.addEventListener('play', () => { if(currentSource==='local'){ playing = true; hideOverlay(); updatePlayIcons(); } });
localVideo.addEventListener('pause', () => { if(currentSource==='local'){ playing = false; updatePlayIcons(); } });
localVideo.addEventListener('ended', () => { if(currentSource==='local') loadAt(nextIndex()); });

/* =========================================================
   VISUALIZER — 동영상이 없는 로컬 오디오 재생 시 표시
   (Web Audio API AnalyserNode + Canvas, 스타일/컬러 선택 가능)
========================================================= */
let audioCtx = null, analyser = null, sourceNode = null, freqData = null, timeData = null;
function ensureAudioGraph(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(localVideo);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }catch(e){ /* Web Audio 사용 불가 — idle 모션으로 대체됨 */ }
}

const VIZ_THEMES = {
  sunset:['#d9a656','#d9788f','#141019'],
  ocean:['#4fd1c5','#5b8def','#0c1620'],
  neon:['#ff5fd1','#5ff0ff','#0a0714'],
  mono:['#f4eee1','#8f8a7d','#141019']
};
let vizStyle = safeStorage.getItem('pomiai_viz_style') || 'bars';
let vizColorKey = safeStorage.getItem('pomiai_viz_color') || 'sunset';
let displayMode = safeStorage.getItem('pomiai_display_mode') || 'list'; // 'media'(영상) | 'list'(재생목록) | 'visualizer'
let vizCanvas = null, vizCtx = null, vizRotation = 0, vizParticles = null;

function stageHasMedia(){
  const t = PLAYLIST[ci];
  return currentSource === 'yt' || (currentSource === 'local' && t && t.kind === 'video');
}
function updateStageMode(){
  const hasMedia = stageHasMedia();
  let mode = displayMode;
  if(mode === 'media' && !hasMedia) mode = 'list'; // 보여줄 영상이 없으면 자동으로 재생목록으로 대체(선택값 자체는 유지)
  $('viz-overlay').style.display = mode === 'visualizer' ? 'block' : 'none';
  $('list-overlay').style.display = mode === 'list' ? 'flex' : 'none';
  if(mode === 'visualizer') resizeVizCanvas(); // 숨겨진 상태에서 계산된 캔버스 크기(0)가 남아있지 않도록 보이는 시점에 다시 계산
  else if(mode === 'list') renderTrackRail();
  document.querySelectorAll('.mode-opt').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
    b.classList.toggle('disabled', b.dataset.mode === 'media' && !hasMedia);
  });
}
function setDisplayMode(m){
  displayMode = m;
  safeStorage.setItem('pomiai_display_mode', m);
  updateStageMode();
}
function renderTrackRail(){
  if(!PLAYLIST.length){
    $('rail-prev').querySelector('.rail-title').textContent = '';
    $('rail-next').querySelector('.rail-title').textContent = '';
    $('rail-current').querySelector('.rail-title').textContent = window._T.empty_title;
    return;
  }
  const cur = PLAYLIST[ci];
  const prevT = PLAYLIST[peekPrevIndex()];
  const nextT = PLAYLIST[peekNextIndex()];
  $('rail-prev').querySelector('.rail-title').textContent = prevT ? prevT.title : '';
  $('rail-current').querySelector('.rail-title').textContent = cur.title;
  $('rail-next').querySelector('.rail-title').textContent = nextT ? nextT.title : '';
  $('rail-current').querySelector('.rail-eq').classList.toggle('eq-idle', !playing);
}

function setupVisualizer(){
  vizCanvas = $('viz-canvas');
  vizCtx = vizCanvas.getContext('2d');
  resizeVizCanvas();
  window.addEventListener('resize', resizeVizCanvas);
  document.querySelectorAll('.mode-opt').forEach(b => {
    b.addEventListener('click', () => setDisplayMode(b.dataset.mode));
  });
  $('rail-prev').addEventListener('click', () => loadAt(prevIndex()));
  $('rail-next').addEventListener('click', () => loadAt(nextIndex()));
  $('rail-current').addEventListener('click', () => togglePlay());
  document.querySelectorAll('.viz-opt').forEach(b => {
    b.classList.toggle('active', b.dataset.style === vizStyle);
    b.addEventListener('click', () => {
      vizStyle = b.dataset.style;
      safeStorage.setItem('pomiai_viz_style', vizStyle);
      document.querySelectorAll('.viz-opt').forEach(x => x.classList.toggle('active', x === b));
    });
  });
  document.querySelectorAll('.viz-swatch').forEach(b => {
    b.classList.toggle('active', b.dataset.color === vizColorKey);
    b.addEventListener('click', () => {
      vizColorKey = b.dataset.color;
      safeStorage.setItem('pomiai_viz_color', vizColorKey);

    });
  });

function resizeVizCanvas(){
  if(!vizCanvas) return;
  const rect = vizCanvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  vizCanvas.width = Math.max(1, rect.width * dpr);
  vizCanvas.height = Math.max(1, rect.height * dpr);
  vizCanvas.style.width = rect.width + 'px';
  vizCanvas.style.height = rect.height + 'px';
  vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function bandValue(i, n){
  if(analyser && playing && currentSource==='local'){
    const bin = Math.floor((i / n) * (freqData.length * 0.72));
    return (freqData[bin] || 0) / 255;
  }
  const t = Date.now() / 260 + i * 0.4;
  return 0.14 + 0.12 * Math.abs(Math.sin(t));
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawVizBars(w, h, theme){
  const n = 40, cx = w/2, maxBar = h*0.68, barW = Math.max(2, (w/n)*0.55);
  const grad = vizCtx.createLinearGradient(0, h, 0, h-maxBar);
  grad.addColorStop(0, theme[0]); grad.addColorStop(1, theme[1]);
  vizCtx.fillStyle = grad;
  for(let i=0; i<n; i++){
    const v = bandValue(i, n);
    const bh = 6 + v*maxBar;
    const x = cx + (i - n/2) * (w/n);
    roundRect(vizCtx, x - barW/2, h - bh - h*0.1, barW, bh, barW/2);
    vizCtx.fill();
  }
}
function drawVizNeonBar(w, h, theme){
  // 인기 있는 "네온 이퀄라이저 바" 스타일 — 글로우(발광) + 아래쪽 반사 효과
  const n = 28, baseline = h*0.66, maxBar = h*0.5;
  const gapRatio = 0.32, barW = Math.max(3, (w/n) * (1-gapRatio));
  vizCtx.save();
  // 베이스라인 은은한 발광 선
  vizCtx.shadowBlur = 10; vizCtx.shadowColor = theme[0];
  vizCtx.strokeStyle = theme[0] + '55'; vizCtx.lineWidth = 1;
  vizCtx.beginPath(); vizCtx.moveTo(0, baseline); vizCtx.lineTo(w, baseline); vizCtx.stroke();
  for(let i=0; i<n; i++){
    const v = bandValue(i, n);
    const bh = 6 + v*maxBar;
    const x = i*(w/n) + ((w/n) - barW)/2;
    const grad = vizCtx.createLinearGradient(0, baseline, 0, baseline - bh);
    grad.addColorStop(0, theme[1]); grad.addColorStop(1, theme[0]);
    // 위쪽 발광 바
    vizCtx.shadowBlur = 16; vizCtx.shadowColor = theme[0];
    vizCtx.fillStyle = grad;
    roundRect(vizCtx, x, baseline - bh, barW, bh, barW/2.2);
    vizCtx.fill();
    // 아래쪽 반사(흐릿하게 대칭 반사)
    vizCtx.save();
    vizCtx.shadowBlur = 0;
    vizCtx.globalAlpha = 0.28;
    const reflGrad = vizCtx.createLinearGradient(0, baseline, 0, baseline + bh*0.45);
    reflGrad.addColorStop(0, theme[1]); reflGrad.addColorStop(1, 'transparent');
    vizCtx.fillStyle = reflGrad;
    roundRect(vizCtx, x, baseline, barW, bh*0.45, barW/2.2);
    vizCtx.fill();
    vizCtx.restore();
  }
  vizCtx.restore();
}
function drawVizWave(w, h, theme){
  const grad = vizCtx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, theme[0]); grad.addColorStop(1, theme[1]);
  vizCtx.strokeStyle = grad; vizCtx.lineWidth = 2.5; vizCtx.lineCap = 'round';
  vizCtx.beginPath();
  const n = (analyser && playing && currentSource==='local') ? timeData.length : 64;
  for(let i=0; i<n; i++){
    const x = (i/(n-1)) * w;
    const v = (analyser && playing && currentSource==='local') ? (timeData[i]-128)/128 : Math.sin(i*0.3 + Date.now()/260)*0.4;
    const y = h/2 + v*h*0.32;
    i===0 ? vizCtx.moveTo(x,y) : vizCtx.lineTo(x,y);
  }
  vizCtx.stroke();
}
function drawVizRadial(w, h, theme, bass){
  const cx=w/2, cy=h/2, r0=Math.min(w,h)*0.17, rMax=Math.min(w,h)*0.42, n=48;
  vizRotation += 0.004 + bass*0.01;
  for(let i=0; i<n; i++){
    const v = bandValue(i, n);
    const len = r0 + v*(rMax-r0);
    const ang = vizRotation + (i/n)*Math.PI*2;
    const x1 = cx+Math.cos(ang)*r0, y1 = cy+Math.sin(ang)*r0;
    const x2 = cx+Math.cos(ang)*len, y2 = cy+Math.sin(ang)*len;
    vizCtx.strokeStyle = i%2 ? theme[0] : theme[1];
    vizCtx.lineWidth = 2.5; vizCtx.lineCap = 'round';
    vizCtx.beginPath(); vizCtx.moveTo(x1,y1); vizCtx.lineTo(x2,y2); vizCtx.stroke();
  }
  vizCtx.beginPath(); vizCtx.arc(cx, cy, r0*(0.7+bass*0.3), 0, Math.PI*2);
  vizCtx.fillStyle = theme[0] + '33'; vizCtx.fill();
}
function drawVizAurora(w, h, theme){
  vizCtx.save();
  vizCtx.filter = 'blur(16px)';
  for(let layer=0; layer<3; layer++){
    const amp = h*0.12*(1+layer*0.4);
    const speed = Date.now() / (1800 + layer*400);
    vizCtx.beginPath();
    for(let x=0; x<=w; x+=8){
      const v = (analyser && playing && currentSource==='local') ? (freqData[Math.floor((x/w)*freqData.length*0.5)]||0)/255 : 0.3;
      const y = h*0.5 + Math.sin(x*0.015 + speed*6 + layer)*amp*(0.4+v);
      x===0 ? vizCtx.moveTo(x,y) : vizCtx.lineTo(x,y);
    }
    vizCtx.lineTo(w,h); vizCtx.lineTo(0,h); vizCtx.closePath();
    vizCtx.fillStyle = (layer%2 ? theme[1] : theme[0]) + '55';
    vizCtx.fill();
  }
  vizCtx.restore();
}
function drawVizParticles(w, h, theme, bass){
  if(!vizParticles){
    vizParticles = [];
    for(let i=0; i<26; i++){
      vizParticles.push({ a: Math.random()*Math.PI*2, r: 18+Math.random()*Math.min(w,h)*0.42, s: 0.002+Math.random()*0.006, sz: 1.5+Math.random()*2.4 });
    }
  }
  const cx=w/2, cy=h/2;
  vizParticles.forEach((p,i) => {
    p.a += p.s * (1 + bass*3);
    const rr = p.r * (0.85 + bass*0.3);
    const x = cx + Math.cos(p.a)*rr, y = cy + Math.sin(p.a)*rr*0.85;
    vizCtx.beginPath();
    vizCtx.arc(x, y, p.sz + bass*3, 0, Math.PI*2);
    vizCtx.fillStyle = i%2 ? theme[0] : theme[1];
    vizCtx.globalAlpha = 0.55 + bass*0.4;
    vizCtx.fill();
  });
  vizCtx.globalAlpha = 1;
}
function vizLoop(){
  requestAnimationFrame(vizLoop);
  if(!vizCanvas) return;
  const active = $('viz-overlay').style.display !== 'none';
  if(!active) return;
  const w = vizCanvas.clientWidth, h = vizCanvas.clientHeight;
  if(!w || !h) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if(Math.round(vizCanvas.width) !== Math.round(w * dpr) || Math.round(vizCanvas.height) !== Math.round(h * dpr)){
    resizeVizCanvas(); // 캔버스 실제 해상도가 표시 크기와 어긋나 있으면(숨김 상태에서 계산된 값 등) 다시 맞춤
  }
  const theme = VIZ_THEMES[vizColorKey];
  vizCtx.clearRect(0, 0, w, h);
  vizCtx.fillStyle = theme[2];
  vizCtx.fillRect(0, 0, w, h);
  if(analyser && playing && currentSource==='local'){
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
  }
  const bass = (analyser && playing && currentSource==='local') ? (freqData[0]+freqData[1]+freqData[2]+freqData[3])/4/255 : (playing ? 0.35+0.15*Math.sin(Date.now()/300) : 0.1);
  if(vizStyle === 'bars') drawVizBars(w, h, theme);
  else if(vizStyle === 'neonbar') drawVizNeonBar(w, h, theme);
  else if(vizStyle === 'wave') drawVizWave(w, h, theme);
  else if(vizStyle === 'radial') drawVizRadial(w, h, theme, bass);
  else if(vizStyle === 'aurora') drawVizAurora(w, h, theme);
  else if(vizStyle === 'particles') drawVizParticles(w, h, theme, bass);
}

/* =========================================================
   MEDIA SESSION (모바일 잠금화면 컨트롤)
========================================================= */
function updateMediaSession(track, artUrl){
  if(!('mediaSession' in navigator)) return;
  const artwork = artUrl ? [{ src:artUrl, sizes:'480x360', type:'image/jpeg' }] : [];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title, artist:'pomiai', album:'pomiai Music', artwork
  });
  navigator.mediaSession.setActionHandler('play', togglePlay);
  navigator.mediaSession.setActionHandler('pause', togglePlay);
  navigator.mediaSession.setActionHandler('previoustrack', () => loadAt(prevIndex()));
  navigator.mediaSession.setActionHandler('nexttrack', () => loadAt(nextIndex()));
}

/* =========================================================
   로컬 파일 / YouTube ID 추가
========================================================= */
function afterAdd(addedList){
  if(!addedList.length) return;
  const wasEmpty = !started;
  PLAYLIST = PLAYLIST.concat(addedList);
  savePlaylist();
  const q = $('search-input').value.trim().toLowerCase();
  visible = q ? PLAYLIST.filter(t => t.title.toLowerCase().includes(q)) : [...PLAYLIST];
  renderQueue();
  updateMeta();
  if(wasEmpty) loadAt(PLAYLIST.length - addedList.length);
  else renderTrackRail(); // 이미 재생 중이면 조용히 추가만 — 다만 레일의 이전/다음 미리보기는 갱신
}

function handleLocalFiles(fileList){
  const files = Array.from(fileList || []);
  const added = [];
  files.forEach(f => {
    const ext = fileExt(f.name);
    let kind = null;
    if(LOCAL_VIDEO_EXT.includes(ext)) kind = 'video';
    else if(LOCAL_AUDIO_EXT.includes(ext)) kind = 'audio';
    if(!kind) return;
    added.push({ source:'local', kind, file:f, url:URL.createObjectURL(f), title: baseName(f.name) });
  });
  if(!added.length){ alert(window._T.alert_no_media_files); return; }
  afterAdd(added);
}

function extractYoutubeId(str){
  str = (str || '').trim();
  if(/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
  const m = str.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function addYoutubeLines(text){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const added = [];
  lines.forEach(line => {
    let raw = line, title = null;
    if(line.includes('|')){
      const parts = line.split('|').map(s => s.trim());
      const idPart = parts.find(p => extractYoutubeId(p));
      const titlePart = parts.find(p => p !== idPart);
      if(idPart){ raw = idPart; title = titlePart || null; }
    }
    const id = extractYoutubeId(raw);
    if(!id) return;
    added.push({ source:'yt', videoId:id, title: title || ('YouTube · ' + id) });
  });
  if(!added.length){ alert(window._T.alert_no_valid_youtube); return; }
  afterAdd(added);

  // oEmbed로 제목 자동 조회 (실패해도 무방 — 기본 라벨 유지)
  if(typeof fetch === 'function'){
    added.forEach(t => {
      if(t.title.indexOf('YouTube · ') !== 0) return;
      try{
        fetch('https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=' + t.videoId + '&format=json')
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if(data && data.title){
              t.title = data.title;
              savePlaylist();
              renderQueue();
              if(PLAYLIST[ci] === t) updateMeta();
            }
          })
          .catch(()=>{});
      }catch(e){ /* fetch 사용 불가 환경 — 기본 라벨 유지 */ }
    });
  }
}

// scrubber drag
(function(){
  const track = $('scrub-track');
  let dragging = false;
  function seekFromEvent(clientX){
    const r = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    $('scrub-fill').style.width = (ratio*100) + '%';
    $('scrub-thumb').style.left = (ratio*100) + '%';
    return ratio;
  }
  track.addEventListener('pointerdown', e => { dragging = true; track.classList.add('dragging'); seekFromEvent(e.clientX); track.setPointerCapture(e.pointerId); });
  track.addEventListener('pointermove', e => { if(dragging) seekFromEvent(e.clientX); });
  track.addEventListener('pointerup', e => {
    if(!dragging) return;
    dragging = false; track.classList.remove('dragging');
    const ratio = seekFromEvent(e.clientX);
    if(currentSource === 'yt'){
      if(ytPlayer && ytReady){ const d = ytPlayer.getDuration() || 0; if(d) ytPlayer.seekTo(d*ratio, true); }
    } else {
      const d = localVideo.duration || 0;
      if(d) localVideo.currentTime = d*ratio;
    }
  });
})();

// swipe on artwork (mobile: left = next, right = prev)
(function(){
  const stage = $('stage');
  let startX = 0, startY = 0, tracking = false;
  stage.addEventListener('pointerdown', e => {
    if(e.target.closest('#viz-toggle-btn, #viz-panel')) return;
    startX = e.clientX; startY = e.clientY; tracking = true;
  });
  stage.addEventListener('pointerup', e => {
    if(!tracking) return; tracking = false;
    if(e.target.closest('#viz-toggle-btn, #viz-panel')) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5){
      if(dx < 0) loadAt(nextIndex()); else loadAt(prevIndex());
    }
  });
})();

// keyboard shortcuts

  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if(e.code === 'ArrowRight') loadAt(nextIndex());
  if(e.code === 'ArrowLeft') loadAt(prevIndex());
  if(e.key.toLowerCase() === 'q'){ $('view-queue').classList.contains('show') ? closeQueue() : openQueue(); }
});
