/* 언어 감지 우선순위: URL ?lang= → 브라우저 언어 → 기본값(ko) — 프로젝트 §5 표준 */
let currentLang = (function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  return (urlLang && I18N[urlLang]) ? urlLang
       : (I18N[browserLang]         ? browserLang : 'ko');
})();
function applyI18n() {
  const dict = I18N[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.innerHTML = dict[key];
  });
  document.documentElement.lang = currentLang;
  const pt = document.getElementById('page-title');
  if (pt && dict.title) pt.textContent = dict.title;
  if (dict.title) document.title = 'pomiai · ' + dict.title;
  document.querySelectorAll('.lang-switch button').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === currentLang));
  renderQueue();
}
document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    applyI18n();
  });
});

/* ---------- format config ---------- */
const AUDIO_EXT = ['mp3','wav','flac','ogg','m4a','aac'];
const VIDEO_EXT = ['mp4','webm','mov','avi','mkv'];
const AUDIO_OUTPUTS = ['mp3','wav','flac','ogg','m4a'];
const VIDEO_OUTPUTS = ['mp4','webm'];
const MIME = { mp3:'audio/mpeg', wav:'audio/wav', flac:'audio/flac', ogg:'audio/ogg', m4a:'audio/mp4', mp4:'video/mp4', webm:'video/webm' };

function categoryOf(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (AUDIO_EXT.includes(ext)) return 'audio';
  if (VIDEO_EXT.includes(ext)) return 'video';
  return null;
}
function extOf(name) { return name.split('.').pop().toLowerCase(); }
function defaultTarget(ext, category) {
  const opts = category === 'audio' ? AUDIO_OUTPUTS : VIDEO_OUTPUTS;
  if (ext === 'mp3') return 'wav';
  if (ext === 'wav') return 'mp3';
  if (ext === 'webm') return 'mp4';
  if (ext === 'mp4') return 'webm';
  return opts.find(o => o !== ext) || opts[0];
}
function needsBitrate(ext) { return ['mp3','ogg','m4a'].includes(ext); }
function buildArgs(inName, outName, targetExt, bitrate, category) {
  if (category === 'audio') {
    if (targetExt === 'wav' || targetExt === 'flac') return ['-i', inName, outName];
    if (targetExt === 'mp3') return ['-i', inName, '-b:a', bitrate + 'k', outName];
    if (targetExt === 'm4a') return ['-i', inName, '-b:a', bitrate + 'k', '-c:a', 'aac', outName];
    if (targetExt === 'ogg') return ['-i', inName, '-b:a', bitrate + 'k', '-c:a', 'libvorbis', outName];
  } else {
    if (targetExt === 'mp4') return ['-i', inName, '-c:v', 'libx264', '-preset', 'ultrafast', '-c:a', 'aac', outName];
    if (targetExt === 'webm') return ['-i', inName, '-c:v', 'libvpx', '-crf', '30', '-b:v', '0', '-c:a', 'libvorbis', outName];
  }
  return ['-i', inName, outName];
}

/* ---------- state ---------- */
let queueItems = [];
let itemCounter = 0;
let ffmpeg = null;
let ffmpegLoaded = false;
let converting = false;

const dropEl = document.getElementById('drop');
const fileInput = document.getElementById('fileInput');
const queueEl = document.getElementById('queue');
const actionsRow = document.getElementById('actionsRow');
const convertAllBtn = document.getElementById('convertAllBtn');
const clearAllBtn = document.getElementById('clearAllBtn');
const bulkRowEl = document.getElementById('bulkRow');
let bulkAudioTarget = AUDIO_OUTPUTS[0];
let bulkVideoTarget = VIDEO_OUTPUTS[0];
let bulkBitrate = 192;

dropEl.addEventListener('click', () => fileInput.click());
dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('drag'); });
dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
dropEl.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => { addFiles(e.target.files); fileInput.value = ''; });

function addFiles(fileList) {
  const hadAudioBefore = queueItems.some(i => i.category === 'audio');
  const hadVideoBefore = queueItems.some(i => i.category === 'video');
  Array.from(fileList).forEach(file => {
    const category = categoryOf(file.name);
    if (!category) return;
    const ext = extOf(file.name);
    itemCounter++;
    queueItems.push({
      id: 'f' + itemCounter,
      file,
      category,
      ext,
      target: defaultTarget(ext, category),
      bitrate: 192,
      status: 'pending',
      progress: 0,
      downloadUrl: null,
      downloadName: null,
      errorMsg: null
    });
  });
  if (!hadAudioBefore) {
    const firstAudio = queueItems.find(i => i.category === 'audio');
    if (firstAudio) { bulkAudioTarget = firstAudio.target; bulkBitrate = firstAudio.bitrate; }
  }
  if (!hadVideoBefore) {
    const firstVideo = queueItems.find(i => i.category === 'video');
    if (firstVideo) bulkVideoTarget = firstVideo.target;
  }
  renderQueue();
}

function renderBulkRow() {
  const dict = I18N[currentLang];
  const hasAudio = queueItems.some(i => i.category === 'audio');
  const hasVideo = queueItems.some(i => i.category === 'video');

  if (!hasAudio && !hasVideo) {
    bulkRowEl.style.display = 'none';
    bulkRowEl.innerHTML = '';
    return;
  }
  bulkRowEl.style.display = 'flex';

  let html = '';
  if (hasAudio) {
    html += `
      <div class="bulk-group">
        ${dict.bulkAudioLabel}
        <select data-role="bulk-audio-target">
          ${AUDIO_OUTPUTS.map(o => `<option value="${o}" ${o === bulkAudioTarget ? 'selected' : ''}>${o.toUpperCase()}</option>`).join('')}
        </select>
        ${needsBitrate(bulkAudioTarget) ? `
        <select data-role="bulk-bitrate">
          ${[128,192,256,320].map(b => `<option value="${b}" ${b === bulkBitrate ? 'selected' : ''}>${b}kbps</option>`).join('')}
        </select>` : ''}
      </div>`;
  }
  if (hasVideo) {
    html += `
      <div class="bulk-group">
        ${dict.bulkVideoLabel}
        <select data-role="bulk-video-target">
          ${VIDEO_OUTPUTS.map(o => `<option value="${o}" ${o === bulkVideoTarget ? 'selected' : ''}>${o.toUpperCase()}</option>`).join('')}
        </select>
      </div>`;
  }
  html += `<div style="flex-basis:100%;font-size:11px;color:var(--muted);">${dict.bulkHint}</div>`;
  bulkRowEl.innerHTML = html;
}

bulkRowEl.addEventListener('change', e => {
  const role = e.target.dataset.role;
  if (!role) return;
  if (role === 'bulk-audio-target') {
    bulkAudioTarget = e.target.value;
    queueItems.forEach(i => {
      if (i.category === 'audio' && i.status !== 'converting' && i.status !== 'done') {
        i.target = bulkAudioTarget;
        i.bitrate = bulkBitrate;
      }
    });
  } else if (role === 'bulk-video-target') {
    bulkVideoTarget = e.target.value;
    queueItems.forEach(i => {
      if (i.category === 'video' && i.status !== 'converting' && i.status !== 'done') {
        i.target = bulkVideoTarget;
      }
    });
  } else if (role === 'bulk-bitrate') {
    bulkBitrate = parseInt(e.target.value, 10);
    queueItems.forEach(i => {
      if (i.category === 'audio' && needsBitrate(i.target) && i.status !== 'converting' && i.status !== 'done') {
        i.bitrate = bulkBitrate;
      }
    });
  }
  renderQueue();
});

function renderQueue() {
  const dict = I18N[currentLang];
  queueEl.innerHTML = '';
  actionsRow.style.display = queueItems.length ? 'flex' : 'none';
  renderBulkRow();

  queueItems.forEach(item => {
    const outputs = item.category === 'audio' ? AUDIO_OUTPUTS : VIDEO_OUTPUTS;
    const div = document.createElement('div');
    div.className = 'item';

    const sizeMB = (item.file.size / (1024*1024)).toFixed(2) + ' MB';
    let statusText = dict.statusPending;
    let statusClass = '';
    if (item.status === 'loading') statusText = dict.statusLoadingEngine;
    if (item.status === 'converting') statusText = dict.statusConverting;
    if (item.status === 'done') { statusText = dict.statusDone; statusClass = 'done'; }
    if (item.status === 'error') { statusText = dict.statusError + ': ' + (item.errorMsg || ''); statusClass = 'error'; }

    div.innerHTML = `
      <div class="item-top">
        <div class="item-name" title="${item.file.name}">${item.file.name}</div>
        <div class="item-size">${sizeMB}</div>
        <button class="item-remove" data-remove="${item.id}">✕</button>
      </div>
      <div class="item-controls">
        <label style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;">
          ${dict.formatLabel}
          <select data-role="target" data-id="${item.id}">
            ${outputs.map(o => `<option value="${o}" ${o === item.target ? 'selected' : ''}>${o.toUpperCase()}</option>`).join('')}
          </select>
        </label>
        ${needsBitrate(item.target) ? `
        <label style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;">
          ${dict.qualityLabel}
          <select data-role="bitrate" data-id="${item.id}">
            ${[128,192,256,320].map(b => `<option value="${b}" ${b === item.bitrate ? 'selected' : ''}>${b}kbps</option>`).join('')}
          </select>
        </label>` : ''}
      </div>
      <div class="item-progress"><div class="item-progress-inner" style="width:${item.progress}%"></div></div>
      <div class="item-status ${statusClass}">${statusText}</div>
      ${item.status === 'done' ? `<a class="item-download" href="${item.downloadUrl}" download="${item.downloadName}">⬇ ${dict.download} (${item.downloadName})</a>` : ''}
    `;
    queueEl.appendChild(div);
  });
}

queueEl.addEventListener('change', e => {
  const id = e.target.dataset.id;
  if (!id) return;
  const item = queueItems.find(i => i.id === id);
  if (!item) return;
  if (e.target.dataset.role === 'target') item.target = e.target.value;
  if (e.target.dataset.role === 'bitrate') item.bitrate = parseInt(e.target.value, 10);
  renderQueue();
});
queueEl.addEventListener('click', e => {
  const id = e.target.dataset.remove;
  if (!id) return;
  queueItems = queueItems.filter(i => i.id !== id);
  renderQueue();
});
clearAllBtn.addEventListener('click', () => {
  queueItems.forEach(i => { if (i.downloadUrl) URL.revokeObjectURL(i.downloadUrl); });
  queueItems = [];
  renderQueue();
});

async function toBlobURL(url, mimeType) {
  const res = await fetch(url);
  if (!res.ok) throw new Error('resource load failed: ' + url);
  const buf = await res.arrayBuffer();
  return URL.createObjectURL(new Blob([buf], { type: mimeType }));
}

async function ensureFFmpeg(onProgress) {
  if (ffmpegLoaded) return;
  const { FFmpeg } = FFmpegWASM;
  ffmpeg = new FFmpeg();
  ffmpeg.on('progress', ({ progress }) => {
    if (onProgress) onProgress(Math.min(100, Math.max(0, Math.round(progress * 100))));
  });
  const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm';
  const classWorkerURL = 'https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.12.15/umd/814.ffmpeg.js';
  await ffmpeg.load({
    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
    classWorkerURL: await toBlobURL(classWorkerURL, 'text/javascript'),
  });
  ffmpegLoaded = true;
}

convertAllBtn.addEventListener('click', async () => {
  if (converting) return;
  converting = true;
  convertAllBtn.disabled = true;

  for (const item of queueItems) {
    if (item.status === 'done') continue;
    try {
      if (!ffmpegLoaded) {
        item.status = 'loading';
        renderQueue();
        await ensureFFmpeg(pct => { item.progress = pct; renderQueue(); });
      }
      item.status = 'converting';
      item.progress = 0;
      renderQueue();

      const inName = 'input_' + item.id + '.' + item.ext;
      const outName = 'output_' + item.id + '.' + item.target;
      const data = new Uint8Array(await item.file.arrayBuffer());
      await ffmpeg.writeFile(inName, data);

      const args = buildArgs(inName, outName, item.target, item.bitrate, item.category);
      await ffmpeg.exec(args);

      const outData = await ffmpeg.readFile(outName);
      const mime = MIME[item.target] || 'application/octet-stream';
      const blob = new Blob([outData.buffer], { type: mime });
      const baseName = item.file.name.replace(/\.[^/.]+$/, '');

      item.downloadUrl = URL.createObjectURL(blob);
      item.downloadName = baseName + '.' + item.target;
      item.status = 'done';
      item.progress = 100;

      await ffmpeg.deleteFile(inName);
      await ffmpeg.deleteFile(outName);
    } catch (err) {
      console.error(err);
      item.status = 'error';
      item.errorMsg = (err && err.message) ? err.message : String(err);
    }
    renderQueue();
  }

  converting = false;
  convertAllBtn.disabled = false;
});

applyI18n();
</script>
</body>
</html>
