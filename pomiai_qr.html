<!DOCTYPE html>
<html lang="ko" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

        묶여 있었는데, QR코드는 모바일 활용도가 높다고 판단해 독립 도구로 분리

<title id="page-title">pomiai QR 코드 생성기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#08080e;--s1:#0e0e18;--s2:#131320;--s3:#191928;--s4:#202032;
  --bd:#1c1c2e;--bd2:#262640;--bd3:#303050;
  --ac:#6c5ce8;--ac2:#9b8ff5;--ac3:rgba(108,92,232,.15);--ac4:rgba(108,92,232,.08);
  --go:#d4924a;--go2:#f0b060;--go3:rgba(212,146,74,.12);
  --te:#28c4a0;--te2:#4eddb8;--te3:rgba(40,196,160,.12);
  --re:#e05555;--re2:#ff8080;--re3:rgba(224,85,85,.12);
  --tx:#eeeaf8;--tx2:#8e8aac;--tx3:#52506a;--tx4:#2c2a3c;
  --sh:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow-x:hidden}

/* ── 헤더 ── */
#header{background:var(--s1);border-bottom:1px solid var(--bd);
  padding:0 18px;display:flex;align-items:center;gap:10px;height:52px;
  position:sticky;top:0;z-index:50}
#logo{font-size:14px;font-weight:600;color:var(--ac2);letter-spacing:1px;flex-shrink:0}
#logo span{color:var(--tx3);font-weight:400}
.h-sep{width:1px;height:20px;background:var(--bd2);flex-shrink:0}
#htabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#htabs::-webkit-scrollbar{display:none}
.htab{padding:8px 14px;font-size:12px;font-weight:500;color:var(--tx3);
  cursor:pointer;border-radius:8px;transition:.15s;white-space:nowrap;flex-shrink:0}
.htab:hover{color:var(--tx2);background:var(--s3)}
.htab.on{color:var(--ac2);background:var(--ac3)}

/* ── 레이아웃 ── */
#app{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.sec{display:none}.sec.on{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{font-size:20px;font-weight:600;margin-bottom:5px}
.sec-sub{font-size:13px;color:var(--tx2);margin-bottom:22px;line-height:1.6}

/* ── 카드 ── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;
  padding:22px;margin-bottom:14px;box-shadow:var(--sh)}
.card-title{font-size:14px;font-weight:600;color:var(--tx2);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title::before{content:'';width:3px;height:14px;
  background:linear-gradient(var(--ac2),var(--te));border-radius:2px}

/* ── 폼 공통 ── */
.fl{font-size:10px;color:var(--tx3);font-weight:600;letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:5px;display:block}
.fi,.fs{background:var(--s3);border:1px solid var(--bd2);color:var(--tx);
  border-radius:10px;padding:10px 13px;font-size:14px;font-family:'DM Sans',sans-serif;
  outline:none;transition:.15s;width:100%;-webkit-appearance:none}
.fi:focus,.fs:focus{border-color:var(--ac);background:var(--s4)}
.fi::placeholder{color:var(--tx4)}
.fm{background:var(--s3);border:1px solid var(--bd2);color:var(--tx);
  border-radius:10px;padding:10px 13px;font-size:13px;
  font-family:'DM Mono',monospace;outline:none;transition:.15s;width:100%;
  resize:none;line-height:1.7}
.fm:focus{border-color:var(--ac)}

/* ── 버튼 ── */
.btn{background:linear-gradient(135deg,var(--ac),#4a38c0);border:none;color:#fff;
  border-radius:11px;padding:12px 20px;font-size:14px;font-weight:600;
  cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif;
  box-shadow:0 4px 16px rgba(108,92,232,.28)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:none;filter:brightness(.96)}
.btn.full{width:100%}
.btn.go{background:linear-gradient(135deg,var(--te),#1a8c72);box-shadow:0 4px 16px rgba(40,196,160,.22)}
.btn.sm{padding:8px 14px;font-size:12px;border-radius:8px}
.btn.outline{background:transparent;border:1px solid var(--bd2);color:var(--tx2);box-shadow:none}
.btn.outline:hover{border-color:var(--ac);color:var(--ac2);filter:none;transform:none;background:var(--ac4)}

/* ── 그리드 ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.gf{grid-column:1/-1}

/* ── 결과 박스 ── */
.result{background:var(--s2);border:1px solid var(--bd2);border-radius:12px;
  padding:16px;margin-top:14px;display:none}
.result.show{display:block;animation:fadeIn .25s ease}
.res-val{font-family:'DM Mono',monospace;font-size:15px;color:var(--te2);
  word-break:break-all;line-height:1.7}
.res-label{font-size:10px;color:var(--tx3);letter-spacing:1px;margin-bottom:6px;font-weight:600;text-transform:uppercase}
.res-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.copy-btn{background:var(--s3);border:1px solid var(--bd2);color:var(--tx2);
  border-radius:8px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:.12s}
.copy-btn:hover{border-color:var(--te);color:var(--te2)}

/* ── QR ── */
#qr-preview{text-align:center;padding:20px 0}
#qr-canvas{border-radius:12px;max-width:220px;display:block;margin:0 auto;display:none}
#qr-placeholder{width:200px;height:200px;margin:0 auto;background:var(--s3);
  border:2px dashed var(--bd2);border-radius:12px;display:flex;align-items:center;
  justify-content:center;color:var(--tx4);font-size:13px}
.qr-type-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.qt{padding:6px 14px;font-size:12px;font-weight:500;border:1px solid var(--bd2);
  color:var(--tx3);background:transparent;border-radius:20px;cursor:pointer;transition:.15s}
.qt:hover{color:var(--tx2);border-color:var(--bd3)}
.qt.on{background:var(--ac3);color:var(--ac2);border-color:var(--ac)}
.qr-input-group{display:none}
.qr-input-group.show{display:block}
.qr-size-row{display:flex;align-items:center;gap:10px;margin-top:12px}
.qr-color-row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.color-pick-wrap{display:flex;align-items:center;gap:6px}
.color-pick-wrap label{font-size:11px;color:var(--tx3)}
input[type="color"]{width:32px;height:32px;border:1px solid var(--bd2);border-radius:6px;
  padding:2px;background:var(--s3);cursor:pointer;-webkit-appearance:none}
input[type="range"]{-webkit-appearance:none;height:4px;background:var(--bd2);
  border-radius:2px;outline:none;cursor:pointer;flex:1}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:50%;background:var(--ac2);cursor:pointer}
.sr-val{font-size:12px;color:var(--ac2);font-family:'DM Mono',monospace;min-width:36px;text-align:right}
.qr-dl-row{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}

/* ── 비밀번호 ── */
.pw-display{background:var(--s2);border:1px solid var(--bd2);border-radius:12px;
  padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px;min-height:60px}
.pw-text{font-family:'DM Mono',monospace;font-size:17px;color:var(--te2);
  flex:1;word-break:break-all;line-height:1.5;user-select:all}
.pw-strength{display:flex;gap:3px;margin-bottom:12px}
.ps-bar{flex:1;height:4px;border-radius:2px;background:var(--bd2);transition:.3s}
.ps-bar.s1{background:var(--re)}
.ps-bar.s2{background:var(--go2)}
.ps-bar.s3{background:var(--te)}
.ps-bar.s4{background:var(--te2)}
.ps-label{font-size:11px;color:var(--tx3);margin-bottom:8px;min-height:16px}
.cb-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cb-row input[type="checkbox"]{accent-color:var(--ac);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.cb-row label{font-size:13px;color:var(--tx2);cursor:pointer;flex:1}
.pw-history{margin-top:14px}
.ph-item{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--s2);border:1px solid var(--bd);
  border-radius:8px;margin-bottom:5px;gap:8px}
.ph-val{font-family:'DM Mono',monospace;font-size:12px;color:var(--tx2);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-copy{background:none;border:none;color:var(--tx3);cursor:pointer;padding:2px 6px;
  font-size:11px;transition:.12s;border-radius:4px;flex-shrink:0}
.ph-copy:hover{color:var(--te2);background:var(--te3)}

/* ── 컬러 팔레트 ── */
.color-wheel-wrap{display:flex;justify-content:center;margin-bottom:16px}
.base-color-input{display:flex;align-items:center;gap:10px;margin-bottom:16px;
  background:var(--s2);border:1px solid var(--bd2);border-radius:12px;padding:12px 16px}
.bc-preview{width:40px;height:40px;border-radius:8px;border:1px solid var(--bd2);flex-shrink:0;cursor:pointer}
.bc-hex{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;
  flex:1;color:var(--tx);background:none;border:none;outline:none}
.palette-modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pm{padding:6px 13px;font-size:12px;font-weight:500;border:1px solid var(--bd2);
  color:var(--tx3);background:transparent;border-radius:20px;cursor:pointer;transition:.15s}
.pm:hover{color:var(--tx2)}
.pm.on{background:var(--ac3);color:var(--ac2);border-color:var(--ac)}
.palette-grid{display:flex;gap:0;border-radius:14px;overflow:hidden;margin-bottom:14px;height:80px}
.pg-swatch{flex:1;cursor:pointer;position:relative;transition:.2s}
.pg-swatch:hover{flex:2}
.pg-hex{position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-size:9px;font-family:'DM Mono',monospace;color:rgba(255,255,255,.8);
  text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:.15s}
.pg-swatch:hover .pg-hex{opacity:1}
.palette-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.pl-item{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}
.pl-item:hover{border-color:var(--ac);transform:translateY(-1px)}
.pl-swatch{height:50px}
.pl-info{padding:7px 10px}
.pl-hex{font-size:12px;font-family:'DM Mono',monospace;color:var(--tx);font-weight:500}
.pl-name{font-size:10px;color:var(--tx3);margin-top:1px}
.export-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}

/* ── 토스트 ── */
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:var(--s3);border:1px solid var(--bd2);color:var(--te2);
  border-radius:20px;padding:8px 18px;font-size:12px;
  opacity:0;transition:.22s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:var(--sh)}
#toast.show{opacity:1}

@media(max-width:600px){
  #app{padding:16px 12px 60px}
  .g2,.g3{grid-template-columns:1fr 1fr}
  .palette-list{grid-template-columns:repeat(3,1fr)}
  .htab{padding:7px 10px;font-size:11px}
  .pw-text{font-size:14px}
}
@media(max-width:380px){
  .g2,.g3{grid-template-columns:1fr}
  .palette-list{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- 헤더 -->
<div id="header">
  <span id="logo">pomiai <span>QR</span></span>
  <div id="lang-switch" style="margin-left:auto;display:flex;gap:4px">
    <button data-lang="ko" style="background:var(--s3);border:1px solid var(--bd2,#262640);color:var(--tx3);font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;cursor:pointer">한</button>
    <button data-lang="en" style="background:var(--s3);border:1px solid var(--bd2,#262640);color:var(--tx3);font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;cursor:pointer">EN</button>
    <button data-lang="ja" style="background:var(--s3);border:1px solid var(--bd2,#262640);color:var(--tx3);font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;cursor:pointer">日</button>
  </div>
</div>

<div id="app">

<!-- ══ QR 코드 생성기 ══ -->
<div class="sec on" id="tab-qr">
  <div class="sec-title" data-i18n="sec_title">QR 코드 생성기</div>
  <div class="sec-sub" data-i18n="sec_sub">URL · 텍스트 · WiFi · 명함 · 이메일 · 전화번호 — 로고 삽입, 색상 커스터마이징, PNG/SVG 다운로드</div>

  <div class="card">
    <!-- 타입 선택 -->
    <div class="card-title" data-i18n="ct_type">콘텐츠 타입</div>
    <div class="qr-type-row">
      <button class="qt on" onclick="setQrType('url')" data-i18n="qt_url">🔗 URL</button>
      <button class="qt" onclick="setQrType('text')" data-i18n="qt_text">📝 텍스트</button>
      <button class="qt" onclick="setQrType('wifi')" data-i18n="qt_wifi">📶 WiFi</button>
      <button class="qt" onclick="setQrType('vcard')" data-i18n="qt_vcard">👤 명함</button>
      <button class="qt" onclick="setQrType('email')" data-i18n="qt_email">✉️ 이메일</button>
      <button class="qt" onclick="setQrType('tel')" data-i18n="qt_tel">📞 전화</button>
    </div>

    <!-- URL -->
    <div class="qr-input-group show" id="qi-url">
      <span class="fl">URL</span>
      <input class="fi" id="qr-url" type="url" placeholder="https://example.com" oninput="autoGenQr()">
    </div>
    <!-- 텍스트 -->
    <div class="qr-input-group" id="qi-text">
      <span class="fl">텍스트</span>
      <textarea class="fm" id="qr-text" rows="3" placeholder="QR코드에 담을 텍스트를 입력하세요" oninput="autoGenQr()"></textarea>
    </div>
    <!-- WiFi -->
    <div class="qr-input-group" id="qi-wifi">
      <div class="g2" style="margin-bottom:10px">
        <div><span class="fl">네트워크 이름 (SSID)</span>
          <input class="fi" id="qr-ssid" placeholder="MyWiFi" oninput="autoGenQr()"></div>
        <div><span class="fl">비밀번호</span>
          <input class="fi" id="qr-wifipw" type="password" placeholder="password" oninput="autoGenQr()"></div>
      </div>
      <span class="fl">보안 방식</span>
      <select class="fs" id="qr-wsec" onchange="autoGenQr()">
        <option value="WPA">WPA/WPA2</option>
        <option value="WEP">WEP</option>
        <option value="nopass">없음</option>
      </select>
    </div>
    <!-- 명함 -->
    <div class="qr-input-group" id="qi-vcard">
      <div class="g2" style="margin-bottom:10px">
        <div><span class="fl">이름</span><input class="fi" id="vc-name" placeholder="홍길동" oninput="autoGenQr()"></div>
        <div><span class="fl">회사</span><input class="fi" id="vc-org" placeholder="회사명" oninput="autoGenQr()"></div>
        <div><span class="fl">직함</span><input class="fi" id="vc-title" placeholder="직책" oninput="autoGenQr()"></div>
        <div><span class="fl">전화</span><input class="fi" id="vc-tel" placeholder="+82-10-1234-5678" oninput="autoGenQr()"></div>
        <div><span class="fl">이메일</span><input class="fi" id="vc-email" placeholder="email@example.com" oninput="autoGenQr()"></div>
        <div><span class="fl">웹사이트</span><input class="fi" id="vc-url" placeholder="https://" oninput="autoGenQr()"></div>
      </div>
    </div>
    <!-- 이메일 -->
    <div class="qr-input-group" id="qi-email">
      <div class="g2" style="margin-bottom:10px">
        <div><span class="fl">받는 사람</span><input class="fi" id="qr-eto" placeholder="to@email.com" oninput="autoGenQr()"></div>
        <div><span class="fl">제목</span><input class="fi" id="qr-esub" placeholder="제목" oninput="autoGenQr()"></div>
      </div>
      <span class="fl">본문</span>
      <textarea class="fm" id="qr-ebody" rows="2" placeholder="이메일 본문" oninput="autoGenQr()"></textarea>
    </div>
    <!-- 전화 -->
    <div class="qr-input-group" id="qi-tel">
      <span class="fl">전화번호</span>
      <input class="fi" id="qr-tel" type="tel" placeholder="+82-10-1234-5678" oninput="autoGenQr()">
    </div>
  </div>

  <!-- 디자인 설정 -->
  <div class="card">
    <div class="card-title" data-i18n="ct_design">디자인 설정</div>
    <div class="g2">
      <div>
        <span class="fl">크기 (px)</span>
        <div class="qr-size-row">
          <input type="range" id="qr-size" min="100" max="600" value="300" oninput="$('qr-sz-v').textContent=this.value;autoGenQr()">
          <span class="sr-val" id="qr-sz-v">300</span>
        </div>
      </div>
      <div>
        <span class="fl">여백</span>
        <div class="qr-size-row">
          <input type="range" id="qr-margin" min="0" max="10" value="2" oninput="$('qr-mg-v').textContent=this.value;autoGenQr()">
          <span class="sr-val" id="qr-mg-v">2</span>
        </div>
      </div>
    </div>
    <div class="qr-color-row">
      <div class="color-pick-wrap">
        <input type="color" id="qr-fg" value="#000000" oninput="autoGenQr()">
        <label>전경색</label>
      </div>
      <div class="color-pick-wrap">
        <input type="color" id="qr-bg" value="#ffffff" oninput="autoGenQr()">
        <label>배경색</label>
      </div>
      <div style="flex:1">
        <span class="fl">오류 수정 레벨</span>
        <select class="fs" id="qr-ec" onchange="autoGenQr()">
          <option value="L">L — 낮음 (7%)</option>
          <option value="M" selected>M — 보통 (15%)</option>
          <option value="Q">Q — 높음 (25%)</option>
          <option value="H">H — 최고 (30%)</option>
        </select>
      </div>
    </div>
    <!-- 로고 업로드 -->
    <div style="margin-top:12px">
      <span class="fl">로고 삽입 (선택)</span>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="file" id="qr-logo-fi" accept="image/*" style="display:none" onchange="loadLogo(this)">
        <button class="btn outline sm" onclick="$('qr-logo-fi').click()">📁 로고 파일 선택</button>
        <span id="qr-logo-name" style="font-size:12px;color:var(--tx3)">선택 안 함</span>
        <button class="btn outline sm" onclick="clearLogo()" id="qr-logo-clear" style="display:none">✕</button>
      </div>
    </div>
  </div>

  <!-- 미리보기 + 다운로드 -->
  <div class="card">
    <div class="card-title" data-i18n="ct_preview">미리보기</div>
    <div id="qr-preview">
      <div id="qr-placeholder">QR코드가 여기에 표시돼요</div>
      <canvas id="qr-canvas"></canvas>
    </div>
    <div class="qr-dl-row">
      <button class="btn full go" onclick="genQr()">⚡ 생성하기</button>
    </div>
    <div class="qr-dl-row">
      <button class="btn outline sm" onclick="dlQr('png')">⬇ PNG 다운로드</button>
      <button class="btn outline sm" onclick="dlQr('svg')">⬇ SVG 다운로드</button>
      <button class="copy-btn" onclick="copyQrDataUrl()">📋 이미지 복사</button>
    </div>
  </div>
</div>

<!-- ══ 비밀번호 생성기 ══ -->

<div class="pomiai-brand-footer" style="margin:20px 18px 4px;padding:14px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
  <div style="font-weight:700;font-size:13px;color:var(--tx)"><span style="color:var(--tx3);font-weight:600;font-size:11px;margin-right:4px" data-i18n="footer_by">Product by</span> pomiai</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <a href="https://checkpomi.com" target="_blank" rel="noopener" style="font-size:11px;font-weight:700;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--bd2)">🌐 checkpomi.com</a>
    <a href="https://www.youtube.com/@pomiai_official" target="_blank" rel="noopener" style="font-size:11px;font-weight:700;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--bd2)">▶ YouTube</a>
  </div>
</div>

</div><!-- /app -->
<div id="toast"></div>

<script>
const I18N = {
  ko:{ page_title:'pomiai QR 코드 생성기', sec_title:'QR 코드 생성기',
    sec_sub:'URL · 텍스트 · WiFi · 명함 · 이메일 · 전화번호 — 로고 삽입, 색상 커스터마이징, PNG/SVG 다운로드',
    ct_type:'콘텐츠 타입', ct_design:'디자인 설정', ct_preview:'미리보기',
    qt_url:'🔗 URL', qt_text:'📝 텍스트', qt_wifi:'📶 WiFi', qt_vcard:'👤 명함', qt_email:'✉️ 이메일', qt_tel:'📞 전화',
    footer_by:'Product by' },
  en:{ page_title:'pomiai QR Code Generator', sec_title:'QR Code Generator',
    sec_sub:'URL · Text · WiFi · vCard · Email · Phone — logo insert, color customization, PNG/SVG download',
    ct_type:'Content Type', ct_design:'Design Settings', ct_preview:'Preview',
    qt_url:'🔗 URL', qt_text:'📝 Text', qt_wifi:'📶 WiFi', qt_vcard:'👤 vCard', qt_email:'✉️ Email', qt_tel:'📞 Phone',
    footer_by:'Product by' },
  ja:{ page_title:'pomiai QRコード生成', sec_title:'QRコード生成',
    sec_sub:'URL・テキスト・WiFi・名刺・メール・電話番号 — ロゴ挿入、色カスタマイズ、PNG/SVGダウンロード',
    ct_type:'コンテンツタイプ', ct_design:'デザイン設定', ct_preview:'プレビュー',
    qt_url:'🔗 URL', qt_text:'📝 テキスト', qt_wifi:'📶 WiFi', qt_vcard:'👤 名刺', qt_email:'✉️ メール', qt_tel:'📞 電話',
    footer_by:'Product by' }
};
(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  const LANG = (urlLang && I18N[urlLang]) ? urlLang : (I18N[browserLang] ? browserLang : 'ko');
  window._LANG = LANG; window._T = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
})();
function applyI18n(){
  const t = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.dataset.i18n;
    if(typeof t[k]==='string') el.textContent = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.title = t.page_title;
}
applyI18n();
document.querySelectorAll('#lang-switch button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const lang = btn.dataset.lang;
    const url = new URL(location.href); url.searchParams.set('lang', lang); history.replaceState(null,'',url);
    window._LANG = lang; window._T = I18N[lang];
    document.getElementById('html-root').lang = lang;
    applyI18n();
  });
});
/* ─────────────────────────────────
   공통 헬퍼
───────────────────────────────── */
const $=id=>document.getElementById(id);
let toastTid;
function toast(msg,dur=2400){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTid);toastTid=setTimeout(()=>t.classList.remove('show'),dur);
}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(()=>toast('✅ 복사됨'));
  else{const ta=document.createElement('textarea');ta.value=text;
    ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);
    ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('✅ 복사됨');}
}

/* ─────────────────────────────────
   QR 코드 생성기
   (순수 Canvas 구현 — 외부 라이브러리 없음)
───────────────────────────────── */
let qrType='url', qrLogoImg=null;
let qrAutoTimer=null;

function setQrType(t){
  qrType=t;
  document.querySelectorAll('.qt').forEach(b=>b.classList.remove('on'));
  event.target.classList.add('on');
  document.querySelectorAll('.qr-input-group').forEach(g=>g.classList.remove('show'));
  $('qi-'+t).classList.add('show');
  autoGenQr();
}
function getQrContent(){
  if(qrType==='url') return $('qr-url').value||'https://checkpomi.com';
  if(qrType==='text') return $('qr-text').value||'pomiai';
  if(qrType==='wifi'){
    const s=$('qr-ssid').value,p=$('qr-wifipw').value,e=$('qr-wsec').value;
    return `WIFI:T:${e};S:${s};P:${p};;`;
  }
  if(qrType==='vcard'){
    const n=$('vc-name').value,o=$('vc-org').value,ti=$('vc-title').value,
          te=$('vc-tel').value,em=$('vc-email').value,u=$('vc-url').value;
    return `BEGIN:VCARD\nVERSION:3.0\nFN:${n}\nORG:${o}\nTITLE:${ti}\nTEL:${te}\nEMAIL:${em}\nURL:${u}\nEND:VCARD`;
  }
  if(qrType==='email'){
    const t=$('qr-eto').value,s=$('qr-esub').value,b=$('qr-ebody').value;
    return `mailto:${t}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;
  }
  if(qrType==='tel') return `tel:${$('qr-tel').value}`;
  return 'pomiai';
}
function autoGenQr(){clearTimeout(qrAutoTimer);qrAutoTimer=setTimeout(genQr,400);}
function loadLogo(inp){
  const f=inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=e=>{
    qrLogoImg=new Image();qrLogoImg.onload=()=>genQr();qrLogoImg.src=e.target.result;
    $('qr-logo-name').textContent=f.name;$('qr-logo-clear').style.display='';
  };fr.readAsDataURL(f);
}
function clearLogo(){qrLogoImg=null;$('qr-logo-name').textContent='선택 안 함';$('qr-logo-clear').style.display='none';$('qr-logo-fi').value='';genQr();}

/* QR 인코딩 — 순수 JS (Reed-Solomon 기반 간소화 구현) */
// 외부 라이브러리 없이 QR코드를 그리기 위해 qrcodegen 라이브러리를 동적 로드
let qrLib=null;
function loadQrLib(){
  return new Promise((resolve,reject)=>{
    if(qrLib){resolve(qrLib);return;}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload=()=>{qrLib=true;resolve(true);};
    s.onerror=()=>{
      // 폴백: 두 번째 CDN 시도
      const s2=document.createElement('script');
      s2.src='https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
      s2.onload=()=>{qrLib='qrcode-npm';resolve('qrcode-npm');};
      s2.onerror=()=>reject(new Error('QR 라이브러리 로드 실패'));
      document.head.appendChild(s2);
    };
    document.head.appendChild(s);
  });
}

async function genQr(){
  const content=getQrContent();
  if(!content.trim())return;
  const size=parseInt($('qr-size').value)||300;
  const margin=parseInt($('qr-margin').value)||2;
  const fg=$('qr-fg').value||'#000000';
  const bg=$('qr-bg').value||'#ffffff';
  const ec=$('qr-ec').value||'M';

  const c=$('qr-canvas');
  c.width=size;c.height=size;
  const ctx=c.getContext('2d');

  try{
    const lib=await loadQrLib();
    // qrcode.min.js (qrcodejs) 방식
    if(lib===true){
      // QRCode.js는 div 기반이므로 임시 div 사용
      const tmp=document.createElement('div');tmp.style.display='none';document.body.appendChild(tmp);
      // 기존 QR 제거
      tmp.innerHTML='';
      const qr=new QRCode(tmp,{text:content,width:size,height:size,colorDark:fg,colorLight:bg,correctLevel:QRCode.CorrectLevel[ec]||QRCode.CorrectLevel.M});
      await new Promise(r=>setTimeout(r,80));
      const img=tmp.querySelector('img')||tmp.querySelector('canvas');
      if(img){
        ctx.clearRect(0,0,size,size);
        const src=img.src||img.toDataURL();
        const i=new Image();i.onload=()=>{ctx.drawImage(i,0,0,size,size);drawLogoOnQr(ctx,size);};i.src=src;
      }
      document.body.removeChild(tmp);
    }else if(lib==='qrcode-npm'){
      // qrcode npm 방식
      QRCode.toCanvas(c,content,{width:size,margin,color:{dark:fg,light:bg},errorCorrectionLevel:ec},(err)=>{
        if(!err)drawLogoOnQr(ctx,size);
        else toast('❌ QR 생성 오류: '+err.message);
      });
    }
    $('qr-canvas').style.display='block';
    $('qr-placeholder').style.display='none';
  }catch(e){
    toast('⚠️ 인터넷 연결이 필요해요 (QR 라이브러리 로딩)');
    // 폴백: 텍스트만 표시
    ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
    ctx.fillStyle=fg;ctx.font=`${Math.min(14,size/20)}px DM Mono,monospace`;
    ctx.textAlign='center';ctx.fillText('QR 생성에 인터넷이 필요해요',size/2,size/2);
    c.style.display='block';$('qr-placeholder').style.display='none';
  }
}

function drawLogoOnQr(ctx,size){
  if(!qrLogoImg)return;
  const ls=Math.round(size*0.22);
  const lx=(size-ls)/2,ly=(size-ls)/2;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.roundRect(lx-4,ly-4,ls+8,ls+8,6);ctx.fill();
  ctx.drawImage(qrLogoImg,lx,ly,ls,ls);
}

function dlQr(fmt){
  const c=$('qr-canvas');
  if(c.style.display==='none'||!c.width){toast('⚠️ QR코드를 먼저 생성하세요');return;}
  if(fmt==='png'){
    const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='pomiai-qr.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  }else if(fmt==='svg'){
    const w=c.width,h=c.height;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><image href="${c.toDataURL()}" width="${w}" height="${h}"/></svg>`;
    const blob=new Blob([svg],{type:'image/svg+xml'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pomiai-qr.svg';
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
  }
  toast('✅ 다운로드 완료');
}
function copyQrDataUrl(){
  const c=$('qr-canvas');
  if(c.style.display==='none'){toast('⚠️ QR코드를 먼저 생성하세요');return;}
  c.toBlob(b=>{
    try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(()=>toast('✅ 이미지 복사됨'));}
    catch(e){copy(c.toDataURL());toast('✅ DataURL 복사됨');}
  });
}

/* ── 초기화 ── */
autoGenQr();
</script>
