<!-- Pomi Platformer – Free Retro Super Mario Style Jump & Run Game | pomiai -->
<div id="mario-platformer-container" style="max-width: 500px; margin: 40px auto; background: #222; border-radius: 12px; padding: 20px; font-family: 'Press Start 2P', 'Segoe UI', Tahoma, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 4px solid #444; touch-action: none; user-select: none;">
    <div style="text-align:center;margin-bottom:8px"><a href="https://checkpomi.com" target="_blank" style="background:#ff007f;color:#fff;font-size:10px;font-weight:bold;padding:3px 12px;border-radius:20px;letter-spacing:2px;font-family:monospace;text-decoration:none;">POMIAI</a></div>

    
    <!-- Game HUD -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; color: #fff;">
        <div>
            <h3 style="color: #e74c3c; margin: 0; font-size: 1.2rem; font-weight: bold; text-shadow: 2px 2px 0 #000;">POMI PLATFORMER</h3>
            <div style="font-size: 0.9rem; color: #f1c40f; margin-top: 5px;">WORLD: <span id="sm-level">1</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 0.9rem; color: #f1c40f; margin-bottom: 5px;">COINS: <span id="sm-score">0</span></div>
            <div style="font-size: 0.9rem; color: #e74c3c;">LIVES: <span id="sm-lives">❤️❤️❤️</span></div>
        </div>
    </div>

    <!-- Game Controls (Start, Pause, End) -->
    <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;">
        <button id="btn-sm-start" class="sm-ctrl-btn" style="background: #2ecc71; color: #000;">▶ START</button>
        <button id="btn-sm-pause" class="sm-ctrl-btn" style="background: #f1c40f; color: #000;">⏸ PAUSE</button>
        <button id="btn-sm-reset" class="sm-ctrl-btn" style="background: #e74c3c; color: #fff;">⏹ RESET</button>
    </div>

    <!-- Canvas Container -->
    <div style="position: relative; width: 100%; aspect-ratio: 5/4; background: #5c94fc; border-radius: 8px; border: 4px solid #000; overflow: hidden; margin-bottom: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.3);">
        <canvas id="sm-canvas" width="400" height="320" style="display: block; width: 100%; height: 100%; image-rendering: pixelated;"></canvas>
    </div>

    <!-- Mobile Action Controls -->
    <div style="display: flex; justify-content: space-between; gap: 10px; align-items: flex-end;">
        <div style="display: flex; gap: 10px;">
            <button class="sm-dir-btn" id="btn-sm-left">◀</button>
            <button class="sm-dir-btn" id="btn-sm-right">▶</button>
        </div>
        <button class="sm-dir-btn" id="btn-sm-jump" style="width: 70px; height: 70px; border-radius: 50%; background: #e74c3c; color: white; border-color: #c0392b; font-size: 1.1rem;">JUMP</button>
    </div>

    <style>
        #mario-platformer-container .sm-ctrl-btn { border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.1s; font-family: inherit; font-size: 0.85rem; border: 2px solid #000; box-shadow: 0 4px 0 #000; }
        #mario-platformer-container .sm-ctrl-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #mario-platformer-container .sm-dir-btn { background: #ccc; color: #000; border: 3px solid #888; height: 50px; min-width: 60px; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 0 #666; touch-action: manipulation; font-weight: bold; }
        #mario-platformer-container .sm-dir-btn:active { transform: translateY(5px); box-shadow: none; background: #aaa; }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('sm-canvas');
            const ctx = canvas.getContext('2d');
            
            const scoreEl = document.getElementById('sm-score');
            const levelEl = document.getElementById('sm-level');
            const livesEl = document.getElementById('sm-lives');

            const TILE = 40;
            const ROWS = 8;
            let COLS = 25; 
            let reqId = null;
            let isPlaying = false;
            
            let level = 1;
            let score = 0;
            let lives = 3;
            let map = [];
            let camX = 0;
            let frameCount = 0;

            let keys = { left: false, right: false, up: false };

            // Player Object
            const player = {
                x: 50, y: 50, width: 24, height: 32,
                dx: 0, dy: 0, accel: 0.6, friction: 0.8, gravity: 0.7, jumpPower: -12,
                grounded: false, isDead: false, deathTimer: 0, facingRight: true
            };

            // --- 8-Bit Pixel Art Data ---
            const palette = {
                'R': '#e74c3c', // Red (Hat/Shirt)
                'B': '#2980b9', // Blue (Overalls)
                'S': '#ffcc99', // Skin (Face/Hands)
                'H': '#8b4513', // Brown (Hair/Shoes)
                'K': '#000000', // Black (Eyes/Mustache)
                'Y': '#f1c40f'  // Yellow (Buttons)
            };

            const sprites = {
                idle: [
                    "   RRRRR    ",
                    "  RRRRRRRRR ",
                    "  HHHSSHK   ",
                    " HSHHSSSKS  ",
                    " HSHHSSSKS  ",
                    " HHSSSSKKKK ",
                    "   SSSSSSS  ",
                    "  RRBBRR    ",
                    " RRRBBRRRR  ",
                    "RRRRBBBBRRR ",
                    "SSBBYYBBSS  ",
                    "SSBBBBBBSS  ",
                    "BBBBBBBBBB  ",
                    "  BB  BB    ",
                    " HHH  HHH   ",
                    "HHHH  HHHH  "
                ],
                run: [
                    "   RRRRR    ",
                    "  RRRRRRRRR ",
                    "  HHHSSHK   ",
                    " HSHHSSSKS  ",
                    " HSHHSSSKS  ",
                    " HHSSSSKKKK ",
                    "   SSSSSSS  ",
                    "  RRBBRR    ",
                    " RRRBBRRRR  ",
                    "RRRRBBBBRRR ",
                    "SSBBYYBBS   ",
                    "SSBBBBBBSS  ",
                    "BBBBBBBBBB  ",
                    "   BB  HHH  ",
                    "  HHH  HHHH ",
                    " HHHH       "
                ],
                jump: [
                    "   RRRRR    ",
                    "  RRRRRRRRR ",
                    "  HHHSSHK   ",
                    " HSHHSSSKS  ",
                    " HSHHSSSKS  ",
                    " HHSSSSKKKK ",
                    "   SSSSSSS  ",
                    "  RRBBRR  SS",
                    " RRRBBRRRR S",
                    "RRRRBBBBRR  ",
                    "SSBBYYBB    ",
                    " SBBBBBB    ",
                    "  BB  BB    ",
                    " HHH  HHH   ",
                    "HHHH        ",
                    "            "
                ]
            };

            function generateMap(lvl) {
                COLS = 20 + (lvl * 5); 
                let newMap = Array.from({length: ROWS}, () => Array(COLS).fill(0));
                
                for (let i = 0; i < COLS; i++) {
                    newMap[ROWS - 1][i] = 1; 
                    if (i > 5 && i < COLS - 5 && Math.random() < 0.15) {
                        newMap[ROWS - 1][i] = 0; 
                    }
                }
                
                for (let i = 4; i < COLS - 4; i++) {
                    if (newMap[ROWS - 1][i] === 1 && Math.random() < 0.3) {
                        let h = Math.random() > 0.5 ? 4 : 5; 
                        newMap[h][i] = 2; 
                        if (Math.random() < 0.6) newMap[h - 1][i] = 3; 
                    }
                }
                
                newMap[ROWS - 2][COLS - 2] = 4; 
                newMap[ROWS - 3][COLS - 2] = 4;
                newMap[ROWS - 4][COLS - 2] = 4;
                newMap[ROWS - 5][COLS - 2] = 5; 
                
                return newMap;
            }

            function initGame(fullReset = false) {
                if (fullReset) {
                    level = 1; score = 0; lives = 3;
                }
                map = generateMap(level);
                resetPlayer();
                updateUI();
            }

            function resetPlayer() {
                player.x = 50; player.y = 50;
                player.dx = 0; player.dy = 0;
                player.grounded = false; player.isDead = false;
                camX = 0;
            }

            function updateUI() {
                scoreEl.innerText = score * 100;
                levelEl.innerText = level;
                livesEl.innerText = lives > 0 ? '❤️'.repeat(lives) : '💀';
            }

            function checkMapCollision(x, y) {
                let col = Math.floor(x / TILE);
                let row = Math.floor(y / TILE);
                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return 0;
                return map[row][col];
            }

            function collectCoin(col, row) {
                if (map[row][col] === 3) {
                    map[row][col] = 0;
                    score++;
                    updateUI();
                }
            }

            function updatePhysics() {
                if (player.isDead) {
                    player.dy += player.gravity;
                    player.y += player.dy;
                    if (player.y > canvas.height + 50) handleDeath();
                    return;
                }

                if (keys.left) { player.dx -= player.accel; player.facingRight = false; }
                if (keys.right) { player.dx += player.accel; player.facingRight = true; }
                player.dx *= player.friction;
                player.x += player.dx;

                let left = Math.floor(player.x / TILE);
                let right = Math.floor((player.x + player.width - 0.1) / TILE);
                let top = Math.floor(player.y / TILE);
                let bottom = Math.floor((player.y + player.height - 0.1) / TILE);

                for (let r = top; r <= bottom; r++) {
                    for (let c = left; c <= right; c++) {
                        let tile = checkMapCollision(c * TILE, r * TILE);
                        if (tile === 1 || tile === 2) {
                            if (player.dx > 0) { player.x = c * TILE - player.width; player.dx = 0; }
                            else if (player.dx < 0) { player.x = (c + 1) * TILE; player.dx = 0; }
                        } else if (tile === 3) collectCoin(c, r);
                        else if (tile === 4 || tile === 5) levelClear();
                    }
                }

                player.dy += player.gravity;
                player.y += player.dy;
                player.grounded = false;

                left = Math.floor(player.x / TILE);
                right = Math.floor((player.x + player.width - 0.1) / TILE);
                top = Math.floor(player.y / TILE);
                bottom = Math.floor((player.y + player.height - 0.1) / TILE);

                for (let r = top; r <= bottom; r++) {
                    for (let c = left; c <= right; c++) {
                        let tile = checkMapCollision(c * TILE, r * TILE);
                        if (tile === 1 || tile === 2) {
                            if (player.dy > 0) {
                                player.y = r * TILE - player.height;
                                player.dy = 0;
                                player.grounded = true;
                            } else if (player.dy < 0) {
                                player.y = (r + 1) * TILE;
                                player.dy = 0; 
                            }
                        } else if (tile === 3) collectCoin(c, r);
                        else if (tile === 4 || tile === 5) levelClear();
                    }
                }

                if (player.y > canvas.height) triggerDeath();

                camX = player.x - canvas.width / 2 + player.width / 2;
                if (camX < 0) camX = 0;
                if (camX > (COLS * TILE) - canvas.width) camX = (COLS * TILE) - canvas.width;
            }

            function triggerDeath() {
                if(player.isDead) return;
                player.isDead = true;
                player.dy = -10; 
                lives--;
                updateUI();
            }

            function handleDeath() {
                isPlaying = false;
                cancelAnimationFrame(reqId);
                if (lives <= 0) {
                    setTimeout(() => alert(`💀 게임 오버!\n최종 코인: ${score * 100}\n다시 도전하세요.`), 100);
                } else {
                    resetPlayer();
                    isPlaying = true;
                    gameLoop();
                }
            }

            function levelClear() {
                if (!isPlaying) return;
                isPlaying = false;
                cancelAnimationFrame(reqId);
                level++;
                setTimeout(() => {
                    alert(`🎉 월드 ${level - 1} 클리어!\n다음 월드로 이동합니다.`);
                    initGame();
                    isPlaying = true;
                    gameLoop();
                }, 100);
            }

            function draw() {
                ctx.fillStyle = '#5c94fc'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(-camX, 0);

                let startCol = Math.max(0, Math.floor(camX / TILE));
                let endCol = Math.min(COLS, Math.ceil((camX + canvas.width) / TILE));

                for (let r = 0; r < ROWS; r++) {
                    for (let c = startCol; c < endCol; c++) {
                        let t = map[r][c];
                        let tx = c * TILE;
                        let ty = r * TILE;

                        if (t === 1) { 
                            ctx.fillStyle = '#6ab04c'; ctx.fillRect(tx, ty, TILE, TILE/4);
                            ctx.fillStyle = '#d35400'; ctx.fillRect(tx, ty+TILE/4, TILE, TILE*0.75);
                            ctx.strokeStyle = '#000'; ctx.strokeRect(tx, ty, TILE, TILE);
                        } else if (t === 2) { 
                            ctx.fillStyle = '#e67e22'; ctx.fillRect(tx, ty, TILE, TILE);
                            ctx.strokeStyle = '#000'; ctx.strokeRect(tx, ty, TILE, TILE);
                            ctx.beginPath(); ctx.moveTo(tx, ty+TILE/2); ctx.lineTo(tx+TILE, ty+TILE/2); ctx.stroke();
                        } else if (t === 3) { 
                            let pulse = Math.sin(frameCount * 0.1) * 2;
                            ctx.fillStyle = '#f1c40f';
                            ctx.beginPath(); ctx.arc(tx + TILE/2, ty + TILE/2, 10 + pulse, 0, Math.PI*2); ctx.fill();
                            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
                        } else if (t === 4) { 
                            ctx.fillStyle = '#bdc3c7'; ctx.fillRect(tx + TILE/2 - 2, ty, 4, TILE);
                        } else if (t === 5) { 
                            ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(tx + TILE/2, ty + TILE/2, 8, 0, Math.PI*2); ctx.fill();
                        }
                    }
                }

                // --- Draw Pixel Art Player ---
                ctx.save();
                if (player.isDead) ctx.filter = 'grayscale(100%)';

                let cx = player.x + player.width / 2;
                let cy = player.y + player.height / 2;

                ctx.translate(cx, cy);
                if (!player.facingRight) ctx.scale(-1, 1);

                let state = 'idle';
                if (!player.grounded && !player.isDead) {
                    state = 'jump';
                } else if (Math.abs(player.dx) > 0.5 && !player.isDead) {
                    state = (Math.floor(frameCount / 6) % 2 === 0) ? 'run' : 'idle';
                }

                let currentSprite = sprites[state];
                let pSize = 2; // Pixel Scale (12x16 grid * 2 = 24x32 size)
                let startX = -player.width / 2;
                let startY = -player.height / 2;

                for (let r = 0; r < 16; r++) {
                    for (let c = 0; c < 12; c++) {
                        let colorCode = currentSprite[r][c];
                        if (colorCode !== ' ') {
                            ctx.fillStyle = palette[colorCode];
                            ctx.fillRect(startX + c * pSize, startY + r * pSize, pSize, pSize);
                        }
                    }
                }
                ctx.restore();
                // -----------------------------

                ctx.restore();
            }

            function gameLoop() {
                if (!isPlaying) return;
                frameCount++;
                updatePhysics();
                draw();
                reqId = requestAnimationFrame(gameLoop);
            }

            // Controls
            document.getElementById('btn-sm-start').addEventListener('click', () => {
                if (!isPlaying) {
                    if(lives <= 0) initGame(true);
                    isPlaying = true;
                    gameLoop();
                }
            });
            document.getElementById('btn-sm-pause').addEventListener('click', () => isPlaying = false);
            document.getElementById('btn-sm-reset').addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(reqId);
                initGame(true);
                draw();
            });

            window.addEventListener('keydown', (e) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) e.preventDefault();
                if (e.code === 'ArrowLeft') keys.left = true;
                if (e.code === 'ArrowRight') keys.right = true;
                if ((e.code === 'ArrowUp' || e.code === 'Space') && player.grounded && !player.isDead) {
                    player.dy = player.jumpPower; player.grounded = false;
                }
            }, { passive: false });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft') keys.left = false;
                if (e.code === 'ArrowRight') keys.right = false;
            });

            const btnLeft = document.getElementById('btn-sm-left');
            const btnRight = document.getElementById('btn-sm-right');
            const btnJump = document.getElementById('btn-sm-jump');

            const addTouch = (elem, key) => {
                elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
                elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
                elem.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
                elem.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
                elem.addEventListener('mouseleave', (e) => { keys[key] = false; });
            };

            addTouch(btnLeft, 'left');
            addTouch(btnRight, 'right');
            
            const handleJump = (e) => {
                e.preventDefault();
                if (player.grounded && !player.isDead && isPlaying) {
                    player.dy = player.jumpPower; player.grounded = false;
                }
            };
            btnJump.addEventListener('touchstart', handleJump, {passive: false});
            btnJump.addEventListener('mousedown', handleJump);

            initGame(true);
            draw();
        })();
    </script>
</div>
<!-- End of Playable Super Mario Style Platformer -->
