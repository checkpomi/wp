<title id="page-title">pomiai 아스테로이드</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#08080e;--s1:#0e0e18;--s2:#131320;--s3:#191928;--s4:#202032;
  --bd:#1c1c2e;--bd2:#262640;--bd3:#303050;
  --ac:#6c5ce8;--ac2:#9b8ff5;--ac3:rgba(108,92,232,.15);--ac4:rgba(108,92,232,.08);
  --go:#d4924a;--go2:#f0b060;--go3:rgba(212,146,74,.12);
  --te:#28c4a0;--te2:#4eddb8;--te3:rgba(40,196,160,.12);
  --re:#e05555;--re3:rgba(224,85,85,.12);
  --tx:#eeeaf8;--tx2:#8e8aac;--tx3:#52506a;--tx4:#2c2a3c;
  --sh:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overscroll-behavior:none}

#shell{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 0 18px}

#header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--s1);border-bottom:1px solid var(--bd);z-index:20}
#logo{font-size:14px;font-weight:700;color:var(--ac2);letter-spacing:.5px}
#logo span{color:var(--tx3);font-weight:400}
#header .tagline{font-size:10px;color:var(--tx3);margin-top:1px}
.icon-btn{background:var(--s3);border:1px solid var(--bd2);color:var(--tx2);width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:active{background:var(--ac3);color:var(--ac2)}

#stats-row{display:flex;gap:8px;padding:12px 16px 6px}
.chip{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:9px 6px;text-align:center}
.chip-label{font-size:9px;color:var(--tx3);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px}
.chip-value{font-size:17px;font-weight:700;color:var(--tx);font-family:'DM Mono',monospace}

#board-area{position:relative;display:flex;justify-content:center;padding:10px 16px 4px;flex:1}
#canvas-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd2);width:100%;max-width:300px}
#pause-overlay{position:absolute;inset:0;background:rgba(8,8,14,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:14px;z-index:5}
#pause-overlay.show{display:flex}
#pause-overlay .po-title{font-size:16px;font-weight:700;color:var(--ac2)}

#action-row{display:flex;gap:8px;padding:12px 16px 4px}
.btn{background:linear-gradient(135deg,var(--ac),#4a38c0);border:none;color:#fff;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(108,92,232,.28);flex:1}
.btn:active{filter:brightness(.92);transform:scale(.98)}
.btn.outline{background:transparent;border:1px solid var(--bd2);color:var(--tx2);box-shadow:none}
.btn.go{background:linear-gradient(135deg,var(--te),#1a8c72);box-shadow:0 4px 16px rgba(40,196,160,.22)}
.btn.re{background:linear-gradient(135deg,var(--re),#a83232);box-shadow:0 4px 16px rgba(224,85,85,.22)}
.btn:disabled{opacity:.4;pointer-events:none}

#control-pad{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:14px;flex-wrap:wrap}
#dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;flex-shrink:0}
#dpad button{background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.1s}
#dpad button:active,#dpad button.active{background:var(--ac3);border-color:var(--ac);color:var(--ac2);transform:scale(.94)}
#action-buttons{display:flex;gap:8px;flex-wrap:wrap}
#action-buttons button{width:64px;height:56px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.1s}
#action-buttons button:active{background:var(--te3);border-color:var(--te);color:var(--te2);transform:scale(.94)}
#action-buttons button.fire:active{background:var(--re3);border-color:var(--re);color:#ff9a9a}
#action-buttons button span{font-size:8px;font-weight:600;color:var(--tx3);letter-spacing:.4px}
#action-buttons button:active span{color:inherit}

#touch-hint{text-align:center;font-size:11px;color:var(--tx3);padding:8px 16px 2px}
#pc-hint{text-align:center;font-size:11px;color:var(--tx3);padding:6px 16px 2px}
@media (hover:none) and (pointer:coarse){ #pc-hint{display:none} }
@media (hover:hover) and (pointer:fine){ #touch-hint{display:none} }

.brand-footer{margin:16px 16px 0;padding:14px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand-name{font-weight:700;font-size:13px;letter-spacing:-.01em;color:var(--tx)}
.brand-by{font-weight:600;font-size:11px;color:var(--tx3);margin-right:4px}
.brand-links{display:flex;gap:8px;flex-wrap:wrap}
.brand-links a{font-size:11px;font-weight:700;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--bd2);white-space:nowrap}
.brand-links a:active{opacity:.7}

#gameover-modal{position:fixed;inset:0;background:rgba(4,4,8,.82);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#gameover-modal.show{display:flex}
.go-card{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:28px 24px;text-align:center;max-width:300px;width:100%;box-shadow:var(--sh)}
.go-title{font-size:20px;font-weight:700;color:var(--re);margin-bottom:8px}
.go-score-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:14px}
.go-score-val{font-size:30px;font-weight:700;color:var(--ac2);font-family:'DM Mono',monospace;margin-bottom:18px}

#landscape-lock{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#landscape-lock .rot-ic{font-size:44px;animation:rotpulse 1.6s ease-in-out infinite}
@keyframes rotpulse{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
#landscape-lock .rot-txt{font-size:14px;color:var(--tx2);font-weight:600}
@media (orientation:landscape) and (hover:none) and (pointer:coarse){
  #landscape-lock{display:flex}
}

#canvas-wrap{max-width:300px}
#astCanvas{display:block;width:100%;height:auto}
.scanline{position:absolute;inset:0;background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.4) 50%);background-size:100% 4px;pointer-events:none;z-index:2}

</style>
</head>
<body>
<div id="landscape-lock">
  <div class="rot-ic">📱</div>
  <div class="rot-txt" data-i18n="orientation_msg">화면을 세로로 돌려주세요</div>
</div>
<div id="shell">
  <div id="header">
    <div>
      <div id="logo">pomiai <span>· ASTEROIDS</span></div>
      <div class="tagline" data-i18n="tagline">소행성을 부수며 살아남으세요</div>
    </div>
  </div>

  <div id="stats-row">
    <div class="chip"><div class="chip-label" data-i18n="wave">웨이브</div><div class="chip-value" id="levelDisplay">1</div></div>
    <div class="chip"><div class="chip-label" data-i18n="score">점수</div><div class="chip-value" id="scoreDisplay">0</div></div>
    <div class="chip"><div class="chip-label" data-i18n="lives">라이프</div><div class="chip-value" id="livesDisplay">🚀🚀🚀</div></div>
  </div>

  <div id="board-area">
    <div id="canvas-wrap">
      <canvas id="astCanvas" width="300" height="300"></canvas>
      <div class="scanline"></div>
    </div>

  <div id="touch-hint" data-i18n="touch_hint">회전/추진/발사 버튼으로 조작하세요</div>
  <div id="pc-hint" data-i18n="pc_hint">PC: 방향키 회전·추진 · 스페이스 발사</div>

  <div id="action-row">
    <button class="btn" id="startBtn" data-i18n="btn_start">시작</button>
    <button class="btn outline" id="pauseBtn" data-i18n="btn_pause">일시정지</button>

  </div>

  <div id="control-pad">
    <div style="display:flex;gap:8px">
      <button id="leftBtn" style="width:52px;height:52px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:20px">↺</button>
      <button id="rightBtn" style="width:52px;height:52px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:20px">↻</button>
    </div>
    <button id="thrustBtn" style="flex:1;height:52px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:14px;font-weight:700">🔥 <span data-i18n="lbl_thrust">추진</span></button>
    <button id="fireBtn" class="fire" style="flex:1;height:52px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:14px;font-weight:700">🎯 <span data-i18n="lbl_fire">발사</span></button>
  </div>

  <div class="brand-footer">
    <div class="brand-name"><span class="brand-by" data-i18n="footer_by">Product by</span> pomiai</div>
    <div class="brand-links">
      <a href="https://checkpomi.com" target="_blank" rel="noopener">🌐 checkpomi.com</a>
      <a href="https://www.youtube.com/@pomiai_official" target="_blank" rel="noopener">▶ YouTube</a>
    </div>
  </div>
</div>

<div id="gameover-modal">
  <div class="go-card">
    <div class="go-title" data-i18n="gameover_title">게임 오버</div>
    <div class="go-score-label" data-i18n="final_score">최종 점수</div>
    <div class="go-score-val" id="finalScore">0</div>
    <button class="btn full" style="width:100%" id="retryBtn" data-i18n="btn_retry">다시하기</button>
  </div>
</div>

<script>
const I18N = {
  ko:{ page_title:'pomiai 아스테로이드', tagline:'소행성을 부수며 살아남으세요',
    wave:'웨이브', score:'점수', lives:'라이프', lbl_thrust:'추진', lbl_fire:'발사',
    touch_hint:'회전/추진/발사 버튼으로 조작하세요', pc_hint:'PC: 방향키 회전·추진 · 스페이스 발사',
    btn_start:'시작', btn_pause:'일시정지', btn_reset:'리셋', btn_retry:'다시하기',
    orientation_msg:'화면을 세로로 돌려주세요',
    gameover_title:'게임 오버', final_score:'최종 점수', footer_by:'Product by' },
  en:{ page_title:'pomiai Asteroids', tagline:'Blast asteroids and survive',
    wave:'Wave', score:'Score', lives:'Lives', lbl_thrust:'Thrust', lbl_fire:'Fire',
    touch_hint:'Use rotate/thrust/fire buttons', pc_hint:'PC: Arrows to rotate/thrust · Space to fire',
    btn_start:'Start', btn_pause:'Pause', btn_reset:'Reset', btn_retry:'Retry',
    orientation_msg:'Please rotate to portrait',
    gameover_title:'Game Over', final_score:'Final Score', footer_by:'Product by' },
  ja:{ page_title:'pomiai アステロイド', tagline:'小惑星を破壊して生き延びよう',
    wave:'ウェーブ', score:'スコア', lives:'ライフ', lbl_thrust:'推進', lbl_fire:'発射',
    touch_hint:'回転・推進・発射ボタンで操作', pc_hint:'PC：矢印キーで回転・推進・スペースで発射',
    btn_start:'スタート', btn_pause:'一時停止', btn_reset:'リセット', btn_retry:'もう一度',
    orientation_msg:'画面を縦向きにしてください',
    gameover_title:'ゲームオーバー', final_score:'最終スコア', footer_by:'Product by' }
};

(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  const LANG = (urlLang && I18N[urlLang]) ? urlLang
             : (I18N[browserLang]         ? browserLang : 'ko');
  window._LANG = LANG;
  window._T    = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
})();
function applyI18n() {
  const t = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (typeof t[k] === 'string') el.textContent = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.title = t.page_title;
}
applyI18n();
function bindHold(el, fn, repeatMs){
  repeatMs = repeatMs || 130;
  let iv=null;
  const start=(e)=>{ e.preventDefault(); fn(); el.classList.add('active'); iv=setInterval(fn,repeatMs); };
  const end=()=>{ clearInterval(iv); iv=null; el.classList.remove('active'); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointercancel', end);
}

const canvas = document.getElementById('astCanvas');
const ctx = canvas.getContext('2d');
const scoreEl=document.getElementById('scoreDisplay'), levelEl=document.getElementById('levelDisplay'), livesEl=document.getElementById('livesDisplay');

let reqId=null, isPlaying=false, level=1, score=0, lives=3;
let ship, asteroids=[], bullets=[], particles=[];
const FRICTION=0.98, AST_ROIDS_NUM=3, AST_SIZE=60;
let keys={ArrowLeft:false,ArrowRight:false,ArrowUp:false,Space:false};
let lastShot=0;

class Ship{
  constructor(){ this.x=canvas.width/2; this.y=canvas.height/2; this.r=10; this.a=-Math.PI/2; this.rot=0; this.thrusting=false; this.dx=0; this.dy=0; this.isDead=false; this.invulnerable=120; }
  draw(){
    if(this.isDead) return;
    if(this.invulnerable>0 && Math.floor(this.invulnerable/10)%2===0) return;
    ctx.strokeStyle='#eeeaf8'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.moveTo(this.x+4/3*this.r*Math.cos(this.a), this.y+4/3*this.r*Math.sin(this.a));
    ctx.lineTo(this.x-this.r*(2/3*Math.cos(this.a)+Math.sin(this.a)), this.y-this.r*(2/3*Math.sin(this.a)-Math.cos(this.a)));
    ctx.lineTo(this.x-this.r*(2/3*Math.cos(this.a)-Math.sin(this.a)), this.y-this.r*(2/3*Math.sin(this.a)+Math.cos(this.a)));
    ctx.closePath(); ctx.stroke();
    if(this.thrusting){
      ctx.strokeStyle='#ff5f7a'; ctx.beginPath();
      ctx.moveTo(this.x-this.r*(2/3*Math.cos(this.a)+0.5*Math.sin(this.a)), this.y-this.r*(2/3*Math.sin(this.a)-0.5*Math.cos(this.a)));
      ctx.lineTo(this.x-this.r*5/3*Math.cos(this.a), this.y-this.r*5/3*Math.sin(this.a));
      ctx.lineTo(this.x-this.r*(2/3*Math.cos(this.a)-0.5*Math.sin(this.a)), this.y-this.r*(2/3*Math.sin(this.a)+0.5*Math.cos(this.a)));
      ctx.stroke();
    }
  }
  update(){
    if(this.invulnerable>0) this.invulnerable--;
    this.a+=this.rot;
    if(this.thrusting){ this.dx+=0.1*Math.cos(this.a); this.dy+=0.1*Math.sin(this.a); }
    else { this.dx*=FRICTION; this.dy*=FRICTION; }
    this.x+=this.dx; this.y+=this.dy;
    if(this.x<0-this.r) this.x=canvas.width+this.r; else if(this.x>canvas.width+this.r) this.x=0-this.r;
    if(this.y<0-this.r) this.y=canvas.height+this.r; else if(this.y>canvas.height+this.r) this.y=0-this.r;
  }
}
class Asteroid{
  constructor(x,y,r,lvl){
    this.x=x; this.y=y; this.r=r; this.lvl=lvl; this.a=Math.random()*Math.PI*2;
    let spd=(1+level*0.2)/this.lvl; this.dx=spd*Math.cos(this.a); this.dy=spd*Math.sin(this.a);
    this.vert=Math.floor(Math.random()*5+7); this.offs=[];
    for(let i=0;i<this.vert;i++) this.offs.push(Math.random()*0.4+0.8);
  }
  draw(){
    ctx.strokeStyle='#9b8ff5'; ctx.lineWidth=1.5; ctx.beginPath();
    for(let j=0;j<this.vert;j++){
      let angle=j*Math.PI*2/this.vert, r=this.r*this.offs[j];
      let px=this.x+r*Math.cos(angle), py=this.y+r*Math.sin(angle);
      if(j===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.stroke();
  }
  update(){
    this.x+=this.dx; this.y+=this.dy;
    if(this.x<0-this.r) this.x=canvas.width+this.r; else if(this.x>canvas.width+this.r) this.x=0-this.r;
    if(this.y<0-this.r) this.y=canvas.height+this.r; else if(this.y>canvas.height+this.r) this.y=0-this.r;
  }
}
class Bullet{
  constructor(x,y,a){ this.x=x; this.y=y; this.dx=6*Math.cos(a); this.dy=6*Math.sin(a); this.life=60; }
  draw(){ ctx.fillStyle='#4eddb8'; ctx.beginPath(); ctx.arc(this.x,this.y,2,0,Math.PI*2); ctx.fill(); }
  update(){
    this.x+=this.dx; this.y+=this.dy; this.life--;
    if(this.x<0) this.x=canvas.width; else if(this.x>canvas.width) this.x=0;
    if(this.y<0) this.y=canvas.height; else if(this.y>canvas.height) this.y=0;
  }
}
class Particle{
  constructor(x,y){ this.x=x; this.y=y; this.dx=(Math.random()-0.5)*4; this.dy=(Math.random()-0.5)*4; this.life=Math.random()*30+10; }
  draw(){ ctx.fillStyle='#eeeaf8'; ctx.globalAlpha=this.life/40; ctx.fillRect(this.x,this.y,2,2); ctx.globalAlpha=1; }
  update(){ this.x+=this.dx; this.y+=this.dy; this.life--; }
}
function createAsteroids(){
  asteroids=[];
  let num=AST_ROIDS_NUM+level-1;
  for(let i=0;i<num;i++){
    let x,y;
    do{ x=Math.random()*canvas.width; y=Math.random()*canvas.height; }
    while(distBetweenPoints(ship.x,ship.y,x,y) < AST_SIZE*2+ship.r);
    asteroids.push(new Asteroid(x,y,AST_SIZE/2,3));
  }
}
function distBetweenPoints(x1,y1,x2,y2){ return Math.sqrt((x2-x1)**2+(y2-y1)**2); }
function explodeAsteroid(index){
  let a=asteroids[index];
  score += (4-a.lvl)*100; updateUI();
  for(let i=0;i<10;i++) particles.push(new Particle(a.x,a.y));
  if(a.lvl>1){ asteroids.push(new Asteroid(a.x,a.y,a.r/2,a.lvl-1)); asteroids.push(new Asteroid(a.x,a.y,a.r/2,a.lvl-1)); }
  asteroids.splice(index,1);
  if(asteroids.length===0){ level++; updateUI(); setTimeout(createAsteroids,1000); }
}
function killShip(){
  ship.isDead=true;
  for(let i=0;i<30;i++) particles.push(new Particle(ship.x,ship.y));
  lives--; updateUI();
  if(lives>0) setTimeout(()=>{ ship=new Ship(); }, 1000);
  else {
    isPlaying=false;
    document.getElementById('finalScore').textContent=score;
    document.getElementById('gameover-modal').classList.add('show');
  }
}
function initGame(){
  level=1; score=0; lives=3; ship=new Ship(); bullets=[]; particles=[]; createAsteroids(); updateUI();
}
function updateUI(){ scoreEl.textContent=score; levelEl.textContent=level; livesEl.textContent=lives>0?'🚀'.repeat(lives):'💀'; }
function shoot(){
  if(ship.isDead) return;
  let now=Date.now();
  if(now-lastShot>150){ bullets.push(new Bullet(ship.x+4/3*ship.r*Math.cos(ship.a), ship.y+4/3*ship.r*Math.sin(ship.a), ship.a)); lastShot=now; }
}
function gameLoop(){
  if(!isPlaying) return;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!ship.isDead){ ship.update(); ship.draw(); }
  for(let i=asteroids.length-1;i>=0;i--){
    let a=asteroids[i]; a.update(); a.draw();
    if(!ship.isDead && ship.invulnerable===0){
      if(distBetweenPoints(ship.x,ship.y,a.x,a.y)<ship.r+a.r){ explodeAsteroid(i); killShip(); continue; }
    }
  }
  for(let i=bullets.length-1;i>=0;i--){
    let b=bullets[i]; b.update(); b.draw();
    if(b.life<=0){ bullets.splice(i,1); continue; }
    for(let j=asteroids.length-1;j>=0;j--){
      let a=asteroids[j];
      if(distBetweenPoints(b.x,b.y,a.x,a.y)<a.r){ bullets.splice(i,1); explodeAsteroid(j); break; }
    }
  }
  for(let i=particles.length-1;i>=0;i--){ let p=particles[i]; p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); }
  reqId=requestAnimationFrame(gameLoop);
}
const handleKey=(e,isDown)=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
  if(ship.isDead) return;
  if(e.code==='ArrowLeft') ship.rot = isDown?-0.1:0;
  if(e.code==='ArrowRight') ship.rot = isDown?0.1:0;
  if(e.code==='ArrowUp') ship.thrusting = isDown;
  if(e.code==='Space' && isDown) shoot();
};
window.addEventListener('keydown', e=>handleKey(e,true), {passive:false});
window.addEventListener('keyup', e=>handleKey(e,false));

document.getElementById('startBtn').addEventListener('click', ()=>{
  document.getElementById('gameover-modal').classList.remove('show');
  if(!isPlaying){ if(lives<=0) initGame(); isPlaying=true; gameLoop(); }
});
document.getElementById('pauseBtn').addEventListener('click', ()=> isPlaying=false);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  isPlaying=false; cancelAnimationFrame(reqId); initGame();
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ship.draw(); asteroids.forEach(a=>a.draw());
});
document.getElementById('retryBtn').addEventListener('click', ()=>{
  document.getElementById('gameover-modal').classList.remove('show');
  initGame(); isPlaying=true; gameLoop();
});
function addTouch(id,down,up){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown', e=>{e.preventDefault(); down();});
  el.addEventListener('pointerup', e=>{e.preventDefault(); up();});
  el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
}
addTouch('leftBtn', ()=>{if(!ship.isDead) ship.rot=-0.1;}, ()=>{if(ship) ship.rot=0;});
addTouch('rightBtn', ()=>{if(!ship.isDead) ship.rot=0.1;}, ()=>{if(ship) ship.rot=0;});
addTouch('thrustBtn', ()=>{if(!ship.isDead) ship.thrusting=true;}, ()=>{if(ship) ship.thrusting=false;});
let shootInterval;
addTouch('fireBtn', ()=>{ shoot(); shootInterval=setInterval(shoot,200); }, ()=>{ clearInterval(shootInterval); });

initGame();
ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
ship.draw(); asteroids.forEach(a=>a.draw());

</script>
</body>
</html>
