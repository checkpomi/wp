<!DOCTYPE html>
<html lang="ko" id="html-root">
<head>

    - 2026.08.08: 마케팅 문구에서 AI 관련 표현 제거
  캐시버스팅: 배포 후 ?v=2026.08.08 파라미터로 강제 갱신 가능

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title id="page-title">pomiai fortune</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  /* 배경 — 차갑지 않은 따뜻한 딥 네이비 */
  --bg:#07070e;--surface:#0e0e1c;--surface2:#131326;--surface3:#1a1a30;--surface4:#212140;
  --border:#202038;--border2:#2c2c4c;--border3:#383860;
  /* 골드 — 더 따뜻하고 부드럽게 */
  --gold:#c9963a;--gold2:#e8b84b;--gold3:rgba(201,150,58,.13);--gold4:rgba(232,184,75,.07);
  /* 보라 — 신비롭고 포근하게 */
  --violet:#7c5ce8;--violet2:#9f82f5;--violet3:rgba(124,92,232,.15);--violet4:rgba(159,130,245,.07);
  /* 포인트 컬러 */
  --rose:#d96b99;--rose3:rgba(217,107,153,.12);
  --teal:#3ac9b0;--amber:#d4863a;
  /* 텍스트 — 읽기 편한 크림화이트 계열 */
  --text:#eeeaf8;--text2:#9b96b8;--text3:#58546e;--text4:#3a3850;
  /* 그림자 */
  --glow-v:0 4px 32px rgba(124,92,232,.25);
  --glow-g:0 4px 32px rgba(201,150,58,.2);
  --shadow-card:0 2px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-y:scroll;overflow-x:hidden;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  overflow:visible;min-height:100vh;width:100%}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;opacity:.45}
#app{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:0 16px 160px;overflow:visible}

/* ── HEADER ── */
#header{text-align:center;padding:48px 0 28px;position:relative}
.header-orb{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:280px;height:280px;
  border-radius:50%;background:radial-gradient(circle,rgba(124,92,232,.2) 0%,rgba(201,150,58,.08) 50%,transparent 70%);
  filter:blur(50px);pointer-events:none}
#logo-main{font-size:11px;font-weight:500;letter-spacing:7px;color:var(--gold);
  text-transform:uppercase;margin-bottom:14px;display:block;opacity:.85}
#title-main{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:400;
  background:linear-gradient(150deg,var(--gold2) 0%,var(--violet2) 55%,var(--rose) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  line-height:1.5;margin-bottom:10px;word-break:keep-all}
#subtitle-main{font-size:11px;color:var(--text3);letter-spacing:2.5px;line-height:1.8}
#today-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--border2);border-radius:40px;
  padding:10px 24px;margin:20px auto 0;width:fit-content;
  font-size:12px;color:var(--text2);box-shadow:var(--shadow-card)}
#today-bar .dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.6}
#today-lunar{color:var(--gold2);font-family:'Noto Serif KR',serif;font-size:12px}

/* ── 신상 입력 카드 ── */
#profile-card{
  background:linear-gradient(145deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--border2);border-radius:22px;padding:24px 22px;
  margin:24px 0 20px;position:relative;
  box-shadow:var(--shadow-card)}
#profile-card::before{content:'';position:absolute;top:-40px;right:-30px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(var(--gold3),transparent 70%);pointer-events:none}
#profile-card::after{content:'';position:absolute;bottom:-30px;left:-20px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(var(--violet4),transparent 70%);pointer-events:none}
.pc-title{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--gold2);
  margin-bottom:18px;display:flex;align-items:center;gap:9px;font-weight:500}
.pc-title::before{content:'';width:3px;height:16px;
  background:linear-gradient(var(--gold2),var(--violet2));border-radius:2px}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pc-group{display:flex;flex-direction:column;gap:6px}
.pc-group.wide{grid-column:span 2}
.pc-group.full{grid-column:1/-1}
.pc-label{font-size:10px;color:var(--text3);letter-spacing:1.5px;font-weight:600;
  text-transform:uppercase}
.pc-input,.pc-select{
  background:var(--surface3);border:1px solid var(--border3);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:14px;font-family:'DM Sans',sans-serif;
  outline:none;transition:.18s;width:100%;-webkit-appearance:none}
.pc-input:focus,.pc-select:focus{
  border-color:var(--violet2);background:var(--surface4);
  box-shadow:0 0 0 3px rgba(159,130,245,.12)}
.pc-input::placeholder{color:var(--text4)}
#profile-status{margin-top:14px;padding:11px 16px;border-radius:12px;font-size:13px;
  background:linear-gradient(135deg,rgba(124,92,232,.1),rgba(201,150,58,.06));
  border:1px solid rgba(159,130,245,.25);color:var(--violet2);
  display:none;align-items:center;gap:8px;line-height:1.6}
#profile-status.show{display:flex}
#profile-status .ps-name{font-weight:700;color:var(--gold2);font-size:14px}

/* ── 탭 ── */
#tabs{display:flex;flex-wrap:wrap;gap:7px;padding:2px 2px 6px;margin-bottom:18px}
.tab{flex-shrink:0;padding:9px 17px;font-size:12px;font-weight:600;color:var(--text3);
  background:var(--surface);border:1px solid var(--border2);border-radius:30px;
  cursor:pointer;transition:.2s;letter-spacing:.3px}
.tab:hover{color:var(--text2);border-color:var(--border3);background:var(--surface2)}
.tab.active{
  background:linear-gradient(135deg,var(--violet3),var(--gold4));
  color:var(--violet2);border-color:var(--violet);
  box-shadow:var(--glow-v)}

/* ── 서비스 패널 ── */
.sec{display:none}
.sec.active{display:block;animation:fadeIn .25s ease;overflow:visible;height:auto;position:relative;z-index:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── 서비스 카드 ── */
.card{
  background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%);
  border:1px solid var(--border2);border-radius:22px;
  padding:24px 22px;margin-bottom:14px;
  overflow:visible;height:auto;
  position:relative;z-index:1;
  box-shadow:var(--shadow-card)}
.card-head{display:flex;flex-direction:row;align-items:flex-start;
  justify-content:space-between;gap:10px;margin-bottom:20px}
.card-title{font-family:'Noto Serif KR',serif;font-size:16px;color:var(--gold2);
  display:flex;align-items:center;gap:9px;font-weight:500;flex:1;min-width:0}
.card-title::before{content:'';width:3px;height:16px;
  background:linear-gradient(var(--gold2),var(--violet2));border-radius:2px;flex-shrink:0}
.profile-hint{flex-shrink:0;font-size:11px;color:var(--text3);background:var(--surface3);
  border:1px solid var(--border2);border-radius:20px;padding:4px 10px;
  white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}
.profile-hint.ok{color:var(--teal);border-color:rgba(58,201,176,.3);background:rgba(58,201,176,.07)}

/* ── 폼 공통 ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:18px}
.form-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:10px;color:var(--text3);letter-spacing:1.5px;font-weight:600;text-transform:uppercase}
.form-input,.form-select{
  background:var(--surface3);border:1px solid var(--border3);color:var(--text);
  border-radius:10px;padding:11px 13px;font-size:14px;
  font-family:'DM Sans',sans-serif;outline:none;transition:.18s;width:100%;
  -webkit-appearance:none}
.form-input:focus,.form-select:focus{
  border-color:var(--violet2);background:var(--surface4);
  box-shadow:0 0 0 3px rgba(159,130,245,.1)}
.form-input::placeholder{color:var(--text4)}

/* ── 버튼 ── */
.btn-main{
  width:100%;background:linear-gradient(135deg,var(--violet) 0%,#5b21b6 100%);
  border:none;color:#fff;border-radius:13px;padding:15px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.22s;
  font-family:'DM Sans',sans-serif;letter-spacing:.5px;
  position:relative;z-index:2;
  box-shadow:0 4px 20px rgba(124,92,232,.3)}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,92,232,.45);filter:brightness(1.07)}
.btn-main:active{transform:translateY(0);box-shadow:0 2px 10px rgba(124,92,232,.3);filter:brightness(.96)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold2) 0%,var(--gold) 100%);
  box-shadow:0 4px 20px rgba(201,150,58,.25)}
.btn-gold:hover{box-shadow:0 8px 28px rgba(201,150,58,.4)}
.btn-rose{
  background:linear-gradient(135deg,var(--rose) 0%,#a8185c 100%);
  box-shadow:0 4px 20px rgba(217,107,153,.25)}
.btn-rose:hover{box-shadow:0 8px 28px rgba(217,107,153,.4)}

/* ── 결과 박스 ── */
.result-box{
  background:linear-gradient(160deg,var(--surface2),var(--surface3));
  border:1px solid var(--border3);border-radius:18px;
  padding:24px 22px;margin-top:20px;display:none;
  overflow-y:auto;overflow-x:hidden;
  max-height:560px;
  scrollbar-width:thin;scrollbar-color:var(--border3) transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.result-box::-webkit-scrollbar{width:4px}
.result-box::-webkit-scrollbar-thumb{background:var(--border3);border-radius:4px}
.result-box::-webkit-scrollbar-track{background:transparent}
.result-box.show{display:block;animation:fadeIn .4s ease}
.result-loading{text-align:center;padding:32px 16px;color:var(--text2)}
.loading-dots{display:inline-flex;gap:7px;margin-top:12px}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--violet2);animation:bounce .9s ease infinite}
.loading-dots span:nth-child(2){animation-delay:.18s}
.loading-dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-7px);opacity:1}}
.result-content{
  font-family:'Noto Serif KR',serif;font-size:15px;line-height:2.05;color:var(--text);
  word-break:keep-all;overflow-wrap:break-word;white-space:normal;
  display:block;width:100%;height:auto;max-height:none;overflow:visible}
.result-content h3{
  font-size:14px;font-weight:600;color:var(--gold2);
  margin:22px 0 10px;padding:8px 12px;
  background:linear-gradient(135deg,var(--gold4),transparent);
  border-left:3px solid var(--gold2);border-radius:0 8px 8px 0;display:block}
.result-content p{margin:.6em 0;line-height:2.05}
.result-content strong{color:var(--violet2);font-weight:600}
.cursor-blink{display:inline-block;color:var(--violet2);
  animation:blink .65s step-end infinite;font-weight:300}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── 사주 시각화 ── */
.saju-pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.pillar{background:var(--surface3);border:1px solid var(--border2);border-radius:11px;padding:12px 6px;text-align:center}
.pillar-label{font-size:10px;color:var(--text3);letter-spacing:1px;margin-bottom:7px}
.pillar-gan{font-family:'Noto Serif KR',serif;font-size:20px;color:var(--gold2);font-weight:600;line-height:1}
.pillar-ji{font-family:'Noto Serif KR',serif;font-size:17px;color:var(--violet2);margin-top:5px}
.pillar-emoji{font-size:16px;margin-top:4px}
.ohaeng-wrap{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.ohaeng-item{flex:1;min-width:52px;background:var(--surface3);border-radius:9px;padding:8px 5px;text-align:center}
.ohaeng-name{font-size:10px;color:var(--text3);margin-bottom:5px}
.ohaeng-bar{height:3px;border-radius:2px;margin:0 auto;transition:.5s}
.ohaeng-val{font-size:12px;font-weight:600;margin-top:4px}

/* ── 타로 ── */
.tarot-deck{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.tarot-card-wrap{cursor:pointer;perspective:800px}
.tarot-card{width:88px;height:144px;border-radius:11px;position:relative;
  transform-style:preserve-3d;transition:transform .55s}
.tarot-card.flipped{transform:rotateY(180deg)}
.tarot-front,.tarot-back{position:absolute;inset:0;border-radius:11px;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}
.tarot-back{background:linear-gradient(150deg,#140820,#251545,#1a0d30);border:1px solid var(--violet2);font-size:28px;box-shadow:inset 0 0 20px rgba(124,92,232,.2)}
.tarot-back::after{content:'☽ ✦ ☾';position:absolute;bottom:8px;font-size:9px;color:var(--violet2);letter-spacing:3px}
.tarot-front{background:linear-gradient(150deg,var(--surface3),var(--surface4),#211a38);
  border:1px solid var(--gold);padding:10px;transform:rotateY(180deg);text-align:center}
.tarot-front .t-num{font-size:10px;color:var(--gold);letter-spacing:1px}
.tarot-front .t-icon{font-size:28px;margin:3px 0}
.tarot-front .t-name{font-family:'Noto Serif KR',serif;font-size:10px;color:var(--text2);line-height:1.4}

/* ── 별자리 그리드 ── */
.zodiac-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}
.zodiac-item{background:var(--surface2);border:1px solid var(--border);border-radius:11px;
  padding:9px 3px;text-align:center;cursor:pointer;transition:.15s}
.zodiac-item:hover,.zodiac-item.sel{border-color:var(--gold);background:var(--gold3)}
.zodiac-item .z-icon{font-size:18px;display:block;margin-bottom:2px}
.zodiac-item .z-name{font-size:9px;color:var(--text3)}
.zodiac-item.sel .z-name{color:var(--gold2)}

/* ── 꿈해몽 태그 ── */
.dream-tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.dream-tag{background:var(--surface3);border:1px solid var(--border2);border-radius:18px;
  padding:5px 13px;font-size:12px;color:var(--text2);cursor:pointer;transition:.15s;letter-spacing:.2px}
.dream-tag:hover{border-color:var(--violet2);color:var(--violet2)}

/* ── 궁합: 상대 입력만 ── */
.partner-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;
  background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:14px;margin-bottom:14px}
.partner-label{grid-column:1/-1;font-size:11px;color:var(--rose);font-weight:600;letter-spacing:1px;margin-bottom:4px}

/* ── 반응형 ── */
@media(max-width:580px){
  #app{padding:0 12px 140px}
  #header{padding:36px 0 20px}
  #title-main{font-size:23px}
  #subtitle-main{font-size:10px;letter-spacing:1.5px}
  #today-bar{padding:8px 16px;font-size:11px;gap:10px}
  #profile-card{padding:20px 16px;border-radius:18px}
  .pc-grid{grid-template-columns:1fr 1fr}
  .pc-group.wide{grid-column:span 2}
  .pc-input,.pc-select{font-size:14px;padding:10px 11px}
  .card{padding:18px 16px;border-radius:18px}
  .card-title{font-size:15px}
  .form-grid{grid-template-columns:1fr}
  .form-input,.form-select{font-size:14px;padding:11px 12px}
  .btn-main{padding:14px;font-size:14px;border-radius:12px}
  .result-box{padding:18px 16px;max-height:480px}
  .result-content{font-size:14px;line-height:1.95}
  .result-content h3{font-size:13px;padding:7px 10px}
  .zodiac-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .zodiac-item{padding:8px 2px}
  .zodiac-item .z-icon{font-size:16px}
  .zodiac-item .z-name{font-size:9px}
  .tarot-card{width:76px;height:124px}
  .tarot-front .t-icon{font-size:24px}
  .saju-pillars{gap:6px}
  .pillar{padding:10px 4px}
  .pillar-gan{font-size:18px}
  .pillar-ji{font-size:15px}
  .tab{padding:8px 13px;font-size:11px}
  .partner-grid{grid-template-columns:1fr}
}
@media(max-width:380px){
  #title-main{font-size:20px}
  .zodiac-grid{grid-template-columns:repeat(3,1fr)}
  .tarot-card{width:66px;height:108px}
}
.langbtn{background:var(--surface3);border:1px solid var(--border3);color:var(--text2);
  font-size:10px;font-weight:700;padding:5px 9px;border-radius:8px;cursor:pointer;transition:.15s}
.langbtn:hover{border-color:var(--violet2);color:var(--violet2)}
.langbtn.active{background:linear-gradient(135deg,var(--violet3),var(--gold4));
  color:var(--gold2);border-color:var(--gold)}
#lang-switch{position:absolute;top:14px;right:14px;display:flex;gap:5px;z-index:2}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="app">

  <!-- 헤더 -->
  <div id="header">
    <div id="lang-switch">
      <button data-lang="ko" class="langbtn">한</button>
      <button data-lang="en" class="langbtn">EN</button>
      <button data-lang="ja" class="langbtn">日</button>
    </div>
    <div class="header-orb"></div>
    <span id="logo-main">pomiai · fortune</span>
    <h1 id="title-main" data-i18n-html="title_main">신비로운 빛이 당신의<br>행복을 응원해요</h1>
    <p id="subtitle-main" data-i18n="subtitle_main">사주 · 오늘운세 · 타로 · 별자리 · 꿈해몽 · 이름풀이</p>
    <div id="today-bar">
      <span id="today-solar"></span>
      <span class="dot"></span>
      <span id="today-lunar">음력</span>
      <span class="dot"></span>
      <span id="today-gan"></span>
    </div>
  </div>

  <!-- ★ 신상 입력 (한 번만) ★ -->
  <div id="profile-card">
    <div class="pc-title" data-i18n="pc_title">나의 정보 입력</div>
    <div class="pc-grid">
      <div class="pc-group">
        <label class="pc-label" data-i18n="lbl_name">이름</label>
        <input class="pc-input" id="p-name" data-i18n-placeholder="ph_name" placeholder="홍길동" oninput="updateProfile()">
      </div>
      <div class="pc-group">
        <label class="pc-label" data-i18n="lbl_gender">성별</label>
        <select class="pc-select" id="p-gender" onchange="updateProfile()">
          <option value="남" data-i18n="opt_male">남성</option>
          <option value="여" data-i18n="opt_female">여성</option>
        </select>
      </div>
      <div class="pc-group">
        <label class="pc-label" data-i18n="lbl_birthdate">생년월일</label>
        <input class="pc-input" id="p-date" type="date" onchange="updateProfile()">
      </div>
      <div class="pc-group">
        <label class="pc-label" data-i18n="lbl_birthtime">태어난 시</label>
        <select class="pc-select" id="p-time" onchange="updateProfile()">
          <option value="모름" data-i18n="opt_unknown">모름</option>
          <option value="子시(23~01)" data-i18n="opt_t01">子시 23~01시</option>
          <option value="丑시(01~03)" data-i18n="opt_t02">丑시 01~03시</option>

<script>
/* ── 배경 파티클 ── */
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;
    stars=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.2+.3,a:Math.random(),da:.002+Math.random()*.003,
      vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12}));}
  resize();window.addEventListener('resize',resize);
  function draw(){
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.x+=s.vx;s.y+=s.vy;s.a+=s.da;
      if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
      const a=.3+.5*Math.abs(Math.sin(s.a));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(167,139,250,${a})`;ctx.fill();
    });
    for(let i=0;i<stars.length;i+=7){
      const j=(i+7)%stars.length;
      const dx=stars[j].x-stars[i].x,dy=stars[j].y-stars[i].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<140){ctx.beginPath();ctx.moveTo(stars[i].x,stars[i].y);ctx.lineTo(stars[j].x,stars[j].y);
        ctx.strokeStyle=`rgba(139,92,246,${(1-dist/140)*.1})`;ctx.lineWidth=.5;ctx.stroke();}
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

function LANG(){return window._LANG||'ko';}
function W(cat,key){const d=WORD_I18N[cat][LANG()]||WORD_I18N[cat].ko;return key!==undefined?d[key]:d;}

function getGanJi(year){
  const g=((year-4)%10+10)%10,j=((year-4)%12+12)%12;
  return{gan:GAN[g],ji:JI[j],animal:ANIMALS[j],animalIdx:j,emoji:ANIMAL_EMOJI[j]};
}
function getSaju(year,month,day){
  const yg=((year-4)%10+10)%10,yj=((year-4)%12+12)%12;
  const mj=(month+1)%12,mg=((year*12+month)%10+10)%10;
  const jd=Math.floor(year*365.25)+Math.floor(month*30.6)+day;
  const dg=(jd%10+10)%10,dj=(jd%12+12)%12;
  return[
    {label:'년주',labelIdx:0,gan:GAN[yg],ji:JI[yj],emoji:ANIMAL_EMOJI[yj]},
    {label:'월주',labelIdx:1,gan:GAN[mg],ji:JI[mj],emoji:'🌙'},
    {label:'일주',labelIdx:2,gan:GAN[dg],ji:JI[dj],emoji:'☀️'},
    {label:'시주',labelIdx:3,gan:GAN[(dg+2)%10],ji:JI[(dj+2)%12],emoji:'⭐'},
  ];
}
function getOhaeng(pillars){
  const map={甲:'목',乙:'목',丙:'화',丁:'화',戊:'토',己:'토',庚:'금',辛:'금',壬:'수',癸:'수',
    子:'수',丑:'토',寅:'목',卯:'목',辰:'토',巳:'화',午:'화',未:'토',申:'금',酉:'금',戌:'토',亥:'수'};
  const cnt={목:0,화:0,토:0,금:0,수:0};
  pillars.forEach(p=>{cnt[map[p.gan]]=(cnt[map[p.gan]]||0)+2;cnt[map[p.ji]]=(cnt[map[p.ji]]||0)+1;});
  return cnt;
}

function autoSetZodiac(m,d){
  const dates=[[21,4,19],[20,5,20],[21,6,20],[21,7,22],[23,8,22],[23,9,22],
    [23,10,22],[23,11,21],[22,12,21],[22,1,19],[20,2,18],[19,3,20]];
  const names=['양자리','황소자리','쌍둥이자리','게자리','사자자리','처녀자리',
    '천칭자리','전갈자리','사수자리','염소자리','물병자리','물고기자리'];
  for(let i=0;i<12;i++){
    const [sd,em,ed]=dates[i];

const LOADING_TXT={ko:'운명의 실을 읽는 중...',en:'Reading the threads of fate...',ja:'運命の糸を読み解いています...'};
const ERROR_TXT={ko:'⚠️ 운세를 불러오지 못했습니다.',en:'⚠️ Could not load your reading.',ja:'⚠️ 占い結果を読み込めませんでした。'};
const OUTPUT_LANG_DIRECTIVE={
  ko:'답변은 반드시 한국어로, 따뜻하고 시적인 문체로 작성하세요.',
  en:'Write your entire answer in natural, fluent English (including all section headers), in a warm, poetic tone.',
  ja:'回答は必ず自然で流暢な日本語で(見出しも含めて)、温かく詩的な文体で作成してください。'
};
async function callClaude(prompt,resultEl){
  resultEl.className='result-box show';
  const l=LANG();
  resultEl.innerHTML=`<div class="result-loading">
    <div style="font-size:30px;margin-bottom:8px">🔮</div>
    <div style="font-family:'Noto Serif KR',serif;font-size:13px;color:var(--violet2)">${LOADING_TXT[l]||LOADING_TXT.ko}</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:8000,
        stream:true,
        system:`당신은 한국의 전통 역학과 운세를 깊이 이해하는 전문 역술가입니다.
사주팔자, 음양오행, 궁합, 타로, 별자리, 꿈해몽, 이름풀이 등 동서양 운세를 종합하여
신비롭고 통찰력 있는 해석을 제공합니다.
${OUTPUT_LANG_DIRECTIVE[l]||OUTPUT_LANG_DIRECTIVE.ko}
섹션 제목은 【 】로 표시하고, 중요한 키워드는 ★로 강조하세요.
부정적인 내용은 희망적인 방향으로 전환하되 솔직하게 표현하세요.`,
        messages:[{role:'user',content:prompt}]
      })
    });

    /* 스트리밍 처리 — 텍스트가 실시간으로 표시됨 */
    const reader=res.body.getReader();
    const decoder=new TextDecoder();
    let fullText='';
    /* 고유 id로 충돌 방지 */
    const uid='sc-'+Date.now();
    resultEl.innerHTML='<div class="result-content" id="'+uid+'"></div>';
    const streamEl=document.getElementById(uid);

    while(true){
      const{done,value}=await reader.read();
      if(done)break;
      const chunk=decoder.decode(value,{stream:true});
      const lines=chunk.split('\n');
      for(const line of lines){
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]')break;
        try{
          const parsed=JSON.parse(data);
          if(parsed.type==='content_block_delta'&&parsed.delta?.type==='text_delta'){
            fullText+=parsed.delta.text;
            streamEl.innerHTML=renderHTML(fullText)+'<span class="cursor-blink">|</span>';
            resultEl.scrollTop=resultEl.scrollHeight;
          }
        }catch(e){}
      }
    }
    /* 커서 제거 후 최종 렌더링 */
    streamEl.innerHTML=renderHTML(fullText);
    setTimeout(()=>resultEl.scrollIntoView({behavior:'smooth',block:'nearest'}),120);

  }catch(e){
    resultEl.innerHTML=`<div class="result-content">${ERROR_TXT[LANG()]||ERROR_TXT.ko}<br><small style="color:var(--text3)">${e.message}</small></div>`;
  }
}

/* 텍스트 → HTML 변환 */
function renderHTML(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\u3010([^\u3011]+)\u3011/g,'<h3>$1</h3>')
    .replace(/(\u2605+)/g,'<span style="color:var(--gold);letter-spacing:2px">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\n\n+/g,'</p><p>')
    .replace(/\n/g,'<br>');
}
function renderResult(text,el){
  el.innerHTML='<div class="result-content"><p>'+renderHTML(text)+'</p></div>';
}

  {name:'양자리',icon:'♈',date:'3/21~4/19'},{name:'황소자리',icon:'♉',date:'4/20~5/20'},
  {name:'쌍둥이자리',icon:'♊',date:'5/21~6/20'},{name:'게자리',icon:'♋',date:'6/21~7/22'},
  {name:'사자자리',icon:'♌',date:'7/23~8/22'},{name:'처녀자리',icon:'♍',date:'8/23~9/22'},
  {name:'천칭자리',icon:'♎',date:'9/23~10/22'},{name:'전갈자리',icon:'♏',date:'10/23~11/21'},
  {name:'사수자리',icon:'♐',date:'11/22~12/21'},{name:'염소자리',icon:'♑',date:'12/22~1/19'},
  {name:'물병자리',icon:'♒',date:'1/20~2/18'},{name:'물고기자리',icon:'♓',date:'2/19~3/20'},
];
let selZodiac=null;

function renderZodiacGrid(){
  const sel=document.querySelectorAll('.zodiac-item.sel')[0];
  const selIdx=sel?[...document.querySelectorAll('.zodiac-item')].indexOf(sel):-1;
  document.getElementById('zodiac-grid').innerHTML=ZODIACS.map((z,i)=>{
    const nm=W('zodiac',i);
    const short=LANG()==='ko'?nm.replace('자리',''):nm;
    return `
    <div class="zodiac-item${i===selIdx?' sel':''}" onclick="selectZodiac(${i})" id="zi-${i}">
      <span class="z-icon">${z.icon}</span>
      <div class="z-name">${short}</div>
    </div>`;}).join('');
}
renderZodiacGrid();

function selectZodiac(i){
  selZodiac=ZODIACS[i];
  document.querySelectorAll('.zodiac-item').forEach((el,j)=>el.classList.toggle('sel',j===i));
}
function autoSelectZodiac(name){
  const i=ZODIACS.findIndex(z=>z.name===name);
  if(i>=0){selZodiac=ZODIACS[i];document.querySelectorAll('.zodiac-item').forEach((el,j)=>el.classList.toggle('sel',j===i));}
}

function doZodiac(){
  const el=document.getElementById('zd-result');
  // 신상의 별자리 자동 사용
  if(!selZodiac&&profile.zodiac) autoSelectZodiac(profile.zodiac);
  if(!selZodiac){el.className='result-box show';el.innerHTML=`<div class="result-content" style="color:var(--gold)">${WARN_TXT.needZodiac[LANG()]||WARN_TXT.needZodiac.ko}</div>`;return;}
  const period=document.getElementById('zd-period').value;
  callClaude(`${selZodiac.name}(${selZodiac.date})의 ${period} 운세를 알려주세요.
오늘: ${YEAR}년 ${NOW.getMonth()+1}월 ${NOW.getDate()}일
${profile.name?'의뢰인: '+profile.name+' / '+profile.ddi:''}

다음 항목으로 운세를 분석해주세요:
【총운】 ★ 별점(1~5개)과 총평
【애정운】 사랑과 인간관계
【재물·사업운】 금전과 커리어
【건강·에너지】 몸과 마음
【행운 아이템】 색상·숫자
【핵심 메시지】 이 시기의 조언

시적이고 감성적으로 300자 이상 작성해주세요.`,el);
}

function applyI18n(){
  const t=I18N[LANG()]||I18N.ko;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    if(typeof t[el.dataset.i18n]==='string') el.textContent=t[el.dataset.i18n];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    if(typeof t[el.dataset.i18nHtml]==='string') el.innerHTML=t[el.dataset.i18nHtml];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    if(typeof t[el.dataset.i18nPlaceholder]==='string') el.placeholder=t[el.dataset.i18nPlaceholder];
  });
  document.getElementById('page-title').textContent=t.page_title;
  document.title=t.page_title;
  document.querySelectorAll('#lang-switch .langbtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG()));
  // 동적 렌더링 요소 재적용
  renderDateBar();
  renderZodiacGrid();
  renderDreamTags();
  if(profile.date) updateProfile();
}
(function(){
  const params=new URLSearchParams(location.search);
  const urlLang=params.get('lang');
  const browserLang=(navigator.language||'ko').slice(0,2);
  const LANGV=(urlLang && I18N[urlLang])?urlLang:(I18N[browserLang]?browserLang:'ko');
  window._LANG=LANGV;
  document.getElementById('html-root').lang=LANGV;
})();
applyI18n();
document.querySelectorAll('#lang-switch .langbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const lang=btn.dataset.lang;
    const url=new URL(location.href); url.searchParams.set('lang',lang); history.replaceState(null,'',url);
    window._LANG=lang;
    document.getElementById('html-root').lang=lang;
    applyI18n();
  });
});
