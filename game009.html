<!-- Playable Snake Game with AI Auto-Pilot -->
<div id="snake-game-container" style="max-width: 500px; margin: 40px auto; background: #2d3436; border-radius: 12px; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 3px solid #00b894; touch-action: none; user-select: none;">
    
    <!-- Game HUD -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; color: #fff;">
        <div>
            <h3 style="color: #00b894; margin: 0; font-size: 1.3rem; font-weight: 800; text-transform: uppercase;">Snake JS</h3>
            <div style="font-size: 0.85rem; color: #b2bec3; margin-top: 5px; font-weight: bold;">MODE: <span id="snk-mode" style="color: #fdcb6e;">HUMAN</span></div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 1.2rem; color: #fff; font-weight: bold;">SCORE: <span id="snk-score" style="color: #00b894;">0</span></div>
            <div style="font-size: 0.8rem; color: #ff7675; margin-top: 2px;">HIGH SCORE: <span id="snk-high">0</span></div>
        </div>
    </div>

    <!-- Game Controls (Start, Pause, Reset, AI Toggle) -->
    <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;">
        <button id="btn-snk-start" class="snk-ctrl-btn" style="background: #00b894; color: #fff;">▶ START</button>
        <button id="btn-snk-pause" class="snk-ctrl-btn" style="background: #b2bec3; color: #2d3436;">⏸ PAUSE</button>
        <button id="btn-snk-ai" class="snk-ctrl-btn" style="background: #fdcb6e; color: #2d3436;">🤖 AI AUTO</button>
    </div>

    <!-- Canvas Container -->
    <div style="position: relative; width: 100%; aspect-ratio: 1; background: #1e272e; border-radius: 8px; border: 2px solid #636e72; overflow: hidden; margin-bottom: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);">
        <canvas id="snk-canvas" width="400" height="400" style="display: block; width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Mobile D-Pad -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <button class="snk-dir-btn" id="btn-snk-up">▲</button>
        <div style="display: flex; gap: 45px;">
            <button class="snk-dir-btn" id="btn-snk-left">◀</button>
            <button class="snk-dir-btn" id="btn-snk-right">▶</button>
        </div>
        <button class="snk-dir-btn" id="btn-snk-down">▼</button>
    </div>

    <style>
        #snake-game-container .snk-ctrl-btn { border: none; padding: 10px 14px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 0.8rem; box-shadow: 0 4px 0 rgba(0,0,0,0.3); flex: 1; min-width: 80px; }
        #snake-game-container .snk-ctrl-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #snake-game-container .snk-dir-btn { background: #636e72; color: #fff; border: none; width: 55px; height: 55px; border-radius: 12px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 0 #2d3436; touch-action: manipulation; }
        #snake-game-container .snk-dir-btn:active { background: #b2bec3; transform: translateY(5px); box-shadow: none; color: #2d3436; }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('snk-canvas');
            const ctx = canvas.getContext('2d');
            
            const scoreEl = document.getElementById('snk-score');
            const highEl = document.getElementById('snk-high');
            const modeEl = document.getElementById('snk-mode');

            // Game Constants
            const TILE = 20;
            const ROWS = canvas.height / TILE;
            const COLS = canvas.width / TILE;
            
            let gameInterval = null;
            let isPlaying = false;
            let isAI = false;
            let speed = 120; // ms per frame
            
            let snake = [];
            let food = {};
            let dx = 1;
            let dy = 0;
            let score = 0;
            let highScore = 0;
            let particles = [];
            let nextDx = 1;
            let nextDy = 0;

            // Initialize Game State
            function initGame() {
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                dx = 1; dy = 0;
                nextDx = 1; nextDy = 0;
                score = 0;
                speed = 120;
                scoreEl.innerText = score;
                particles = [];
                placeFood();
            }

            function placeFood() {
                let valid = false;
                while (!valid) {
                    food = {
                        x: Math.floor(Math.random() * COLS),
                        y: Math.floor(Math.random() * ROWS)
                    };
                    valid = true;
                    for (let segment of snake) {
                        if (segment.x === food.x && segment.y === food.y) {
                            valid = false;
                            break;
                        }
                    }
                }
            }

            // Simple Pathfinding AI (Greedy Algorithm)
            function getAIMove() {
                let head = snake[0];
                let bestDist = Infinity;
                let bestMove = {dx: dx, dy: dy};
                
                let possibleMoves = [
                    {dx: 1, dy: 0}, {dx: -1, dy: 0},
                    {dx: 0, dy: 1}, {dx: 0, dy: -1}
                ];

                // Prevent reversing
                let validMoves = possibleMoves.filter(m => !(m.dx === -dx && m.dy === -dy));

                for (let m of validMoves) {
                    let nx = head.x + m.dx;
                    let ny = head.y + m.dy;

                    // Wall check
                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;

                    // Body collision check
                    let collision = false;
                    // We don't check the very last tail segment because it will move forward
                    for (let i = 0; i < snake.length - 1; i++) {
                        if (nx === snake[i].x && ny === snake[i].y) {
                            collision = true;
                            break;
                        }
                    }
                    if (collision) continue;

                    // Manhattan Distance to food
                    let dist = Math.abs(food.x - nx) + Math.abs(food.y - ny);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestMove = m;
                    }
                }
                return bestMove;
            }

            // Particle System for "Juice"
            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.vx = (Math.random() - 0.5) * 6;
                    this.vy = (Math.random() - 0.5) * 6;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.05 + 0.02;
                    this.color = Math.random() > 0.5 ? '#ff7675' : '#fab1a0';
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                }
                draw() {
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, 3, 3);
                    ctx.globalAlpha = 1.0;
                }
            }

            // Main Logic Update
            function update() {
                if (isAI) {
                    let move = getAIMove();
                    dx = move.dx;
                    dy = move.dy;
                } else {
                    dx = nextDx;
                    dy = nextDy;
                }

                let head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // Game Over Checks (Walls)
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    return gameOver();
                }

                // Game Over Checks (Body)
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        return gameOver();
                    }
                }

                snake.unshift(head); // Add new head

                // Eat Food
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreEl.innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        highEl.innerText = highScore;
                    }
                    
                    // Spawn Particles
                    for(let i=0; i<15; i++) {
                        particles.push(new Particle(food.x * TILE + TILE/2, food.y * TILE + TILE/2));
                    }
                    
                    placeFood();
                    
                    // Increase speed slightly
                    if(speed > 50) {
                        speed -= 2;
                        clearInterval(gameInterval);
                        gameInterval = setInterval(gameLoop, speed);
                    }
                } else {
                    snake.pop(); // Remove tail if no food eaten
                }
            }

            // Render Graphics
            function draw() {
                // Background grid
                ctx.fillStyle = '#1e272e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = '#2d3436';
                ctx.lineWidth = 0.5;
                for(let i=0; i<=COLS; i++) {
                    ctx.beginPath(); ctx.moveTo(i*TILE, 0); ctx.lineTo(i*TILE, canvas.height); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i*TILE); ctx.lineTo(canvas.width, i*TILE); ctx.stroke();
                }

                // Draw Food (Pulsing Apple)
                let pulse = Math.abs(Math.sin(Date.now() / 200)) * 2;
                ctx.fillStyle = '#ff7675';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff7675';
                ctx.beginPath();
                ctx.arc(food.x * TILE + TILE/2, food.y * TILE + TILE/2, (TILE/2 - 2) + pulse, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Draw Snake
                for (let i = 0; i < snake.length; i++) {
                    let segment = snake[i];
                    ctx.fillStyle = i === 0 ? '#55efc4' : '#00b894'; // Head is lighter
                    
                    // Rounded rect for snake
                    ctx.beginPath();
                    ctx.roundRect(segment.x * TILE + 1, segment.y * TILE + 1, TILE - 2, TILE - 2, 4);
                    ctx.fill();

                    // Eyes for head
                    if (i === 0) {
                        ctx.fillStyle = '#2d3436';
                        let eyeSize = 3;
                        let ex1 = segment.x * TILE + 5; let ey1 = segment.y * TILE + 5;
                        let ex2 = segment.x * TILE + 12; let ey2 = segment.y * TILE + 5;
                        
                        if(dx === 1) { ex1 = segment.x * TILE + 12; ex2 = ex1; ey2 = ey1 + 7; } // Right
                        if(dx === -1) { ex1 = segment.x * TILE + 5; ex2 = ex1; ey2 = ey1 + 7; } // Left
                        if(dy === 1) { ey1 = segment.y * TILE + 12; ey2 = ey1; } // Down
                        
                        ctx.fillRect(ex1, ey1, eyeSize, eyeSize);
                        ctx.fillRect(ex2, ey2, eyeSize, eyeSize);
                    }
                }

                // Update & Draw Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            function gameLoop() {
                update();
                draw();
            }

            function gameOver() {
                isPlaying = false;
                clearInterval(gameInterval);
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff7675';
                ctx.font = 'bold 30px "Segoe UI"';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                ctx.fillStyle = '#fff';
                ctx.font = '16px "Segoe UI"';
                ctx.fillText(`SCORE: ${score}`, canvas.width/2, canvas.height/2 + 30);
            }

            // --- Controls ---
            document.getElementById('btn-snk-start').addEventListener('click', () => {
                if (!isPlaying) {
                    if (snake.length === 0 || score > 0 || isPlaying === false) initGame(); // Need reset
                    isPlaying = true;
                    gameInterval = setInterval(gameLoop, speed);
                }
            });

            document.getElementById('btn-snk-pause').addEventListener('click', () => {
                isPlaying = false;
                clearInterval(gameInterval);
            });

            document.getElementById('btn-snk-ai').addEventListener('click', () => {
                isAI = !isAI;
                modeEl.innerText = isAI ? "AI AUTO-PILOT" : "HUMAN";
                modeEl.style.color = isAI ? "#00b894" : "#fdcb6e";
                
                if(!isPlaying) {
                    initGame();
                    isPlaying = true;
                    gameInterval = setInterval(gameLoop, speed);
                }
            });

            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
                    e.preventDefault();
                }
                if(isAI) return; // Prevent manual override during AI mode
                
                if (e.code === 'ArrowLeft' && dx !== 1) { nextDx = -1; nextDy = 0; }
                if (e.code === 'ArrowRight' && dx !== -1) { nextDx = 1; nextDy = 0; }
                if (e.code === 'ArrowUp' && dy !== 1) { nextDx = 0; nextDy = -1; }
                if (e.code === 'ArrowDown' && dy !== -1) { nextDx = 0; nextDy = 1; }
            }, { passive: false });

            // Mobile D-Pad
            const handleDir = (newDx, newDy) => {
                if(isAI) return;
                if(newDx === -dx && newDy === -dy) return; // Prevent 180 turn
                nextDx = newDx; nextDy = newDy;
            };

            const addTouch = (id, ndx, ndy) => {
                const btn = document.getElementById(id);
                const action = (e) => { e.preventDefault(); handleDir(ndx, ndy); };
                btn.addEventListener('touchstart', action, {passive: false});
                btn.addEventListener('mousedown', action);
            };

            addTouch('btn-snk-left', -1, 0);
            addTouch('btn-snk-right', 1, 0);
            addTouch('btn-snk-up', 0, -1);
            addTouch('btn-snk-down', 0, 1);

            // Initial Draw
            initGame();
            draw();
        })();
    </script>
</div>
<!-- End of Playable Snake Game with AI Auto-Pilot -->
