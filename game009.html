<!-- Playable Cute Snake Game (20 Levels & 3 Lives) -->
<div id="snake-game-container" style="max-width: 500px; margin: 40px auto; background: #2d3436; border-radius: 12px; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 3px solid #00b894; touch-action: none; user-select: none;">
    
    <!-- Game HUD -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; color: #fff;">
        <div>
            <h3 style="color: #00b894; margin: 0; font-size: 1.2rem; font-weight: 800; text-transform: uppercase;">Cute Snake JS</h3>
            <div style="font-size: 0.85rem; color: #b2bec3; margin-top: 5px; font-weight: bold;">
                LEVEL: <span id="snk-level" style="color: #fdcb6e;">1</span>/20
            </div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 1.1rem; color: #fff; font-weight: bold;">SCORE: <span id="snk-score" style="color: #00b894;">0</span></div>
            <div style="font-size: 0.8rem; color: #ff7675; margin-top: 2px;">LIVES: <span id="snk-lives">❤️❤️❤️</span></div>
        </div>
    </div>

    <!-- Game Controls -->
    <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;">
        <button id="btn-snk-start" class="snk-ctrl-btn" style="background: #00b894; color: #fff;">▶ START</button>
        <button id="btn-snk-pause" class="snk-ctrl-btn" style="background: #b2bec3; color: #2d3436;">⏸ PAUSE</button>
        <button id="btn-snk-ai" class="snk-ctrl-btn" style="background: #fdcb6e; color: #2d3436;">🤖 AI AUTO</button>
    </div>

    <!-- Canvas Container -->
    <div style="position: relative; width: 100%; aspect-ratio: 1; background: #c8d6e5; border-radius: 12px; border: 4px solid #8395a7; overflow: hidden; margin-bottom: 15px; box-shadow: inset 0 0 20px rgba(0,0,0,0.2);">
        <canvas id="snk-canvas" width="400" height="400" style="display: block; width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Mobile D-Pad -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
        <button class="snk-dir-btn" id="btn-snk-up">▲</button>
        <div style="display: flex; gap: 45px;">
            <button class="snk-dir-btn" id="btn-snk-left">◀</button>
            <button class="snk-dir-btn" id="btn-snk-right">▶</button>
        </div>
        <button class="snk-dir-btn" id="btn-snk-down">▼</button>
    </div>

    <style>
        #snake-game-container .snk-ctrl-btn { border: none; padding: 10px 14px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.2s; font-family: inherit; font-size: 0.8rem; box-shadow: 0 4px 0 rgba(0,0,0,0.3); flex: 1; min-width: 80px; }
        #snake-game-container .snk-ctrl-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #snake-game-container .snk-dir-btn { background: #636e72; color: #fff; border: none; width: 55px; height: 55px; border-radius: 50%; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 0 #2d3436; touch-action: manipulation; font-weight: bold; }
        #snake-game-container .snk-dir-btn:active { background: #00b894; transform: translateY(5px); box-shadow: none; color: #fff; }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('snk-canvas');
            const ctx = canvas.getContext('2d');
            
            const scoreEl = document.getElementById('snk-score');
            const livesEl = document.getElementById('snk-lives');
            const levelEl = document.getElementById('snk-level');
            const aiBtn = document.getElementById('btn-snk-ai');

            // Game Constants
            const TILE = 20;
            const ROWS = canvas.height / TILE;
            const COLS = canvas.width / TILE;
            const MAX_LEVEL = 20;
            const APPLES_PER_LEVEL = 5;
            
            let gameInterval = null;
            let isPlaying = false;
            let isAI = false;
            let speed = 250; // 초기 속도를 느리게 설정 (250ms)
            
            let snake = [];
            let food = {};
            let dx = 1, dy = 0;
            let nextDx = 1, nextDy = 0;
            
            let level = 1;
            let score = 0;
            let lives = 3;
            let applesEaten = 0; // 레벨업 카운터
            
            let particles = [];
            let tickCount = 0;

            function initGame(fullReset = true) {
                if (fullReset) {
                    level = 1;
                    score = 0;
                    lives = 3;
                    applesEaten = 0;
                }
                resetBoard();
                updateUI();
            }

            function resetBoard() {
                // 부활 시 뱀 길이는 초기화하되, 점수와 레벨은 유지
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                dx = 1; dy = 0;
                nextDx = 1; nextDy = 0;
                // 레벨에 따른 속도 계산 (1레벨 250ms -> 20레벨 79ms)
                speed = 250 - ((level - 1) * 9); 
                particles = [];
                placeFood();
            }

            function updateUI() {
                scoreEl.innerText = score;
                levelEl.innerText = level;
                livesEl.innerText = lives > 0 ? '❤️'.repeat(lives) : '💀';
            }

            function placeFood() {
                let valid = false;
                while (!valid) {
                    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
                    valid = true;
                    for (let segment of snake) {
                        if (segment.x === food.x && segment.y === food.y) { valid = false; break; }
                    }
                }
            }

            // AI Pathfinding (Greedy)
            function getAIMove() {
                let head = snake[0];
                let bestDist = Infinity;
                let bestMove = {dx: dx, dy: dy};
                
                let possibleMoves = [
                    {dx: 1, dy: 0}, {dx: -1, dy: 0}, {dx: 0, dy: 1}, {dx: 0, dy: -1}
                ];
                let validMoves = possibleMoves.filter(m => !(m.dx === -dx && m.dy === -dy));

                for (let m of validMoves) {
                    let nx = head.x + m.dx, ny = head.y + m.dy;
                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;

                    let collision = false;
                    for (let i = 0; i < snake.length - 1; i++) {
                        if (nx === snake[i].x && ny === snake[i].y) { collision = true; break; }
                    }
                    if (collision) continue;

                    let dist = Math.abs(food.x - nx) + Math.abs(food.y - ny);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestMove = m;
                    }
                }
                return bestMove;
            }

            class Particle {
                constructor(x, y) {
                    this.x = x; this.y = y;
                    this.vx = (Math.random() - 0.5) * 6;
                    this.vy = (Math.random() - 0.5) * 6;
                    this.life = 1.0;
                    this.decay = Math.random() * 0.05 + 0.02;
                    this.color = Math.random() > 0.5 ? '#ff4757' : '#ff7f50';
                }
                update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
                draw() {
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.fillStyle = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI*2); ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            function handleDeath() {
                isPlaying = false;
                clearInterval(gameInterval);
                lives--;
                updateUI();
                
                // Screen Shake / Flash Effect
                ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (lives > 0) {
                    setTimeout(() => {
                        alert(`앗! 부딪혔습니다.\n남은 목숨: ${lives}개\n[확인]을 누르면 레벨 ${level}에서 이어서 시작합니다.`);
                        resetBoard();
                        isPlaying = true;
                        gameInterval = setInterval(gameLoop, speed);
                    }, 100);
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ff7675';
                    ctx.font = 'bold 30px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px "Segoe UI"';
                    ctx.fillText(`최종 점수: ${score} (레벨 ${level})`, canvas.width/2, canvas.height/2 + 30);
                }
            }

            function levelUp() {
                isPlaying = false;
                clearInterval(gameInterval);
                
                if (level >= MAX_LEVEL) {
                    setTimeout(() => {
                        alert(`🏆 축하합니다! 20레벨을 모두 클리어했습니다!\n최종 점수: ${score}`);
                        initGame(true);
                    }, 100);
                    return;
                }
                
                level++;
                applesEaten = 0;
                speed = 250 - ((level - 1) * 9); // 레벨업 시 속도 증가
                updateUI();

                setTimeout(() => {
                    alert(`🚀 레벨 ${level} 달성!\n뱀의 이동 속도가 조금 빨라집니다.`);
                    isPlaying = true;
                    gameInterval = setInterval(gameLoop, speed);
                }, 100);
            }

            function update() {
                if (isAI) {
                    let move = getAIMove();
                    dx = move.dx; dy = move.dy;
                } else {
                    dx = nextDx; dy = nextDy;
                }

                let head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // Collision Check
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return handleDeath();
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) return handleDeath();
                }

                snake.unshift(head); 

                // Eat Food
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    applesEaten++;
                    updateUI();
                    
                    for(let i=0; i<15; i++) particles.push(new Particle(food.x * TILE + TILE/2, food.y * TILE + TILE/2));
                    placeFood();
                    
                    // 레벨 업 체크
                    if (applesEaten >= APPLES_PER_LEVEL) {
                        levelUp();
                    }
                } else {
                    snake.pop(); 
                }
            }

            function draw() {
                tickCount++;

                // Background & Checkerboard
                ctx.fillStyle = '#c8d6e5';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#b2bec3';
                ctx.globalAlpha = 0.2;
                for(let r=0; r<ROWS; r++){
                    for(let c=0; c<COLS; c++){
                        if((r+c)%2===0) ctx.fillRect(c*TILE, r*TILE, TILE, TILE);
                    }
                }
                ctx.globalAlpha = 1.0;

                // Draw Food (Cute Apple)
                let fx = food.x * TILE + TILE/2;
                let fy = food.y * TILE + TILE/2;
                let pulse = Math.sin(tickCount * 0.2) * 1.5;
                
                ctx.fillStyle = '#ff4757';
                ctx.beginPath(); ctx.arc(fx, fy + 2, TILE/2 - 3 + pulse, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#2ed573';
                ctx.beginPath(); ctx.ellipse(fx + 3, fy - 5 + pulse, 5, 2.5, -Math.PI/4, 0, Math.PI*2); ctx.fill();

                // Draw Snake Body
                for (let i = snake.length - 1; i >= 0; i--) {
                    let seg = snake[i];
                    let cx = seg.x * TILE + TILE/2;
                    let cy = seg.y * TILE + TILE/2;

                    if (i !== 0) {
                        ctx.fillStyle = (i % 2 === 0) ? '#1dd1a1' : '#10ac84'; 
                        ctx.beginPath(); ctx.arc(cx, cy, TILE/2 - 1, 0, Math.PI*2); ctx.fill();
                    } else {
                        // Tongue
                        if (Math.sin(tickCount * 0.5) > 0) {
                            ctx.strokeStyle = '#ff6b81';
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            ctx.moveTo(cx, cy);
                            ctx.lineTo(cx + dx * (TILE/2 + 6), cy + dy * (TILE/2 + 6));
                            ctx.stroke();
                        }

                        // Head
                        ctx.fillStyle = '#01a3a4';
                        ctx.beginPath(); ctx.arc(cx, cy, TILE/2 + 1, 0, Math.PI*2); ctx.fill();

                        // Eyes & Blush
                        let e1x = cx, e1y = cy, e2x = cx, e2y = cy;
                        if (dx === 1) { e1x=cx+3; e1y=cy-4; e2x=cx+3; e2y=cy+4; }
                        else if (dx === -1) { e1x=cx-3; e1y=cy-4; e2x=cx-3; e2y=cy+4; }
                        else if (dy === 1) { e1x=cx-4; e1y=cy+3; e2x=cx+4; e2y=cy+3; }
                        else if (dy === -1) { e1x=cx-4; e1y=cy-3; e2x=cx+4; e2y=cy-3; }

                        const drawEye = (x, y) => {
                            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
                            ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x + dx, y + dy, 2, 0, Math.PI*2); ctx.fill();
                            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + dx - 0.5, y + dy - 0.5, 0.8, 0, Math.PI*2); ctx.fill();
                        };
                        drawEye(e1x, e1y); drawEye(e2x, e2y);

                        ctx.fillStyle = 'rgba(255, 107, 129, 0.6)';
                        if(dx !== 0) {
                            ctx.beginPath(); ctx.ellipse(cx, cy-6, 2, 3, 0, 0, Math.PI*2); ctx.fill();
                            ctx.beginPath(); ctx.ellipse(cx, cy+6, 2, 3, 0, 0, Math.PI*2); ctx.fill();
                        } else {
                            ctx.beginPath(); ctx.ellipse(cx-6, cy, 3, 2, 0, 0, Math.PI*2); ctx.fill();
                            ctx.beginPath(); ctx.ellipse(cx+6, cy, 3, 2, 0, 0, Math.PI*2); ctx.fill();
                        }
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].life <= 0) particles.splice(i, 1);
                }
            }

            function gameLoop() {
                update();
                draw();
            }

            // --- Controls ---
            document.getElementById('btn-snk-start').addEventListener('click', () => {
                if (!isPlaying) {
                    if (lives <= 0) initGame(true);
                    else if (snake.length === 0) initGame(false);
                    isPlaying = true;
                    gameInterval = setInterval(gameLoop, speed);
                }
            });

            document.getElementById('btn-snk-pause').addEventListener('click', () => {
                isPlaying = false;
                clearInterval(gameInterval);
            });

            document.getElementById('btn-snk-ai').addEventListener('click', () => {
                isAI = !isAI;
                aiBtn.innerText = isAI ? "👤 MANUAL" : "🤖 AI AUTO";
                aiBtn.style.background = isAI ? "#00b894" : "#fdcb6e";
                aiBtn.style.color = isAI ? "#fff" : "#2d3436";
                
                if(!isPlaying && lives > 0) {
                    isPlaying = true;
                    gameInterval = setInterval(gameLoop, speed);
                }
            });

            window.addEventListener('keydown', (e) => {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
                if(isAI || !isPlaying) return; 
                
                if (e.code === 'ArrowLeft' && dx !== 1) { nextDx = -1; nextDy = 0; }
                if (e.code === 'ArrowRight' && dx !== -1) { nextDx = 1; nextDy = 0; }
                if (e.code === 'ArrowUp' && dy !== 1) { nextDx = 0; nextDy = -1; }
                if (e.code === 'ArrowDown' && dy !== -1) { nextDx = 0; nextDy = 1; }
            }, { passive: false });

            const handleDir = (newDx, newDy) => {
                if(isAI || !isPlaying) return;
                if(newDx === -dx && newDy === -dy) return; 
                nextDx = newDx; nextDy = newDy;
            };

            const addTouch = (id, ndx, ndy) => {
                const btn = document.getElementById(id);
                const action = (e) => { e.preventDefault(); handleDir(ndx, ndy); };
                btn.addEventListener('touchstart', action, {passive: false});
                btn.addEventListener('mousedown', action);
            };

            addTouch('btn-snk-left', -1, 0);
            addTouch('btn-snk-right', 1, 0);
            addTouch('btn-snk-up', 0, -1);
            addTouch('btn-snk-down', 0, 1);

            initGame(true);
            draw();
        })();
    </script>
</div>
<!-- End of Playable Cute Snake Game -->
