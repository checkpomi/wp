<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic 2048 Online - Play the Ultimate Tile-Merging Puzzle</title>
    <meta name="description" content="Play the classic 2048 game online. Merge tiles, reach the 2048 score, and challenge your brain with this addictive logic puzzle. Free to play in your browser.">
    <link rel="canonical" href="Your-URL-Here/2048.html">
    
    <!-- SEO & Social Media -->
    <meta property="og:title" content="Classic 2048 Online - Strategy Puzzle Game">
    <meta property="og:description" content="Can you reach the 2048 tile? Test your logic in this smooth, responsive web version.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #faf8ef;
            --grid-bg: #bbada0;
            --tile-empty: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: none; /* Prevents scrolling while playing on mobile */
        }

        .game-container {
            width: 400px;
            max-width: 95vw;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { font-size: 60px; margin: 0; font-weight: bold; }

        .score-container {
            background: var(--grid-bg);
            padding: 10px 20px;
            border-radius: 6px;
            color: white;
            text-align: center;
        }

        .score-label { display: block; font-size: 13px; text-transform: uppercase; }
        .score-value { font-size: 25px; font-weight: bold; }

        .grid-container {
            position: relative;
            background: var(--grid-bg);
            padding: 15px;
            border-radius: 6px;
            width: 400px;
            height: 400px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
        }

        .cell {
            background: var(--tile-empty);
            border-radius: 3px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            transition: transform 0.1s ease-in-out;
        }

        /* Tile Colors */
        .cell[data-value="2"] { background: #eee4da; color: var(--text-dark); }
        .cell[data-value="4"] { background: #ede0c8; color: var(--text-dark); }
        .cell[data-value="8"] { background: #f2b179; color: var(--text-light); }
        .cell[data-value="16"] { background: #f59563; color: var(--text-light); }
        .cell[data-value="32"] { background: #f67c5f; color: var(--text-light); }
        .cell[data-value="64"] { background: #f65e3b; color: var(--text-light); }
        .cell[data-value="128"] { background: #edcf72; color: var(--text-light); font-size: 30px; }
        .cell[data-value="256"] { background: #edcc61; color: var(--text-light); font-size: 30px; }
        .cell[data-value="512"] { background: #edc850; color: var(--text-light); font-size: 30px; }
        .cell[data-value="1024"] { background: #edc53f; color: var(--text-light); font-size: 25px; }
        .cell[data-value="2048"] { background: #edc22e; color: var(--text-light); font-size: 25px; }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        .btn-restart {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .instructions {
            margin-top: 30px;
            line-height: 1.5;
            font-size: 0.9rem;
            color: #776e65;
        }

        @media (max-width: 420px) {
            .grid-container { width: 320px; height: 320px; padding: 10px; gap: 10px; }
            h1 { font-size: 40px; }
            .cell { font-size: 25px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <header class="header">
            <h1>2048</h1>
            <div class="score-container">
                <span class="score-label">Score</span>
                <div id="score" class="score-value">0</div>
            </div>
        </header>

        <main>
            <div id="grid" class="grid-container">
                <!-- Cells will be generated by JS -->
            </div>
        </main>

        <div class="controls">
            <button class="btn-restart" onclick="resetGame()">New Game</button>
        </div>

        <section class="instructions">
            <p><strong>HOW TO PLAY:</strong> Use your <strong>arrow keys</strong> or <strong>swipe</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong></p>
        </section>
    </div>

    <script>
        const gridDisplay = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        let width = 4;
        let squares = [];
        let score = 0;

        // Create the playing board
        function createBoard() {
            gridDisplay.innerHTML = '';
            for (let i = 0; i < width * width; i++) {
                let square = document.createElement('div');
                square.classList.add('cell');
                square.innerHTML = '';
                gridDisplay.appendChild(square);
                squares.push(square);
            }
            generate();
            generate();
        }

        // Generate a new number (2 or 4)
        function generate() {
            let randomNumber = Math.floor(Math.random() * squares.length);
            if (squares[randomNumber].innerHTML === "") {
                squares[randomNumber].innerHTML = Math.random() > 0.1 ? 2 : 4;
                squares[randomNumber].setAttribute('data-value', squares[randomNumber].innerHTML);
                checkForGameOver();
            } else generate();
        }

        function moveRight() {
            for (let i = 0; i < 16; i++) {
                if (i % 4 === 0) {
                    let totalOne = squares[i].innerHTML;
                    let totalTwo = squares[i+1].innerHTML;
                    let totalThree = squares[i+2].innerHTML;
                    let totalFour = squares[i+3].innerHTML;
                    let row = [parseInt(totalOne) || 0, parseInt(totalTwo) || 0, parseInt(totalThree) || 0, parseInt(totalFour) || 0];

                    let filteredRow = row.filter(num => num);
                    let missing = 4 - filteredRow.length;
                    let zeros = Array(missing).fill(0);
                    let newRow = zeros.concat(filteredRow);

                    squares[i].innerHTML = newRow[0] || "";
                    squares[i+1].innerHTML = newRow[1] || "";
                    squares[i+2].innerHTML = newRow[2] || "";
                    squares[i+3].innerHTML = newRow[3] || "";
                }
            }
        }

        function moveLeft() {
            for (let i = 0; i < 16; i++) {
                if (i % 4 === 0) {
                    let totalOne = squares[i].innerHTML;
                    let totalTwo = squares[i+1].innerHTML;
                    let totalThree = squares[i+2].innerHTML;
                    let totalFour = squares[i+3].innerHTML;
                    let row = [parseInt(totalOne) || 0, parseInt(totalTwo) || 0, parseInt(totalThree) || 0, parseInt(totalFour) || 0];

                    let filteredRow = row.filter(num => num);
                    let missing = 4 - filteredRow.length;
                    let zeros = Array(missing).fill(0);
                    let newRow = filteredRow.concat(zeros);

                    squares[i].innerHTML = newRow[0] || "";
                    squares[i+1].innerHTML = newRow[1] || "";
                    squares[i+2].innerHTML = newRow[2] || "";
                    squares[i+3].innerHTML = newRow[3] || "";
                }
            }
        }

        function moveUp() {
            for (let i = 0; i < 4; i++) {
                let totalOne = squares[i].innerHTML;
                let totalTwo = squares[i+width].innerHTML;
                let totalThree = squares[i+(width*2)].innerHTML;
                let totalFour = squares[i+(width*3)].innerHTML;
                let column = [parseInt(totalOne) || 0, parseInt(totalTwo) || 0, parseInt(totalThree) || 0, parseInt(totalFour) || 0];

                let filteredColumn = column.filter(num => num);
                let missing = 4 - filteredColumn.length;
                let zeros = Array(missing).fill(0);
                let newColumn = filteredColumn.concat(zeros);

                squares[i].innerHTML = newColumn[0] || "";
                squares[i+width].innerHTML = newColumn[1] || "";
                squares[i+(width*2)].innerHTML = newColumn[2] || "";
                squares[i+(width*3)].innerHTML = newColumn[3] || "";
            }
        }

        function moveDown() {
            for (let i = 0; i < 4; i++) {
                let totalOne = squares[i].innerHTML;
                let totalTwo = squares[i+width].innerHTML;
                let totalThree = squares[i+(width*2)].innerHTML;
                let totalFour = squares[i+(width*3)].innerHTML;
                let column = [parseInt(totalOne) || 0, parseInt(totalTwo) || 0, parseInt(totalThree) || 0, parseInt(totalFour) || 0];

                let filteredColumn = column.filter(num => num);
                let missing = 4 - filteredColumn.length;
                let zeros = Array(missing).fill(0);
                let newColumn = zeros.concat(filteredColumn);

                squares[i].innerHTML = newColumn[0] || "";
                squares[i+width].innerHTML = newColumn[1] || "";
                squares[i+(width*2)].innerHTML = newColumn[2] || "";
                squares[i+(width*3)].innerHTML = newColumn[3] || "";
            }
        }

        function combineRow() {
            for (let i = 0; i < 15; i++) {
                if (squares[i].innerHTML === squares[i+1].innerHTML && squares[i].innerHTML !== "") {
                    let combinedTotal = parseInt(squares[i].innerHTML) + parseInt(squares[i+1].innerHTML);
                    squares[i].innerHTML = combinedTotal;
                    squares[i+1].innerHTML = "";
                    score += combinedTotal;
                    scoreDisplay.innerHTML = score;
                }
            }
            checkForWin();
        }

        function combineColumn() {
            for (let i = 0; i < 12; i++) {
                if (squares[i].innerHTML === squares[i+width].innerHTML && squares[i].innerHTML !== "") {
                    let combinedTotal = parseInt(squares[i].innerHTML) + parseInt(squares[i+width].innerHTML);
                    squares[i].innerHTML = combinedTotal;
                    squares[i+width].innerHTML = "";
                    score += combinedTotal;
                    scoreDisplay.innerHTML = score;
                }
            }
            checkForWin();
        }

        // Handle Keyboard Controls
        function control(e) {
            if (e.keyCode === 37) keyLeft();
            else if (e.keyCode === 38) keyUp();
            else if (e.keyCode === 39) keyRight();
            else if (e.keyCode === 40) keyDown();
            updateAttributes();
        }
        document.addEventListener('keyup', control);

        function keyLeft() { moveLeft(); combineRow(); moveLeft(); generate(); }
        function keyRight() { moveRight(); combineRow(); moveRight(); generate(); }
        function keyUp() { moveUp(); combineColumn(); moveUp(); generate(); }
        function keyDown() { moveDown(); combineColumn(); moveDown(); generate(); }

        function updateAttributes() {
            squares.forEach(sq => {
                sq.setAttribute('data-value', sq.innerHTML);
            });
        }

        function checkForWin() {
            for (let i = 0; i < squares.length; i++) {
                if (squares[i].innerHTML == 2048) {
                    alert('You Win!');
                    document.removeEventListener('keyup', control);
                }
            }
        }

        function checkForGameOver() {
            let zeros = 0;
            for (let i = 0; i < squares.length; i++) {
                if (squares[i].innerHTML == "") zeros++;
            }
            if (zeros === 0) {
                alert('Game Over!');
                document.removeEventListener('keyup', control);
            }
        }

        function resetGame() {
            location.reload();
        }

        createBoard();

        // Mobile Touch Support
        let touchstartX = 0;
        let touchstartY = 0;
        let touchendX = 0;
        let touchendY = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
            touchstartY = e.changedTouches[0].screenY;
        });

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            touchendY = e.changedTouches[0].screenY;
            handleGesture();
        });

        function handleGesture() {
            let dx = touchendX - touchstartX;
            let dy = touchendY - touchstartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) keyRight(); else keyLeft();
            } else {
                if (dy > 0) keyDown(); else keyUp();
            }
            updateAttributes();
        }
    </script>
</body>
</html>
