<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Classic 2048 Online</title>
    <style>
        :root {
            --bg-color: #faf8ef;
            --grid-bg: #bbada0;
            --tile-empty: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            touch-action: none;
        }
        .header { width: 320px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .score-container { background: var(--grid-bg); padding: 5px 15px; border-radius: 5px; color: white; text-align: center; }
        .grid-container {
            background: var(--grid-bg);
            width: 320px; height: 320px;
            padding: 10px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            box-sizing: border-box;
        }
        .cell {
            background: var(--tile-empty);
            border-radius: 4px;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold;
        }
        /* 타일별 색상 처리 */
        .cell[data-value="2"] { background: #eee4da; color: var(--text-dark); }
        .cell[data-value="4"] { background: #ede0c8; color: var(--text-dark); }
        .cell[data-value="8"] { background: #f2b179; color: white; }
        .cell[data-value="16"] { background: #f59563; color: white; }
        .cell[data-value="32"] { background: #f67c5f; color: white; }
        .cell[data-value="64"] { background: #f65e3b; color: white; }
        .cell[data-value="128"] { background: #edcf72; color: white; font-size: 20px; }
        .cell[data-value="256"] { background: #edcc61; color: white; font-size: 20px; }
        .cell[data-value="512"] { background: #edc850; color: white; font-size: 20px; }
        .cell[data-value="1024"] { background: #edc53f; color: white; font-size: 16px; }
        .cell[data-value="2048"] { background: #edc22e; color: white; font-size: 16px; }

        .btn-restart { margin-top: 20px; padding: 10px 20px; background: #8f7a66; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="margin:0;">2048</h1>
        <div class="score-container">
            <div style="font-size:12px;">SCORE</div>
            <div id="score">0</div>
        </div>
    </div>

    <div id="grid" class="grid-container"></div>

    <button class="btn-restart" onclick="resetGame()">New Game</button>

    <script>
        const gridDisplay = document.querySelector('#grid');
        const scoreDisplay = document.querySelector('#score');
        let squares = [];
        let score = 0;

        // 보드 생성
        function createBoard() {
            for (let i = 0; i < 16; i++) {
                const square = document.createElement('div');
                square.classList.add('cell');
                gridDisplay.appendChild(square);
                squares.push(square);
            }
            generate();
            generate();
        }

        // 랜덤 숫자 생성
        function generate() {
            const emptySquares = squares.filter(s => s.innerHTML === '');
            if (emptySquares.length > 0) {
                const randomSquare = emptySquares[Math.floor(Math.random() * emptySquares.length)];
                const val = Math.random() > 0.1 ? 2 : 4;
                randomSquare.innerHTML = val;
                randomSquare.setAttribute('data-value', val);
            }
        }

        // 이동 로직 (가로)
        function move(isRight) {
            for (let i = 0; i < 16; i += 4) {
                let row = [
                    parseInt(squares[i].innerHTML) || 0,
                    parseInt(squares[i+1].innerHTML) || 0,
                    parseInt(squares[i+2].innerHTML) || 0,
                    parseInt(squares[i+3].innerHTML) || 0
                ];

                let filtered = row.filter(num => num);
                let missing = 4 - filtered.length;
                let zeros = Array(missing).fill(0);
                let newRow = isRight ? zeros.concat(filtered) : filtered.concat(zeros);

                for (let j = 0; j < 4; j++) {
                    squares[i+j].innerHTML = newRow[j] === 0 ? '' : newRow[j];
                    squares[i+j].setAttribute('data-value', newRow[j] === 0 ? '' : newRow[j]);
                }
            }
        }

        // 합치기 로직 (가로)
        function combineRow(isRight) {
            for (let i = 0; i < 15; i++) {
                if (i % 4 !== 3) {
                    if (squares[i].innerHTML !== '' && squares[i].innerHTML === squares[i+1].innerHTML) {
                        let combinedTotal = parseInt(squares[i].innerHTML) + parseInt(squares[i+1].innerHTML);
                        if(isRight) {
                            squares[i+1].innerHTML = combinedTotal;
                            squares[i].innerHTML = '';
                        } else {
                            squares[i].innerHTML = combinedTotal;
                            squares[i+1].innerHTML = '';
                        }
                        score += combinedTotal;
                        scoreDisplay.innerHTML = score;
                    }
                }
            }
        }

        // 세로 이동은 가로 로직을 응용하거나 별도 구현 (여기서는 심플하게 키 이벤트만 연결)
        // ... (핵심 실행 확인을 위해 가로 이동부터 테스트)

        function handleKey(e) {
            if(e.keyCode === 37) { move(false); combineRow(false); move(false); generate(); }
            else if(e.keyCode === 39) { move(true); combineRow(true); move(true); generate(); }
            // 위아래 로직 추가 생략 (구동 확인용)
        }

        document.addEventListener('keyup', handleKey);
        function resetGame() { location.reload(); }

        window.onload = createBoard; // 페이지 로드 후 실행 보장
    </script>
</body>
</html>
