<html lang="ko" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

범위: 툴바·빈 상태·테이블 헤더 등 정적 UI 텍스트(약 20개)만 번역.

<title id="page-title">pomiai 압축 관리자</title>
<!-- zip.js: AES-256 암호화/복호화 지원 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/zip.js/2.7.44/zip-full.min.js"></script>
<style>
:root{
  --bg:#0b0b0d;--panel:#131317;--panel2:#1a1a20;--border:#25252d;
  --accent:#7F77DD;--accent2:#5DCAA5;--red:#E24B4A;--yellow:#EF9F27;
  --text:#e0e0e8;--text2:#888;--text3:#444;--h:52px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif}

/* TOOLBAR */
#toolbar{height:var(--h);background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:5px;padding:0 10px;flex-shrink:0;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;}
#toolbar::-webkit-scrollbar{display:none;}
#logo{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;white-space:nowrap;margin-right:2px;flex-shrink:0}
#logo span{color:var(--text2);font-weight:400}
.sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 1px}
.tbtn{display:flex;align-items:center;gap:4px;background:transparent;border:1px solid var(--border);
  color:var(--text2);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;
  transition:.15s;white-space:nowrap;flex-shrink:0;user-select:none}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(127,119,221,.08)}
.tbtn.ok:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(93,202,165,.08)}
.tbtn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(226,75,74,.08)}
.tbtn.lock{border-color:var(--yellow)!important;color:var(--yellow)!important;background:rgba(239,159,39,.08)!important}
.tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
#archive-name{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1;min-width:60px}
#lock-badge{font-size:11px;padding:3px 8px;border-radius:12px;background:rgba(239,159,39,.15);
  color:var(--yellow);border:1px solid rgba(239,159,39,.3);display:none;white-space:nowrap;flex-shrink:0}
#lock-badge.show{display:inline-flex;align-items:center;gap:4px}
#file-input{display:none}
#add-input{display:none}

/* LAYOUT */
#body{display:flex;height:calc(100% - var(--h));overflow:hidden}

/* LEFT */
#left{width:240px;min-width:0;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s}
#left.collapsed{width:0}
#left-head{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between}
#left-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:1.5px;text-transform:uppercase}
#left-toggle{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 4px}
#left-toggle:hover{color:var(--accent)}
#tree{flex:1;overflow-y:auto;padding:5px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#tree::-webkit-scrollbar{width:3px}
#tree::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.tnode{display:flex;align-items:center;gap:5px;padding:5px 10px;cursor:pointer;
  font-size:12px;color:var(--text2);transition:.1s;border-left:2px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tnode:hover{background:var(--panel2);color:var(--text);border-left-color:var(--border)}
.tnode.sel{background:rgba(127,119,221,.1);color:var(--accent);border-left-color:var(--accent)}
.tnode.folder{color:var(--yellow)}
.tnode.folder.sel{color:var(--yellow);border-left-color:var(--yellow)}
.tnode .icon{flex-shrink:0}
.tnode .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
#stats{padding:8px 10px;border-top:1px solid var(--border);font-size:11px;color:#aaa;line-height:2;flex-shrink:0}
#stats b{color:#fff;font-weight:600}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#breadcrumb{padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;flex-shrink:0;overflow:hidden;white-space:nowrap}
.bcrumb{color:var(--text2);cursor:pointer;transition:.1s}
.bcrumb:hover{color:var(--accent)}
.bcrumb.cur{color:var(--text);cursor:default}
.bcsep{color:var(--text3)}
#list-head{display:flex;align-items:center;padding:0 12px;background:var(--panel2);
  border-bottom:1px solid var(--border);font-size:11px;color:var(--text3);flex-shrink:0;height:30px;user-select:none}
.lh{cursor:pointer;transition:.1s;display:flex;align-items:center;gap:2px}
.lh:hover{color:var(--text2)}
.lh.asc::after{content:'▲';font-size:9px}
.lh.desc::after{content:'▼';font-size:9px}
.col-chk{width:26px;flex-shrink:0}
.col-icon{width:24px;flex-shrink:0}
.col-name{flex:1;min-width:80px}
.col-size{width:78px;text-align:right;flex-shrink:0}
.col-date{width:124px;flex-shrink:0}
.col-ratio{width:58px;text-align:right;flex-shrink:0}
#file-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#file-list::-webkit-scrollbar{width:5px}
#file-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.frow{display:flex;align-items:center;padding:5px 12px;font-size:12px;cursor:pointer;
  transition:.1s;border-bottom:1px solid rgba(255,255,255,.02);color:var(--text2)}
.frow:hover{background:var(--panel2);color:var(--text)}
.frow.selected{background:rgba(127,119,221,.1);color:var(--text)}
.frow.folder{color:var(--yellow)}
.frow input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.frow .ficon{width:24px;flex-shrink:0;font-size:13px}
.frow .fname{flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fsize{width:78px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.frow .fdate{width:124px;flex-shrink:0;font-size:11px;color:var(--text3)}
.frow .fratio{width:58px;text-align:right;flex-shrink:0;font-size:11px}
.ratio-bar{display:inline-block;background:var(--accent2);border-radius:2px;height:4px;
  margin-right:3px;vertical-align:middle;opacity:.5}

/* 빈 상태 */
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--text3);text-align:center;padding:40px}
#empty-state .ei{font-size:48px;opacity:.3}
#empty-state h3{font-size:15px;color:var(--text2)}
#empty-state p{font-size:13px;line-height:1.7}
.dz-hint{border:2px dashed var(--border);border-radius:12px;padding:18px 28px;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.dz-hint.drag{border-color:var(--accent);background:rgba(127,119,221,.05)}
.ebtn{background:var(--accent);border:none;color:#fff;border-radius:7px;
  padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.ebtn:hover{background:#6d65cc}
.ebtn.green{background:var(--accent2)}
.ebtn.green:hover{background:#4ab890}

/* 상태바 */
#statusbar{height:26px;background:var(--panel);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:12px;font-size:11px;color:#aaa;flex-shrink:0}
#statusbar b{color:#fff;font-weight:600}

/* 미리보기 */
#preview{width:280px;background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .2s}
#preview.hidden{width:0}
#prev-head{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between}
#prev-title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase}
#prev-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px}
#prev-close:hover{color:var(--red)}
#prev-body{flex:1;overflow:auto;padding:10px;font-size:12px;line-height:1.7;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#prev-body img{max-width:100%;border-radius:3px;display:block;margin:0 auto}
#prev-body pre{background:var(--panel2);border:1px solid var(--border);border-radius:4px;
  padding:8px;font-family:'Consolas','D2Coding',monospace;font-size:11px;
  overflow-x:auto;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-all}
#prev-meta{padding:8px 10px;border-top:1px solid var(--border);font-size:11px;
  color:var(--text3);line-height:1.9;flex-shrink:0}
#prev-meta b{color:var(--text2)}

/* 진행 모달 */
#progress-modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;
  display:none;align-items:center;justify-content:center}
#progress-modal.show{display:flex}
#prog-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:26px 34px;min-width:300px;text-align:center;display:flex;flex-direction:column;gap:12px}
#prog-title{font-size:14px;font-weight:600;color:var(--text)}
#prog-sub{font-size:12px;color:var(--text2);min-height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog-bar-wrap{background:var(--panel2);border-radius:4px;height:7px;overflow:hidden}
#prog-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .1s;width:0}
#prog-pct{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}

/* 암호 모달 */
#pw-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:110;
  display:none;align-items:center;justify-content:center}
#pw-modal.show{display:flex}
#pw-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:28px 32px;min-width:320px;max-width:420px;display:flex;flex-direction:column;gap:14px}
#pw-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
#pw-desc{font-size:12px;color:var(--text2);line-height:1.65}
#pw-fields{display:flex;flex-direction:column;gap:8px}
.pw-label{font-size:11px;color:var(--text3);margin-bottom:2px}
.pw-row{display:flex;align-items:center;gap:6px}
.pw-input{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:8px 10px;font-size:13px;outline:none;transition:.15s}
.pw-input:focus{border-color:var(--accent)}
.pw-input::placeholder{color:var(--text3)}
.pw-eye{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px 6px;font-size:14px;flex-shrink:0}
.pw-eye:hover{color:var(--text2)}
#pw-strength{height:3px;border-radius:2px;background:var(--border);margin-top:2px;transition:all .2s}
#pw-strength-label{font-size:10px;color:var(--text3);margin-top:2px}
#pw-encrypt-opts{display:none;flex-direction:column;gap:6px}
#pw-encrypt-opts.show{display:flex}
.radio-row{display:flex;gap:12px;flex-wrap:wrap}
.radio-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);cursor:pointer}
.radio-item input{accent-color:var(--accent)}
#pw-error{font-size:12px;color:var(--red);display:none;padding:6px 10px;background:rgba(226,75,74,.1);border-radius:5px}
#pw-error.show{display:block}
#pw-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.pw-btn{border:none;border-radius:7px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
#pw-cancel{background:var(--panel2);color:var(--text2);border:1px solid var(--border)}
#pw-cancel:hover{border-color:var(--border);color:var(--text)}
#pw-ok{background:var(--accent);color:#fff}
#pw-ok:hover{background:#6d65cc}

/* 이름 변경 input */
.rename-inp{background:var(--panel2);border:1px solid var(--accent);color:var(--text);
  border-radius:4px;padding:2px 6px;font-size:12px;outline:none;width:100%}

/* 컨텍스트 메뉴 */
#ctx-menu{position:fixed;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:4px 0;min-width:155px;z-index:150;display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ctx-item{padding:7px 13px;font-size:12px;color:var(--text2);cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.1s}
.ctx-item:hover{background:rgba(127,119,221,.1);color:var(--text)}
.ctx-item.red:hover{background:rgba(226,75,74,.1);color:var(--red)}
.ctx-sep{border:none;border-top:1px solid var(--border);margin:3px 0}

/* 토스트 */
#toast{position:fixed;bottom:14px;right:14px;background:#111;border:1px solid var(--border);
  border-radius:8px;padding:7px 13px;font-size:12px;color:var(--accent2);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;max-width:300px;word-break:break-all}
#toast.show{opacity:1}
#toast.err{color:var(--red)}

@media(max-width:640px){
  #left{display:none}#preview{display:none}
  .col-date,.col-ratio,.fdate,.fratio{display:none}
  .tbtn span{display:none}
}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <span id="logo">pomiai <span>zip</span></span>
  <div class="sep"></div>
  <button class="tbtn" onclick="triggerOpen()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    <span data-i18n="btn_open"></span>
  </button>
  <button class="tbtn ok" onclick="triggerNewZip()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span data-i18n="btn_newzip"></span>
  </button>
  <div class="sep"></div>
  <button class="tbtn" id="btn-addfile" onclick="triggerAddFile()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    <span data-i18n="btn_addfiles"></span>
  </button>
  <button class="tbtn" id="btn-extract-sel" onclick="extractSelected()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/></svg>
    <span data-i18n="btn_extractsel"></span>
  </button>
  <button class="tbtn ok" id="btn-extract-all" onclick="extractAll()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/></svg>
    <span data-i18n="btn_extractall"></span>
  </button>
  <button class="tbtn danger" id="btn-delete-sel" onclick="deleteSelected()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
    <span data-i18n="btn_delete"></span>
  </button>
  <div class="sep"></div>
  <!-- 암호 관련 버튼들 -->
  <button class="tbtn" id="btn-pw-open" onclick="showPwModal('open')" disabled>
    🔓 <span data-i18n="btn_pwopen"></span>
  </button>
  <button class="tbtn" id="btn-pw-set" onclick="showPwModal('set')" disabled>
    🔐 <span data-i18n="btn_pwset"></span>
  </button>
  <button class="tbtn" id="btn-pw-change" onclick="showPwModal('change')" disabled style="display:none">
    🔑 <span data-i18n="btn_pwchange"></span>
  </button>
  <button class="tbtn danger" id="btn-pw-remove" onclick="showPwModal('remove')" disabled style="display:none">
    🔓 <span data-i18n="btn_pwremove"></span>
  </button>
  <div class="sep"></div>
  <button class="tbtn ok" id="btn-save" onclick="saveZip()" disabled>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    <span data-i18n="btn_save"></span>
  </button>
  <input type="file" id="file-input" accept=".zip">
  <input type="file" id="add-input" multiple>
  <span id="lock-badge">🔒 암호 설정됨</span>
  <span id="archive-name" data-i18n="msg_noarchive"></span>
</div>

<div id="body">
  <!-- LEFT -->
  <div id="left">
    <div id="left-head">
      <span id="left-title" data-i18n="lbl_tree"></span>
      <button id="left-toggle" onclick="toggleLeft()">✕</button>
    </div>
    <div id="tree"></div>
    <div id="stats"></div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="breadcrumb"><span class="bcrumb cur" data-i18n-html="lbl_root"></span></div>
    <div id="list-head">
      <div class="col-chk"><input type="checkbox" id="chk-all" onchange="toggleAll(this.checked)"></div>
      <div class="col-icon"></div>
      <div class="col-name lh" onclick="sortBy('name')" id="sh-name" data-i18n="col_name"></div>
      <div class="col-size lh" onclick="sortBy('size')" id="sh-size" data-i18n="col_size"></div>
      <div class="col-date lh" onclick="sortBy('date')" id="sh-date" data-i18n="col_date"></div>
      <div class="col-ratio" data-i18n="col_ratio"></div>
    </div>
    <div id="file-list">
      <div id="empty-state">
        <div class="ei">🗜️</div>
        <h3 data-i18n="empty_title"></h3>
        <p data-i18n-html="empty_sub"></p>
        <div class="dz-hint" id="drop-hint">
          <p style="font-size:12px;color:#555" data-i18n="empty_draghint"></p>
          <button class="ebtn" onclick="triggerOpen()" data-i18n="btn_openzip"></button>
          <button class="ebtn green" onclick="triggerNewZip()" data-i18n="btn_makenewzip"></button>
        </div>
      </div>
    </div>
    <div id="statusbar">
      <span><b id="st-count">0</b>개</span>
      <span>선택 <b id="st-sel">0</b></span>
      <span>원본 <b id="st-orig">—</b></span>
      <span>압축 <b id="st-comp">—</b></span>
      <span>압축률 <b id="st-ratio">—</b></span>
    </div>
  </div>

  <!-- PREVIEW -->
  <div id="preview" class="hidden">
    <div id="prev-head">

/* ── 상태 ── */
// 파일 목록: [{name, path, isDir, size, compSize, date, ext, data(Uint8Array)}]
let entries=[];       // 현재 ZIP의 모든 파일 항목
let curPath='';
let zipName='새 아카이브.zip';
let currentPw='';     // 현재 열려 있는 ZIP의 암호 (빈 문자열=없음)
let savePw='';        // 저장 시 사용할 암호
let hasZip=false;
let sortKey='name', sortAsc=true;
let ctxTarget=null;
let toastTid=null;
let pwMode='';        // 'open'|'set'|'change'|'remove'
let pwResolve=null;

/* ── 파일 열기 ── */
function triggerOpen(){$('file-input').click();}
$('file-input').addEventListener('change',e=>{if(e.target.files[0])openZip(e.target.files[0]);e.target.value='';});

async function openZip(file){
  showProgress('ZIP 열기 중...','',0);
  try{
    // 먼저 암호 없이 시도
    const result=await readZip(file,'');
    if(result.needsPassword){
      hideProgress();
      // 암호 입력 요청
      const pw=await askPassword('open',file.name);
      if(pw===null){hideProgress();return;}
      showProgress('암호 확인 중...','',0);
      const result2=await readZip(file,pw);
      if(result2.needsPassword||result2.error){
        hideProgress();toast('❌ 잘못된 암호입니다',true);return;
      }
      currentPw=pw;savePw=pw;
      entries=result2.entries;
    }else if(result.error){
      hideProgress();toast('❌ '+result.error,true);return;
    }else{
      currentPw='';savePw='';
      entries=result.entries;
    }
    zipName=file.name;curPath='';hasZip=true;
    updateAll();toast('✅ '+file.name+' 열림');
  }catch(e){toast('❌ '+e.message,true);}
  hideProgress();
}

async function readZip(file,password){
  try{
    const buf=await file.arrayBuffer();
    const reader=new zip.ZipReader(new zip.Uint8ArrayReader(new Uint8Array(buf)),{password:password||undefined});
    const zipEntries=await reader.getEntries();
    await reader.close();
    const items=[];
    for(const e of zipEntries){
      if(e.directory)continue;
      let data=null;
      try{
        data=await e.getData(new zip.Uint8ArrayWriter(),{password:password||undefined,onprogress:(c,t)=>setProgress(t>0?c/t*100:0,e.filename)});
      }catch(err){
        if(err.message&&(err.message.includes('password')||err.message.includes('Wrong')||err.message.includes('encrypted'))){
          return{needsPassword:true,entries:[]};
        }
        // 다른 에러: 파일 건너뜀
        data=new Uint8Array(0);
      }
      const parts=e.filename.split('/');
      items.push({
        name:parts[parts.length-1]||e.filename,
        path:e.filename,
        isDir:false,
        size:e.uncompressedSize||0,
        compSize:e.compressedSize||0,
        date:e.lastModDate||null,
        ext:(parts[parts.length-1]||'').split('.').pop().toLowerCase(),
        data:data,
        encrypted:e.encrypted||false,
      });
    }
    return{needsPassword:false,entries:items};
  }catch(err){
    if(err.message&&(err.message.includes('password')||err.message.includes('Wrong')||err.message.includes('encrypted'))){
      return{needsPassword:true,entries:[]};
    }
    return{error:err.message,entries:[]};
  }
}

/* ── 새 ZIP ── */
function triggerNewZip(){
  entries=[];zipName='새 아카이브.zip';curPath='';currentPw='';savePw='';hasZip=true;
  updateAll();toast('✅ 새 ZIP 아카이브 생성됨');
}

/* ── 파일 추가 ── */
function triggerAddFile(){$('add-input').click();}
$('add-input').addEventListener('change',e=>{if(e.target.files.length)addFiles([...e.target.files]);e.target.value='';});

async function addFiles(files){
  if(!hasZip){toast('⚠️ 먼저 ZIP을 열거나 새 ZIP을 만드세요',true);return;}
  showProgress('파일 추가 중...','',0);
  const prefix=curPath?curPath+'/':'';
  for(let i=0;i<files.length;i++){
    const f=files[i];setProgress(i/files.length*100,'추가: '+f.name);
    const data=new Uint8Array(await f.arrayBuffer());
    const path=prefix+f.name;
    // 이미 존재하면 교체
    const idx=entries.findIndex(e=>e.path===path);
    const item={name:f.name,path,isDir:false,size:f.size,compSize:0,date:new Date(),ext:f.name.split('.').pop().toLowerCase(),data,encrypted:false};
    if(idx>=0)entries[idx]=item;else entries.push(item);
  }
  hideProgress();updateAll();toast(`✅ ${files.length}개 파일 추가됨`);
}

/* ── 드래그 앤 드롭 ── */
let dc=0;
document.addEventListener('dragenter',e=>{e.preventDefault();dc++;const dh=$('drop-hint');if(dh)dh.classList.add('drag');});
document.addEventListener('dragleave',()=>{dc--;if(dc<=0){dc=0;const dh=$('drop-hint');if(dh)dh.classList.remove('drag');}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();dc=0;const dh=$('drop-hint');if(dh)dh.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(f){if(f.name.toLowerCase().endsWith('.zip'))openZip(f);else if(hasZip)addFiles([...e.dataTransfer.files]);else toast('⚠️ ZIP 파일만 드롭해서 열 수 있습니다',true);}
});

/* ── 추출 ── */
async function extractAll(){
  if(!hasZip)return;
  const toEx=entries.filter(e=>!e.isDir);
  if(!toEx.length){toast('⚠️ 추출할 파일이 없습니다',true);return;}
  showProgress('전체 압축 해제 중...','',0);
  for(let i=0;i<toEx.length;i++){setProgress(i/toEx.length*100,toEx[i].name);await downloadEntry(toEx[i]);}
  hideProgress();toast(`✅ ${toEx.length}개 파일 추출 완료`);
}

async function extractSelected(){
  if(!hasZip)return;
  const sel=getSelectedPaths();
  if(!sel.length){toast('⚠️ 추출할 파일을 선택하세요',true);return;}
  const toEx=entries.filter(e=>!e.isDir&&(sel.includes(e.path)||sel.some(s=>e.path.startsWith(s+'/'))));
  showProgress('압축 해제 중...','',0);
  for(let i=0;i<toEx.length;i++){setProgress(i/toEx.length*100,toEx[i].name);await downloadEntry(toEx[i]);}
  hideProgress();toast(`✅ ${toEx.length}개 파일 추출 완료`);
}

async function downloadEntry(entry){
  if(!entry.data||entry.data.length===0)return;
  try{
    const blob=new Blob([entry.data]);
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.download=entry.name;a.href=url;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    await new Promise(r=>setTimeout(r,60));
  }catch(e){console.warn('download error:',e);}
}

/* ── 삭제 ── */
function deleteSelected(){
  if(!hasZip)return;
  const sel=getSelectedPaths();
  if(!sel.length){toast('⚠️ 삭제할 파일을 선택하세요',true);return;}
  entries=entries.filter(e=>!sel.includes(e.path)&&!sel.some(s=>e.path.startsWith(s+'/')));
  updateAll();toast(`🗑️ ${sel.length}개 항목 삭제됨`);
}
function deleteByPath(path){
  entries=entries.filter(e=>e.path!==path&&!e.path.startsWith(path+'/'));
  updateAll();
}

/* ── ZIP 저장 ── */
async function saveZip(){
  if(!hasZip)return;
  showProgress('ZIP 생성 중...','',0);
  try{
    const zipWriter=new zip.ZipWriter(
      new zip.BlobWriter('application/zip'),
      savePw?{password:savePw,encryptionStrength:3}:{}
    );
    const files=entries.filter(e=>!e.isDir);
    for(let i=0;i<files.length;i++){
      const f=files[i];setProgress(i/files.length*100,'추가: '+f.name);
      await zipWriter.add(f.path,new zip.Uint8ArrayReader(f.data),{
        lastModDate:f.date||new Date(),
        level:6,
      });
    }
    const blob=await zipWriter.close();
    setProgress(100,'저장 중...');
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=zipName;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('✅ '+zipName+(savePw?' (🔒 암호화됨)':'')+' 저장 완료');
  }catch(e){toast('❌ 저장 실패: '+e.message,true);}
  hideProgress();
}

function closePwModal(){
  const m=$('pw-modal');if(m)m.classList.remove('show');
  pwMode='';
}

function togglePwEye(inputId,btn){
  const inp=$(inputId);if(!inp)return;
  inp.type=inp.type==='password'?'text':'password';
  btn.textContent=inp.type==='password'?'👁️':'🙈';
}

function checkPwStrength(pw){
  const bar=$('pw-strength'),label=$('pw-strength-label');
  if(!bar||!label)return;
  let score=0;
  if(pw.length>=8)score++;if(pw.length>=12)score++;
  if(/[A-Z]/.test(pw))score++;if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;
  const levels=[
    {w:'0%',bg:'transparent',text:''},
    {w:'20%',bg:'#E24B4A',text:'매우 약함'},
    {w:'40%',bg:'#EF9F27',text:'약함'},
    {w:'65%',bg:'#EF9F27',text:'보통'},
    {w:'85%',bg:'#5DCAA5',text:'강함'},
    {w:'100%',bg:'#5DCAA5',text:'매우 강함'},
  ];
  const lv=levels[Math.min(score,5)];
  bar.style.width=lv.w;bar.style.background=lv.bg;
  label.textContent=lv.text;label.style.color=lv.bg;
}

function pwShowError(msg){
  const el=$('pw-error');if(!el)return;
  el.textContent=msg;el.className='show';
}

async function pwConfirm(){
  const errEl=$('pw-error');if(errEl){errEl.className='';errEl.textContent='';}

  if(pwMode==='open'){
    const pw=($('pw-in1')||{}).value||'';
    if(!pw){pwShowError('암호를 입력하세요');return;}
    closePwModal();
    if(pwResolve){pwResolve(pw);pwResolve=null;}

  }else if(pwMode==='set'){
    const pw1=($('pw-in1')||{}).value||'';
    const pw2=($('pw-in2')||{}).value||'';
    if(!pw1){pwShowError('암호를 입력하세요');return;}
    if(pw1.length<4){pwShowError('암호는 4자 이상이어야 합니다');return;}
    if(pw1!==pw2){pwShowError('암호가 일치하지 않습니다');return;}
    savePw=pw1;
    updateLockUI();
    closePwModal();
    toast('🔐 암호가 설정되었습니다. ZIP 저장 시 적용됩니다');

  }else if(pwMode==='change'){
    const old=($('pw-in0')||{}).value||'';
    const pw1=($('pw-in1')||{}).value||'';
    const pw2=($('pw-in2')||{}).value||'';
    if(savePw&&old!==savePw){pwShowError('현재 암호가 올바르지 않습니다');return;}
    if(!pw1){pwShowError('새 암호를 입력하세요');return;}
    if(pw1.length<4){pwShowError('암호는 4자 이상이어야 합니다');return;}
    if(pw1!==pw2){pwShowError('새 암호가 일치하지 않습니다');return;}
    savePw=pw1;currentPw=pw1;
    updateLockUI();closePwModal();
    toast('🔑 암호가 변경되었습니다');

  }else if(pwMode==='remove'){
    const old=($('pw-in0')||{}).value||'';
    if(savePw&&old!==savePw){pwShowError('현재 암호가 올바르지 않습니다');return;}
    savePw='';currentPw='';
    updateLockUI();closePwModal();
    toast('🔓 암호가 제거되었습니다. 다음 저장부터 암호화되지 않습니다');
  }
}

// 암호 입력을 Promise로 기다리기
function askPassword(mode,filename){
  return new Promise(resolve=>{
    pwResolve=resolve;
    pwMode='open';
    const modal=$('pw-modal'),title=$('pw-title'),desc=$('pw-desc'),fields=$('pw-fields');
    if(title)title.textContent='🔓 암호로 열기';
    if(desc)desc.textContent=`"${filename}" 은(는) 암호로 보호되어 있습니다.\n암호를 입력하세요.`;
    if(fields)fields.innerHTML=`
      <div class="pw-label">암호</div>
      <div class="pw-row">
        <input class="pw-input" id="pw-in1" type="password" placeholder="암호 입력" autocomplete="current-password">
        <button class="pw-eye" onclick="togglePwEye('pw-in1',this)">👁️</button>
      </div>`;
    if(fields)fields.addEventListener('keydown',e=>{if(e.key==='Enter')pwConfirm();},{once:true});
    // 취소 = resolve(null)
    const cancel=$('pw-cancel');
    if(cancel){
      const origClick=cancel.onclick;
      cancel.onclick=()=>{closePwModal();if(pwResolve){pwResolve(null);pwResolve=null;}};
    }
    modal.classList.add('show');
    setTimeout(()=>{const f=$('pw-in1');if(f)f.focus();},100);
  });
}

function updateLockUI(){
  const badge=$('lock-badge');
  const hasPw=!!savePw;
  if(badge)badge.className=hasPw?'show':'';
  const setBtns=[
    {id:'btn-pw-set',show:!hasPw},
    {id:'btn-pw-change',show:hasPw},
    {id:'btn-pw-remove',show:hasPw},
    {id:'btn-pw-open',show:true},
  ];
  setBtns.forEach(({id,show})=>{const el=$(id);if(el)el.style.display=show?'':'none';});
}

/* ── 렌더링 ── */
function updateAll(){
  const setBtns=['btn-addfile','btn-extract-all','btn-save','btn-pw-set','btn-pw-open'];
  setBtns.forEach(id=>{const el=$(id);if(el)el.disabled=!hasZip;});
  const an=$('archive-name');if(an)an.textContent=hasZip?zipName:window._T.msg_noarchive;
  updateLockUI();renderTree();renderList();updateStats();updateBreadcrumb();
}

function getFolders(){
  const folders=new Set(['']);
  entries.forEach(e=>{
    const parts=e.path.split('/');
    for(let i=1;i<parts.length;i++)folders.add(parts.slice(0,i).join('/'));
  });
  return folders;
}

function getEntriesAt(path){
  const prefix=path?path+'/':'';
  const seen=new Set();const items=[];
  entries.forEach(e=>{
    if(!e.path.startsWith(prefix))return;
    const rel=e.path.slice(prefix.length);if(!rel)return;
    const parts=rel.split('/');const name=parts[0];
    if(!name||seen.has(name))return;seen.add(name);
    const isDir=parts.length>1;
    const fullPath=prefix+name;
    if(isDir){
      const subs=entries.filter(c=>c.path.startsWith(fullPath+'/'));
      items.push({name,path:fullPath,isDir:true,size:subs.reduce((s,c)=>s+c.size,0),count:subs.length,compSize:0,date:null});
    }else{
      items.push({...e,isDir:false});
    }
  });
  return items;
}

function renderList(){
  const fl=$('file-list');
  const es=$('empty-state');
  if(es&&es.parentNode===fl)fl.removeChild(es);
  if(!hasZip){fl.innerHTML='';if(es){es.style.display='flex';fl.appendChild(es);}return;}
  if(es)es.style.display='none';
  const items=getEntriesAt(curPath);
  items.sort((a,b)=>{
    if(a.isDir!==b.isDir)return a.isDir?-1:1;
    let v=0;
    if(sortKey==='name')v=a.name.localeCompare(b.name,'ko');
    else if(sortKey==='size')v=a.size-b.size;
    else if(sortKey==='date')v=(a.date||0)-(b.date||0);
    return sortAsc?v:-v;
  });
  fl.innerHTML='';
  if(curPath){
    const up=document.createElement('div');up.className='frow folder';
    up.innerHTML=`<div class="col-chk"></div><div class="ficon">📂</div><div class="fname">..</div><div class="fsize"></div><div class="fdate"></div><div class="fratio"></div>`;
    up.addEventListener('click',()=>navigateTo(curPath.split('/').slice(0,-1).join('/')));
    fl.appendChild(up);
  }
  items.forEach(item=>{
    const row=document.createElement('div');
    row.className='frow'+(item.isDir?' folder':'');
    row.dataset.path=item.path;
    const icon=item.isDir?'📁':getIcon(item.ext||'');
    const lockIcon=item.encrypted?'🔒 ':'';
    const sz=item.isDir?`${item.count}개`:(item.size>0?fmtSize(item.size):'—');
    const dt=item.date?fmtDate(item.date):'';
    const ratio=(!item.isDir&&item.size>0)?Math.round((1-item.compSize/item.size)*100):0;
    const ratioBar=item.isDir?'':
      `<span class="ratio-bar" style="width:${Math.min(ratio,100)*0.38}px"></span>${ratio}%`;
    row.innerHTML=`
      <div class="col-chk"><input type="checkbox" class="fchk" data-path="${escAttr(item.path)}" onclick="onCheckChange(event)"></div>
      <div class="ficon">${icon}</div>
      <div class="fname" title="${escAttr(item.name)}">${lockIcon}${escHtml(item.name)}</div>
      <div class="fsize">${sz}</div>
      <div class="fdate">${dt}</div>
      <div class="fratio">${ratioBar}</div>`;
    row.addEventListener('click',e=>{
      if(e.target.type==='checkbox')return;
      if(item.isDir){navigateTo(item.path);return;}
      row.classList.toggle('selected');
      const chk=row.querySelector('.fchk');if(chk)chk.checked=row.classList.contains('selected');
      updateSelectionUI();
    });
    row.addEventListener('dblclick',e=>{if(e.target.type==='checkbox')return;if(!item.isDir)previewFile(item);});
    row.addEventListener('contextmenu',e=>{e.preventDefault();showCtxMenu(e,item);});
    fl.appendChild(row);
  });
  updateSelectionUI();
  ['name','size','date'].forEach(k=>{const el=$('sh-'+k);if(el)el.className='lh'+(sortKey===k?' '+(sortAsc?'asc':'desc'):'');});
}

function renderTree(){
  const tree=$('tree');tree.innerHTML='';
  if(!hasZip)return;
  const folders=[...getFolders()].sort();
  folders.forEach(f=>{
    const depth=f?f.split('/').length:0;
    const d=document.createElement('div');
    d.className='tnode folder'+(f===curPath?' sel':'');
    d.style.paddingLeft=(10+depth*14)+'px';
    d.innerHTML=`<span class="icon">${f?'📁':'🏠'}</span><span class="nm">${f?f.split('/').pop():'루트'}</span>`;
    d.addEventListener('click',()=>navigateTo(f));
    tree.appendChild(d);
  });
}

function updateBreadcrumb(){
  const bc=$('breadcrumb');if(!bc)return;bc.innerHTML='';
  const parts=curPath?curPath.split('/'):[]; 
  const addCrumb=(label,path,isCur)=>{
    const s=document.createElement('span');s.className='bcrumb'+(isCur?' cur':'');
    s.textContent=label;
    if(!isCur)s.addEventListener('click',()=>navigateTo(path));
    bc.appendChild(s);
  };
  addCrumb(window._T.lbl_root,'',!curPath);
  parts.forEach((p,i)=>{
    const sep=document.createElement('span');sep.className='bcsep';sep.textContent=' › ';bc.appendChild(sep);
    addCrumb(p,parts.slice(0,i+1).join('/'),i===parts.length-1);
  });
}

function updateStats(){
  const statsEl=$('stats');
  if(!hasZip){if(statsEl)statsEl.innerHTML='';return;}
  const files=entries.filter(e=>!e.isDir);
  const orig=files.reduce((s,e)=>s+e.size,0);
  const comp=files.reduce((s,e)=>s+e.compSize,0);
  const ratio=orig>0?Math.round((1-comp/orig)*100):0;
  if(statsEl)statsEl.innerHTML=`<b>파일</b> ${files.length}개<br><b>원본</b> ${fmtSize(orig)}<br><b>압축</b> ${fmtSize(comp)}<br><b>절감</b> ${ratio}%${savePw?'<br><b>암호</b> 🔒 설정됨':''}`;
  const set=(id,v)=>{const el=$(id);if(el)el.textContent=v;};
  set('st-count',files.length);set('st-orig',fmtSize(orig));
  set('st-comp',fmtSize(comp));set('st-ratio',ratio+'%');
}

function updateSelectionUI(){
  const sel=getSelectedPaths();
  const stel=$('st-sel');if(stel)stel.textContent=sel.length;
  const bex=$('btn-extract-sel');if(bex)bex.disabled=!hasZip||!sel.length;
  const bdel=$('btn-delete-sel');if(bdel)bdel.disabled=!hasZip||!sel.length;
  const ca=$('chk-all');if(!ca)return;
  const allChks=document.querySelectorAll('.fchk');
  const cnt=document.querySelectorAll('.fchk:checked').length;
  ca.indeterminate=false;ca.checked=allChks.length>0&&cnt===allChks.length;
  if(cnt>0&&cnt<allChks.length)ca.indeterminate=true;
}

function toggleAll(checked){
  document.querySelectorAll('.fchk').forEach(c=>c.checked=checked);
  document.querySelectorAll('.frow').forEach(r=>r.classList.toggle('selected',checked));
  updateSelectionUI();
}
function onCheckChange(e){
  const row=e.target.closest('.frow');if(row)row.classList.toggle('selected',e.target.checked);
  updateSelectionUI();
}
function getSelectedPaths(){return[...document.querySelectorAll('.fchk:checked')].map(c=>c.dataset.path);}
function navigateTo(path){curPath=path;renderTree();renderList();updateBreadcrumb();closeCtxMenu();}
function sortBy(key){if(sortKey===key)sortAsc=!sortAsc;else{sortKey=key;sortAsc=true;}renderList();}

/* ── 미리보기 ── */
const TEXT_EXTS=new Set(['txt','md','js','ts','jsx','tsx','json','xml','html','htm','css','csv','log','py','java','c','cpp','h','sh','yaml','yml','ini','toml','sql','bat','cmd','conf','cfg']);
const IMG_EXTS=new Set(['jpg','jpeg','png','gif','webp','svg','bmp','ico']);

async function previewFile(item){
  const pt=$('prev-title'),pm=$('prev-meta'),pb=$('prev-body'),pv=$('preview');
  if(!pt||!pb||!pv)return;
  pt.textContent=item.name.slice(0,24);
  if(pm)pm.innerHTML=`<b>${window._T.col_size}</b> ${fmtSize(item.size)}<br>${item.encrypted?'<b>'+(window._T.lbl_encrypted||'Encrypted')+'</b> \ud83d\udd12<br>':''}${item.date?'<b>'+window._T.col_date+'</b> '+fmtDate(item.date):''}`;
  pb.innerHTML='<div style="color:#555;padding:20px;text-align:center">로딩 중...</div>';
  pv.classList.remove('hidden');
  try{
    if(!item.data||item.data.length===0){pb.innerHTML='<div style="color:#555;padding:20px;text-align:center">데이터 없음</div>';return;}
    const ext=(item.ext||'').toLowerCase();
    if(IMG_EXTS.has(ext)){
      const blob=new Blob([item.data]);const url=URL.createObjectURL(blob);
      pb.innerHTML=`<img src="${url}" alt="${escAttr(item.name)}" onload="URL.revokeObjectURL(this.src)">`;
    }else if(TEXT_EXTS.has(ext)||item.size<100000){
      const dec=new TextDecoder('utf-8',{fatal:false});const txt=dec.decode(item.data);
      const pre=document.createElement('pre');
      pre.textContent=txt.slice(0,10000)+(txt.length>10000?'\n\n… (이하 생략)':'');
      pb.innerHTML='';pb.appendChild(pre);
    }else{
      pb.innerHTML=`<div style="color:#555;padding:20px;text-align:center">미리보기 불가 (${fmtSize(item.size)})</div>`;
    }
  }catch(e){if(pb)pb.innerHTML='<div style="color:var(--red);padding:16px">오류: '+escHtml(e.message)+'</div>';}
}
function closePreview(){const pv=$('preview');if(pv)pv.classList.add('hidden');}

/* ── 컨텍스트 메뉴 ── */
function showCtxMenu(e,item){
  ctxTarget=item;const m=$('ctx-menu');if(!m)return;
  m.style.display='block';
  m.style.left=Math.min(e.clientX,window.innerWidth-160)+'px';
  m.style.top=Math.min(e.clientY,window.innerHeight-160)+'px';
}
function closeCtxMenu(){const m=$('ctx-menu');if(m)m.style.display='none';ctxTarget=null;}
document.addEventListener('click',e=>{const m=$('ctx-menu');if(m&&m.style.display==='block'&&!m.contains(e.target))closeCtxMenu();});
async function ctxExtract(){const t=ctxTarget;closeCtxMenu();if(t&&!t.isDir)await downloadEntry(t);toast('✅ 추출 완료');}
function ctxPreview(){const t=ctxTarget;closeCtxMenu();if(t&&!t.isDir)previewFile(t);}
function ctxRename(){
  const t=ctxTarget;closeCtxMenu();if(!t)return;
  const row=document.querySelector(`.frow[data-path="${CSS.escape(t.path)}"]`);if(!row)return;
  const nm=row.querySelector('.fname');if(!nm)return;
  const old=t.name;
  nm.innerHTML=`<input class="rename-inp" value="${escAttr(old)}" onclick="event.stopPropagation()">`;
  const inp=nm.querySelector('input');if(!inp)return;inp.focus();inp.select();
  let applied=false;
  const apply=()=>{
    if(applied)return;applied=true;
    const nv=inp.value.trim();
    if(nv&&nv!==old){
      const oldPath=t.path;const newPath=oldPath.slice(0,oldPath.length-old.length)+nv;
      entries=entries.map(e=>{
        if(e.path===oldPath)return{...e,name:nv,path:newPath};
        if(e.path.startsWith(oldPath+'/'))return{...e,path:newPath+e.path.slice(oldPath.length)};
        return e;
      });
      updateAll();toast('✅ 이름 변경: '+nv);
    }else renderList();
  };
  inp.addEventListener('blur',apply);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();apply();}if(e.key==='Escape'){applied=true;renderList();}});
}
function ctxDelete(){const t=ctxTarget;closeCtxMenu();if(t){deleteByPath(t.path);toast('🗑️ 삭제됨: '+t.name);}}

/* ── 사이드바 ── */
function toggleLeft(){const l=$('left');if(l)l.classList.toggle('collapsed');}

/* ── 진행 모달 ── */
function showProgress(title,sub,pct){
  const pm=$('progress-modal');if(!pm)return;
  const set=(id,v,prop)=>{const el=$(id);if(el){if(prop)el[prop]=v;else el.textContent=v;}};
  set('prog-title',title);set('prog-sub',sub||'');
  set('prog-bar',pct+'%','style.width');set('prog-pct',Math.round(pct||0)+'%');
  pm.classList.add('show');
}
function setProgress(pct,sub){
  const pb=$('prog-bar'),pp=$('prog-pct'),ps=$('prog-sub');
  if(pb)pb.style.width=pct+'%';if(pp)pp.textContent=Math.round(pct)+'%';
  if(sub&&ps)ps.textContent=sub;
}
function hideProgress(){const pm=$('progress-modal');if(pm)pm.classList.remove('show');}

/* ── 유틸 ── */
function fmtSize(b){
  if(!b||b===0)return'0 B';
  const k=1024,u=['B','KB','MB','GB'];
  const i=Math.floor(Math.log(b)/Math.log(k));
  return(b/Math.pow(k,i)).toFixed(i?1:0)+' '+u[i];
}
function fmtDate(d){
  if(!d)return'';
  try{return new Date(d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
  catch(e){return'';}
}
function getIcon(ext){
  const m={pdf:'📄',doc:'📝',docx:'📝',hwp:'📝',hwpx:'📝',xls:'📊',xlsx:'📊',csv:'📊',ppt:'📋',pptx:'📋',
    jpg:'🖼️',jpeg:'🖼️',png:'🖼️',gif:'🖼️',svg:'🎨',webp:'🖼️',ico:'🖼️',bmp:'🖼️',
    mp3:'🎵',wav:'🎵',flac:'🎵',aac:'🎵',ogg:'🎵',m4a:'🎵',
    mp4:'🎬',avi:'🎬',mov:'🎬',mkv:'🎬',webm:'🎬',
    zip:'🗜️',gz:'🗜️',rar:'🗜️',tar:'🗜️','7z':'🗜️',
    js:'📜',ts:'📜',json:'📋',xml:'📋',html:'🌐',css:'🎨',py:'🐍',java:'☕',
    txt:'📃',md:'📃',log:'📃',exe:'⚙️',dll:'⚙️'};
  return m[ext]||'📄';
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg,isErr){
  const t=$('toast');if(!t)return;
  t.textContent=msg;t.classList.toggle('err',!!isErr);t.classList.add('show');
  if(toastTid)clearTimeout(toastTid);toastTid=setTimeout(()=>t.classList.remove('show'),3200);
}
