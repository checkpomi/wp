<title id="page-title">pomiai 플랫포머</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#08080e;--s1:#0e0e18;--s2:#131320;--s3:#191928;--s4:#202032;
  --bd:#1c1c2e;--bd2:#262640;--bd3:#303050;
  --ac:#6c5ce8;--ac2:#9b8ff5;--ac3:rgba(108,92,232,.15);--ac4:rgba(108,92,232,.08);
  --go:#d4924a;--go2:#f0b060;--go3:rgba(212,146,74,.12);
  --te:#28c4a0;--te2:#4eddb8;--te3:rgba(40,196,160,.12);
  --re:#e05555;--re3:rgba(224,85,85,.12);
  --tx:#eeeaf8;--tx2:#8e8aac;--tx3:#52506a;--tx4:#2c2a3c;
  --sh:0 4px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overscroll-behavior:none}

#shell{max-width:420px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 0 18px}

#header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:var(--s1);border-bottom:1px solid var(--bd);z-index:20}
#logo{font-size:14px;font-weight:700;color:var(--ac2);letter-spacing:.5px}
#logo span{color:var(--tx3);font-weight:400}
#header .tagline{font-size:10px;color:var(--tx3);margin-top:1px}
.icon-btn{background:var(--s3);border:1px solid var(--bd2);color:var(--tx2);width:36px;height:36px;border-radius:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:active{background:var(--ac3);color:var(--ac2)}

#stats-row{display:flex;gap:8px;padding:12px 16px 6px}
.chip{flex:1;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:9px 6px;text-align:center}
.chip-label{font-size:9px;color:var(--tx3);font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px}
.chip-value{font-size:17px;font-weight:700;color:var(--tx);font-family:'DM Mono',monospace}

#board-area{position:relative;display:flex;justify-content:center;padding:10px 16px 4px;flex:1}
#canvas-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bd2);width:100%;max-width:300px}
#pause-overlay{position:absolute;inset:0;background:rgba(8,8,14,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:14px;z-index:5}
#pause-overlay.show{display:flex}
#pause-overlay .po-title{font-size:16px;font-weight:700;color:var(--ac2)}

#action-row{display:flex;gap:8px;padding:12px 16px 4px}
.btn{background:linear-gradient(135deg,var(--ac),#4a38c0);border:none;color:#fff;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;font-family:'DM Sans',sans-serif;box-shadow:0 4px 16px rgba(108,92,232,.28);flex:1}
.btn:active{filter:brightness(.92);transform:scale(.98)}
.btn.outline{background:transparent;border:1px solid var(--bd2);color:var(--tx2);box-shadow:none}
.btn.go{background:linear-gradient(135deg,var(--te),#1a8c72);box-shadow:0 4px 16px rgba(40,196,160,.22)}
.btn.re{background:linear-gradient(135deg,var(--re),#a83232);box-shadow:0 4px 16px rgba(224,85,85,.22)}
.btn:disabled{opacity:.4;pointer-events:none}

#control-pad{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;gap:14px;flex-wrap:wrap}
#dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;flex-shrink:0}
#dpad button{background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.1s}
#dpad button:active,#dpad button.active{background:var(--ac3);border-color:var(--ac);color:var(--ac2);transform:scale(.94)}
#action-buttons{display:flex;gap:8px;flex-wrap:wrap}
#action-buttons button{width:64px;height:56px;background:var(--s2);border:1px solid var(--bd2);border-radius:14px;color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.1s}
#action-buttons button:active{background:var(--te3);border-color:var(--te);color:var(--te2);transform:scale(.94)}
#action-buttons button.fire:active{background:var(--re3);border-color:var(--re);color:#ff9a9a}
#action-buttons button span{font-size:8px;font-weight:600;color:var(--tx3);letter-spacing:.4px}
#action-buttons button:active span{color:inherit}

#touch-hint{text-align:center;font-size:11px;color:var(--tx3);padding:8px 16px 2px}
#pc-hint{text-align:center;font-size:11px;color:var(--tx3);padding:6px 16px 2px}
@media (hover:none) and (pointer:coarse){ #pc-hint{display:none} }
@media (hover:hover) and (pointer:fine){ #touch-hint{display:none} }

.brand-footer{margin:16px 16px 0;padding:14px;border-radius:12px;background:var(--s1);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.brand-name{font-weight:700;font-size:13px;letter-spacing:-.01em;color:var(--tx)}
.brand-by{font-weight:600;font-size:11px;color:var(--tx3);margin-right:4px}
.brand-links{display:flex;gap:8px;flex-wrap:wrap}
.brand-links a{font-size:11px;font-weight:700;color:var(--tx2);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--s2);border:1px solid var(--bd2);white-space:nowrap}
.brand-links a:active{opacity:.7}

#gameover-modal{position:fixed;inset:0;background:rgba(4,4,8,.82);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#gameover-modal.show{display:flex}
.go-card{background:var(--s1);border:1px solid var(--bd2);border-radius:18px;padding:28px 24px;text-align:center;max-width:300px;width:100%;box-shadow:var(--sh)}
.go-title{font-size:20px;font-weight:700;color:var(--re);margin-bottom:8px}
.go-score-label{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-top:14px}
.go-score-val{font-size:30px;font-weight:700;color:var(--ac2);font-family:'DM Mono',monospace;margin-bottom:18px}

#landscape-lock{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#landscape-lock .rot-ic{font-size:44px;animation:rotpulse 1.6s ease-in-out infinite}
@keyframes rotpulse{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}
#landscape-lock .rot-txt{font-size:14px;color:var(--tx2);font-weight:600}
@media (orientation:landscape) and (hover:none) and (pointer:coarse){
  #landscape-lock{display:flex}
}

#canvas-wrap{max-width:300px}
#smCanvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#msg-toast{position:absolute;top:10px;left:50%;transform:translateX(-50%) translateY(-6px);background:rgba(14,14,24,.94);border:1px solid var(--bd2);color:var(--tx);font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:15;text-align:center;max-width:90%}
#msg-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>
</head>

  <div class="rot-ic">📱</div>
  <div class="rot-txt" data-i18n="orientation_msg">화면을 세로로 돌려주세요</div>
</div>

  <div id="header">
    <div>

  <div id="stats-row">

<script>
const I18N = {
  ko:{ page_title:'pomiai 플랫포머', tagline:'코인을 모아 깃발까지 달려가세요',
    world:'월드', coins:'코인', lives:'라이프',
    touch_hint:'LEFT/RIGHT 이동, JUMP 점프', pc_hint:'PC: 방향키 이동 · 위/스페이스 점프',
    btn_start:'시작', btn_pause:'일시정지', btn_reset:'리셋',
    orientation_msg:'화면을 세로로 돌려주세요',
    msg_dead:'게임 오버 · 최종 코인', msg_clear:'🎉 월드 클리어! 다음 월드' },
  en:{ page_title:'pomiai Platformer', tagline:'Collect coins and reach the flag',
    world:'World', coins:'Coins', lives:'Lives',
    touch_hint:'LEFT/RIGHT to move, JUMP to leap', pc_hint:'PC: Arrows to move · Up/Space to jump',
    btn_start:'Start', btn_pause:'Pause', btn_reset:'Reset',
    orientation_msg:'Please rotate to portrait',
    msg_dead:'Game Over · Final coins', msg_clear:'🎉 World cleared! Next world' },
  ja:{ page_title:'pomiai プラットフォーマー', tagline:'コインを集めて旗を目指そう',
    world:'ワールド', coins:'コイン', lives:'ライフ',
    touch_hint:'LEFT/RIGHTで移動、JUMPでジャンプ', pc_hint:'PC：矢印キー移動・上/スペースでジャンプ',
    btn_start:'スタート', btn_pause:'一時停止', btn_reset:'リセット',
    orientation_msg:'画面を縦向きにしてください',
    msg_dead:'ゲームオーバー・最終コイン', msg_clear:'🎉 ワールドクリア！次のワールドへ' }
};

(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  const LANG = (urlLang && I18N[urlLang]) ? urlLang
             : (I18N[browserLang]         ? browserLang : 'ko');
  window._LANG = LANG;
  window._T    = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
})();
function applyI18n() {
  const t = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (typeof t[k] === 'string') el.textContent = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.title = t.page_title;
}
applyI18n();
function bindHold(el, fn, repeatMs){
  repeatMs = repeatMs || 130;
  let iv=null;
  const start=(e)=>{ e.preventDefault(); fn(); el.classList.add('active'); iv=setInterval(fn,repeatMs); };
  const end=()=>{ clearInterval(iv); iv=null; el.classList.remove('active'); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointercancel', end);
}

const canvas = document.getElementById('smCanvas');
const ctx = canvas.getContext('2d');
const scoreEl=document.getElementById('scoreDisplay'), levelEl=document.getElementById('levelDisplay'), livesEl=document.getElementById('livesDisplay');
const toast=document.getElementById('msg-toast');
function showToast(msg,ms){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(showToast._tid); showToast._tid=setTimeout(()=>toast.classList.remove('show'), ms||1500); }

const TILE=40, ROWS=8;
let COLS=25, reqId=null, isPlaying=false, level=1, score=0, lives=3, map=[], camX=0, frameCount=0;
let keys={left:false,right:false,up:false};
const player={x:50,y:50,width:24,height:32,dx:0,dy:0,accel:0.6,friction:0.8,gravity:0.7,jumpPower:-12,grounded:false,isDead:false,facingRight:true};

const palette={R:'#ff5f7a',B:'#4e7dbf',S:'#ffcc99',H:'#8b4513',K:'#000000',Y:'#f0b060'};
const sprites={
  idle:["   RRRRR    ","  RRRRRRRRR ","  HHHSSHK   "," HSHHSSSKS  "," HSHHSSSKS  "," HHSSSSKKKK ","   SSSSSSS  ","  RRBBRR    "," RRRBBRRRR  ","RRRRBBBBRRR ","SSBBYYBBSS  ","SSBBBBBBSS  ","BBBBBBBBBB  ","  BB  BB    "," HHH  HHH   ","HHHH  HHHH  "],
  run:["   RRRRR    ","  RRRRRRRRR ","  HHHSSHK   "," HSHHSSSKS  "," HSHHSSSKS  "," HHSSSSKKKK ","   SSSSSSS  ","  RRBBRR    "," RRRBBRRRR  ","RRRRBBBBRRR ","SSBBYYBBS   ","SSBBBBBBSS  ","BBBBBBBBBB  ","   BB  HHH  ","  HHH  HHHH "," HHHH       "],
  jump:["   RRRRR    ","  RRRRRRRRR ","  HHHSSHK   "," HSHHSSSKS  "," HSHHSSSKS  "," HHSSSSKKKK ","   SSSSSSS  ","  RRBBRR  SS"," RRRBBRRRR S","RRRRBBBBRR  ","SSBBYYBB    "," SBBBBBB    ","  BB  BB    "," HHH  HHH   ","HHHH        ","            "]
};
palette.B = '#4e7dbf'; // ensure literal ref

function generateMap(lvl){
  COLS = 20+(lvl*5);
  let m = Array.from({length:ROWS},()=>Array(COLS).fill(0));
  for(let i=0;i<COLS;i++){
    m[ROWS-1][i]=1;
    if(i>5 && i<COLS-5 && Math.random()<0.15) m[ROWS-1][i]=0;
  }
  for(let i=4;i<COLS-4;i++){
    if(m[ROWS-1][i]===1 && Math.random()<0.3){
      let h=Math.random()>0.5?4:5;
      m[h][i]=2;
      if(Math.random()<0.6) m[h-1][i]=3;
    }
  }
  m[ROWS-2][COLS-2]=4; m[ROWS-3][COLS-2]=4; m[ROWS-4][COLS-2]=4; m[ROWS-5][COLS-2]=5;
  return m;
}
function initGame(full){
  if(full){ level=1; score=0; lives=3; }
  map=generateMap(level); resetPlayer(); updateUI();
}
function resetPlayer(){ player.x=50; player.y=50; player.dx=0; player.dy=0; player.grounded=false; player.isDead=false; camX=0; }
function updateUI(){ scoreEl.textContent=score*100; levelEl.textContent=level; livesEl.textContent=lives>0?'❤️'.repeat(lives):'💀'; }
function checkMapCollision(x,y){
  let col=Math.floor(x/TILE), row=Math.floor(y/TILE);
  if(row<0||row>=ROWS||col<0||col>=COLS) return 0;
  return map[row][col];
}
function collectCoin(col,row){ if(map[row][col]===3){ map[row][col]=0; score++; updateUI(); } }
function triggerDeath(){ if(player.isDead) return; player.isDead=true; player.dy=-10; lives--; updateUI(); }
function handleDeath(){
  isPlaying=false; cancelAnimationFrame(reqId);
  if(lives<=0){ showToast(`${window._T.msg_dead}: ${score*100}`, 2000); }
  else { resetPlayer(); isPlaying=true; gameLoop(); }
}
function levelClear(){
  if(!isPlaying) return;
  isPlaying=false; cancelAnimationFrame(reqId); level++;
  showToast(`${window._T.msg_clear} ${level}`, 1300);
  setTimeout(()=>{ initGame(); isPlaying=true; gameLoop(); }, 1100);
}
function updatePhysics(){
  if(player.isDead){
    player.dy+=player.gravity; player.y+=player.dy;
    if(player.y>canvas.height+50) handleDeath();
    return;
  }
  if(keys.left){ player.dx-=player.accel; player.facingRight=false; }
  if(keys.right){ player.dx+=player.accel; player.facingRight=true; }
  player.dx*=player.friction; player.x+=player.dx;

  let left=Math.floor(player.x/TILE), right=Math.floor((player.x+player.width-0.1)/TILE);
  let top=Math.floor(player.y/TILE), bottom=Math.floor((player.y+player.height-0.1)/TILE);
  for(let r=top;r<=bottom;r++) for(let c=left;c<=right;c++){
    let tile=checkMapCollision(c*TILE,r*TILE);
    if(tile===1||tile===2){
      if(player.dx>0){ player.x=c*TILE-player.width; player.dx=0; }
      else if(player.dx<0){ player.x=(c+1)*TILE; player.dx=0; }
    } else if(tile===3) collectCoin(c,r);
    else if(tile===4||tile===5) levelClear();
  }
  player.dy+=player.gravity; player.y+=player.dy; player.grounded=false;
  left=Math.floor(player.x/TILE); right=Math.floor((player.x+player.width-0.1)/TILE);
  top=Math.floor(player.y/TILE); bottom=Math.floor((player.y+player.height-0.1)/TILE);
  for(let r=top;r<=bottom;r++) for(let c=left;c<=right;c++){
    let tile=checkMapCollision(c*TILE,r*TILE);
    if(tile===1||tile===2){
      if(player.dy>0){ player.y=r*TILE-player.height; player.dy=0; player.grounded=true; }
      else if(player.dy<0){ player.y=(r+1)*TILE; player.dy=0; }
    } else if(tile===3) collectCoin(c,r);
    else if(tile===4||tile===5) levelClear();
  }
  if(player.y>canvas.height) triggerDeath();
  camX=player.x-canvas.width/2+player.width/2;
  if(camX<0) camX=0;
  if(camX>(COLS*TILE)-canvas.width) camX=(COLS*TILE)-canvas.width;
}
function draw(){
  ctx.fillStyle='#191a2e'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.translate(-camX,0);
  let startCol=Math.max(0,Math.floor(camX/TILE)), endCol=Math.min(COLS,Math.ceil((camX+canvas.width)/TILE));
  for(let r=0;r<ROWS;r++) for(let c=startCol;c<endCol;c++){
    let t=map[r][c], tx=c*TILE, ty=r*TILE;
    if(t===1){ ctx.fillStyle='#4eddb8'; ctx.fillRect(tx,ty,TILE,TILE/4); ctx.fillStyle='#5a3a20'; ctx.fillRect(tx,ty+TILE/4,TILE,TILE*0.75); ctx.strokeStyle='#08080e'; ctx.strokeRect(tx,ty,TILE,TILE); }
    else if(t===2){ ctx.fillStyle='#c9762e'; ctx.fillRect(tx,ty,TILE,TILE); ctx.strokeStyle='#08080e'; ctx.strokeRect(tx,ty,TILE,TILE); ctx.beginPath(); ctx.moveTo(tx,ty+TILE/2); ctx.lineTo(tx+TILE,ty+TILE/2); ctx.stroke(); }
    else if(t===3){ let pulse=Math.sin(frameCount*0.1)*2; ctx.fillStyle='#f0b060'; ctx.beginPath(); ctx.arc(tx+TILE/2,ty+TILE/2,10+pulse,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1; }
    else if(t===4){ ctx.fillStyle='#9b8ff5'; ctx.fillRect(tx+TILE/2-2,ty,4,TILE); }
    else if(t===5){ ctx.fillStyle='#f0b060'; ctx.beginPath(); ctx.arc(tx+TILE/2,ty+TILE/2,8,0,Math.PI*2); ctx.fill(); }
  }
  ctx.save();
  if(player.isDead) ctx.filter='grayscale(100%)';
  let cx=player.x+player.width/2, cy=player.y+player.height/2;
  ctx.translate(cx,cy);
  if(!player.facingRight) ctx.scale(-1,1);
  let state='idle';
  if(!player.grounded && !player.isDead) state='jump';
  else if(Math.abs(player.dx)>0.5 && !player.isDead) state=(Math.floor(frameCount/6)%2===0)?'run':'idle';
  let sprite=sprites[state], pSize=2, startX=-player.width/2, startY=-player.height/2;
  for(let r=0;r<16;r++) for(let c=0;c<12;c++){
    let code=sprite[r][c];
    if(code!==' '){ ctx.fillStyle=palette[code]; ctx.fillRect(startX+c*pSize, startY+r*pSize, pSize, pSize); }
  }
  ctx.restore();
  ctx.restore();
}
function gameLoop(){ if(!isPlaying) return; frameCount++; updatePhysics(); draw(); reqId=requestAnimationFrame(gameLoop); }

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(!isPlaying){ if(lives<=0) initGame(true); isPlaying=true; gameLoop(); }
});
document.getElementById('pauseBtn').addEventListener('click', ()=> isPlaying=false);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  isPlaying=false; cancelAnimationFrame(reqId); initGame(true); draw();
});
window.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
  if(e.code==='ArrowLeft') keys.left=true;
  if(e.code==='ArrowRight') keys.right=true;
  if((e.code==='ArrowUp'||e.code==='Space') && player.grounded && !player.isDead){ player.dy=player.jumpPower; player.grounded=false; }
}, {passive:false});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft') keys.left=false;
  if(e.code==='ArrowRight') keys.right=false;
});
function addTouch(id,key){
  const btn=document.getElementById(id);
  const down=e=>{e.preventDefault(); keys[key]=true;}, up=()=>keys[key]=false;
  btn.addEventListener('pointerdown',down); btn.addEventListener('pointerup',up);
  btn.addEventListener('pointerleave',up); btn.addEventListener('pointercancel',up);
}
addTouch('leftBtn','left'); addTouch('rightBtn','right');
document.getElementById('jumpBtn').addEventListener('pointerdown', e=>{
  e.preventDefault();
  if(player.grounded && !player.isDead && isPlaying){ player.dy=player.jumpPower; player.grounded=false; }
});

initGame(true);
draw();

</script>
</body>
</html>
