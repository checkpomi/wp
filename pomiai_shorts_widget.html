<!DOCTYPE html>
<html lang="ko" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">pomiai 쇼츠 라디오</title>
<meta name="description" content="pomiai의 짧은 음악 쇼츠를 라디오처럼 반복 재생하는 위젯">
<!-- YouTube IFrame API: 페이지 로드 시 즉시 준비 -->
<script src="https://www.youtube.com/iframe_api"></script>
<style>
  :root{
    --plum:#2b1f3d;--plum2:#3a2a52;--amber:#e8935a;
    --gold:#f4c873;--cream:#f4ede0;--rose:#d8788f;
    --line:rgba(244,237,224,.14);--shadow:0 18px 40px rgba(15,9,26,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;font-family:'Noto Sans KR',-apple-system,sans-serif}
  #widget{
    width:100%;max-width:300px;
    background:linear-gradient(165deg,var(--plum) 0%,var(--plum2) 55%,#241934 100%);
    border-radius:20px;padding:18px;color:var(--cream);
    box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden;
  }
  #widget::before{
    content:'';position:absolute;top:-40%;right:-30%;width:70%;height:70%;
    background:radial-gradient(circle,rgba(232,147,90,.25),transparent 70%);pointer-events:none;
  }
  #head{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:relative;z-index:1}
  #dial{width:9px;height:9px;border-radius:50%;background:var(--gold)}
  #dial.live{animation:pulse 1.6s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(244,200,115,.55)}
    70%{box-shadow:0 0 0 8px rgba(244,200,115,0)}
    100%{box-shadow:0 0 0 0 rgba(244,200,115,0)}
  }
  #title-area{flex:1;min-width:0}
  #eyebrow{font-size:10px;letter-spacing:.14em;color:var(--rose);font-weight:700;text-transform:uppercase}
  #wname{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #disc-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;position:relative;z-index:1}
  #disc-wrap{width:64px;height:64px;flex-shrink:0;position:relative}
  #disc{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,var(--plum) 0 14%,transparent 14.5%),
               repeating-radial-gradient(circle,#1c1428 0,#1c1428 2px,#2a1f3a 2px,#2a1f3a 4px);
    border:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  #disc.spin{animation:spin 3.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #disc-center{
    position:absolute;top:50%;left:50%;width:14px;height:14px;
    transform:translate(-50%,-50%);background:var(--amber);border-radius:50%;border:2px solid var(--plum);
  }
  #now-info{flex:1;min-width:0}
  #now-label{font-size:10px;color:var(--rose);font-weight:700;letter-spacing:.08em;margin-bottom:2px}
  #now-title{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  #now-track{font-size:11px;color:rgba(244,237,224,.6)}
  #progress-track{
    position:relative;z-index:1;height:3px;background:rgba(244,237,224,.15);
    border-radius:99px;margin-bottom:14px;overflow:hidden;
  }
  #progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:99px;transition:width .25s linear}
  #controls{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1;margin-bottom:12px}
  .ctrl-btn{
    background:rgba(244,237,224,.08);border:1px solid var(--line);color:var(--cream);
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.18s;
  }
  .ctrl-btn:hover{background:rgba(244,237,224,.18);transform:translateY(-1px)}
  .ctrl-btn svg{width:14px;height:14px}
  #play-btn{
    width:46px;height:46px;background:linear-gradient(135deg,var(--amber),var(--rose));
    border:none;box-shadow:0 6px 16px rgba(232,147,90,.35);
  }
  #play-btn svg{width:18px;height:18px}
  #play-btn:hover{transform:translateY(-1px) scale(1.03)}
  #mode-row{display:flex;justify-content:center;gap:8px;position:relative;z-index:1;margin-bottom:4px}
  .mode-chip{
    font-size:10px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);
    background:rgba(244,237,224,.05);color:rgba(244,237,224,.65);cursor:pointer;font-weight:600;transition:.15s;
  }
  .mode-chip.on{background:linear-gradient(135deg,var(--amber),var(--gold));color:var(--plum);border-color:transparent}
  #counter{text-align:center;font-size:10px;color:rgba(244,237,224,.4);margin-top:10px;position:relative;z-index:1}
  #toast{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    background:rgba(232,147,90,.9);color:var(--plum);font-size:11px;font-weight:700;
    padding:6px 14px;border-radius:99px;z-index:10;opacity:0;transition:opacity .25s;
    white-space:nowrap;pointer-events:none;
  }
  #toast.show{opacity:1}
  /* 숨겨진 플레이어 */
  #hidden-player{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>

<div id="widget">
  <div id="head">
    <div id="dial"></div>
    <div id="title-area">
      <div id="eyebrow">NOW STREAMING</div>
      <div id="wname">pomiai 쇼츠 라디오</div>
    </div>
  </div>

  <div id="disc-row">
    <div id="disc-wrap">
      <div id="disc"><div id="disc-center"></div></div>
    </div>
    <div id="now-info">
      <div id="now-label">현재 곡</div>
      <div id="now-title">—</div>
      <div id="now-track">0 / 0</div>
    </div>
  </div>

  <div id="progress-track"><div id="progress-fill"></div></div>

  <div id="controls">
    <button class="ctrl-btn" id="prev-btn" title="이전">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn" id="play-btn" title="재생">
      <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="next-btn" title="다음">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
  </div>

  <div id="mode-row">
    <button class="mode-chip on" id="mode-loop-all">전체반복</button>
    <button class="mode-chip" id="mode-loop-one">1곡반복</button>
    <button class="mode-chip" id="mode-shuffle">랜덤</button>
  </div>

  <div id="counter"><span id="counter-text">0 / 0</span></div>
  <div id="toast"></div>
</div>

<div id="hidden-player"><div id="yt-player"></div></div>

<script>
/* ============================================================
   쇼츠 데이터
   ▼ videoId: "" → 실제 YouTube 쇼츠 영상 ID로 교체
   예) "dQw4w9WgXcQ"  (유튜브 URL의 v= 또는 shorts/ 뒤 11자리)
   ============================================================ */
const SHORTS = [
  { videoId: "", title: "pomiai shorts 01" },
  { videoId: "", title: "pomiai shorts 02" },
  { videoId: "", title: "pomiai shorts 03" },
  { videoId: "", title: "pomiai shorts 04" },
  { videoId: "", title: "pomiai shorts 05" },
  { videoId: "", title: "pomiai shorts 06" },
  { videoId: "", title: "pomiai shorts 07" },
  { videoId: "", title: "pomiai shorts 08" },
  { videoId: "", title: "pomiai shorts 09" },
  { videoId: "", title: "pomiai shorts 10" },
  { videoId: "", title: "pomiai shorts 11" },
  { videoId: "", title: "pomiai shorts 12" },
  { videoId: "", title: "pomiai shorts 13" },
  { videoId: "", title: "pomiai shorts 14" },
  { videoId: "", title: "pomiai shorts 15" },
  { videoId: "", title: "pomiai shorts 16" },
  { videoId: "", title: "pomiai shorts 17" },
  { videoId: "", title: "pomiai shorts 18" },
  { videoId: "", title: "pomiai shorts 19" },
  { videoId: "", title: "pomiai shorts 20" },
  { videoId: "", title: "pomiai shorts 21" },
  { videoId: "", title: "pomiai shorts 22" },
  { videoId: "", title: "pomiai shorts 23" },
  { videoId: "", title: "pomiai shorts 24" },
  { videoId: "", title: "pomiai shorts 25" },
  { videoId: "", title: "pomiai shorts 26" },
  { videoId: "", title: "pomiai shorts 27" },
  { videoId: "", title: "pomiai shorts 28" },
  { videoId: "", title: "pomiai shorts 29" },
  { videoId: "", title: "pomiai shorts 30" },
  { videoId: "", title: "pomiai shorts 31" },
  { videoId: "", title: "pomiai shorts 32" },
  { videoId: "", title: "pomiai shorts 33" },
  { videoId: "", title: "pomiai shorts 34" },
  { videoId: "", title: "pomiai shorts 35" },
  { videoId: "", title: "pomiai shorts 36" },
  { videoId: "", title: "pomiai shorts 37" },
  { videoId: "", title: "pomiai shorts 38" },
  { videoId: "", title: "pomiai shorts 39" },
  { videoId: "", title: "pomiai shorts 40" }
];

/* ============================================================
   유효한 트랙만 필터링
   ============================================================ */
const VALID = SHORTS.filter(s => s.videoId.trim() !== "");

/* ============================================================
   상태
   ============================================================ */
let player = null;
let playerReady = false;
let curIdx = 0;       // VALID 배열 기준 인덱스
let isPlaying = false;
let playMode = 'loop_all';
let shuffleOrder = [], shufflePos = 0;
let progressTimer = null;

const $ = id => document.getElementById(id);

/* ============================================================
   유틸
   ============================================================ */
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2400);
}

function buildShuffleOrder() {
  shuffleOrder = VALID.map((_, i) => i).sort(() => Math.random() - 0.5);
  shufflePos = Math.max(0, shuffleOrder.indexOf(curIdx));
}

function setMode(mode) {
  playMode = mode;
  $('mode-loop-all').classList.toggle('on', mode === 'loop_all');
  $('mode-loop-one').classList.toggle('on', mode === 'loop_one');
  $('mode-shuffle').classList.toggle('on', mode === 'shuffle');
  if (mode === 'shuffle') buildShuffleOrder();
}

function nextIndex() {
  if (!VALID.length) return 0;
  if (playMode === 'loop_one') return curIdx;
  if (playMode === 'shuffle') {
    if (!shuffleOrder.length) buildShuffleOrder();
    shufflePos = (shufflePos + 1) % shuffleOrder.length;
    if (shufflePos === 0) buildShuffleOrder();
    return shuffleOrder[shufflePos];
  }
  return (curIdx + 1) % VALID.length;
}

function prevIndex() {
  if (!VALID.length) return 0;
  if (playMode === 'shuffle') {
    if (!shuffleOrder.length) buildShuffleOrder();
    shufflePos = (shufflePos - 1 + shuffleOrder.length) % shuffleOrder.length;
    return shuffleOrder[shufflePos];
  }
  return (curIdx - 1 + VALID.length) % VALID.length;
}

/* ============================================================
   UI 업데이트
   ============================================================ */
function updateNowInfo() {
  if (!VALID.length) {
    $('now-title').textContent = 'ID를 입력하면 재생돼요';
    $('now-track').textContent = '0 / 0';
    $('counter-text').textContent = '0 / 0';
    return;
  }
  const track = VALID[curIdx];
  $('now-title').textContent = track.title;
  $('now-track').textContent = `${curIdx + 1} / ${VALID.length}`;
  $('counter-text').textContent = `${curIdx + 1} / ${VALID.length}`;
}

function setPlayingUI(playing) {
  isPlaying = playing;
  $('disc').classList.toggle('spin', playing);
  $('dial').classList.toggle('live', playing);
  $('play-icon').innerHTML = playing
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateProgress() {
  if (!player || !playerReady || !isPlaying) return;
  try {
    const dur = player.getDuration() || 27;
    const cur = player.getCurrentTime() || 0;
    $('progress-fill').style.width = Math.min(100, (cur / dur) * 100) + '%';
  } catch(e) {}
}

/* ============================================================
   플레이어 제어
   ============================================================ */
function loadAndPlay(idx) {
  if (!VALID.length) { showToast('📋 먼저 videoId를 입력해주세요'); return; }
  curIdx = idx;
  updateNowInfo();
  if (player && playerReady) {
    player.loadVideoById(VALID[curIdx].videoId);
  }
}

function togglePlay() {
  if (!VALID.length) { showToast('📋 먼저 videoId를 입력해주세요'); return; }
  if (!playerReady) { showToast('⏳ 플레이어 준비 중...'); return; }
  if (isPlaying) {
    player.pauseVideo();
  } else {
    if (player.getVideoUrl && player.getVideoUrl().includes('v=')) {
      player.playVideo();
    } else {
      player.loadVideoById(VALID[curIdx].videoId);
    }
  }
}

/* ============================================================
   YouTube IFrame API 콜백 (페이지 로드 시 자동 호출됨)
   ============================================================ */
window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('yt-player', {
    height: '1', width: '1',
    playerVars: { playsinline: 1, controls: 0, modestbranding: 1, rel: 0 },
    events: {
      onReady: function() {
        playerReady = true;
        // 첫 번째 유효한 트랙 로드만 해두고 재생은 안 함 (사용자 클릭 대기)
        if (VALID.length) {
          player.cueVideoById(VALID[0].videoId);
        }
        updateNowInfo();
        progressTimer = setInterval(updateProgress, 250);
      },
      onStateChange: function(e) {
        if (e.data === YT.PlayerState.PLAYING)  setPlayingUI(true);
        if (e.data === YT.PlayerState.PAUSED)   setPlayingUI(false);
        if (e.data === YT.PlayerState.ENDED)    loadAndPlay(nextIndex());
        if (e.data === YT.PlayerState.BUFFERING) setPlayingUI(true);
      }
    }
  });
};

/* ============================================================
   이벤트 바인딩
   ============================================================ */
$('play-btn').addEventListener('click', togglePlay);
$('next-btn').addEventListener('click', () => loadAndPlay(nextIndex()));
$('prev-btn').addEventListener('click', () => loadAndPlay(prevIndex()));
$('mode-loop-all').addEventListener('click', () => setMode('loop_all'));
$('mode-loop-one').addEventListener('click', () => setMode('loop_one'));
$('mode-shuffle').addEventListener('click', () => setMode('shuffle'));

/* 초기화 */
updateNowInfo();
setMode('loop_all');
</script>
</body>
</html>
