.flow{display:grid;gap:6px}
.flow-row{display:grid;grid-template-columns:52px 1fr 84px;gap:8px;align-items:center;font-size:13px}
.track{position:relative;height:16px;background:var(--hold-bg);border-radius:2px}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink);opacity:.45}
.fbar{position:absolute;top:0;bottom:0;border-radius:2px}
.fbar.p{left:50%;background:var(--up)} .fbar.n{right:50%;background:var(--down)}
.flow-row .amt{text-align:right;font-weight:600}
.sub{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}

.world b{display:block;font-size:12px;color:var(--muted);font-weight:600}

.stage{display:inline-block;min-width:54px;text-align:center;font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--hold-bg);color:var(--hold)}
.news{list-style:none;margin:0;padding:0;display:grid;gap:7px}

footer{font-size:12px;color:var(--muted);display:grid;gap:6px;padding:4px 2px}

      newsSmall: function (n) { return "last 24 hours: " + n.total + " headlines, " + n.pos + " positive · " + n.neg + " negative"; },
      pos: "Positive", neg: "Negative", neu: "Neutral", newsNote: "This only counts words in headlines, so it carries the least weight.",
      hist: "Signal track record", histSmallEmpty: "next-day result of both-buying signals",
      histEmpty: "No record yet. After a few days of collection, both the signals that worked and the ones that missed stay here.",
      histRate: "rose the next day: ", histWait: "awaiting results", pending: "pending",
      thSigDay: "Signal date", thNext: "Next trading-day change of the top both-buying stocks", histNote: "Missed signals are not removed.",
      src: "Collection status", ok: "OK", planned: "planned", bad: "failed", okOf: " OK"
    }
  };
  var t = T[L];

  // 수집 데이터에 들어 있는 한국어 라벨을 영어 화면에서 바꿔 준다. (종목명·공시 제목·뉴스 제목은 원문 그대로)
  var MAP = {
    "우호적": "Favorable", "관망": "Wait and see", "주의": "Caution", "판정 보류": "No verdict",
    "동시 매수": "Both buying", "외국인만": "Foreign only", "기관만": "Institutions only",
    "코스피": "KOSPI", "코스닥": "KOSDAQ", "유가": "KOSPI",
    "나스닥": "Nasdaq", "다우": "Dow", "필라델피아 반도체": "PHLX Semiconductor", "원/달러": "USD/KRW",
    "호재성": "Positive", "악재성": "Negative", "내용 확인": "Check details",
    "지수 코스피": "KOSPI index", "지수 코스닥": "KOSDAQ index", "투자자 수급 코스피": "KOSPI investor flows",
    "투자자 수급 코스닥": "KOSDAQ investor flows", "종목별 수급": "Stock-level flows", "거래량 급증": "Volume spikes",
    "관심종목 시세": "Watchlist prices", "공시 DART": "DART filings", "해외 지수·환율": "Overseas indices and FX",
    "뉴스 제목": "News headlines", "공매도·신용잔고": "Short selling and margin", "신호 성적표": "Signal track record"
  };
  function tx(s) {
    if (L === "ko" || s == null) return s;
    return Object.prototype.hasOwnProperty.call(MAP, s) ? MAP[s] : s;
  }
  function txReason(s) {
    if (L === "ko" || s == null) return s;
    var m = String(s).match(/^뉴스 제목 긍정 (\d+) · 부정 (\d+)$/);
    if (m) return "Headlines: " + m[1] + " positive · " + m[2] + " negative";
    return String(s)
      .replace("판정에 쓸 자료를 받지 못했습니다", "No data available for a verdict")
      .replace("코스피 보합", "KOSPI flat").replace("코스피", "KOSPI")
      .replace("외국인 순매수", "Foreign net buy").replace("외국인 순매도", "Foreign net sell")
      .replace("기관", "Institutions").replace("나스닥", "Nasdaq")
      .replace(/억$/, " (KRW 100M)");
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function fmt(v, d) {
    if (!isNum(v)) return "-";
    return v.toLocaleString(LOCALE, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  }
  function signed(v, d, unit) {
    if (!isNum(v)) return '<span class="muted">-</span>';
    var cls = v > 0 ? "up" : (v < 0 ? "down" : "muted");
    return '<span class="num ' + cls + '">' + (v > 0 ? "+" : "") + fmt(v, d) + (unit || "") + "</span>";
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function empty(msg) { return '<div class="empty">' + esc(msg) + "</div>"; }
  function sec(title, small, body, cls) {
    return '<section class="' + (cls || "") + '"><h2>' + esc(title) + (small ? " <small>" + esc(small) + "</small>" : "") + "</h2>" + body + "</section>";
  }
  function stockName(x) {
    return esc(x.name) + (L === "en" && x.code ? ' <span class="muted num">' + esc(x.code) + "</span>" : "");
  }
  function rankText(r) { return r ? (L === "ko" ? r + t.rank : "#" + r) : "-"; }
  function stageText(s) { return L === "ko" ? s + t.stage : "Stage " + s; }

  function vVerdict(d) {
    var v = d.verdict || {};
    var chips = (v.reasons || []).map(function (r) {
      return '<span class="pill ' + esc(r[0]) + '">' + esc(txReason(r[1])) + "</span>";
    }).join("");
    return '<section class="verdict ' + esc(v.tone || "neu") + '"><div class="label">' + esc(t.vLabel) + "</div>" +
      '<div class="call">' + esc(tx(v.label) || t.vNone) + "</div>" +
      '<div class="chips">' + chips + "</div>" +
      '<p class="note">' + esc(t.vNote) + "</p></section>";
  }

  function vIndex(d) {
    var ix = d.index || {};
    function one(name, o) {
      if (!o || !isNum(o.value)) return '<div class="idx"><div class="name">' + esc(name) + '</div><div class="muted">' + esc(t.fail) + "</div></div>";
      var cls = o.pct > 0 ? "up" : (o.pct < 0 ? "down" : "muted");
      var arrow = o.pct > 0 ? "▲" : (o.pct < 0 ? "▼" : "");
      return '<div class="idx"><div class="name">' + esc(name) + '</div><div class="val num">' + fmt(o.value, 2) + "</div>" +
        '<div class="chg num ' + cls + '">' + arrow + " " + (isNum(o.chg) ? fmt(Math.abs(o.chg), 2) : "") +
        " (" + (o.pct > 0 ? "+" : "") + fmt(o.pct, 2) + "%)</div></div>";
    }
    return sec(t.idx, d.market_open ? t.open : t.closed, '<div class="grid2">' + one(t.kospi, ix.kospi) + one(t.kosdaq, ix.kosdaq) + "</div>");
  }

  function vFlow(d) {
    var f = d.flow || {};
    function block(name, o) {
      if (!o) return '<div class="sub">' + esc(name) + "</div>" + empty(t.flowFail);
      var max = Math.max(Math.abs(o.foreign || 0), Math.abs(o.inst || 0), Math.abs(o.personal || 0), 1);
      function row(label, v) {
        var w = isNum(v) ? Math.max(0.5, Math.abs(v) / max * 50) : 0;
        return '<div class="flow-row"><span>' + esc(label) + '</span><div class="track"><div class="fbar ' + (v >= 0 ? "p" : "n") +
          '" style="width:' + w.toFixed(1) + '%"></div></div><span class="amt">' + signed(v, 0) + "</span></div>";
      }
      return '<div class="sub">' + esc(name) + '</div><div class="flow">' + row(t.foreign, o.foreign) + row(t.inst, o.inst) + row(t.personal, o.personal) + "</div>";
    }
    return sec(t.flow, t.flowUnit, block(t.kospi, f.kospi) + block(t.kosdaq, f.kosdaq) + '<p class="note">' + esc(t.flowNote) + "</p>");
  }

  function vWorld(d) {
    var w = d.world || [];
    if (!w.length) return sec(t.world, "", empty(t.worldFail));
    return sec(t.world, t.worldSmall, '<div class="world">' + w.map(function (x) {
      return "<div><b>" + esc(tx(x.name)) + '</b><span class="num">' + fmt(x.value, 2) + "</span> " + signed(x.pct, 2, "%") + "</div>";
    }).join("") + "</div>");
  }

  function vSupply(d) {
    var s = d.supply;
    if (!s || !(s.picks || []).length) return sec(t.supply, "", empty(t.supplyFail));
    var rows = s.picks.map(function (p) {
      var cls = p.signal === "동시 매수" ? "go" : "wait";
      return "<tr><td>" + stockName(p) + ' <span class="muted">' + esc(tx(p.market)) + "</span></td>" +
        '<td><span class="pill ' + cls + '">' + esc(tx(p.signal)) + "</span></td>" +
        '<td class="r num">' + rankText(p.foreign_rank) + "</td>" +
        '<td class="r num">' + rankText(p.inst_rank) + "</td>" +
        '<td class="r num">' + fmt(p.score, 0) + "</td></tr>";
    }).join("");
    return sec(t.supply, (s.date ? s.date + t.asOf : t.lastDay),
      '<div class="scroll"><table><thead><tr><th>' + esc(t.thStock) + "</th><th>" + esc(t.thSignal) + '</th><th class="r">' + esc(t.thForeign) +
      '</th><th class="r">' + esc(t.thInst) + '</th><th class="r">' + esc(t.thScore) + "</th></tr></thead><tbody>" +
      rows + "</tbody></table></div>" + '<p class="note">' + esc(t.supplyNote) + "</p>");
  }

  function vSurge(d) {
    var s = d.surge || [];
    if (!s.length) return sec(t.surge, "", empty(t.surgeFail));
    var rows = s.map(function (x) {
      return "<tr><td>" + stockName(x) + ' <span class="muted">' + esc(tx(x.market)) + "</span></td>" +
        '<td class="r num">' + fmt(x.price, 0) + '</td><td class="r">' + signed(x.pct, 2, "%") + "</td>" +
        '<td class="r num">' + (isNum(x.ratio) ? fmt(x.ratio, 0) + "%" : "-") + "</td></tr>";
    }).join("");
    return sec(t.surge, t.surgeSmall,
      '<div class="scroll"><table><thead><tr><th>' + esc(t.thStock) + '</th><th class="r">' + esc(t.thPrice) + '</th><th class="r">' + esc(t.thChg) +
      '</th><th class="r">' + esc(t.thVol) + "</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<p class="note">' + esc(t.surgeNote) + "</p>");
  }

  function spark(arr) {
    if (!arr || arr.length < 2) return "";
    var min = Math.min.apply(null, arr), max = Math.max.apply(null, arr), span = (max - min) || 1;
    var pts = arr.map(function (v, i) {
      return (i / (arr.length - 1) * 68 + 1).toFixed(1) + "," + (20 - (v - min) / span * 18).toFixed(1);
    }).join(" ");
    var up = arr[arr.length - 1] >= arr[0];
    return '<svg class="sp" viewBox="0 0 70 22" aria-hidden="true"><polyline fill="none" stroke="var(' + (up ? "--up" : "--down") + ')" stroke-width="1.4" points="' + pts + '"/></svg>';
  }

  function vWatch(d) {
    var w = d.watch || [];
    if (!w.length) return sec(t.watch, t.watchSmallFail, empty(t.watchFail));
    var sorted = w.slice().sort(function (a, b) { return (isNum(a.disp) ? a.disp : 999) - (isNum(b.disp) ? b.disp : 999); });
    var rows = sorted.map(function (x) {
      if (!isNum(x.close)) return "<tr><td>" + stockName(x) + '</td><td class="muted" colspan="6">' + esc(t.priceFail) + "</td></tr>";
      var st = isNum(x.stage) ? x.stage : null;
      return "<tr><td>" + stockName(x) + (x.name_check ? ' <span class="pill wait">' + esc(t.codeCheck + x.name_check) + "</span>" : "") + "</td>" +
        '<td class="r num">' + fmt(x.close, 0) + '</td><td class="r">' + signed(x.pct, 2, "%") + "</td>" +
        '<td class="r num">' + fmt(x.ma120, 0) + '</td><td class="r num">' + fmt(x.disp, 1) + "</td>" +
        '<td><span class="stage' + (st >= 3 ? " st" + st : "") + '">' + (st === null ? "-" : stageText(st)) + "</span></td>" +
        "<td>" + spark(x.spark) + "</td></tr>";
    }).join("");
    var stages = d.stages || [[100, 0], [90, 1], [80, 2], [70, 3]];
    var scale = stages.map(function (s, i) {
      var range = i === 0 ? s[0] + t.orMore : s[0] + "~" + stages[i - 1][0];
      return '<div class="' + (s[1] >= 3 ? "st" + s[1] : "") + '"><b>' + stageText(s[1]) + "</b>" + range + "</div>";
    }).join("") + '<div class="st4"><b>' + stageText(4) + "</b>" + (L === "ko" ? stages[stages.length - 1][0] + t.under : "< " + stages[stages.length - 1][0]) + "</div>";
    var date = (sorted.find(function (x) { return x.date; }) || {}).date || "";
    return sec(t.watch, t.watchSmall + (date ? " · " + date : ""),
      '<div class="scroll"><table><thead><tr><th>' + esc(t.thStock) + '</th><th class="r">' + esc(t.thPrice) + '</th><th class="r">' + esc(t.thChg) +
      '</th><th class="r">' + esc(t.thMa) + '</th><th class="r">' + esc(t.thDisp) + "</th><th>" + esc(t.thStage) + "</th><th>" + esc(t.th60) + "</th></tr></thead><tbody>" +
      rows + '</tbody></table></div><div class="scale">' + scale + "</div>" + '<p class="note">' + esc(t.watchNote) + "</p>");
  }

  function vDart(d) {
    var a = d.dart || [];
    if (!a.length) return sec(t.dart, "DART", empty(t.dartFail));
    var tone = { pos: "pos", neg: "neg", chk: "wait" };
    var rows = a.map(function (x) {
      var u = safeUrl(x.url);
      var title = u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(x.title) + "</a>" : esc(x.title);
      return '<tr><td class="num">' + esc(x.time) + "</td><td>" + esc(tx(x.market)) + "</td><td>" + esc(x.corp) +
        '</td><td class="wrap">' + title + '</td><td><span class="pill ' + (tone[x.tone] || "off") + '">' + esc(tx(x.label)) + "</span></td></tr>";
    }).join("");
    return sec(t.dart, t.dartSmall,
      '<div class="scroll"><table><thead><tr><th>' + esc(t.thTime) + "</th><th>" + esc(t.thMkt) + "</th><th>" + esc(t.thCorp) + "</th><th>" +
      esc(t.thWhat) + "</th><th>" + esc(t.thTone) + "</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<p class="note">' + esc(t.dartNote) + "</p>");
  }

  function vNews(d) {
    var n = d.news;
    if (!n || !(n.items || []).length) return sec(t.news, "", empty(t.newsFail));
    var items = n.items.map(function (x) {
      var u = safeUrl(x.url);
      return '<li><span class="pill ' + esc(x.tone) + '">' + esc(t[x.tone] || t.neu) + "</span><span>" +
        (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(x.title) + "</a>" : esc(x.title)) + "</span></li>";
    }).join("");
    return sec(t.news, t.newsSmall(n), '<ul class="news">' + items + '</ul><p class="note">' + esc(t.newsNote) + "</p>");
  }

  function vHistory(d) {
    var h = (d.history || []).slice().reverse();
    if (!h.length) return sec(t.hist, t.histSmallEmpty, empty(t.histEmpty));
    var hit = 0, tot = 0;
    var rows = h.map(function (x) {
      var cells = x.picks.map(function (p) {
        if (isNum(p.next_pct)) { tot++; if (p.next_pct > 0) hit++; }
        return esc(p.name) + " " + (isNum(p.next_pct) ? signed(p.next_pct, 2, "%") : '<span class="muted">' + esc(t.pending) + "</span>");
      }).join(" · ");
      return '<tr><td class="num">' + esc(x.date) + '</td><td class="wrap">' + cells + "</td></tr>";
    }).join("");
    return sec(t.hist, tot ? t.histRate + hit + "/" + tot : t.histWait,
      '<div class="scroll"><table><thead><tr><th>' + esc(t.thSigDay) + "</th><th>" + esc(t.thNext) + "</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<p class="note">' + esc(t.histNote) + "</p>");
  }

  function vSources(d) {
    var s = d.sources || {};
    var chips = Object.keys(s).map(function (k) {
      var o = s[k];
      var cls = o.ok ? "ok" : (o.planned ? "" : "bad");
      return '<span class="' + cls + '">' + esc(tx(k)) + " " + esc(o.ok ? t.ok : (o.planned ? t.planned : t.bad)) + "</span>";
    }).join("");
    return sec(t.src, d.summary ? d.summary.ok + "/" + d.summary.total + t.okOf : "", '<div class="src">' + chips + "</div>");
  }

  function render(d) {
    var dt = new Date(d.generated_at);
    var age = Math.round((Date.now() - dt.getTime()) / 60000);
    var when = isNaN(dt) ? String(d.generated_at) : dt.toLocaleString(LOCALE, { timeZone: "Asia/Seoul", month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });
    var ago = isNaN(age) ? "" : " · " + (age < 1 ? t.justNow : age < 120 ? age + t.minAgo : Math.round(age / 60) + t.hrAgo);
    stamp.textContent = t.collected + when + t.kst + ago;
    app.innerHTML = vVerdict(d) + vIndex(d) + vFlow(d) + vWorld(d) + vSupply(d) + vSurge(d) + vWatch(d) + vDart(d) + vNews(d) + vHistory(d) + vSources(d);
  }

  function load(url) {
    return fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function refresh() {
    btn.disabled = true;
    btn.textContent = t.refreshing;
    var a = load(LOCAL).catch(function () { return null; });
    var b = load(RAW).catch(function () { return null; });
    Promise.all([a, b]).then(function (res) {
      var docs = res.filter(function (x) { return x && x.generated_at; });
      if (!docs.length) {
        stamp.textContent = t.noData;
        app.innerHTML = "<section>" + empty(t.loadFail) + "</section>";
        return;
      }
      docs.sort(function (x, y) { return new Date(y.generated_at) - new Date(x.generated_at); });
      render(docs[0]);
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = t.refresh;
    });
  }

  // 고정 문구 적용
  document.documentElement.setAttribute("lang", L);
  document.title = t.title;
  document.getElementById("t-h1").textContent = t.h1;
  document.getElementById("t-loading").textContent = t.loading;
  document.getElementById("t-f1").innerHTML = t.f1;
  document.getElementById("t-f2").textContent = t.f2;
  document.getElementById("t-f3").textContent = t.f3;
  btn.textContent = t.refresh;

  btn.addEventListener("click", refresh);
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
