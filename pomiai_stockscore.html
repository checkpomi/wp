<!DOCTYPE html>
<html lang="ko" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="pomiai stock score dashboard: KOSPI200 / KOSDAQ150 valuation (PER, PBR, ROE), AI diagnostic score, AI price prediction and supply/demand signal for your watchlist. Export to CSV/Excel or print/save as PDF.">
<title id="page-title">관심종목 진단 · AI예측 대시보드 | pomiai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    color-scheme: light;
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #efece4;
    --text-primary: #16181c;
    --text-secondary: #565a66;
    --text-muted: #8c8f97;
    --border: rgba(15,20,30,0.11);
    --border-strong: rgba(15,20,30,0.18);
    --accent: #3a4f73;
    --accent-strong: #24344f;
    --accent-tint: #e7ebf3;
    --badge-kospi: #b34d20;
    --badge-kospi-bg: #fbe6d8;
    --badge-kosdaq: #10805a;
    --badge-kosdaq-bg: #dcf3e9;
    --badge-etc: #493a9e;
    --badge-etc-bg: #eae6fa;
    --up: #b8302f;
    --up-bg: #fbe6e5;
    --down: #1f5fac;
    --down-bg: #e4edfa;
    --neutral: #8c8f97;
    --shadow: 0 1px 2px rgba(20,20,15,0.04), 0 8px 24px -14px rgba(20,20,15,0.18);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0c0d0f;
      --surface: #17181c;
      --surface-2: #1e2024;
      --text-primary: #f4f4f2;
      --text-secondary: #c3c2b7;
      --text-muted: #8c8f97;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --accent: #93a9d6;
      --accent-strong: #b7c6e8;
      --accent-tint: rgba(147,169,214,0.14);
      --badge-kospi: #f0a578;
      --badge-kospi-bg: rgba(217,89,38,0.18);
      --badge-kosdaq: #6fe0b8;
      --badge-kosdaq-bg: rgba(25,158,112,0.18);
      --badge-etc: #c3bdf5;
      --badge-etc-bg: rgba(144,133,233,0.18);
      --up: #ea8280;
      --up-bg: rgba(224,102,100,0.16);
      --down: #7fa9e6;
      --down-bg: rgba(57,135,229,0.16);
      --neutral: #93949b;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0d0f;
    --surface: #17181c;
    --surface-2: #1e2024;
    --text-primary: #f4f4f2;
    --text-secondary: #c3c2b7;
    --text-muted: #8c8f97;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --accent: #93a9d6;
    --accent-strong: #b7c6e8;
    --accent-tint: rgba(147,169,214,0.14);
    --badge-kospi: #f0a578;
    --badge-kospi-bg: rgba(217,89,38,0.18);
    --badge-kosdaq: #6fe0b8;
    --badge-kosdaq-bg: rgba(25,158,112,0.18);
    --badge-etc: #c3bdf5;
    --badge-etc-bg: rgba(144,133,233,0.18);
    --up: #ea8280;
    --up-bg: rgba(224,102,100,0.16);
    --down: #7fa9e6;
    --down-bg: rgba(57,135,229,0.16);
    --neutral: #93949b;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -14px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  /* ---------- header ---------- */
  header { margin-bottom: 22px; }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 12.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 3.2vw, 30px);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .meta-block {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .updated {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .updated .num { color: var(--text-primary); font-weight: 500; }
  .refresh-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  .refresh-btn:hover { background: var(--accent-strong); }
  .refresh-btn:active { transform: translateY(1px); }
  .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .refresh-icon { display:inline-block; transition: transform .5s ease; }
  .refresh-btn.spinning .refresh-icon { transform: rotate(360deg); }

  .cadence-note {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ---------- stat tiles ---------- */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .stat-tile .label {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .stat-tile .value {
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .stat-tile .value.up { color: var(--up); }
  .stat-tile .value.down { color: var(--down); }
  .stat-tile .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin: 22px 0 12px;
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .12s ease;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip[data-active="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip[data-active="true"] .count { opacity: .85; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip-check input[type="checkbox"] { margin: 0; accent-color: var(--accent); cursor: pointer; }
  .chip-check:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

  .search-sort { display: flex; align-items: center; gap: 8px; }
  #searchInput, #sortSelect {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 7px 10px;
  }
  #searchInput { width: 160px; }
  #searchInput:focus-visible, #sortSelect:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- export ---------- */
  .export-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-strong);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .icon-btn:hover { background: var(--accent-tint); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .export-note { font-size: 11.5px; color: var(--text-muted); }
  .export-note.export-error { color: var(--down); }
  .export-note.export-ok { color: var(--up); }

  /* ---------- table ---------- */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: auto;
    box-shadow: var(--shadow);
  }
  table { border-collapse: collapse; width: 100%; min-width: 1360px; }
  thead th {
    position: sticky; top: 0;
    background: var(--surface-2);
    text-align: left;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--text-secondary); }
  thead th .arrow { font-size: 10px; margin-left: 3px; opacity: .5; }
  th.group-start, td.group-start { border-left: 1px solid var(--border-strong); }
  .fund-num { color: var(--text-secondary); }
  .fund-num.pos { color: var(--up); }
  .fund-num.neg { color: var(--down); }
  .fund-empty { color: var(--text-muted); font-size: 12px; }
  .fund-inferred { font-size: 10px; color: var(--text-muted); }
  .earn-cell { font-size: 12px; color: var(--text-secondary); max-width: 230px; white-space: normal; line-height: 1.4; }
  thead th[data-sorted="true"] { color: var(--accent); }
  thead th[data-sorted="true"] .arrow { opacity: 1; }
  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-2); }

  .name-cell .name { font-weight: 600; }
  .name-cell .code { font-size: 11.5px; color: var(--text-muted); margin-left: 6px; }
  tr.child-row:not(.watch-row) td { background: var(--surface-2); }
  tr.child-row:not(.watch-row):hover td { background: var(--surface-2); filter: brightness(0.97); }
  tr.child-row .name { font-weight: 500; color: var(--text-secondary); }
  .child-arrow { display: inline-block; color: var(--text-muted); margin-right: 4px; font-weight: 400; }
  .pref-tag { font-size: 10.5px; color: var(--text-muted); }
  .gap-rate { font-size: 10px; margin-top: 2px; font-weight: 500; }
  .gap-rate.up { color: var(--up); }
  .gap-rate.down { color: var(--down); }

  /* ---------- 관심종목 강조 ---------- */
  tr.watch-row td { background: var(--accent-tint); }
  tr.watch-row:hover td { background: var(--accent-tint); filter: brightness(0.96); }
  tr.watch-row.child-row td { background: var(--accent-tint); }

  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.kospi { background: var(--badge-kospi-bg); color: var(--badge-kospi); }
  .badge.kosdaq { background: var(--badge-kosdaq-bg); color: var(--badge-kosdaq); }
  .badge.etc { background: var(--badge-etc-bg); color: var(--badge-etc); }

  .chg { font-weight: 600; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .chg.flat { color: var(--neutral); }
  .chg .arrow { font-size: 11px; }

  .score-wrap { display: flex; align-items: center; gap: 8px; min-width: 108px; }
  .score-bar-bg { flex: 1; height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }
  .score-num { font-weight: 600; width: 26px; text-align: right; }
  .score-empty { color: var(--text-muted); font-size: 12px; }

  .ai-val.up { color: var(--up); font-weight: 600; }
  .ai-val.down { color: var(--down); font-weight: 600; }
  .ai-empty { color: var(--text-muted); font-size: 12px; }

  .supply-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-secondary);
  }
  .supply-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .supply-pill.s-strong .dot { background: var(--up); }
  .supply-pill.s-mid .dot { background: var(--neutral); }
  .supply-pill.s-weak .dot { background: var(--down); }
  .supply-empty { color: var(--text-muted); font-size: 12px; }

  .empty-row td { text-align: center; padding: 30px; color: var(--text-muted); }

  /* ---------- footer ---------- */
  footer {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
  }
  footer a { color: var(--accent); }
  footer .foot-title { color: var(--text-secondary); font-weight: 600; margin-bottom: 3px; }

  @media (max-width: 760px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .header-top { align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------- print / PDF ---------- */
  @media print {
    body { background: #fff; color: #111; }
    .page { max-width: 100%; padding: 8px 0; }
    .refresh-btn, .cadence-note, .controls, .export-row, .stat-row { display: none !important; }
    .table-wrap { box-shadow: none; border: 1px solid #ccc; overflow: visible; }
    table { min-width: 0; width: 100%; font-size: 10.5px; }
    thead th { position: static; background: #f0f0ee; color: #333; }
    tbody tr:hover td { background: inherit; }
    tr.watch-row td, tr.child-row td { background: #eef1f6 !important; }
    * { box-shadow: none !important; }
    footer { font-size: 9.5px; }
  }


/* ================= pomiai brand / i18n additions ================= */
body {
  font-family: "IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans SC", "Noto Sans TC", "Noto Sans Arabic", "Noto Sans", system-ui, sans-serif;
}
.pomiai-topbar {
  max-width: 1180px;
  margin: 0 auto 14px;
  padding: 10px 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.pomiai-topbar-brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-secondary);
  text-decoration: none;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12.5px;
  letter-spacing: 0.01em;
}
.pomiai-topbar-brand:hover { color: var(--accent); }
.pomiai-topbar-icon {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  background: var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.pomiai-topbar-icon svg { width: 12px; height: 12px; }
.pomiai-lang-wrap { position: relative; }
#lang-select {
  font: inherit;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12.5px;
  padding: 6px 28px 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-primary);
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}
.pomiai-lang-wrap::after {
  content: "▾";
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-muted);
  pointer-events: none;
}
#lang-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pomiai-brand-footer-line {
  margin-top: 10px !important;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11.5px !important;
}
.pomiai-brand-footer-line a { color: var(--accent); text-decoration: none; font-weight: 600; }
.pomiai-brand-footer-line a:hover { text-decoration: underline; }

/* RTL (Arabic) layout */
html[dir="rtl"] .page { direction: rtl; }
html[dir="rtl"] body { font-family: "Noto Sans Arabic", "IBM Plex Sans KR", system-ui, sans-serif; }
html[dir="rtl"] .pomiai-topbar,
html[dir="rtl"] .header-top,
html[dir="rtl"] .meta-block,
html[dir="rtl"] .controls,
html[dir="rtl"] .search-sort,
html[dir="rtl"] .chip-row,
html[dir="rtl"] .export-row { direction: rtl; }
html[dir="rtl"] .name-cell .code { margin-left: 0; margin-right: 6px; }
html[dir="rtl"] #searchInput { text-align: right; }
/* Financial data table stays LTR internally for numeral/column legibility, a common
   convention on Arabic finance sites; only its outer placement follows RTL page flow. */
html[dir="rtl"] .table-wrap { direction: ltr; }
html[dir="rtl"] .table-wrap thead th,
html[dir="rtl"] .table-wrap td { text-align: left; }

@media (max-width: 760px) {
  .pomiai-topbar { padding: 10px 20px 0; }
}

/* print: hide brand chrome not relevant to the printed/PDF table */
@media print {
  .pomiai-topbar { display: none !important; }
}
</style>
</head>

    "foot_p1": "Diagnosewert, KI-Prognose, Kursveränderung und Angebots-/Nachfragesignal werden unverändert von den Werten übernommen, die <a href=\"https://www.valueline.co.kr\" target=\"_blank\" rel=\"noopener\">Valueline</a> mithilfe eines auf Big Data und ARIMA basierenden Algorithmus berechnet (bei 효성화학 weicht die Skala der Rohdaten von der anderer Aktien ab, daher wurde der Wert unverändert als „13“ übernommen). Für die 10 Vorzugsaktien (Kennzeichnung ●우) berechnet Valueline überhaupt keine KI-Diagnose, -Prognose oder ein Angebots-/Nachfragesignal (es existiert keine eigene Seite dafür); daher zeigen nur diese drei Felder „Keine Daten (Vorzugsaktie)“ — aktueller Kurs und Kursveränderung wurden separat aus anderen Kursdatenquellen ergänzt, und bei einigen selten gehandelten Werten wurde das Datum der letzten Ausführung angegeben. Da sich das Marktsegment nicht nach der Stammaktie, sondern nach dem einzelnen Wertpapier richtet, werden alle Vorzugsaktien als „Sonstige“ angezeigt. Bei 달바글로벌 wich der vom Nutzer angegebene Name („달마글로벌“) vom tatsächlichen Börsennamen ab und wurde entsprechend korrigiert. GS건설 wurde bei der planmäßigen Indexanpassung im Mai 2026 aus dem KOSPI200 entfernt und wird derzeit als „Sonstige“ geführt.",
    "foot_p2": "Da für Vorzugsaktien kein Valueline-Wert vorliegt, wird angenommen, dass sie sich ähnlich wie ihre Stammaktie entwickeln; unabhängig vom gewählten Sortierkriterium (Diagnosewert, Kursveränderung, KI-Prognose, Name, Marktsegment usw.) werden sie stets direkt unter ihrer Stammaktie (Kennzeichnung ↳) angezeigt. Ist die Stammaktie nicht sichtbar — etwa wenn der Marktfilter nur „Sonstige“ anzeigt —, wird die Vorzugsaktie als eigenständige Zeile normal einsortiert.",
    "foot_p3": "PER, PBR, ROE und die letzten Ergebnisse (YoY) werden von Valueline auf Basis der Unternehmensmeldungen berechnet, größtenteils für das 2. Quartal 2026 (26.2Q) (teilweise als „vorläufig“ gekennzeichnet). Ein negativer PER- oder PBR-Wert bedeutet einen Verlust im letzten Quartal. Da Valueline für Vorzugsaktien keine gesonderten Werte bereitstellt, handelt es sich hierbei um Näherungswerte, die als <strong>PER/PBR der Stammaktie × (Kurs der Vorzugsaktie / Kurs der Stammaktie)</strong> umgerechnet wurden (Kennzeichnung „Umgerechnet von Stammaktie“); der ROE ist eine unternehmensweite Kennzahl und wurde daher unverändert vom Wert der Stammaktie übernommen (Kennzeichnung „Identisch mit Stammaktie“) — da es sich nicht um die tatsächlich gemeldeten Werte, sondern um Näherungswerte handelt, prüfen Sie für Anlageentscheidungen bitte die Originalmeldungen.",
    "foot_p4": "Farbig hinterlegte Zeilen kennzeichnen die vom Nutzer festgelegte <strong>Watchlist</strong> (56 Aktien). Für die übrigen KOSPI200- und KOSDAQ150-Mitgliedsaktien (rund 307 Aktien) wurden nach Entfernung von Duplikaten ebenfalls aktueller Kurs, PER, PBR, ROE, Diagnosewert, KI-Prognose und Angebots-/Nachfragesignal aus Valueline und Hankyung abgerufen; über die Kontrollkästchen oben lassen sich Alle/KOSPI200/KOSDAQ150/Vorzugsaktien/Watchlist frei kombinieren. Aktien außerhalb der Watchlist werden jedoch nicht stündlich automatisch aktualisiert, sondern stellen eine Momentaufnahme zum Zeitpunkt der letzten Befüllung dar (der Umfang der automatischen Aktualisierung soll künftig erweitert werden); bei einigen neu notierten Aktien oder Unternehmen, die in eine Holdingstruktur umgewandelt wurden (z. B. 삼성에피스홀딩스), konnte der Code in der Datenquelle nicht ermittelt werden, sodass nur Name und Marktsegment angezeigt werden. Die „Abweichung zur Stammaktie“ in der Zeile der Vorzugsaktie wird als (Kurs der Vorzugsaktie − Kurs der Stammaktie) / Kurs der Stammaktie berechnet und immer angezeigt, unabhängig vom Filterstatus.",
    "foot_p5": "Diese Seite dient nur zu Informationszwecken und stellt keine Anlageberatung dar; die Anlageentscheidung und deren Verantwortung liegen allein bei Ihnen.",

    "foot_p1": "Le score de diagnostic, la variation prévue par l'IA et le signal offre/demande sont repris tels quels des valeurs calculées par <a href=\"https://www.valueline.co.kr\" target=\"_blank\" rel=\"noopener\">Valueline</a> à l'aide d'un algorithme fondé sur le big data et le modèle ARIMA (pour 효성화학, l'échelle des données sources diffère de celle des autres valeurs ; la valeur \"13\" a donc été reprise telle quelle). Pour les 10 actions préférentielles (valeurs marquées ●우), Valueline ne calcule pas du tout le diagnostic IA, la prévision ni le signal offre/demande (ces actions ne disposent pas de page dédiée) ; ces trois éléments affichent donc uniquement la mention \"Données indisponibles (action préférentielle)\" — le cours actuel et la variation ont été renseignés séparément à partir d'une autre source de cotation, et pour les valeurs peu échangées, la date de la dernière transaction est indiquée. Le marché est classé par titre individuel et non par action ordinaire ; toutes les actions préférentielles sont donc affichées comme \"Autres\". Pour 달바글로벌, le nom fourni par l'utilisateur (\"달마글로벌\") différait de la dénomination officielle cotée ; il a donc été corrigé. GS건설 a été retiré du KOSPI200 lors de la révision périodique de mai 2026 et figure désormais dans \"Autres\".",

    "foot_p3": "Le PER, le PBR, le ROE et les résultats récents (YoY) sont des valeurs calculées par Valueline sur la base des publications officielles, la plupart se référant aux résultats du 2e trimestre 2026 (26.2Q) (certains étant \"provisoires\"). Un PER ou un PBR négatif signifie une perte au dernier trimestre. Pour les actions préférentielles, Valueline ne fournit pas de valeurs distinctes ; il s'agit donc de valeurs de référence obtenues par <strong>PER/PBR de l'action ordinaire × (cours de l'action préférentielle / cours de l'action ordinaire)</strong> (mention \"Converti (action ordinaire)\"), et le ROE, étant un indicateur global de l'entreprise, reprend directement la même valeur que celle de l'action ordinaire (mention \"Identique (action ordinaire)\") — ce ne sont pas les chiffres officiels réels mais des approximations ; veuillez consulter les documents de publication originaux pour toute décision d'investissement.",

    "foot_p1": "درجة التشخيص، ونسبة التغير المتوقعة بالذكاء الاصطناعي، وإشارة العرض والطلب هي قيم مأخوذة كما هي من <a href=\"https://www.valueline.co.kr\" target=\"_blank\" rel=\"noopener\">Valueline</a> التي تحسبها بخوارزمية قائمة على البيانات الضخمة ونموذج ARIMA (بالنسبة لـ 효성화학، ولأن مقياس البيانات الأصلية يختلف عن باقي الأسهم، تم إدراج القيمة كما وردت وهي \"13\"). بالنسبة إلى الأسهم الممتازة العشرة (المعلّمة بالرمز ●우)، ولأن Valueline لا تحسب لها التشخيص أو التنبؤ بالذكاء الاصطناعي أو إشارة العرض والطلب على الإطلاق (لا توجد لها صفحة مستقلة)، فإن هذه العناصر الثلاثة فقط تظهر بعبارة \"لا توجد بيانات (سهم ممتاز)\" — أما السعر الحالي ونسبة التغير فقد تم تعبئتهما من مصدر تسعير آخر، وبالنسبة إلى بعض الأسهم قليلة التداول تم عرض تاريخ آخر تنفيذ للصفقة. ولأن تصنيف السوق يُحدَّد وفقًا للورقة المالية الفردية وليس وفقًا للسهم العادي، فقد صُنِّفت جميع الأسهم الممتازة ضمن فئة \"أخرى\". أما 달바글로벌 فقد جرى تصحيح اسمه لأن الاسم الذي قدّمه المستخدم (\"달마글로벌\") يختلف عن اسم الإدراج الفعلي. أما GS건설 فقد استُبعد من مؤشر KOSPI200 في إعادة التوازن الدورية لشهر مايو 2026، وهو مصنّف حاليًا ضمن فئة \"أخرى\".",
    "foot_p2": "نظرًا لعدم توفر درجة من Valueline للأسهم الممتازة، ولافتراض أن أداءها يتحرك بشكل مشابه لأداء سهمها العادي المقابل، فإنها تُعرض دائمًا مباشرة أسفل سهمها العادي (بعلامة ↳)، بصرف النظر عن معيار الترتيب المستخدم (درجة التشخيص، نسبة التغير، تنبؤ الذكاء الاصطناعي، الاسم، تصنيف السوق، وغيرها). أما إذا لم يكن السهم العادي معروضًا على الشاشة — كما يحدث عند تصفية السوق لعرض فئة \"أخرى\" فقط — فيُرتَّب السهم الممتاز أيضًا بشكل طبيعي كصف مستقل.",
    "foot_p3": "قيم PER وPBR وROE وأحدث النتائج (سنويًا) محسوبة من قبل Valueline استنادًا إلى الإفصاحات الرسمية، ومعظمها مبني على نتائج الربع الثاني من عام 2026 (26.2Q) (بعضها \"مبدئي\"). وتشير القيمة السالبة لـ PER أو PBR إلى وجود خسارة في الربع الأخير. وبما أن Valueline لا توفر أرقامًا منفصلة للأسهم الممتازة، فإن PER وPBR لها قيم مرجعية محوّلة عبر معادلة <strong>PER/PBR للسهم العادي × (سعر السهم الممتاز / سعر السهم العادي)</strong> (وتُعرَض بعبارة \"محوّل من السهم العادي\")، أما ROE فهو مؤشر على مستوى الشركة ككل، لذا استُخدمت نفس قيمة السهم العادي كما هي (وتُعرَض بعبارة \"مطابق للسهم العادي\") — وبما أنها تقديرات وليست أرقامًا فعلية من الإفصاحات، يُرجى الرجوع إلى مصادر الإفصاح الأصلية عند اتخاذ القرارات الاستثمارية.",
    "foot_p4": "تشير خلفية الصف الملوّنة إلى <strong>الأسهم المفضلة</strong> (56 سهمًا) التي حددها المستخدم. أما بقية الأسهم المكوّنة لمؤشري KOSPI200 وKOSDAQ150 (نحو 307 أسهم) فقد تم أيضًا، بعد إزالة التكرار، تعبئتها بالكامل ببيانات السعر الحالي وPER وPBR وROE ودرجة التشخيص وتنبؤ الذكاء الاصطناعي وإشارة العرض والطلب من Valueline و한경، ويمكن دمج الفئات (الكل / KOSPI200 / KOSDAQ150 / الأسهم الممتازة / الأسهم المفضلة) بحرية باستخدام مربعات الاختيار في الأعلى. غير أن الأسهم خارج قائمة الأسهم المفضلة لا تخضع للتحديث التلقائي كل ساعة، بل هي لقطة زمنية اعتبارًا من وقت التعبئة الحالي (ومن المخطط توسيع نطاق التحديث التلقائي لاحقًا)، كما أن بعض الأسهم المُدرجة حديثًا أو التي تحوّلت إلى شركة قابضة (مثل 삼성에피스홀딩스) لا يظهر لها سوى الاسم وتصنيف السوق، لأن رمزها لم يتم التحقق منه في مصدر البيانات. أما نسبة الفارق \"مقابل السهم العادي\" في صفوف الأسهم الممتازة فتُحسب بالمعادلة (سعر السهم الممتاز － سعر السهم العادي) / سعر السهم العادي، وتظهر دائمًا بصرف النظر عن حالة الفلترة.",

  function applyI18n() {

  function normalizeLang(raw) {
    raw = (raw || 'ko').toLowerCase();
    if (raw.indexOf('ko') === 0) return 'ko';
    if (raw.indexOf('ja') === 0) return 'ja';
    if (raw.indexOf('zh') === 0) return /tw|hant|hk|mo/.test(raw) ? 'zh_TW' : 'zh_CN';
    if (raw.indexOf('de') === 0) return 'de_DE';
    if (raw.indexOf('fr') === 0) return 'fr_FR';
    if (raw.indexOf('nl') === 0) return 'nl_NL';
    if (raw.indexOf('sv') === 0) return 'sv_SE';
    if (raw.indexOf('da') === 0) return 'da_DK';
    if (raw.indexOf('nn') === 0 || raw.indexOf('nb') === 0 || raw.indexOf('no') === 0) return 'nn_NO';
    if (raw.indexOf('ar') === 0) return 'ar';
    if (raw.indexOf('en') === 0) return 'en';
    return 'ko';
  }

  function setLang(lang, opts) {
    opts = opts || {};
    if (!I18N[lang]) lang = 'ko';
    window._LANG = lang;
    window._T = I18N[lang];
    var root = document.getElementById('html-root');
    root.setAttribute('lang', lang === 'zh_CN' ? 'zh-CN' : (lang === 'zh_TW' ? 'zh-TW' : lang));
    root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    try { localStorage.setItem('pomiai-stockscore-lang', lang); } catch (e) {}
    if (!opts.skipUrl) {
      try {
        var url = new URL(location.href);
        url.searchParams.set('lang', lang);
        history.replaceState(null, '', url.toString());
      } catch (e) {}
    }
    var sel = document.getElementById('lang-select');
    if (sel && sel.value !== lang) sel.value = lang;
    applyI18n();
    renderAll();
  }

  function initLang() {
    var sel = document.getElementById('lang-select');
    LANG_OPTIONS.forEach(function (pair) {
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      sel.appendChild(opt);
    });
    sel.addEventListener('change', function () { setLang(sel.value); });

    var params = new URLSearchParams(location.search);
    var urlLang = params.get('lang');
    var saved = null;
    try { saved = localStorage.getItem('pomiai-stockscore-lang'); } catch (e) {}
    var initial = (urlLang && I18N[urlLang]) ? urlLang
      : (saved && I18N[saved]) ? saved
      : normalizeLang(navigator.language);
    if (!I18N[initial]) initial = 'ko';
    setLang(initial, { skipUrl: !!urlLang });
  }

  function buildUniverse() {
    var watchNames = {};
    WATCHLIST.forEach(function (d) { watchNames[d.name] = true; });
    var seen = {};
    var universe = [];
    function addList(names, market) {
      names.forEach(function (n) {
        var norm = NAME_ALIAS[n] || n;
        if (watchNames[norm] || seen[norm]) return;
        seen[norm] = true;
        var extra = UNIVERSE_DATA[norm] || UNIVERSE_DATA[n];
        var base = { name: n, market: market, code: null, watch: false };
        if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) base[k] = extra[k]; } }
        universe.push(base);
      });
    }
    addList(KOSPI200_NAMES, "KOSPI200");
    addList(KOSDAQ150_NAMES, "KOSDAQ150");
    return universe;
  }
  var UNIVERSE = buildUniverse();

  var state = { filters: new Set(["WATCH"]), sort: "score-desc", q: "" };

  function computeStats() {
    var total = STOCKS.length;
    var byMarket = { KOSPI200: 0, KOSDAQ150: 0, "기타": 0 };
    var scored = [];
    var up = 0, down = 0, prefCount = 0, watchCount = 0;
    STOCKS.forEach(function (d) {
      byMarket[d.market]++;
      if (d.score != null) scored.push(d.score);
      if (d.chg > 0) up++;
      if (d.chg < 0) down++;
      if (d.pref) prefCount++;
      if (d.watch) watchCount++;
    });
    var avgScore = scored.length ? (scored.reduce(function(a,b){return a+b;},0) / scored.length) : 0;
    return { total: total, byMarket: byMarket, avgScore: avgScore, up: up, down: down, prefCount: prefCount, watchCount: watchCount };
  }

  function matchesFilters(d) {
    if (state.filters.has("ALL")) return true;
    if (state.filters.has("KOSPI200") && d.market === "KOSPI200") return true;
    if (state.filters.has("KOSDAQ150") && d.market === "KOSDAQ150") return true;
    if (state.filters.has("PREF") && d.pref) return true;
    if (state.filters.has("WATCH") && d.watch) return true;
    return false;
  }

        } else {

          if (cb.checked) state.filters.add(key); else state.filters.delete(key);
          if (state.filters.size === 0) state.filters.add("ALL");
        }

  }

  function sortRows(rows) {
    var key = state.sort;
    function num(v, fallback) { return (v == null || isNaN(v)) ? fallback : v; }
    var sorted = rows.slice();
    switch (key) {
      case "score-desc": sorted.sort(function(a,b){ return num(b.score,-1) - num(a.score,-1); }); break;
      case "score-asc": sorted.sort(function(a,b){ return num(a.score,101) - num(b.score,101); }); break;
      case "chg-desc": sorted.sort(function(a,b){ return num(b.chg,-999) - num(a.chg,-999); }); break;
      case "chg-asc": sorted.sort(function(a,b){ return num(a.chg,999) - num(b.chg,999); }); break;
      case "ai-desc": sorted.sort(function(a,b){ return num(b.ai,-999) - num(a.ai,-999); }); break;
      case "per-asc": sorted.sort(function(a,b){
          // PER은 마이너스(적자)를 "저평가"로 착시하지 않도록 0 이하는 뒤로 보낸다
          var pa = a.per, pb = b.per;
          var va = (pa == null) ? Infinity : (pa <= 0 ? Infinity - 1 : pa);
          var vb = (pb == null) ? Infinity : (pb <= 0 ? Infinity - 1 : pb);
          return va - vb;
        }); break;
      case "pbr-asc": sorted.sort(function(a,b){ return num(a.pbr,999) - num(b.pbr,999); }); break;
      case "roe-desc": sorted.sort(function(a,b){ return num(b.roe,-999) - num(a.roe,-999); }); break;
      case "name-asc": sorted.sort(function(a,b){ return a.name.localeCompare(b.name, "ko"); }); break;
      case "market": sorted.sort(function(a,b){
          var order = {KOSPI200:0, KOSDAQ150:1, "기타":2};
          return order[a.market] - order[b.market] || num(b.score,-1) - num(a.score,-1);
        }); break;
    }
    return sorted;
  }

  // 우선주는 밸류라인 점수가 없어 본주와 비슷한 수준으로 보고,
  // 정렬 기준이 무엇이든 항상 짝이 되는 본주 바로 아래에 붙여서 보여준다.
  function groupWithParents(rows) {
    var byCode = {};
    rows.forEach(function (r) { if (r.code) byCode[r.code] = r; r._isChild = false; });
    var childrenMap = {};
    var primaries = [];
    rows.forEach(function (r) {
      if (r.parent && byCode[r.parent]) {
        r._isChild = true;
        (childrenMap[r.parent] = childrenMap[r.parent] || []).push(r);
      } else {
        primaries.push(r);
      }
    });
    var sortedPrimaries = sortRows(primaries);
    var out = [];
    sortedPrimaries.forEach(function (p) {
      out.push(p);
      if (childrenMap[p.code]) childrenMap[p.code].forEach(function (c) { out.push(c); });
    });
    return out;
  }

  function fmtFund(v, decimals) {
    if (v == null || isNaN(v)) return '<span class="fund-empty">—</span>';
    return '<span class="fund-num num">' + v.toFixed(decimals) + '</span>';
  }

  // 우선주-본주 괴리율: 필터/정렬 상태와 무관하게 전역 CODE_INDEX로 항상 계산한다
  function gapRate(d) {
    if (!d.pref || !d.parent) return null;
    var p = CODE_INDEX[d.parent];
    if (!p || d.price == null || p.price == null) return null;
    return (d.price - p.price) / p.price * 100;
  }

  function csvEscape(v) {
    v = (v == null) ? "" : String(v);
    if (/[",\n\r]/.test(v)) { v = '"' + v.replace(/"/g, '""') + '"'; }
    return v;
  }

  function setExportStatus(msg, kind) {
    var el = document.getElementById("exportStatus");
    if (!el) return;

    el.className = "export-note" + (kind ? " export-" + kind : "");
  }

  // 현재 화면에 보이는 결과(필터·검색·정렬 반영)를 CSV로 내보낸다 — 엑셀에서 바로 열림
  async function exportCSV() {
    var rows = state.lastRows || [];
    var t = window._T || I18N.ko;
    var headers = [t.col_name, t.csv_col_code, t.col_market, t.lbl_watch, t.col_price, t.col_chg + "(%)", t.col_score, t.col_ai, t.csv_col_ai_trend, t.col_supply, t.col_per, t.col_pbr, t.col_roe + "(%)", t.csv_col_gap, t.col_earn];
    var lines = [headers.map(csvEscape).join(",")];
    rows.forEach(function (d) {
      var mm = marketMeta()[d.market];
      var gap = gapRate(d);
      var row = [
        d.name,
        d.code || "",
        mm ? mm.label : d.market,
        d.watch ? "Y" : "",
        d.price == null ? "" : d.price,
        d.chg == null ? "" : d.chg,
        d.score == null ? "" : d.score,
        d.ai == null ? "" : d.ai,
        d.ai == null ? (d.aiTrend || "") : "",
        d.supply || "",
        d.per == null ? "" : d.per,
        d.pbr == null ? "" : d.pbr,
        d.roe == null ? "" : d.roe,
        gap == null ? "" : gap.toFixed(2),
        d.earn || ""
      ];
      lines.push(row.map(csvEscape).join(","));
    });
    var csv = "﻿" + lines.join("\r\n"); // BOM: 엑셀에서 한글이 깨지지 않도록
    var ts = (document.getElementById("dataAsOf").textContent.match(/[\d-]+ [\d:]+/) || [""])[0].replace(/[^0-9]/g, "").slice(0, 12);
    var filename = t.csv_filename_prefix + (ts || "export") + ".csv";

    // claude.ai 아티팩트로 열려 있으면(스크립트로 직접 내려받기가 막혀 있으므로) downloads 기능을 쓰고,
    // 로컬 HTML로 직접 열었을 때는 일반 브라우저 다운로드를 쓴다.
    if (window.claude && typeof window.claude.use === "function") {
      try {
        var downloads = await window.claude.use("downloads");
        if (!downloads) {
          setExportStatus(t.export_no_downloads, "error");
          return;
        }
        await downloads.save({ filename: filename, data: csv });
        setExportStatus(t.export_done_prefix + filename, "ok");
      } catch (err) {
        var code = err && err.code;
        if (code === "declined") {
          setExportStatus(t.export_cancelled, null);
        } else if (code === "extension_not_enabled" || code === "rejected_extension") {
          setExportStatus(t.export_restricted, "error");
        } else {
          setExportStatus(t.export_failed_prefix + (err && err.message ? err.message : t.export_failed_unknown), "error");
        }
      }
      return;
    }

    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    setExportStatus(t.export_done_prefix + filename, "ok");
  }

  function renderTable() {
    var rows = STOCKS.filter(function (d) {
      if (!matchesFilters(d)) return false;
      if (state.q && d.name.indexOf(state.q) === -1) return false;
      return true;
    });
    rows = groupWithParents(rows);
    state.lastRows = rows; // CSV/인쇄 내보내기가 화면에 보이는 것과 동일한 결과를 쓰도록 저장

    if (!rows.length) {
      document.getElementById("tableBody").innerHTML = '<tr class="empty-row"><td colspan="11">' + (window._T||I18N.ko).empty_message + '</td></tr>';
      return;
    }

    var t = window._T || I18N.ko;
    var html = rows.map(function (d) {
      var mm = marketMeta()[d.market];
      var chg = fmtChg(d.chg);
      var scoreCell;
      if (d.score == null) {
        scoreCell = '<span class="score-empty">' + t.no_data + (d.pref ? t.pref_suffix : '') + '</span>';
      } else {
        var pct = Math.max(0, Math.min(100, d.score));
        scoreCell = '<div class="score-wrap"><div class="score-bar-bg"><div class="score-bar-fill" style="width:' + pct + '%"></div></div><span class="score-num num">' + d.score + '</span></div>' +
          (d.scoreNote ? '<div class="pref-tag">' + d.scoreNote + '</div>' : '');
      }
      var aiCell;
      if (d.ai != null) {
        var cls = d.ai > 0 ? "up" : (d.ai < 0 ? "down" : "");
        aiCell = '<span class="ai-val num ' + cls + '">' + (d.ai > 0 ? "+" : "") + d.ai.toFixed(2) + '%</span>';
      } else if (d.aiTrend) {
        aiCell = '<span class="ai-empty">' + trendLabel(d.aiTrend) + ' ' + t.ai_no_value_suffix + '</span>';
      } else {
        aiCell = '<span class="ai-empty">' + t.no_data + (d.pref ? t.pref_suffix : '') + '</span>';
      }
      var supplyCell;
      if (d.supply) {
        supplyCell = '<span class="supply-pill ' + supplyClass(d.supply) + '"><span class="dot"></span>' + supplyLabel(d.supply) + '</span>' +
          (d.supplyNote ? '<div class="pref-tag">' + d.supplyNote + '</div>' : '');
      } else {
        supplyCell = '<span class="supply-empty">' + t.no_data + (d.pref ? t.pref_suffix : '') + '</span>';
      }

      var perCell = fmtFund(d.per, 2) + (d.valInferred ? '<div class="fund-inferred">' + t.valinferred_per + '</div>' : '');
      var pbrCell = fmtFund(d.pbr, 2) + (d.valInferred ? '<div class="fund-inferred">' + t.valinferred_per + '</div>' : '');
      var roeCell = d.roe == null ? '<span class="fund-empty">—</span>' : '<span class="fund-num num">' + d.roe.toFixed(2) + '%</span>' + (d.valInferred ? '<div class="fund-inferred">' + t.valinferred_roe + '</div>' : '');
      var earnCell = d.earn ? '<span class="earn-cell">' + d.earn + '</span>' : '<span class="fund-empty">—</span>';
      var gap = gapRate(d);
      var priceCell = fmtPrice(d.price) + (gap != null ? '<div class="gap-rate ' + (gap >= 0 ? 'up' : 'down') + '">' + t.gap_label + ' ' + (gap >= 0 ? '+' : '') + gap.toFixed(1) + '%</div>' : '');
      var rowClass = (d._isChild ? 'child-row ' : '') + (d.watch ? 'watch-row' : '');

      return '<tr class="' + rowClass + '">' +
        '<td class="name-cell"><span class="name">' + (d._isChild ? '<span class="child-arrow">↳</span>' : '') + d.name + '</span>' + (d.code ? '<span class="code num">' + d.code + '</span>' : '') + (d.note ? '<div class="pref-tag">' + d.note + '</div>' : '') + '</td>' +
        '<td><span class="badge ' + mm.cls + '">' + mm.label + '</span></td>' +
        '<td class="num">' + priceCell + '</td>' +
        '<td class="chg ' + chg.cls + ' num">' + chg.text + '</td>' +
        '<td class="group-start">' + scoreCell + '</td>' +
        '<td>' + aiCell + '</td>' +
        '<td>' + supplyCell + '</td>' +
        '<td class="group-start">' + perCell + '</td>' +
        '<td>' + pbrCell + '</td>' +
        '<td>' + roeCell + '</td>' +
        '<td>' + earnCell + '</td>' +
      '</tr>';
    }).join("");
    document.getElementById("tableBody").innerHTML = html;
  }

  function renderAll() {
    renderStats();
    renderChips();
    renderTable();
  }

  document.getElementById("searchInput").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    renderTable();
  });
  document.getElementById("sortSelect").addEventListener("change", function (e) {
    state.sort = e.target.value;
    renderTable();
  });
  document.getElementById("sortSelect").value = state.sort;

  Array.prototype.forEach.call(document.querySelectorAll("th[data-key]"), function (th) {
    th.addEventListener("click", function () {
      var key = th.getAttribute("data-key");
      var map = { score: "score-desc", chg: "chg-desc", ai: "ai-desc", name: "name-asc", market: "market", per: "per-asc", pbr: "pbr-asc", roe: "roe-desc" };
      if (map[key]) {
        state.sort = map[key];
        document.getElementById("sortSelect").value = state.sort;
        renderTable();
      }
    });
  });

  document.getElementById("refreshBtn").addEventListener("click", function () {
    this.classList.add("spinning");
    setTimeout(function () { location.reload(); }, 250);
  });

  document.getElementById("exportCsvBtn").addEventListener("click", exportCSV);
  document.getElementById("printBtn").addEventListener("click", function () {
    window.print();
  });

  initLang();
})();
</script>

</body>
</html>
