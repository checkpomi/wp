<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Bubble Bobble Online – Retro Action Platformer</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #game-container { position: relative; border: 4px solid #3498db; background: #00021a; box-shadow: 0 0 20px #3498db; }
        canvas { display: block; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 10; }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; }
        .btn-start { background: #2ecc71; color: white; }
        .btn-pause { background: #f1c40f; color: black; }
        .btn-reset { background: #e74c3c; color: white; }
        .info { margin-top: 10px; font-size: 14px; color: #888; text-align: center; }
        #score-board { font-size: 24px; color: #3498db; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="score-board">SCORE: <span id="score">0</span></div>

    <div id="game-container">
        <div id="overlay" class="ui-layer">
            <h1 id="status-msg" style="color:#2ecc71">BUBBLE BOBBLE</h1>
            <button class="btn btn-start" onclick="game.start()">GAME START</button>
        </div>
        <canvas id="gameCanvas" width="400" height="300"></canvas>
    </div>

    <div class="controls">
        <button id="pauseBtn" class="btn btn-pause" onclick="game.togglePause()" disabled>PAUSE</button>
        <button class="btn btn-reset" onclick="game.reset()">RESET</button>
    </div>

    <div class="info">
        PC: [←][→] 이동 | [Z] 점프 | [X] 거품 발사<br>
        Mobile: 화면 아래 버튼을 추가하거나 터치 영역을 활용하세요.
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const pauseBtn = document.getElementById('pauseBtn');
const overlay = document.getElementById('overlay');
const statusMsg = document.getElementById('status-msg');

const game = {
    running: false,
    paused: false,
    score: 0,
    bubbles: [],
    platforms: [
        {x: 0, y: 280, w: 400, h: 20}, // 바닥
        {x: 50, y: 200, w: 100, h: 10},
        {x: 250, y: 200, w: 100, h: 10},
        {x: 150, y: 120, w: 100, h: 10}
    ],
    
    player: {
        x: 50, y: 230, w: 20, h: 20,
        vx: 0, vy: 0, 
        speed: 3, jumpPower: -8,
        grounded: false, direction: 1 // 1: 우, -1: 좌
    },

    start() {
        this.running = true;
        this.paused = false;
        this.score = 0;
        this.bubbles = [];
        this.player.x = 50; this.player.y = 230;
        scoreEl.innerText = '0';
        overlay.style.display = 'none';
        pauseBtn.disabled = false;
        this.loop();
    },

    togglePause() {
        this.paused = !this.paused;
        pauseBtn.innerText = this.paused ? "RESUME" : "PAUSE";
        if(!this.paused) this.loop();
    },

    reset() {
        this.running = false;
        overlay.style.display = 'flex';
        statusMsg.innerText = "READY?";
        pauseBtn.disabled = true;
    },

    shoot() {
        if(!this.running || this.paused) return;
        this.bubbles.push({
            x: this.player.x + (this.player.direction * 10),
            y: this.player.y + 5,
            vx: this.player.direction * 5,
            vy: -0.5,
            life: 100
        });
    },

    update() {
        if(!this.running || this.paused) return;

        // 중력 및 이동
        this.player.vy += 0.4;
        this.player.x += this.player.vx;
        this.player.y += this.player.vy;
        this.player.grounded = false;

        // 플랫폼 충돌
        this.platforms.forEach(p => {
            if(this.player.x < p.x + p.w && this.player.x + this.player.w > p.x &&
               this.player.y + this.player.h > p.y && this.player.y + this.player.h < p.y + p.h + 10) {
                if(this.player.vy > 0) {
                    this.player.grounded = true;
                    this.player.vy = 0;
                    this.player.y = p.y - this.player.h;
                }
            }
        });

        // 거품 업데이트
        this.bubbles.forEach((b, i) => {
            b.x += b.vx;
            b.y += b.vy;
            b.vx *= 0.95; // 감속
            b.life--;
            if(b.life <= 0) this.bubbles.splice(i, 1);
        });
    },

    draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 플랫폼
        ctx.fillStyle = '#34495e';
        this.platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

        // 플레이어 (공룡 대용 사각형)
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.player.x, this.player.y, this.player.w, this.player.h);
        // 눈 방향 표시
        ctx.fillStyle = 'white';
        let eyeX = this.player.direction === 1 ? this.player.x + 12 : this.player.x + 4;
        ctx.fillRect(eyeX, this.player.y + 4, 4, 4);

        // 거품
        ctx.strokeStyle = '#00d2ff';
        this.bubbles.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, 8, 0, Math.PI*2);
            ctx.stroke();
        });
    },

    loop() {
        if(!this.running || this.paused) return;
        this.update();
        this.draw();
        requestAnimationFrame(() => this.loop());
    }
};

// 키 입력 제어
const keys = {};
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if(e.code === 'ArrowLeft') { game.player.vx = -game.player.speed; game.player.direction = -1; }
    if(e.code === 'ArrowRight') { game.player.vx = game.player.speed; game.player.direction = 1; }
    if(e.code === 'KeyZ' && game.player.grounded) game.player.vy = game.player.jumpPower;
    if(e.code === 'KeyX') game.shoot();
});
window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if(e.code === 'ArrowLeft' || e.code === 'ArrowRight') game.player.vx = 0;
});
</script>
</body>
</html>
