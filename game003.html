<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Bubble Shooter Online - Retro Arcade</title>
    <style>
        body {
            background: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-header { text-align: center; margin-bottom: 10px; }
        .score-box { font-size: 24px; color: #00d2ff; font-weight: bold; }

        #game-wrapper {
            position: relative;
            border: 4px solid #333;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas { display: block; background: #000; cursor: crosshair; }

        /* 오버레이 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* 컨트롤 패널 */
        .panel {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            color: #white;
        }

        .btn-start { background: #2ecc71; color: white; }
        .btn-pause { background: #f1c40f; color: #333; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn:disabled { background: #555; cursor: not-allowed; opacity: 0.5; }

        .desc { margin-top: 15px; color: #777; font-size: 13px; }
    </style>
</head>
<body>

    <div class="game-header">
        <div class="score-box">SCORE: <span id="score">0</span></div>
    </div>

    <div id="game-wrapper">
        <div id="overlay">
            <h2 id="msg" style="color: #00d2ff;">BUBBLE SHOOTER</h2>
            <button class="btn btn-start" onclick="startGame()">START GAME</button>
        </div>
        <canvas id="bubbleCanvas" width="320" height="400"></canvas>
    </div>

    <div class="panel">
        <button id="pauseBtn" class="btn btn-pause" onclick="togglePause()" disabled>PAUSE</button>
        <button class="btn btn-reset" onclick="resetGame()">RESET</button>
    </div>

    <p class="desc">클릭하여 버블을 발사하세요! 3개 이상 모이면 터집니다.</p>

    <script>
        const canvas = document.getElementById('bubbleCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const pauseBtn = document.getElementById('pauseBtn');
        const overlay = document.getElementById('overlay');
        const msg = document.getElementById('msg');

        const COLORS = ['#ff007a', '#00d2ff', '#ffee00', '#00ff66', '#aa00ff'];
        let bubbles = [];
        let projectile = null;
        let score = 0;
        let gameRunning = false;
        let isPaused = false;
        let animationId;

        function startGame() {
            bubbles = [];
            score = 0;
            scoreEl.innerText = '0';
            gameRunning = true;
            isPaused = false;
            overlay.style.display = 'none';
            pauseBtn.disabled = false;
            pauseBtn.innerText = "PAUSE";
            
            // 초기 버블 배치
            for(let r=0; r<4; r++) {
                for(let c=0; c<8; c++) {
                    bubbles.push({
                        x: c * 40 + 20,
                        y: r * 40 + 20,
                        color: COLORS[Math.floor(Math.random() * COLORS.length)]
                    });
                }
            }
            createProjectile();
            animate();
        }

        function createProjectile() {
            projectile = {
                x: canvas.width / 2,
                y: canvas.height - 30,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                vx: 0,
                vy: 0,
                active: false
            };
        }

        function togglePause() {
            if (!gameRunning) return;
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.innerText = "RESUME";
                cancelAnimationFrame(animationId);
            } else {
                pauseBtn.innerText = "PAUSE";
                animate();
            }
        }

        function resetGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            msg.innerText = "GAME RESET";
            overlay.style.display = 'flex';
            pauseBtn.disabled = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 기존 버블 그리기
            bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.fill();
                ctx.closePath();
            });

            // 발사체 그리기
            if (projectile) {
                ctx.beginPath();
                ctx.arc(projectile.x, projectile.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = projectile.color;
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.stroke();
                ctx.closePath();
            }
        }

        function update() {
            if (projectile && projectile.active) {
                projectile.x += projectile.vx;
                projectile.y += projectile.vy;

                // 벽 충돌
                if (projectile.x < 18 || projectile.x > canvas.width - 18) projectile.vx *= -1;

                // 천장 충돌 및 버블 충돌 체크
                let hit = false;
                if (projectile.y < 18) hit = true;
                
                bubbles.forEach(b => {
                    const dist = Math.hypot(projectile.x - b.x, projectile.y - b.y);
                    if (dist < 34) hit = true;
                });

                if (hit) {
                    bubbles.push({ x: projectile.x, y: projectile.y, color: projectile.color });
                    score += 10;
                    scoreEl.innerText = score;
                    if (projectile.y > canvas.height - 80) {
                        gameRunning = false;
                        msg.innerText = "GAME OVER";
                        overlay.style.display = 'flex';
                    }
                    createProjectile();
                }
            }
        }

        function animate() {
            if (!gameRunning || isPaused) return;
            draw();
            update();
            animationId = requestAnimationFrame(animate);
        }

        canvas.addEventListener('click', (e) => {
            if (!gameRunning || isPaused || projectile.active) return;
            const rect = canvas.getBoundingClientRect();
            const tx = e.clientX - rect.left;
            const ty = e.clientY - rect.top;
            const angle = Math.atan2(ty - projectile.y, tx - projectile.x);
            projectile.vx = Math.cos(angle) * 8;
            projectile.vy = Math.sin(angle) * 8;
            projectile.active = true;
        });
    </script>
</body>
</html>
