<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Bubble Shooter Online - Retro Arcade Tool</title>
    <meta name="description" content="Play the classic bubble shooter game online. A retro arcade experience inspired by Bubble Bobble. Free to play, no download required.">
    <style>
        :root {
            --bg-dark: #0f0f1b;
            --primary-accent: #00d2ff;
            --retro-pink: #ff007a;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* SEO용 헤더 */
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 24px; color: var(--primary-accent); margin: 0; }
        .score-container { font-size: 20px; margin: 10px 0; color: var(--retro-pink); font-weight: bold; }

        /* 게임 보드 박스 */
        #game-container {
            position: relative;
            width: 320px;
            height: 480px;
            border: 4px solid #333;
            background: #000;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        canvas { display: block; touch-action: none; }

        /* 오버레이 창 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* 컨트롤 버튼 스타일 */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            color: white;
        }

        .btn-start { background: #27ae60; }
        .btn-pause { background: #f39c12; }
        .btn-reset { background: #e74c3c; }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        .btn:disabled { background: #555; cursor: not-allowed; }

        .instructions {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            max-width: 320px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<header>
    <h1>Bubble Shooter Retro Arcade</h1>
    <div class="score-container">SCORE: <span id="score-val">0</span></div>
</header>

<div id="game-container">
    <div id="overlay">
        <h2 id="msg" style="color: var(--primary-accent);">READY?</h2>
        <button class="btn btn-start" onclick="game.init()">START GAME</button>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<div class="controls">
    <button id="pauseBtn" class="btn btn-pause" onclick="game.togglePause()" disabled>PAUSE</button>
    <button class="btn btn-reset" onclick="game.reset()">RESET</button>
</div>

<section class="instructions">
    <p><strong>How to Play:</strong> Aim with your mouse or touch. Click to shoot the bubble. Match 3 or more of the same color to pop them!</p>
</section>

<script>
/**
 * 버블 슈터 엔진 핵심 로직
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-val');
const overlay = document.getElementById('overlay');
const msg = document.getElementById('msg');
const pauseBtn = document.getElementById('pauseBtn');

canvas.width = 320;
canvas.height = 480;

const COLORS = ['#FF007A', '#00D2FF', '#FFEE00', '#00FF66', '#AA00FF'];

const game = {
    running: false,
    paused: false,
    score: 0,
    bubbles: [],
    currentBubble: null,
    
    init() {
        this.running = true;
        this.paused = false;
        this.score = 0;
        this.bubbles = [];
        scoreEl.innerText = '0';
        overlay.style.display = 'none';
        pauseBtn.disabled = false;
        pauseBtn.innerText = "PAUSE";
        
        // 초기 버블 배치 (간이 구현)
        for(let i=0; i<5; i++) {
            for(let j=0; j<8; j++) {
                this.bubbles.push({
                    x: j * 40 + 20,
                    y: i * 40 + 20,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    radius: 18
                });
            }
        }
        this.newProjectile();
        this.loop();
    },

    newProjectile() {
        this.currentBubble = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            radius: 18,
            vx: 0,
            vy: 0,
            active: false
        };
    },

    draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 설치된 버블 그리기
        this.bubbles.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.fill();
            ctx.closePath();
        });

        // 현재 발사체 그리기
        if (this.currentBubble) {
            ctx.beginPath();
            ctx.arc(this.currentBubble.x, this.currentBubble.y, this.currentBubble.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.currentBubble.color;
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.stroke();
            ctx.closePath();
        }
    },

    update() {
        if (!this.running || this.paused) return;

        if (this.currentBubble && this.currentBubble.active) {
            this.currentBubble.x += this.currentBubble.vx;
            this.currentBubble.y += this.currentBubble.vy;

            // 벽 반사
            if (this.currentBubble.x < 18 || this.currentBubble.x > canvas.width - 18) {
                this.currentBubble.vx *= -1;
            }

            // 천장 도달 또는 버블 충돌
            if (this.currentBubble.y < 20) {
                this.attachBubble();
            } else {
                this.bubbles.forEach((b, index) => {
                    const dist = Math.hypot(this.currentBubble.x - b.x, this.currentBubble.y - b.y);
                    if (dist < 36) {
                        this.attachBubble();
                    }
                });
            }
        }
    },

    attachBubble() {
        this.bubbles.push({
            x: this.currentBubble.x,
            y: this.currentBubble.y,
            color: this.currentBubble.color,
            radius: 18
        });
        this.score += 10;
        scoreEl.innerText = this.score;
        this.currentBubble.active = false;
        this.newProjectile();
        
        if (this.bubbles.length > 60) {
            this.gameOver();
        }
    },

    togglePause() {
        if(!this.running) return;
        this.paused = !this.paused;
        pauseBtn.innerText = this.paused ? "RESUME" : "PAUSE";
        if(!this.paused) this.loop();
    },

    reset() {
        this.running = false;
        this.bubbles = [];
        this.currentBubble = null;
        overlay.style.display = 'flex';
        msg.innerText = "RESET DONE";
        pauseBtn.disabled = true;
        this.draw();
    },

    gameOver() {
        this.running = false;
        overlay.style.display = 'flex';
        msg.innerText = "GAME OVER";
        pauseBtn.disabled = true;
    },

    loop() {
        if (!this.running || this.paused) return;
        game.update();
        game.draw();
        requestAnimationFrame(() => game.loop());
    }
};

// 입력 이벤트 제어
canvas.addEventListener('mousedown', (e) => {
    if(!game.running || game.paused || game.currentBubble.active) return;
    
    const rect = canvas.getBoundingClientRect();
    const targetX = e.clientX - rect.left;
    const targetY = e.clientY - rect.top;
    
    const angle = Math.atan2(targetY - game.currentBubble.y, targetX - game.currentBubble.x);
    game.currentBubble.vx = Math.cos(angle) * 7;
    game.currentBubble.vy = Math.sin(angle) * 7;
    game.currentBubble.active = true;
});

// 터치 지원
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const targetX = touch.clientX - rect.left;
    const targetY = touch.clientY - rect.top;
    
    const angle = Math.atan2(targetY - game.currentBubble.y, targetX - game.currentBubble.x);
    game.currentBubble.vx = Math.cos(angle) * 7;
    game.currentBubble.vy = Math.sin(angle) * 7;
    game.currentBubble.active = true;
}, {passive: false});

</script>
</body>
</html>
