const VALID=TRACKS.filter(t=>t.videoId.trim()!=="");
let player=null,ready=false,ci=0,playing=false,mode='la';
let so=[],sp=0,vis=[...TRACKS],ptimer=null;
const $=id=>document.getElementById(id);
const ft=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function bso(){so=VALID.map((_,i)=>i).sort(()=>Math.random()-.5);sp=Math.max(0,so.indexOf(ci));}
function ni2(){if(!VALID.length)return 0;if(mode==='lo')return ci;if(mode==='sh'){if(!so.length)bso();sp=(sp+1)%so.length;if(sp===0)bso();return so[sp];}return(ci+1)%VALID.length;}
function pi2(){if(!VALID.length)return 0;if(mode==='sh'){if(!so.length)bso();sp=(sp-1+so.length)%so.length;return so[sp];}return(ci-1+VALID.length)%VALID.length;}
function sm(m){mode=m;['la','lo','sh'].forEach(x=>$('m-'+x).classList.toggle('on',x===m));if(m==='sh')bso();}
function ui(){
  if(!VALID.length){$('ntitle').textContent='재생할 영상이 없습니다';return;}
  const t=VALID[ci];
  $('ntitle').textContent=t.title;
  $('nsub').textContent=(TRACKS.indexOf(t)+1)+' / '+TRACKS.length;
}
function spu(p){
  playing=p;
  $('disc').classList.toggle('spin',p);
  $('tonearm').classList.toggle('active',p);
  $('pi').innerHTML=p?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  rpl();
}
function uprog(){
  if(!player||!ready)return;
  try{const d=player.getDuration()||0,c=player.getCurrentTime()||0;
    $('prog-fill').style.width=(d?Math.min(100,c/d*100):0)+'%';
    $('tc-cur').textContent=ft(c);$('tc-dur').textContent=d?ft(d):'—';}catch(e){}
}
function eqa(){return`<svg viewBox="0 0 16 16" fill="none" stroke="${playing?'#f4c873':'#e8935a'}" stroke-width="2" stroke-linecap="round"><line x1="3" y1="14" x2="3" y2="8"><animate attributeName="y2" values="4;13;6;12;4" dur=".8s" repeatCount="indefinite"/></line><line x1="8" y1="14" x2="8" y2="5"><animate attributeName="y2" values="11;3;10;4;11" dur=".7s" repeatCount="indefinite"/></line><line x1="13" y1="14" x2="13" y2="9"><animate attributeName="y2" values="7;13;5;12;7" dur=".9s" repeatCount="indefinite"/></line></svg>`;}
function rpl(){
  const wrap=$('pl');
  if(!vis.length){wrap.innerHTML='<div style="text-align:center;padding:36px;color:rgba(244,237,224,.35);font-size:14px">검색 결과가 없어요</div>';return;}
  const cur=VALID[ci];wrap.innerHTML='';
  vis.forEach(t=>{
    const hasId=t.videoId.trim()!=="",isA=t===cur;
    const row=document.createElement('div');
    row.className='tr'+(isA?' active':'');
    row.innerHTML=`<div class="tn">${String(t.no).padStart(3,'0')}</div><div class="teq">${isA?eqa():''}</div><div class="tm"><div class="tt">${t.title}${t.genre?`<span class="tb">${t.genre}</span>`:''}</div><div class="tmeta">pomiai · AI Music${!hasId?' · <span style="color:#e8935a;font-size:10px">▸ ID 미입력</span>':''}</div></div>`;
    if(hasId)row.addEventListener('click',()=>lap(VALID.indexOf(t)));
    wrap.appendChild(row);
  });
  $('tc').textContent=vis.length+'곡';
}
function lap(vi){
  if(!VALID.length)return;ci=vi;ui();rpl();
  if(player&&ready)player.loadVideoById(VALID[ci].videoId);
}
function tp(){
  if(!VALID.length||!ready)return;
  if(playing){player.pauseVideo();}
  else{try{const s=player.getPlayerState();(s===-1||s===5)?player.loadVideoById(VALID[ci].videoId):player.playVideo();}catch(e){player.loadVideoById(VALID[ci].videoId);}}
}
window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('yt-player',{height:'1',width:'1',
    playerVars:{playsinline:1,controls:0,modestbranding:1,rel:0},
    events:{
      onReady:function(){ready=true;if(VALID.length)player.cueVideoById(VALID[0].videoId);ptimer=setInterval(uprog,250);ui();rpl();},
      onStateChange:function(e){if(e.data===YT.PlayerState.PLAYING)spu(true);if(e.data===YT.PlayerState.PAUSED)spu(false);if(e.data===YT.PlayerState.ENDED)lap(ni2());}
    }});
};
$('prog-track').addEventListener('click',e=>{
  if(!player||!ready)return;
  const r=(e.clientX-e.currentTarget.getBoundingClientRect().left)/e.currentTarget.offsetWidth;
  const d=player.getDuration()||0;if(d)player.seekTo(d*r,true);
});
$('si').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  vis=q?TRACKS.filter(t=>t.title.toLowerCase().includes(q)||t.genre.toLowerCase().includes(q)):[...TRACKS];
  rpl();
});
$('pbtn').addEventListener('click',tp);
$('pb2').addEventListener('click',()=>{if(VALID.length)lap(pi2());});
$('nb2').addEventListener('click',()=>{if(VALID.length)lap(ni2());});
$('m-la').addEventListener('click',()=>sm('la'));
$('m-lo').addEventListener('click',()=>sm('lo'));
$('m-sh').addEventListener('click',()=>sm('sh'));
sm('la');rpl();ui();
</script>
