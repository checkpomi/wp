<style>
  :root{
    --plum:#2b1f3d; --plum2:#3a2a52; --plum-deep:#1c1428;
    --amber:#e8935a; --gold:#f4c873; --cream:#f4ede0; --rose:#d8788f;
    --line:rgba(244,237,224,.12);
    --font-display:'Noto Serif KR',serif;
    --font-body:'Noto Sans KR',-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--plum-deep);font-family:var(--font-body);color:var(--cream)}
  #page{max-width:920px;margin:0 auto;padding:32px 20px 80px}

  /* ---------- HERO ---------- */
  #hero{
    position:relative;border-radius:28px;overflow:hidden;
    background:radial-gradient(circle at 18% 20%, rgba(232,147,90,.28), transparent 55%),
               linear-gradient(150deg,var(--plum) 0%,var(--plum2) 55%,#241934 100%);
    padding:40px 32px;margin-bottom:28px;border:1px solid var(--line);
  }
  #hero-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--rose);font-weight:700;text-transform:uppercase;margin-bottom:10px}
  #hero h1{font-family:var(--font-display);font-size:clamp(26px,4vw,38px);margin:0 0 10px;font-weight:700;color:var(--cream)}
  #hero p{font-size:14px;color:rgba(244,237,224,.72);max-width:520px;line-height:1.7;margin:0}

  /* ---------- NOW PLAYING DECK ---------- */
  #deck{
    display:flex;gap:24px;align-items:center;margin-top:30px;flex-wrap:wrap;
  }
  #disc-wrap{width:120px;height:120px;flex-shrink:0;position:relative}
  #tonearm{
    position:absolute;top:-14px;right:-6px;width:60px;height:60px;
    transform-origin:90% 10%;transform:rotate(-22deg);transition:transform .4s ease;
    z-index:2;pointer-events:none;
  }
  #tonearm.active{transform:rotate(4deg)}
  #tonearm svg{width:100%;height:100%}
  #disc{
    width:120px;height:120px;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--plum) 0 13%, transparent 13.5%),
      repeating-radial-gradient(circle, #1c1428 0, #1c1428 3px, #2a1f3a 3px, #2a1f3a 7px);
    border:5px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  #disc.spin{animation:spin 3.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #disc-center{position:absolute;top:50%;left:50%;width:22px;height:22px;transform:translate(-50%,-50%);background:var(--amber);border-radius:50%;border:3px solid var(--plum-deep)}

  #now-info{flex:1;min-width:200px}
  #now-eyebrow{font-size:10px;color:var(--rose);font-weight:700;letter-spacing:.1em;margin-bottom:4px}
  #now-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:6px}
  #now-sub{font-size:12px;color:rgba(244,237,224,.55)}

  #progress-row{display:flex;align-items:center;gap:10px;margin-top:14px}
  #progress-track{flex:1;height:4px;background:rgba(244,237,224,.15);border-radius:99px;overflow:hidden;cursor:pointer}
  #progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--amber),var(--gold));border-radius:99px}
  .time-label{font-size:10px;color:rgba(244,237,224,.5);min-width:34px;text-align:center}

  #controls-row{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
  .ctrl-btn{
    background:rgba(244,237,224,.08);border:1px solid var(--line);color:var(--cream);
    width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:.18s;
  }
  .ctrl-btn:hover{background:rgba(244,237,224,.18);transform:translateY(-1px)}
  .ctrl-btn svg{width:16px;height:16px}
  #play-btn{
    width:54px;height:54px;background:linear-gradient(135deg,var(--amber),var(--rose));
    border:none;box-shadow:0 8px 20px rgba(232,147,90,.35);
  }
  #play-btn svg{width:22px;height:22px}

  .mode-chip{
    font-size:11px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);
    background:rgba(244,237,224,.05);color:rgba(244,237,224,.65);cursor:pointer;font-weight:600;
    transition:.15s;
  }
  .mode-chip.on{background:linear-gradient(135deg,var(--amber),var(--gold));color:var(--plum-deep);border-color:transparent}
  #mode-group{display:flex;gap:8px;margin-left:auto}

  /* ---------- SEARCH / FILTER ---------- */
  #toolbar{display:flex;gap:10px;align-items:center;margin:36px 0 16px;flex-wrap:wrap}
  #search-input{
    flex:1;min-width:160px;background:rgba(244,237,224,.06);border:1px solid var(--line);
    color:var(--cream);border-radius:12px;padding:10px 14px;font-size:13px;outline:none;
  }
  #search-input::placeholder{color:rgba(244,237,224,.4)}
  #track-count{font-size:12px;color:rgba(244,237,224,.5);white-space:nowrap}

  /* ---------- PLAYLIST ---------- */
  #playlist{display:flex;flex-direction:column;gap:6px}
  .track-row{
    display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;
    background:rgba(244,237,224,.03);border:1px solid transparent;cursor:pointer;transition:.15s;
  }
  .track-row:hover{background:rgba(244,237,224,.08)}
  .track-row.active{background:linear-gradient(90deg,rgba(232,147,90,.16),rgba(244,200,115,.06));border-color:rgba(244,200,115,.3)}
  .track-num{font-size:12px;color:rgba(244,237,224,.4);width:24px;text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums}
  .track-row.active .track-num{color:var(--gold)}
  .track-eq{width:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .track-eq svg{width:14px;height:14px}
  .track-main{flex:1;min-width:0}
  .track-title{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track-meta{font-size:11px;color:rgba(244,237,224,.45);margin-top:2px}
  .track-dur{font-size:11px;color:rgba(244,237,224,.4);flex-shrink:0;font-variant-numeric:tabular-nums}

  #hidden-player{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

  @media (max-width:560px){
    #deck{flex-direction:column;align-items:flex-start}
    #mode-group{margin-left:0;width:100%;justify-content:flex-start}
  }
</style>
</head>

<div id="page">

  <section id="hero">
    <div id="hero-eyebrow" data-i18n="hero_eyebrow">POMIAI MUSIC · YOUTUBE</div>
    <h1 id="hero-title" data-i18n="hero_title">포미 음악 플레이어</h1>

    <div id="deck">

          <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">

            <button class="mode-chip" id="mode-loop-one" data-i18n="mode_loop_one">1곡반복</button>

</div>

<script>
/* ============================================================
   I18N — §5 표준 구조
   ============================================================ */
const I18N = {
  ko: {
    page_title: '포미 음악 플레이어 | pomiai Music',
    hero_eyebrow: 'POMIAI MUSIC · YOUTUBE',
    hero_title: '포미 음악 플레이어',
    hero_desc: 'AI와 함께 만든 pomiai의 노래 30곡. 발라드부터 디스코펑크, 명상 음악까지 — 라디오처럼 이어 들어보세요.',
    now_playing: 'NOW PLAYING',
    play: '재생', pause: '일시정지', prev: '이전', next: '다음',
    mode_loop_all: '전체반복', mode_loop_one: '1곡반복', mode_shuffle: '랜덤',
    search_placeholder: '곡 제목 검색...',
    tracks_unit: '곡'
  },
  en: {
    page_title: 'Pomi Music Player | pomiai Music',
    hero_eyebrow: 'POMIAI MUSIC · YOUTUBE',
    hero_title: 'Pomi Music Player',
    hero_desc: '30 songs made with AI by pomiai. From ballads to disco-funk to meditation music — listen like your own radio.',
    now_playing: 'NOW PLAYING',
    play: 'Play', pause: 'Pause', prev: 'Prev', next: 'Next',
    mode_loop_all: 'Loop All', mode_loop_one: 'Loop One', mode_shuffle: 'Shuffle',
    search_placeholder: 'Search song title...',
    tracks_unit: 'tracks'
  },
  ja: {
    page_title: 'ポミ ミュージックプレーヤー | pomiai Music',
    hero_eyebrow: 'POMIAI MUSIC · YOUTUBE',
    hero_title: 'ポミ ミュージックプレーヤー',
    hero_desc: 'AIと作ったpomiaiの楽曲30曲。バラードからディスコファンク、瞑想音楽まで——ラジオのように聴いてみて。',
    now_playing: '再生中',
    play: '再生', pause: '一時停止', prev: '前へ', next: '次へ',
    mode_loop_all: '全曲リピート', mode_loop_one: '1曲リピート', mode_shuffle: 'シャッフル',
    search_placeholder: '曲名を検索...',
    tracks_unit: '曲'
  }
};

(function(){
  const params = new URLSearchParams(location.search);
  const urlLang = params.get('lang');
  const browserLang = (navigator.language || 'ko').slice(0, 2);
  const LANG = (urlLang && I18N[urlLang]) ? urlLang
             : (I18N[browserLang]         ? browserLang : 'ko');
  window._LANG = LANG;
  window._T    = I18N[LANG];
  document.getElementById('html-root').lang = LANG;
  if (LANG === 'ar') document.getElementById('html-root').setAttribute('dir','rtl');
})();

function applyI18n() {
  const t = window._T;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (typeof t[k] === 'string') el.textContent = t[k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    const k = el.dataset.i18nTitle;
    if (typeof t[k] === 'string') el.title = t[k];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const k = el.dataset.i18nPlaceholder;
    if (typeof t[k] === 'string') el.placeholder = t[k];
  });
  document.getElementById('page-title').textContent = t.page_title;
  document.title = t.page_title;
  document.getElementById('track-count').textContent = TRACKS.length + ' ' + t.tracks_unit;
}

/* ============================================================
   트랙 데이터 — 30곡, videoId는 추후 편집
   §5: 곡별 메타데이터는 _SEO_메타정보_전체.txt / 가사번역 소스와 매핑 가능
   ============================================================ */
const TRACKS = [
  { no: 1,  videoId: "", title: "pomiai track 01", genre: "" },
  { no: 2,  videoId: "", title: "pomiai track 02", genre: "" },
  { no: 3,  videoId: "", title: "pomiai track 03", genre: "" },
  { no: 4,  videoId: "", title: "pomiai track 04", genre: "" },
  { no: 5,  videoId: "", title: "서랍속영수증", genre: "" },
  { no: 6,  videoId: "", title: "pomiai track 06", genre: "" },
  { no: 7,  videoId: "", title: "pomiai track 07", genre: "" },
  { no: 8,  videoId: "", title: "pomiai track 08", genre: "" },
  { no: 9,  videoId: "", title: "pomiai track 09", genre: "" },
  { no: 10, videoId: "", title: "pomiai track 10", genre: "" },
  { no: 11, videoId: "", title: "pomiai track 11", genre: "" },
  { no: 12, videoId: "", title: "pomiai track 12", genre: "" },
  { no: 13, videoId: "", title: "pomiai track 13", genre: "" },
  { no: 14, videoId: "", title: "pomiai track 14", genre: "" },
  { no: 15, videoId: "", title: "pomiai track 15", genre: "" },
  { no: 16, videoId: "", title: "pomiai track 16", genre: "" },
  { no: 17, videoId: "", title: "pomiai track 17", genre: "" },
  { no: 18, videoId: "", title: "pomiai track 18", genre: "" },
  { no: 19, videoId: "", title: "pomiai track 19", genre: "" },
  { no: 20, videoId: "", title: "pomiai track 20", genre: "" },
  { no: 21, videoId: "", title: "pomiai track 21", genre: "" },
  { no: 22, videoId: "", title: "pomiai track 22", genre: "" },
  { no: 23, videoId: "", title: "pomiai track 23 (Zen & Inner Peace)", genre: "meditation" },
  { no: 24, videoId: "", title: "pomiai track 24 (Zen & Inner Peace)", genre: "meditation" },
  { no: 25, videoId: "", title: "pomiai track 25 (Zen & Inner Peace)", genre: "meditation" },
  { no: 26, videoId: "", title: "pomiai track 26 (Zen & Inner Peace)", genre: "meditation" },
  { no: 27, videoId: "", title: "pomiai track 27 (Zen & Inner Peace)", genre: "meditation" },
  { no: 28, videoId: "", title: "pomiai track 28 (Zen & Inner Peace)", genre: "meditation" },
  { no: 29, videoId: "", title: "pomiai track 29 (Zen & Inner Peace)", genre: "meditation" },
  { no: 30, videoId: "", title: "pomiai track 30", genre: "" }
];

let visibleTracks = [...TRACKS];

/* ============================================================
   재생 로직
   ============================================================ */
const $ = id => document.getElementById(id);
let player = null, playerReady = false, curIdx = 0, isPlaying = false;
let playMode = 'loop_all';
let shuffleOrder = [], shufflePos = 0;
let progressTimer = null;

function fmtTime(s){
  s = Math.max(0, Math.floor(s||0));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

function buildShuffleOrder(){
  shuffleOrder = TRACKS.map((_,i)=>i).sort(()=>Math.random()-0.5);
  shufflePos = Math.max(0, shuffleOrder.indexOf(curIdx));
}

function setMode(mode){
  playMode = mode;
  $('mode-loop-all').classList.toggle('on', mode==='loop_all');
  $('mode-loop-one').classList.toggle('on', mode==='loop_one');
  $('mode-shuffle').classList.toggle('on', mode==='shuffle');
  if (mode==='shuffle') buildShuffleOrder();
}

function nextIndex(){
  if (playMode==='loop_one') return curIdx;
  if (playMode==='shuffle'){
    if (!shuffleOrder.length) buildShuffleOrder();
    shufflePos = (shufflePos+1) % shuffleOrder.length;
    if (shufflePos===0) buildShuffleOrder();
    return shuffleOrder[shufflePos];
  }
  return (curIdx+1) % TRACKS.length;
}
function prevIndex(){
  if (playMode==='shuffle'){
    if (!shuffleOrder.length) buildShuffleOrder();
    shufflePos = (shufflePos-1+shuffleOrder.length) % shuffleOrder.length;
    return shuffleOrder[shufflePos];
  }
  return (curIdx-1+TRACKS.length) % TRACKS.length;
}

function renderPlaylist(){
  const wrap = $('playlist');
  wrap.innerHTML = '';
  visibleTracks.forEach(track=>{
    const idx = TRACKS.indexOf(track);
    const row = document.createElement('div');
    row.className = 'track-row' + (idx===curIdx ? ' active' : '');
    row.innerHTML = `
      <div class="track-num">${String(track.no).padStart(2,'0')}</div>
      <div class="track-eq">${idx===curIdx && isPlaying ? eqIcon() : ''}</div>
      <div class="track-main">
        <div class="track-title">${track.title}</div>
        <div class="track-meta">${track.genre || ''}</div>
      </div>
      <div class="track-dur">0:27</div>
    `;
    row.addEventListener('click', ()=> loadAndPlay(idx));
    wrap.appendChild(row);
  });
}
function eqIcon(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#f4c873" stroke-width="2" stroke-linecap="round"><line x1="6" y1="18" x2="6" y2="10"/><line x1="12" y1="18" x2="12" y2="6"/><line x1="18" y1="18" x2="18" y2="13"/></svg>`;
}

function updateNowInfo(){
  const t = window._T;
  const track = TRACKS[curIdx];
  $('now-title').textContent = track ? track.title : '—';
  $('now-sub-text').textContent = `${curIdx+1} / ${TRACKS.length}`;
  renderPlaylist();
}

function updateProgress(seconds, duration){
  const pct = duration ? Math.min(100,(seconds/duration)*100) : 0;
  $('progress-fill').style.width = pct + '%';
  $('time-cur').textContent = fmtTime(seconds);
  $('time-dur').textContent = fmtTime(duration);
}

function startProgressTimer(){
  clearInterval(progressTimer);
  progressTimer = setInterval(()=>{
    if (!player || !playerReady || !isPlaying) return;
    try{
      const dur = player.getDuration() || 0;
      const cur = player.getCurrentTime() || 0;
      updateProgress(cur, dur);
    }catch(e){}
  }, 250);
}

function loadAndPlay(idx){
  curIdx = idx;
  updateNowInfo();
  const track = TRACKS[curIdx];
  if (!track.videoId){ setPlayingUI(false); return; }
  if (player && playerReady){
    player.loadVideoById(track.videoId);
    player.playVideo();
  }
}

function setPlayingUI(playing){
  isPlaying = playing;
  $('disc').classList.toggle('spin', playing);
  $('tonearm').classList.toggle('active', playing);
  $('play-icon').innerHTML = playing
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  renderPlaylist();
}

function onPlayerStateChange(e){
  if (e.data === YT.PlayerState.PLAYING) setPlayingUI(true);
  else if (e.data === YT.PlayerState.PAUSED) setPlayingUI(false);
  else if (e.data === YT.PlayerState.ENDED) loadAndPlay(nextIndex());
}

function togglePlay(){
  if (!playerReady){ initPlayer(true); return; }
  if (!TRACKS[curIdx].videoId) return;
  if (isPlaying) player.pauseVideo(); else player.playVideo();
}

function initPlayer(autoStart){
  if (window.YT && window.YT.Player){ createPlayer(autoStart); }
  else {
    window.onYouTubeIframeAPIReady = ()=> createPlayer(autoStart);
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }
}

function createPlayer(autoStart){
  const firstValid = TRACKS.findIndex(s=>s.videoId);
  const startIdx = firstValid >= 0 ? firstValid : 0;
  curIdx = startIdx;
  player = new YT.Player('yt-player', {
    height: '1', width: '1',
    videoId: TRACKS[startIdx].videoId || undefined,
    playerVars: { playsinline: 1, controls: 0, modestbranding: 1, rel: 0 },
    events: {
      onReady: ()=>{
        playerReady = true;
        startProgressTimer();
        if (autoStart && TRACKS[startIdx].videoId) player.playVideo();
        updateNowInfo();
      },
      onStateChange: onPlayerStateChange
    }
  });
}

/* progress bar seek */
$('progress-track').addEventListener('click', (e)=>{
  if (!player || !playerReady) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  const dur = player.getDuration() || 0;
  player.seekTo(dur * ratio, true);
});

/* search filter */
$('search-input').addEventListener('input', (e)=>{
  const q = e.target.value.trim().toLowerCase();
  visibleTracks = q ? TRACKS.filter(t=>t.title.toLowerCase().includes(q)) : [...TRACKS];
  renderPlaylist();
});

/* controls */
$('play-btn').addEventListener('click', togglePlay);
$('next-btn').addEventListener('click', ()=> loadAndPlay(nextIndex()));
$('prev-btn').addEventListener('click', ()=> loadAndPlay(prevIndex()));
$('mode-loop-all').addEventListener('click', ()=> setMode('loop_all'));
$('mode-loop-one').addEventListener('click', ()=> setMode('loop_one'));
$('mode-shuffle').addEventListener('click', ()=> setMode('shuffle'));

applyI18n();
updateNowInfo();
setMode('loop_all');
</script>
</body>
</html>
