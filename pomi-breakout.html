<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomi Breakout – Free Retro Brick Breaker Arcade Game | pomiai</title>
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --bg-dark: #0a0a12;
        }

        body {
            background-color: #050505;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Pretendard', -apple-system, sans-serif;
            color: white;
        }

        .game-container {
            background-color: #1a1a2e;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            touch-action: none;
        }

        .game-header {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .game-hud {
            display: flex;
            justify-content: space-between;
            background: rgba(0,0,0,0.5);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .hud-item { text-align: center; }
        .hud-label { font-size: 10px; color: #888; display: block; text-transform: uppercase; }
        .hud-value { font-family: 'Courier New', monospace; font-size: 18px; color: var(--neon-blue); font-weight: bold; }
        #life-val { font-size: 16px; letter-spacing: 2px; }

        #brickCanvas {
            background-color: var(--bg-dark);
            border: 3px solid #30336b;
            border-radius: 10px;
            display: block;
            width: 100%;
            height: auto;
            box-sizing: border-box;
        }

        .mobile-ctrl {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .touch-btn {
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 12px;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }
        .touch-btn:active { background: rgba(0, 210, 255, 0.3); border-color: var(--neon-blue); }

        .game-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .btn-start { background: #27ae60; }
        .btn-pause { background: #f39c12; }
        .btn-stop { background: #c0392b; }
        .btn:disabled { background: #444; opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div style="text-align:center;margin-bottom:8px;"><span style="background:#ff007f;color:#fff;font-size:10px;font-weight:bold;padding:3px 10px;border-radius:20px;letter-spacing:2px;font-family:monospace;">pomiai.com</span></div>
    <div style="text-align:center;margin-bottom:6px"><a href="https://checkpomi.com" target="_blank" style="background:#ff007f;color:#fff;font-size:10px;font-weight:bold;padding:3px 12px;border-radius:20px;letter-spacing:2px;font-family:monospace;text-decoration:none;">POMIAI</a></div>
<div class="game-container">
    <div class="game-header">🎾 POMI BREAKOUT</div>
    
    <div class="game-hud">
        <div class="hud-item"><span class="hud-label">LIFE</span><span id="life-val"></span></div>
        <div class="hud-item"><span class="hud-label">STAGE</span><span class="hud-value" id="stage-val">1 / 20</span></div>
        <div class="hud-item"><span class="hud-label">SCORE</span><span class="hud-value" id="score-val">0</span></div>
    </div>

    <canvas id="brickCanvas" width="400" height="500"></canvas>

    <div class="mobile-ctrl">
        <div class="touch-btn" id="l-btn">◀</div>
        <div class="touch-btn" id="r-btn">▶</div>
    </div>

    <div class="game-btns">
        <button class="btn btn-start" id="s-btn" onclick="startGame()">Start</button>
        <button class="btn btn-pause" id="p-btn" onclick="pauseGame()" disabled>Pause</button>
        <button class="btn btn-stop" id="t-btn" onclick="stopGame()">Stop</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('brickCanvas');
    const ctx = canvas.getContext('2d');
    
    const U_HEART = "❤️";
    const U_TROPHY = "🏆";

    let score = 0, lives = 3, stage = 1;
    let active = false, paused = false, loop;
    
    const ballRadius = 8;
    let x, y, dx, dy;
    const paddleHeight = 12, paddleBaseWidth = 90;
    let paddleWidth = paddleBaseWidth, paddleX;
    
    const brickRowCount = 6, brickColumnCount = 5;
    const brickWidth = 65, brickHeight = 20, brickPadding = 10, brickOffsetTop = 40, brickOffsetLeft = 15;
    let bricks = [];
    const keys = {};

    // 이벤트 리스너 통합 정리
    window.addEventListener('keydown', e => {
        if(["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
        keys[e.code] = true;
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    const setupTouch = (id, key) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
        el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
    };
    setupTouch('l-btn', 'ArrowLeft');
    setupTouch('r-btn', 'ArrowRight');

    function initBricks() {
        bricks = Array.from({ length: brickColumnCount }, () => 
            Array.from({ length: brickRowCount }, () => ({ x: 0, y: 0, status: 1 }))
        );
    }

    function updateHUD() {
        document.getElementById('score-val').textContent = score;
        document.getElementById('stage-val').textContent = `${stage} / 20`;
        document.getElementById('life-val').textContent = U_HEART.repeat(lives);
    }

    function initStage() {
        paddleWidth = Math.max(paddleBaseWidth - (stage * 2), 40);
        paddleX = (canvas.width - paddleWidth) / 2;
        x = canvas.width / 2;
        y = canvas.height - 40;
        let speed = 2.5 + (stage * 0.4); 
        dx = speed; dy = -speed;
        initBricks();
        updateHUD();
    }

    function startGame() {
        if(paused) return pauseGame();
        active = true; paused = false; score = 0; lives = 3; stage = 1;
        initStage();
        document.getElementById('s-btn').disabled = true;
        document.getElementById('p-btn').disabled = false;
        runGame();
    }

    function pauseGame() {
        if(!active) return;
        paused = !paused;
        document.getElementById('p-btn').textContent = paused ? "Resume" : "Pause";
        if(!paused) runGame();
    }

    function stopGame() {
        active = false; paused = false;
        cancelAnimationFrame(loop);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('s-btn').disabled = false;
        document.getElementById('p-btn').disabled = true;
        document.getElementById('p-btn').textContent = "Pause";
        alert(`게임 종료! 스테이지: ${stage}`);
    }

    function collisionDetection() {
        let activeBricks = 0;
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                let b = bricks[c][r];
                if (b.status === 1) {
                    activeBricks++;
                    if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                        dy = -dy;
                        b.status = 0;
                        score += 10;
                        updateHUD();
                    }
                }
            }
        }
        if(activeBricks === 0 && active) {
            if(stage < 20) {
                stage++;
                alert(`STAGE ${stage} START!`);
                initStage();
            } else {
                alert(`${U_TROPHY} 모든 스테이지 클리어!`);
                stopGame();
            }
        }
    }

    function runGame() {
        if(!active || paused) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 배경 그리드
        ctx.strokeStyle = "#161d27";
        for(let i=0; i<canvas.width; i+=40) {
            ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
        }

        // 그리기 함수들
        drawBricks();
        drawBall();
        drawPaddle();
        collisionDetection();

        // 벽 충돌
        if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
        if (y + dy < ballRadius) dy = -dy;
        else if (y + dy > canvas.height - ballRadius - 10) {
            if (x > paddleX && x < paddleX + paddleWidth) {
                dy = -dy;
                dx = 8 * ((x - (paddleX + paddleWidth / 2)) / paddleWidth);
            } else {
                lives--;
                updateHUD();
                if (lives <= 0) {
                    alert("GAME OVER!");
                    stopGame();
                    return;
                } else {
                    x = canvas.width / 2; y = canvas.height - 40;
                    dx = Math.abs(dx); dy = -Math.abs(dy);
                }
            }
        }

        // 패들 이동
        if (keys['ArrowRight'] && paddleX < canvas.width - paddleWidth) paddleX += 7;
        else if (keys['ArrowLeft'] && paddleX > 0) paddleX -= 7;

        x += dx; y += dy;
        loop = requestAnimationFrame(runGame);
    }

    function drawBall() {
        ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2);
        ctx.fillStyle = "#fff";
        ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
        ctx.fill(); ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function drawPaddle() {
        ctx.beginPath(); ctx.rect(paddleX, canvas.height - paddleHeight - 10, paddleWidth, paddleHeight);
        ctx.fillStyle = stage <= 7 ? "#00d2ff" : (stage <= 14 ? "#f39c12" : "#ff007f");
        ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
        ctx.fill(); ctx.closePath();
        ctx.shadowBlur = 0;
    }

    function drawBricks() {
        for (let c = 0; c < brickColumnCount; c++) {
            for (let r = 0; r < brickRowCount; r++) {
                if (bricks[c][r].status === 1) {
                    let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                    let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                    bricks[c][r].x = brickX; bricks[c][r].y = brickY;
                    ctx.beginPath(); ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = r % 2 === 0 ? "#ff007f" : "#39ff14";
                    ctx.fill(); ctx.closePath();
                }
            }
        }
    }

    updateHUD();
</script>

</body>
</html>
