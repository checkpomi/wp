<!DOCTYPE html>
<html lang="ko">
<head>

        :root {

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            position: relative;
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;

        #tetris {
            border: 4px solid #fff;
            background-color: #000;

        .stats {

        /* 모바일 컨트롤 버튼 */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            background: var(--accent-color);
        }

        .btn-rotate { grid-column: span 3; }
    </style>
</head>
