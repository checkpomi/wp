<!-- Playable Cute Donkey Kong Style Platformer -->
<div id="dk-game-container" style="max-width: 500px; margin: 40px auto; background: #2c3e50; border-radius: 12px; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border: 4px solid #f1c40f; touch-action: none; user-select: none;">
    
    <!-- Game HUD -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; color: #fff;">
        <div>
            <h3 style="color: #f1c40f; margin: 0; font-size: 1.3rem; font-weight: 900; text-shadow: 1px 1px 0 #d35400;">CUTE JUMP BROS.</h3>
            <div style="font-size: 0.85rem; color: #bdc3c7; margin-top: 5px; font-weight: bold;">
                LEVEL: <span id="dk-level" style="color: #fff;">1</span>
            </div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 1.2rem; color: #fff; font-weight: bold;">SCORE: <span id="dk-score" style="color: #e74c3c;">0</span></div>
            <div style="font-size: 0.8rem; color: #3498db; margin-top: 2px;">LIVES: <span id="dk-lives">❤️❤️❤️</span></div>
        </div>
    </div>

    <!-- Game Controls -->
    <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;">
        <button id="btn-dk-start" class="dk-ctrl-btn" style="background: #2ecc71; color: #000;">▶ START</button>
        <button id="btn-dk-pause" class="dk-ctrl-btn" style="background: #bdc3c7; color: #000;">⏸ PAUSE</button>
        <button id="btn-dk-end" class="dk-ctrl-btn" style="background: #e74c3c; color: #fff;">⏹ END</button>
    </div>

    <!-- Canvas Container -->
    <div style="position: relative; width: 100%; aspect-ratio: 4/5; background: #34495e; border-radius: 12px; border: 4px solid #7f8c8d; overflow: hidden; margin-bottom: 15px;">
        <!-- Starry Background -->
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 30px 30px; opacity: 0.1; pointer-events: none;"></div>
        <canvas id="dk-canvas" width="400" height="500" style="display: block; width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Mobile Action Controls -->
    <div style="display: flex; justify-content: space-between; gap: 10px; align-items: flex-end;">
        <div style="display: grid; grid-template-columns: 50px 50px 50px; gap: 5px;">
            <div></div>
            <button class="dk-dir-btn" id="btn-dk-up">▲</button>
            <div></div>
            <button class="dk-dir-btn" id="btn-dk-left">◀</button>
            <button class="dk-dir-btn" id="btn-dk-down">▼</button>
            <button class="dk-dir-btn" id="btn-dk-right">▶</button>
        </div>
        <button class="dk-dir-btn" id="btn-dk-jump" style="width: 75px; height: 75px; border-radius: 50%; background: #e74c3c; color: white; border-color: #c0392b; font-size: 1rem; font-weight: 900;">JUMP</button>
    </div>

    <style>
        #dk-game-container .dk-ctrl-btn { border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; transition: 0.1s; font-family: inherit; font-size: 0.8rem; box-shadow: 0 4px 0 rgba(0,0,0,0.4); flex: 1; }
        #dk-game-container .dk-ctrl-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #dk-game-container .dk-dir-btn { background: #7f8c8d; color: #fff; border: none; height: 50px; border-radius: 12px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 5px 0 #2c3e50; touch-action: manipulation; font-weight: bold; }
        #dk-game-container .dk-dir-btn:active { background: #95a5a6; transform: translateY(5px); box-shadow: none; color: #f1c40f; }
    </style>

    <script>
        (function() {
            const canvas = document.getElementById('dk-canvas');
            const ctx = canvas.getContext('2d');
            
            const scoreEl = document.getElementById('dk-score');
            const livesEl = document.getElementById('dk-lives');
            const levelEl = document.getElementById('dk-level');

            let reqId = null;
            let isPlaying = false;
            
            let level = 1;
            let score = 0;
            let lives = 3;
            let frameCount = 0;

            let keys = { left: false, right: false, up: false, down: false };

            // Physics Constants
            const GRAVITY = 0.5;
            const JUMP_POWER = -8.5;
            const MOVE_SPEED = 2.5;
            const CLIMB_SPEED = 2.0;

            // Map Data (Girders: x1, y1, x2, y2)
            const girders = [
                {x1: 0, y1: 480, x2: 400, y2: 480}, 
                {x1: 50, y1: 390, x2: 400, y2: 410}, 
                {x1: 0, y1: 320, x2: 350, y2: 300},  
                {x1: 50, y1: 210, x2: 400, y2: 230}, 
                {x1: 0, y1: 140, x2: 350, y2: 120},  
                {x1: 150, y1: 50, x2: 300, y2: 50}   
            ];

            const ladders = [
                {x: 350, y1: 405, y2: 480},
                {x: 80, y1: 308, y2: 393},
                {x: 320, y1: 226, y2: 305},
                {x: 80, y1: 128, y2: 213},
                {x: 250, y1: 50, y2: 130}
            ];

            let player = {
                x: 30, y: 440, w: 20, h: 28,
                dx: 0, dy: 0,
                state: 'idle', 
                grounded: false,
                facingRight: true
            };

            let barrels = [];
            let goal = { x: 180, y: 15, w: 24, h: 35 }; 

            function initGame(fullReset = true) {
                if (fullReset) {
                    level = 1;
                    score = 0;
                    lives = 3;
                }
                resetLevel();
                updateUI();
            }

            function resetLevel() {
                player.x = 30; player.y = 440;
                player.dx = 0; player.dy = 0;
                player.state = 'idle';
                player.grounded = true;
                player.facingRight = true;
                barrels = [];
                frameCount = 0;
            }

            function updateUI() {
                scoreEl.innerText = score;
                levelEl.innerText = level;
                livesEl.innerText = lives > 0 ? '❤️'.repeat(lives) : '💀';
            }

            function getFloorY(x) {
                let highestFloor = 9999;
                for (let g of girders) {
                    if (x >= g.x1 && x <= g.x2) {
                        let slope = (g.y2 - g.y1) / (g.x2 - g.x1);
                        let y = g.y1 + slope * (x - g.x1);
                        if (y >= player.y + player.h * 0.5 && y < highestFloor) {
                            highestFloor = y;
                        }
                    }
                }
                return highestFloor;
            }

            function isNearLadder(p) {
                for (let l of ladders) {
                    if (Math.abs((p.x + p.w/2) - l.x) < 12 && p.y + p.h >= l.y1 && p.y <= l.y2) {
                        return l;
                    }
                }
                return null;
            }

            function spawnBarrel() {
                // 악당(통)의 속도를 엄청나게 하향: 기본 0.5 + 레벨당 0.1 추가
                let barrelSpeed = 0.5 + (level * 0.1);
                barrels.push({
                    x: 60, y: 110, r: 10,
                    dx: barrelSpeed, dy: 0,
                    scored: false, rotation: 0
                });
            }

            function handleDeath() {
                isPlaying = false;
                cancelAnimationFrame(reqId);
                lives--;
                updateUI();
                
                ctx.fillStyle = 'rgba(231, 76, 60, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (lives > 0) {
                    setTimeout(() => {
                        alert(`앗! 술통에 맞았습니다.\n남은 생명: ${lives}개\n[확인]을 누르면 점수를 유지한 채 다시 시작합니다.`);
                        resetLevel(); 
                        isPlaying = true;
                        gameLoop();
                    }, 100);
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ff7675';
                    ctx.font = 'bold 30px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px "Segoe UI"';
                    ctx.fillText(`최종 점수: ${score} (레벨 ${level})`, canvas.width/2, canvas.height/2 + 30);
                }
            }

            function checkLevelClear() {
                if (player.x + player.w > goal.x && player.x < goal.x + goal.w && player.y < goal.y + goal.h) {
                    isPlaying = false;
                    cancelAnimationFrame(reqId);
                    score += 1000;
                    level++;
                    updateUI();
                    setTimeout(() => {
                        alert(`🎉 구출 성공!\n레벨 ${level} 시작!`);
                        resetLevel();
                        isPlaying = true;
                        gameLoop();
                    }, 100);
                }
            }

            function update() {
                frameCount++;
                
                // 적 스폰 주기 하향 (더 여유롭게 스폰)
                let spawnRate = Math.max(120, 180 - (level * 5)); 
                if (frameCount % spawnRate === 0) spawnBarrel();

                let activeLadder = isNearLadder(player);

                if (player.state === 'climb') {
                    player.dx = 0;
                    if (keys.up) player.dy = -CLIMB_SPEED;
                    else if (keys.down) player.dy = CLIMB_SPEED;
                    else player.dy = 0;

                    if (!activeLadder || keys.left || keys.right) {
                        player.state = 'jump';
                    } else {
                        player.x = activeLadder.x - player.w / 2; 
                    }
                } else {
                    if (keys.left) { player.dx = -MOVE_SPEED; player.facingRight = false; }
                    else if (keys.right) { player.dx = MOVE_SPEED; player.facingRight = true; }
                    else player.dx = 0;

                    player.dy += GRAVITY;

                    if (activeLadder && (keys.up || keys.down)) {
                        player.state = 'climb';
                        player.x = activeLadder.x - player.w / 2;
                        player.dx = 0;
                    }
                }

                player.x += player.dx;
                player.y += player.dy;

                if (player.x < 0) player.x = 0;
                if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

                if (player.state !== 'climb') {
                    let floorY = getFloorY(player.x + player.w / 2);
                    if (player.y + player.h >= floorY) {
                        player.y = floorY - player.h;
                        player.dy = 0;
                        player.grounded = true;
                        player.state = player.dx === 0 ? 'idle' : 'walk';
                    } else {
                        player.grounded = false;
                        player.state = 'jump';
                    }
                }

                // Update Barrels
                for (let i = barrels.length - 1; i >= 0; i--) {
                    let b = barrels[i];
                    
                    b.dy += GRAVITY;
                    b.x += b.dx;
                    b.y += b.dy;
                    b.rotation += b.dx * 0.1;

                    let bFloor = getFloorY(b.x);
                    if (b.y + b.r >= bFloor) {
                        b.y = bFloor - b.r;
                        b.dy = 0;
                        
                        let fLeft = getFloorY(b.x - 5);
                        let fRight = getFloorY(b.x + 5);
                        
                        if (fLeft < fRight) b.dx = Math.abs(b.dx); 
                        else if (fRight < fLeft) b.dx = -Math.abs(b.dx); 
                    }

                    if (b.x < 0 || b.x > canvas.width) b.dx *= -1; 

                    if (b.y > canvas.height) {
                        barrels.splice(i, 1);
                        continue;
                    }

                    // Collision: Death
                    let distX = (player.x + player.w/2) - b.x;
                    let distY = (player.y + player.h/2) - b.y;
                    if (Math.abs(distX) < player.w/2 + b.r - 2 && Math.abs(distY) < player.h/2 + b.r - 2) {
                        return handleDeath();
                    }

                    // Collision: Jump-over Score
                    if (!b.scored && player.state === 'jump' && player.y + player.h < b.y) {
                        if (Math.abs(player.x - b.x) < 20) {
                            score += 100;
                            b.scored = true;
                            updateUI();
                        }
                    }
                }

                checkLevelClear();
            }

            // --- 한층 더 귀여워진 치비 스타일 플레이어 ---
            function drawCutePlayer(x, y, w, h) {
                let cx = x + w/2;
                let dir = player.facingRight ? 1 : -1;

                // 1. 작은 몸통 (오버롤)
                ctx.fillStyle = '#3498db'; // 파란 바지
                ctx.beginPath(); ctx.roundRect(x + 2, y + 16, w - 4, 12, 4); ctx.fill();
                ctx.fillStyle = '#e74c3c'; // 빨간 셔츠
                ctx.beginPath(); ctx.roundRect(x + 3, y + 14, w - 6, 8, 3); ctx.fill();
                
                // 2. 앙증맞은 발 (신발)
                ctx.fillStyle = '#8b4513';
                // 걷기 상태일 때 발을 까딱거림
                let footOffset = (player.state === 'walk' && Math.floor(frameCount / 5) % 2 === 0) ? 2 : 0;
                ctx.beginPath(); ctx.ellipse(cx - 5, y + 27 - footOffset, 4, 3, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(cx + 5, y + 27 + footOffset, 4, 3, 0, 0, Math.PI*2); ctx.fill();

                // 3. 커다란 머리 (가분수 비율)
                ctx.fillStyle = '#ffeaa7'; // 살구색 피부
                ctx.beginPath(); ctx.arc(cx, y + 8, 11, 0, Math.PI*2); ctx.fill();

                // 4. 빨간 빵모자 (마리오 스타일)
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath(); ctx.arc(cx, y + 3, 11, Math.PI, Math.PI*2); ctx.fill(); // 모자 윗부분
                ctx.beginPath(); ctx.ellipse(cx + dir*3, y + 3, 12, 4, 0, 0, Math.PI*2); ctx.fill(); // 모자 챙

                // 5. 크고 초롱초롱한 애니메이션풍 눈
                let eyeX1 = cx + dir*3;
                let eyeX2 = cx + dir*8;
                if(!player.facingRight) {
                    eyeX1 = cx - 3;
                    eyeX2 = cx - 8;
                }
                
                // 메인 눈 (앞쪽)
                ctx.fillStyle = '#2d3436';
                ctx.beginPath(); ctx.ellipse(eyeX1, y + 8, 2.5, 3.5, 0, 0, Math.PI*2); ctx.fill();
                // 눈망울 하이라이트 (반짝!)
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(eyeX1 - dir*0.5, y + 6.5, 1.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(eyeX1 + dir*0.5, y + 9, 0.5, 0, Math.PI*2); ctx.fill();

                // 서브 눈 (뒤쪽 - 입체감)
                ctx.fillStyle = '#2d3436';
                ctx.beginPath(); ctx.ellipse(eyeX2, y + 8, 1.5, 2.5, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(eyeX2 - dir*0.5, y + 6.5, 0.8, 0, Math.PI*2); ctx.fill();

                // 6. 발그레한 볼
                ctx.fillStyle = 'rgba(255, 118, 117, 0.8)';
                ctx.beginPath(); ctx.ellipse(cx + dir*5, y + 12, 3, 1.5, 0, 0, Math.PI*2); ctx.fill();
                
                // 7. 귀여운 입 (살짝 벌린 미소)
                ctx.strokeStyle = '#d63031';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(cx + dir*7, y + 10, 2, 0, Math.PI, false); ctx.stroke();
            }

            function drawCuteGorilla(x, y) {
                // 갈색 몸통
                ctx.fillStyle = '#8b4513';
                ctx.beginPath(); ctx.roundRect(x, y, 45, 45, 12); ctx.fill();
                // 살구색 얼굴
                ctx.fillStyle = '#d2b48c';
                ctx.beginPath(); ctx.roundRect(x + 5, y + 10, 35, 30, 10); ctx.fill();
                // 똘망한 눈
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(x + 14, y + 20, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + 31, y + 20, 3.5, 0, Math.PI*2); ctx.fill();
                // 화난 눈썹
                ctx.lineWidth = 3; ctx.strokeStyle = '#5c2a0b';
                ctx.beginPath(); ctx.moveTo(x + 10, y + 15); ctx.lineTo(x + 18, y + 17); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + 35, y + 15); ctx.lineTo(x + 27, y + 17); ctx.stroke();
                // 입
                ctx.beginPath(); ctx.arc(x + 22.5, y + 30, 5, 0, Math.PI, false); ctx.stroke();
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Girders (둥글고 귀여운 느낌으로)
                ctx.lineWidth = 10;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#d35400';
                for (let g of girders) {
                    ctx.beginPath(); ctx.moveTo(g.x1, g.y1); ctx.lineTo(g.x2, g.y2); ctx.stroke();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#e67e22';
                    ctx.stroke();
                    ctx.lineWidth = 10;
                    ctx.strokeStyle = '#d35400';
                }

                // Draw Ladders
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#2980b9';
                for (let l of ladders) {
                    ctx.beginPath();
                    ctx.moveTo(l.x - 8, l.y1); ctx.lineTo(l.x - 8, l.y2);
                    ctx.moveTo(l.x + 8, l.y1); ctx.lineTo(l.x + 8, l.y2);
                    ctx.stroke();
                    for(let y = l.y1 + 10; y < l.y2; y += 15) {
                        ctx.beginPath(); ctx.moveTo(l.x - 8, y); ctx.lineTo(l.x + 8, y); ctx.stroke();
                    }
                }

                // Draw Goal (구출 대상 공주님)
                ctx.fillStyle = '#ff9ff3';
                ctx.beginPath(); ctx.roundRect(goal.x, goal.y+10, goal.w, goal.h-10, 6); ctx.fill();
                ctx.fillStyle = '#ffeaa7';
                ctx.beginPath(); ctx.arc(goal.x + goal.w/2, goal.y+8, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(goal.x + goal.w/2 - 2, goal.y+8, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(goal.x + goal.w/2 + 2, goal.y+8, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#f1c40f'; // 티아라
                ctx.beginPath(); ctx.moveTo(goal.x+4, goal.y+2); ctx.lineTo(goal.x+8, goal.y-4); ctx.lineTo(goal.x+12, goal.y+2); ctx.lineTo(goal.x+16, goal.y-4); ctx.lineTo(goal.x+20, goal.y+2); ctx.fill();

                // Draw Player (Super Cute Chibi!)
                drawCutePlayer(player.x, player.y, player.w, player.h);

                // Draw Gorilla
                drawCuteGorilla(10, 65);

                // Draw Barrels (귀여운 나무통)
                for (let b of barrels) {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.rotation);
                    ctx.fillStyle = '#cd6133';
                    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
                    ctx.lineWidth = 3; ctx.strokeStyle = '#84817a';
                    ctx.beginPath(); ctx.arc(0, 0, b.r - 2, 0, Math.PI*2); ctx.stroke();
                    ctx.lineWidth = 2; ctx.strokeStyle = '#a0522d';
                    ctx.beginPath(); ctx.moveTo(-b.r+2, 0); ctx.lineTo(b.r-2, 0); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, -b.r+2); ctx.lineTo(0, b.r-2); ctx.stroke();
                    ctx.restore();
                }
            }

            function gameLoop() {
                if (!isPlaying) return;
                update();
                draw();
                reqId = requestAnimationFrame(gameLoop);
            }

            // --- Controls ---
            document.getElementById('btn-dk-start').addEventListener('click', () => {
                if (!isPlaying) {
                    if (lives <= 0) initGame(true);
                    isPlaying = true;
                    gameLoop();
                }
            });

            document.getElementById('btn-dk-pause').addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(reqId);
            });

            document.getElementById('btn-dk-end').addEventListener('click', () => {
                isPlaying = false;
                cancelAnimationFrame(reqId);
                initGame(true);
                draw();
            });

            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
                if (!isPlaying) return;
                
                if (e.code === 'ArrowLeft') keys.left = true;
                if (e.code === 'ArrowRight') keys.right = true;
                if (e.code === 'ArrowUp') keys.up = true;
                if (e.code === 'ArrowDown') keys.down = true;
                if ((e.code === 'Space' || e.code === 'ArrowUp') && player.grounded && player.state !== 'climb') {
                    player.dy = JUMP_POWER;
                    player.grounded = false;
                }
            }, { passive: false });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'ArrowLeft') keys.left = false;
                if (e.code === 'ArrowRight') keys.right = false;
                if (e.code === 'ArrowUp') keys.up = false;
                if (e.code === 'ArrowDown') keys.down = false;
            });

            // Mobile
            const addTouch = (id, keyName) => {
                const btn = document.getElementById(id);
                const actDown = (e) => { e.preventDefault(); keys[keyName] = true; };
                const actUp = (e) => { e.preventDefault(); keys[keyName] = false; };
                btn.addEventListener('touchstart', actDown, {passive: false});
                btn.addEventListener('touchend', actUp, {passive: false});
                btn.addEventListener('mousedown', actDown);
                btn.addEventListener('mouseup', actUp);
                btn.addEventListener('mouseleave', actUp);
            };

            addTouch('btn-dk-left', 'left');
            addTouch('btn-dk-right', 'right');
            addTouch('btn-dk-up', 'up');
            addTouch('btn-dk-down', 'down');

            const btnJump = document.getElementById('btn-dk-jump');
            const doJump = (e) => {
                e.preventDefault();
                if (player.grounded && player.state !== 'climb' && isPlaying) {
                    player.dy = JUMP_POWER;
                    player.grounded = false;
                }
            };
            btnJump.addEventListener('touchstart', doJump, {passive: false});
            btnJump.addEventListener('mousedown', doJump);

            // Init Render
            initGame(true);
            draw();
        })();
    </script>
</div>
<!-- End of Playable Cute Donkey Kong Style Platformer -->
